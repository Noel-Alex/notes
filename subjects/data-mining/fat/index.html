concept"},{"module":4,"q":"Actual CAT-II at minsup=3: support(I2,I3,I4) equals…","choices":["2","3","4","5"],"answer":1,"why":"T102,T105,T108 contain all three.","kind":"numerical"},{"module":4,"q":"In the actual CAT-II, which of these is NOT frequent at minsup 3?","choices":["{I1,I5}","{I3,I5}","{I1,I2,I3}","{I2,I4}"],"answer":2,"why":"I1,I2,I3 occurs only in T103 (count 1).","kind":"numerical"},{"module":4,"q":"ECLAT calculates support using…","choices":["Union of items","Intersection of item TID sets","Matrix eigenvalues","Class gain ratio"],"answer":1,"why":"Vertical mining intersects sets of transaction IDs.","kind":"concept"},{"module":4,"q":"If s(A∪B)=0.4 and s(A)=0.8, confidence(A→B) is…","choices":["0.2","0.5","0.8","1.2"],"answer":1,"why":"0.4/0.8=0.5.","kind":"numerical"},{"module":4,"q":"Lift > 1 indicates…","choices":["Observed positive association vs independent baseline","Perfect causality","No co-occurrence","Exactly one transaction"],"answer":0,"why":"Lift compares confidence with baseline support of consequent.","kind":"concept"},{"module":5,"q":"For target split of 4 Yes and 4 No, entropy is:","choices":["0","0.5","1","2"],"answer":2,"why":"A perfectly balanced binary target has 1 bit entropy.","kind":"numerical"},{"module":5,"q":"ID3 selects the attribute with…","choices":["Lowest gain","Highest gain","Most unique values always","Maximum leaf size"],"answer":1,"why":"Choose biggest entropy reduction.","kind":"concept"},{"module":5,"q":"In the cardiac-risk CAT-II, best root attribute:","choices":["Cholesterol","Exercise","Age Group","Patient ID"],"answer":2,"why":"Age gain=0.65564; other gains 0.18872.","kind":"concept"},{"module":5,"q":"Young, Low Exercise, High Cholesterol is classified as:","choices":["Yes","No","Unknown","0.5"],"answer":1,"why":"All young training patients have No → pure leaf.","kind":"concept"},{"module":5,"q":"Loan re-CAT, root according to information gain:","choices":["Employment Status","Income Group","Credit Score","Customer ID"],"answer":1,"why":"Income gain=0.65564 highest.","kind":"concept"},{"module":5,"q":"C4.5 commonly uses:","choices":["Information gain ratio","Only Euclidean distance","Jaccard","Kappa only"],"answer":0,"why":"Gain ratio adjusts information gain for split information.","kind":"concept"},{"module":5,"q":"Which is Gini impurity for 50/50 binary classes?","choices":["0","0.25","0.5","1"],"answer":2,"why":"1−0.5²−0.5²=0.5.","kind":"numerical"},{"module":5,"q":"Prepruning means…","choices":["Stop splits during tree growth","Grow full then prune","Remove entire dataset","Only change test labels"],"answer":0,"why":"Prepruning imposes stopping criteria before further growth.","kind":"concept"},{"module":5,"q":"Naive Bayes assumes features are…","choices":["Independent unconditionally","Conditionally independent given class","Always perfectly correlated","Unlabeled"],"answer":1,"why":"It factorizes P(X|C) across features.","kind":"concept"},{"module":5,"q":"The full joint for B→A←E and A→P1,P2 is…","choices":["P(A)P(B)P(E)P(P1)P(P2)","P(B)P(E)P(A|B,E)P(P1|A)P(P2|A)","P(P1|B)P(P2|E)","P(A|P1,P2)"],"answer":1,"why":"Product of each variable conditioned on its graph parents.","kind":"concept"},{"module":5,"q":"In a confusion matrix, FN means…","choices":["Actual positive predicted negative","Actual negative predicted positive","Correct positive","Correct negative"],"answer":0,"why":"FN = missed positive.","kind":"concept"},{"module":5,"q":"Precision equals…","choices":["TP/(TP+FN)","TP/(TP+FP)","TN/(TN+FP)","(TP+TN)/N"],"answer":1,"why":"Precision conditions on predicted positive.","kind":"concept"},{"module":5,"q":"Stratified k-fold chiefly preserves…","choices":["Exact alphabetical order","Overall target proportions in each fold","All labels in every split regardless of size","Identical model weights"],"answer":1,"why":"Useful with class imbalance.","kind":"concept"},{"module":5,"q":"LOOCV with n=40 requires how many model fits?","choices":["1","5","20","40"],"answer":3,"why":"Hold one observation out on each of 40 folds.","kind":"numerical"},{"module":5,"q":"For TP=140 TN=740 FP=60 FN=60, Cohen's κ =","choices":["0.88","0.625","0.5","0.68"],"answer":1,"why":"Observed agreement=.88, chance agreement=.68, κ=.625.","kind":"numerical"},{"module":5,"q":"MCC of the same re-CAT confusion matrix equals:","choices":["0.625","0.88","0.2","−0.625"],"answer":0,"why":"MCC=(140·740−60·60)/(200·200·800·800)^0.5=.625.","kind":"numerical"},{"module":5,"q":"Bagging generally relies on…","choices":["Bootstrap samples and aggregation","Only one giant tree","Sequential hard-example reweighting","PageRank"],"answer":0,"why":"Bagging trains independent bootstrapped learners and combines them.","kind":"concept"},{"module":5,"q":"Random forest differs from simple bagged trees by adding…","choices":["Feature subset randomness at tree splits","No training labels","Anomaly thresholds","PCA eigenvectors"],"answer":0,"why":"Random feature selection helps decorrelate trees.","kind":"concept"},{"module":5,"q":"What best evaluates rare-positive retrieval?","choices":["Accuracy only","Precision–recall curve","Number of features","Training set accuracy"],"answer":1,"why":"PR evaluation emphasizes positive-class retrieval.","kind":"concept"},{"module":6,"q":"Clustering without known categories is…","choices":["Supervised","Unsupervised","Always regression","Only OLAP"],"answer":1,"why":"Clustering finds groups without labels.","kind":"concept"},{"module":6,"q":"Euclidean distance between (2,3) and (5,7):","choices":["4","5","6","7"],"answer":1,"why":"sqrt(3²+4²)=5.","kind":"numerical"},{"module":6,"q":"Manhattan distance between the same points:","choices":["3","4","5","7"],"answer":3,"why":"|5−2|+|7−3|=7.","kind":"numerical"},{"module":6,"q":"Which k-means representative need not be an observed point?","choices":["Centroid","Medoid","Raw sample","Nearest neighbor"],"answer":0,"why":"Centroid is arithmetic mean and may lie between observations.","kind":"concept"},{"module":6,"q":"K-medoids representatives are…","choices":["Actual dataset objects","Always median per attribute","Always eigenvectors","Synthetic means"],"answer":0,"why":"PAM uses observed points.","kind":"concept"},{"module":6,"q":"PAM initial cost=20, swap cost=22. What should happen?","choices":["Accept swap","Reject swap","Increase k","Change labels"],"answer":1,"why":"Swap worsens objective by +2, so reject.","kind":"concept"},{"module":6,"q":"Single linkage is…","choices":["Maximum cross-cluster distance","Average cross-cluster distance","Minimum cross-cluster distance","Distance between centroids"],"answer":2,"why":"Single = minimum pairwise cross distance.","kind":"concept"},{"module":6,"q":"Complete linkage is…","choices":["Maximum cross distance","Minimum cross distance","Median distance","Only density"],"answer":0,"why":"Complete = maximum pairwise cross distance.","kind":"concept"},{"module":6,"q":"Average linkage example cross distances {4,7,3,6}:","choices":["3","4","5","7"],"answer":2,"why":"(4+7+3+6)/4=5.","kind":"numerical"},{"module":6,"q":"AGNES starts with…","choices":["One large cluster","One cluster per point","A PageRank vector","Only labeled examples"],"answer":1,"why":"Agglomerative bottom-up merging begins at singletons.","kind":"concept"},{"module":6,"q":"DBSCAN requires…","choices":["k only","Epsilon and MinPts","Information gain only","Damping factor"],"answer":1,"why":"Radius and minimum neighborhood density parameters.","kind":"concept"},{"module":6,"q":"Can a DBSCAN border point expand a cluster?","choices":["Yes, always","No; only core points expand","Yes if not visited","Only if k=2"],"answer":1,"why":"Border point is density-reachable but not a core expansion seed.","kind":"concept"},{"module":6,"q":"Which method is best known for arbitrary-shaped clusters with noise?","choices":["K-means","DBSCAN","Naïve Bayes","Apriori"],"answer":1,"why":"Density-connected groups needn't be spherical.","kind":"concept"},{"module":6,"q":"Anomalous only in a summer temperature context:","choices":["Global outlier","Contextual outlier","Only collective outlier","Not anomalous"],"answer":1,"why":"Context changes what counts as normal.","kind":"concept"},{"module":6,"q":"IQR fences with Q1=3.5, Q3=7.5:","choices":["[−2.5,13.5]","[0,10]","[3.5,7.5]","[−5,15]"],"answer":0,"why":"IQR=4; fences Q1−6 and Q3+6.","kind":"numerical"},{"module":7,"q":"Mining hyperlink graph structure is:","choices":["Web usage mining","Web structure mining","Web content mining","Data imputation"],"answer":1,"why":"Links capture structure and authority.","kind":"concept"},{"module":7,"q":"Server click paths are used in:","choices":["Web usage","Web content","Only PageRank","PCA only"],"answer":0,"why":"Clickstream and session logs show user behavior.","kind":"concept"},{"module":7,"q":"What is the job of an indexer?","choices":["Fetch every page only","Build searchable term→document structure","Estimate k medoids","Compute confidence"],"answer":1,"why":"Indexer creates inverted index and document metadata.","kind":"concept"},{"module":7,"q":"HITS authority update is…","choices":["a=Aᵀh","a=Ah","a=h/A","a=1−d"],"answer":0,"why":"Incoming hub scores are collected by transpose adjacency.","kind":"concept"},{"module":7,"q":"HITS hub update is…","choices":["h=Aa","h=Aᵀa","h=−a","h=χ²"],"answer":0,"why":"A hub points to authorities; multiply A by authority vector.","kind":"concept"},{"module":7,"q":"PageRank distributes a page's score across…","choices":["Its outlinks","Its class labels","Its term frequencies only","Its cluster centroids"],"answer":0,"why":"Each outgoing link receives a share PR(source)/outdegree(source).","kind":"concept"},{"module":7,"q":"In the WEB MINING slide example: 190 relevant of 210 returned. Precision is…","choices":["95%","90.48%","85%","100%"],"answer":1,"why":"190/210≈0.90476.","kind":"numerical"},{"module":7,"q":"200 total relevant pages, 190 returned relevant. Recall is…","choices":["90.48%","90%","95%","100%"],"answer":2,"why":"190/200=.95.","kind":"numerical"},{"module":7,"q":"STC primarily groups documents by shared…","choices":["Phrases","Geographical grids","TF class labels only","Database joins"],"answer":0,"why":"Suffix Tree Clustering uses common phrases.","kind":"concept"},{"module":7,"q":"Jaccard resemblance for 1 shared shingle out of 5 union shingles:","choices":["0.1","0.2","0.5","1"],"answer":1,"why":"Intersection/union=1/5=.2.","kind":"numerical"},{"module":7,"q":"Which time-dependent rule connects changes across snapshots?","choices":["Temporal association rule","Snowflake dimension only","KNN vote","CART pruning"],"answer":0,"why":"Temporal rules model evolution patterns.","kind":"concept"},{"module":7,"q":"STING+ is designed to handle…","choices":["Active spatial triggers for evolving data","Only SQL transactions","Naïve Bayes features","Web query ranking"],"answer":0,"why":"It tracks spatial updates selectively with grid triggers.","kind":"concept"},{"module":7,"q":"PageRank vs HITS: which statement is correct?","choices":["Both only use classes","HITS has hub and authority scores, PageRank one rank","PageRank uses entropy","HITS doesn't use links"],"answer":1,"why":"HITS computes two mutually reinforcing score types.","kind":"concept"},{"module":7,"q":"Containment of shingle set A within B is…","choices":["|A∩B|/|A|","|A∪B|/|A|","|A|/|B|","|A∩B|/|A∪B| always"],"answer":0,"why":"Containment is asymmetric, unlike resemblance.","kind":"concept"}],"exams":[{"module":2,"title":"2025 FAT Q1 · Retail-store mining functionalities","origin":"Verified public transcription · VIT FAT April 2025 · F1 · Q1","marks":10,"prompt":"You are designing a data-mining system for an electronics retailer. Explain the main data-mining functionalities and illustrate how each could contribute to decisions from sales records.","solution":"**An exam-ready answer has two layers: define the task, then tie it to the sales database.**\n\n| Functionality | Meaning | Store-specific example |\n|---|---|---|\n| Characterization / summarization | Describe typical properties of one target group | Describe spending, device type, and location among laptop buyers |\n| Discrimination | Compare a target class with a contrasting class | Laptop buyers vs smartphone-only buyers |\n| Frequent patterns and association rules | Find co-occurrence relationships | `{Laptop} → {Mouse}`; give support and confidence rather than claim causation |\n| Classification | Predict a **category** from labeled examples | Classify a customer as likely/unlikely to return an item |\n| Numeric prediction / regression | Predict a **number** | Predict next month's value of sales |\n| Clustering | Group similar records without labels | Segment customers by purchase frequency and category preferences |\n| Outlier or anomaly detection | Find unusual records | Identify unexpectedly large returns or unusual orders |\n| Trend / evolution analysis | Study changes over time | Compare quarterly demand and seasonal peaks |\n\n**Application workflow:** integrate POS, returns and inventory records → clean missing/duplicate entries → create product, region and time attributes → choose a suitable mining task → evaluate pattern quality and business meaning → report to managers. Cite real measures (support, confidence, validation metrics) where relevant.\n\n**Full-mark caution:** do not confuse data mining *functionalities* (what we learn) with algorithms (how we learn it). A retail example alone without definitions is not enough.","lessons":["Six kinds of mining tasks","The seven KDD stages","What data mining actually does"],"promptHTML":"<p>You are designing a data-mining system for an electronics retailer. Explain the main data-mining functionalities and illustrate how each could contribute to decisions from sales records.</p>\n","solutionHTML":"<p><strong>An exam-ready answer has two layers: define the task, then tie it to the sales database.</strong></p>\n<table>\n<thead>\n<tr>\n  <th>Functionality</th>\n  <th>Meaning</th>\n  <th>Store-specific example</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Characterization / summarization</td>\n  <td>Describe typical properties of one target group</td>\n  <td>Describe spending, device type, and location among laptop buyers</td>\n</tr>\n<tr>\n  <td>Discrimination</td>\n  <td>Compare a target class with a contrasting class</td>\n  <td>Laptop buyers vs smartphone-only buyers</td>\n</tr>\n<tr>\n  <td>Frequent patterns and association rules</td>\n  <td>Find co-occurrence relationships</td>\n  <td><code>{Laptop} → {Mouse}</code>; give support and confidence rather than claim causation</td>\n</tr>\n<tr>\n  <td>Classification</td>\n  <td>Predict a <strong>category</strong> from labeled examples</td>\n  <td>Classify a customer as likely/unlikely to return an item</td>\n</tr>\n<tr>\n  <td>Numeric prediction / regression</td>\n  <td>Predict a <strong>number</strong></td>\n  <td>Predict next month's value of sales</td>\n</tr>\n<tr>\n  <td>Clustering</td>\n  <td>Group similar records without labels</td>\n  <td>Segment customers by purchase frequency and category preferences</td>\n</tr>\n<tr>\n  <td>Outlier or anomaly detection</td>\n  <td>Find unusual records</td>\n  <td>Identify unexpectedly large returns or unusual orders</td>\n</tr>\n<tr>\n  <td>Trend / evolution analysis</td>\n  <td>Study changes over time</td>\n  <td>Compare quarterly demand and seasonal peaks</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Application workflow:</strong> integrate POS, returns and inventory records → clean missing/duplicate entries → create product, region and time attributes → choose a suitable mining task → evaluate pattern quality and business meaning → report to managers. Cite real measures (support, confidence, validation metrics) where relevant.</p>\n<p><strong>Full-mark caution:</strong> do not confuse data mining <em>functionalities</em> (what we learn) with algorithms (how we learn it). A retail example alone without definitions is not enough.</p>\n","paper_kind":"fat2025"},{"module":3,"title":"2025 FAT Q2 · Chi-square 2×3 independence test","origin":"Verified public transcription · VIT FAT April 2025 · F1 · Q2","marks":10,"prompt":"Gender × preferred product counts: Male (30, 50, 20), Female (20, 60, 20). At 5% significance, determine whether preference is independent of gender; the supplied critical value is 5.991.","solution":"**Step 1. State hypotheses.** H₀: gender and product preference are independent. H₁: they are associated. α = 0.05.\n\n**Step 2. Observed totals.** Row sums: Male = 100, Female = 100. Column sums: A = 50, B = 110, C = 40. Grand total = 200.\n\n**Step 3. Expected counts:** `Eᵢⱼ = (row total × column total)/200`.\n\n| Gender | Expected A | Expected B | Expected C |\n|---|---:|---:|---:|\n| Male | 25 | 55 | 20 |\n| Female | 25 | 55 | 20 |\n\n**Step 4. Compute χ² = Σ(O−E)²/E.** Contributions are `25/25 + 25/55 + 0 + 25/25 + 25/55 + 0` = `1 + 0.4545 + 1 + 0.4545` = **2.9091**.\n\n**Step 5. Degrees of freedom:** `(2−1)(3−1) = 2`. Supplied χ² critical = **5.991** at α = 0.05.\n\n**Decision:** 2.9091 < 5.991 ⇒ **fail to reject H₀**. No statistically significant evidence of an association between gender and product preference in these observations.\n\n**Important wording:** the result does not prove independence or causality. Chi-square is a test of categorical association; don't describe this as Pearson correlation.","lessons":["Data integration, redundancy, and chi-square","The complete preprocessing map"],"promptHTML":"<p>Gender × preferred product counts: Male (30, 50, 20), Female (20, 60, 20). At 5% significance, determine whether preference is independent of gender; the supplied critical value is 5.991.</p>\n","solutionHTML":"<p><strong>Step 1. State hypotheses.</strong> H₀: gender and product preference are independent. H₁: they are associated. α = 0.05.</p>\n<p><strong>Step 2. Observed totals.</strong> Row sums: Male = 100, Female = 100. Column sums: A = 50, B = 110, C = 40. Grand total = 200.</p>\n<p><strong>Step 3. Expected counts:</strong> <code>Eᵢⱼ = (row total × column total)/200</code>.</p>\n<table>\n<thead>\n<tr>\n  <th>Gender</th>\n  <th style=\"text-align:right\">Expected A</th>\n  <th style=\"text-align:right\">Expected B</th>\n  <th style=\"text-align:right\">Expected C</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Male</td>\n  <td style=\"text-align:right\">25</td>\n  <td style=\"text-align:right\">55</td>\n  <td style=\"text-align:right\">20</td>\n</tr>\n<tr>\n  <td>Female</td>\n  <td style=\"text-align:right\">25</td>\n  <td style=\"text-align:right\">55</td>\n  <td style=\"text-align:right\">20</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Step 4. Compute χ² = Σ(O−E)²/E.</strong> Contributions are <code>25/25 + 25/55 + 0 + 25/25 + 25/55 + 0</code> = <code>1 + 0.4545 + 1 + 0.4545</code> = <strong>2.9091</strong>.</p>\n<p><strong>Step 5. Degrees of freedom:</strong> <code>(2−1)(3−1) = 2</code>. Supplied χ² critical = <strong>5.991</strong> at α = 0.05.</p>\n<p><strong>Decision:</strong> 2.9091 &lt; 5.991 ⇒ <strong>fail to reject H₀</strong>. No statistically significant evidence of an association between gender and product preference in these observations.</p>\n<p><strong>Important wording:</strong> the result does not prove independence or causality. Chi-square is a test of categorical association; don't describe this as Pearson correlation.</p>\n","paper_kind":"fat2025"},{"module":4,"title":"2025 FAT Q3 · Complete Apriori & strong rules (MONKEY)","origin":"Verified public transcription · VIT FAT April 2025 · F1 · Q3","marks":10,"prompt":"Five transactions: T100 {M,O,N,K,E,Y}; T200 {D,O,N,K,E,Y}; T300 {M,A,K,E}; T400 {M,U,C,K,Y}; T500 {C,O,O,K,I,E}. Find all frequent itemsets at support ≥60% and all association rules with confidence ≥80%.","solution":"**Step 1. Convert threshold:** min support count = `ceil(0.60 × 5) = 3`; min confidence = 80%. Each transaction is a **set**: the duplicate O in T500 counts only once toward an itemset's support.\n\n**Step 2. C₁ scan and L₁.** `{E}:4, {K}:5, {M}:3, {O}:3, {Y}:3` survive. All other items have count below 3.\n\n**Step 3. C₂ joins, support scan and L₂.** The surviving pairs are `{E,K}:4`, `{E,O}:3`, `{K,M}:3`, `{K,O}:3`, `{K,Y}:3`. Every other candidate pair falls below three transactions.\n\n**Step 4. Join/prune for L₃.** `{E,K,O}:3` is the only surviving triple: its three 2-item subsets `{E,K}`, `{E,O}` and `{K,O}` are frequent. There is no frequent 4-itemset. Thus **L = L₁ ∪ L₂ ∪ L₃** above.\n\n**Step 5. Generate rules from all frequent itemsets of size ≥2, then apply confidence = support(X∪Y)/support(X).** The complete strong-rule set is:\n\n| Rule | Confidence |\n|---|---:|\n| E → K | 4/4 = 100% |\n| K → E | 4/5 = 80% |\n| O → E | 3/3 = 100% |\n| M → K | 3/3 = 100% |\n| O → K | 3/3 = 100% |\n| Y → K | 3/3 = 100% |\n| O → {E,K} | 3/3 = 100% |\n| {E,O} → K | 3/3 = 100% |\n| {K,O} → E | 3/3 = 100% |\n\n**Common traps:** 60% means **three transactions**, not item-occurrence frequency; counting duplicate O twice is wrong; candidate generation must check all necessary subsets; **minimum confidence filters rules, not frequent itemsets**.","lessons":["Transactions, itemsets and rules","Apriori: downward-closure principle","Apriori candidate generation and speedups","Generate rules from frequent itemsets"],"promptHTML":"<p>Five transactions: T100 {M,O,N,K,E,Y}; T200 {D,O,N,K,E,Y}; T300 {M,A,K,E}; T400 {M,U,C,K,Y}; T500 {C,O,O,K,I,E}. Find all frequent itemsets at support ≥60% and all association rules with confidence ≥80%.</p>\n","solutionHTML":"<p><strong>Step 1. Convert threshold:</strong> min support count = <code>ceil(0.60 × 5) = 3</code>; min confidence = 80%. Each transaction is a <strong>set</strong>: the duplicate O in T500 counts only once toward an itemset's support.</p>\n<p><strong>Step 2. C₁ scan and L₁.</strong> <code>{E}:4, {K}:5, {M}:3, {O}:3, {Y}:3</code> survive. All other items have count below 3.</p>\n<p><strong>Step 3. C₂ joins, support scan and L₂.</strong> The surviving pairs are <code>{E,K}:4</code>, <code>{E,O}:3</code>, <code>{K,M}:3</code>, <code>{K,O}:3</code>, <code>{K,Y}:3</code>. Every other candidate pair falls below three transactions.</p>\n<p><strong>Step 4. Join/prune for L₃.</strong> <code>{E,K,O}:3</code> is the only surviving triple: its three 2-item subsets <code>{E,K}</code>, <code>{E,O}</code> and <code>{K,O}</code> are frequent. There is no frequent 4-itemset. Thus <strong>L = L₁ ∪ L₂ ∪ L₃</strong> above.</p>\n<p><strong>Step 5. Generate rules from all frequent itemsets of size ≥2, then apply confidence = support(X∪Y)/support(X).</strong> The complete strong-rule set is:</p>\n<table>\n<thead>\n<tr>\n  <th>Rule</th>\n  <th style=\"text-align:right\">Confidence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>E → K</td>\n  <td style=\"text-align:right\">4/4 = 100%</td>\n</tr>\n<tr>\n  <td>K → E</td>\n  <td style=\"text-align:right\">4/5 = 80%</td>\n</tr>\n<tr>\n  <td>O → E</td>\n  <td style=\"text-align:right\">3/3 = 100%</td>\n</tr>\n<tr>\n  <td>M → K</td>\n  <td style=\"text-align:right\">3/3 = 100%</td>\n</tr>\n<tr>\n  <td>O → K</td>\n  <td style=\"text-align:right\">3/3 = 100%</td>\n</tr>\n<tr>\n  <td>Y → K</td>\n  <td style=\"text-align:right\">3/3 = 100%</td>\n</tr>\n<tr>\n  <td>O → {E,K}</td>\n  <td style=\"text-align:right\">3/3 = 100%</td>\n</tr>\n<tr>\n  <td>{E,O} → K</td>\n  <td style=\"text-align:right\">3/3 = 100%</td>\n</tr>\n<tr>\n  <td>{K,O} → E</td>\n  <td style=\"text-align:right\">3/3 = 100%</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Common traps:</strong> 60% means <strong>three transactions</strong>, not item-occurrence frequency; counting duplicate O twice is wrong; candidate generation must check all necessary subsets; <strong>minimum confidence filters rules, not frequent itemsets</strong>.</p>\n","paper_kind":"fat2025"},{"module":4,"title":"2025 FAT Q4 · FP-tree with long/noisy transactions","origin":"Verified public transcription · VIT FAT April 2025 · F1 · Q4","marks":10,"prompt":"Five transactions: T1 {A,B,C,E,F}; T2 {G,E,F}; T3 {A,H,I,J}; T4 {A,I,J,K,L,M,N,O,P,Q,R,S,T,U,V,W,X,Y,Z}; T5 {J,B,B,D,K,E}. Construct the FP-tree and mine frequent itemsets with min support count 3.","solution":"**Step 1. First scan and support counts.** Across five transactions, **A:3, E:3, J:3** reach minimum support. Every other item occurs in fewer than three transactions. In particular, B is present in **two** transactions, even though B is repeated inside T5.\n\n**Step 2. Choose a stable frequency order** among tied items, such as alphabetical **A → E → J**. Using a different consistently applied tie-break produces a different-looking but equally valid tree.\n\n**Step 3. Filter and reorder each transaction:**\n\n| Transaction | Frequent items in order |\n|---|---|\n| T1 | A, E |\n| T2 | E |\n| T3 | A, J |\n| T4 | A, J |\n| T5 | E, J |\n\n**Step 4. Insert transactions with prefix counts; the tree is:**\n\n```text\nROOT\n├─ A:3\n│  ├─ E:1\n│  └─ J:2\n└─ E:2\n   └─ J:1\n```\n\nNode counts are prefix counts, **not** global support counts; total E support = 1 + 2 = 3 and J support = 2 + 1 = 3. Draw/header-link same-name nodes if required.\n\n**Step 5. Conditional pattern mining.** Candidate pairs have counts: A∩E = 1, A∩J = 2, E∩J = 1. All are below 3; thus no 2-itemset (or larger itemset) is frequent.\n\n**Final frequent patterns: {A}:3, {E}:3, {J}:3.** A huge transaction can mostly disappear after minimum-support filtering; that is a feature of FP-Growth, not a mistake.","lessons":["FP-Growth: the idea","Construct the actual CAT-II FP-tree","Mine the frequent patterns from the CAT-II tree"],"promptHTML":"<p>Five transactions: T1 {A,B,C,E,F}; T2 {G,E,F}; T3 {A,H,I,J}; T4 {A,I,J,K,L,M,N,O,P,Q,R,S,T,U,V,W,X,Y,Z}; T5 {J,B,B,D,K,E}. Construct the FP-tree and mine frequent itemsets with min support count 3.</p>\n","solutionHTML":"<p><strong>Step 1. First scan and support counts.</strong> Across five transactions, <strong>A:3, E:3, J:3</strong> reach minimum support. Every other item occurs in fewer than three transactions. In particular, B is present in <strong>two</strong> transactions, even though B is repeated inside T5.</p>\n<p><strong>Step 2. Choose a stable frequency order</strong> among tied items, such as alphabetical <strong>A → E → J</strong>. Using a different consistently applied tie-break produces a different-looking but equally valid tree.</p>\n<p><strong>Step 3. Filter and reorder each transaction:</strong></p>\n<table>\n<thead>\n<tr>\n  <th>Transaction</th>\n  <th>Frequent items in order</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>T1</td>\n  <td>A, E</td>\n</tr>\n<tr>\n  <td>T2</td>\n  <td>E</td>\n</tr>\n<tr>\n  <td>T3</td>\n  <td>A, J</td>\n</tr>\n<tr>\n  <td>T4</td>\n  <td>A, J</td>\n</tr>\n<tr>\n  <td>T5</td>\n  <td>E, J</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Step 4. Insert transactions with prefix counts; the tree is:</strong></p>\n<pre><code class=\"language-text\">ROOT\n├─ A:3\n│  ├─ E:1\n│  └─ J:2\n└─ E:2\n   └─ J:1\n</code></pre>\n<p>Node counts are prefix counts, <strong>not</strong> global support counts; total E support = 1 + 2 = 3 and J support = 2 + 1 = 3. Draw/header-link same-name nodes if required.</p>\n<p><strong>Step 5. Conditional pattern mining.</strong> Candidate pairs have counts: A∩E = 1, A∩J = 2, E∩J = 1. All are below 3; thus no 2-itemset (or larger itemset) is frequent.</p>\n<p><strong>Final frequent patterns: {A}:3, {E}:3, {J}:3.</strong> A huge transaction can mostly disappear after minimum-support filtering; that is a feature of FP-Growth, not a mistake.</p>\n","paper_kind":"fat2025"},{"title":"OLTP vs OLAP + five operations","module":1,"origin":"CAT-I 12 Aug 2026 · Q1","marks":10,"prompt":"Compare OLTP with OLAP on five criteria. Explain why OLAP fits decision support and describe five operations with examples.","solution":"**Comparison:** OLTP handles short real-time inserts/updates, concurrent operational tasks, current detail and normalized transactional schemas. OLAP answers read-heavy historical, aggregate, multidimensional questions via warehouses/cubes, often denormalized structures. Compare purpose, users, operations, timeframe and schema/query complexity.\n\n**Why OLAP:** Historical integration, consistent measures, ad hoc reporting, efficient large aggregates without blocking production transactions.\n\n**Operations:** Roll-up city→state; drill-down year→quarter; slice time=2026; dice product in {laptop,phone} and city in {Bangalore,Chennai}; pivot exchange product and city axes. Diagram the product×region×time cube.","lessons":["Why a data warehouse exists","OLAP operations you must distinguish"],"promptHTML":"<p>Compare OLTP with OLAP on five criteria. Explain why OLAP fits decision support and describe five operations with examples.</p>\n","solutionHTML":"<p><strong>Comparison:</strong> OLTP handles short real-time inserts/updates, concurrent operational tasks, current detail and normalized transactional schemas. OLAP answers read-heavy historical, aggregate, multidimensional questions via warehouses/cubes, often denormalized structures. Compare purpose, users, operations, timeframe and schema/query complexity.</p>\n<p><strong>Why OLAP:</strong> Historical integration, consistent measures, ad hoc reporting, efficient large aggregates without blocking production transactions.</p>\n<p><strong>Operations:</strong> Roll-up city→state; drill-down year→quarter; slice time=2026; dice product in {laptop,phone} and city in {Bangalore,Chennai}; pivot exchange product and city axes. Diagram the product×region×time cube.</p>\n","paper_kind":"cat2026"},{"title":"Three-tier warehouse for retail history","module":1,"origin":"CAT-I 12 Aug 2026 · Q2","marks":10,"prompt":"Design a data warehouse for eight years of product and country sales; justify a warehouse and draw its three-tier architecture.","solution":"**Why DW:** Integrates sales/customer/inventory sources; retains 8 years; resolves heterogeneity; avoids expensive OLAP workloads on live OLTP; supports trend and category/country aggregations.\n\n**Three-tier sketch:** Bottom: operational DBs/ERP/files → ETL/staging → historical DW + metadata, dimensions (Date, Product, Country) and Sales fact. Middle: ROLAP/MOLAP server / multidimensional query engine. Top: dashboards/reports/data mining for management. Annotate flow and example query: `SUM(revenue) by year, country, product_category`.","lessons":["Three-tier architecture and ETL","Facts, dimensions and schema designs"],"promptHTML":"<p>Design a data warehouse for eight years of product and country sales; justify a warehouse and draw its three-tier architecture.</p>\n","solutionHTML":"<p><strong>Why DW:</strong> Integrates sales/customer/inventory sources; retains 8 years; resolves heterogeneity; avoids expensive OLAP workloads on live OLTP; supports trend and category/country aggregations.</p>\n<p><strong>Three-tier sketch:</strong> Bottom: operational DBs/ERP/files → ETL/staging → historical DW + metadata, dimensions (Date, Product, Country) and Sales fact. Middle: ROLAP/MOLAP server / multidimensional query engine. Top: dashboards/reports/data mining for management. Annotate flow and example query: <code>SUM(revenue) by year, country, product_category</code>.</p>\n","paper_kind":"cat2026"},{"title":"Data mining classifications and issues","module":2,"origin":"CAT-I 12 Aug 2026 · Q3","marks":10,"prompt":"Explain classification schemes of mining systems and analyze challenges to reliable discovery.","solution":"**Classification axes:** Data type (relational/transactional/web/temporal/spatial), mined knowledge (association/classification/clustering/outlier/evolution), method (statistics, database, machine learning, visualization), and application (health/retail/finance). Give an example along each axis.\n\n**Issues:** Methodology and user interaction (multiple pattern types, interestingness, domain knowledge); efficiency and scalability (large/high-dimensional/distributed/incremental data); heterogeneous data; uncertainty/noise and evaluation; privacy and interpretation. End by explaining why those factors affect algorithm and system design.","lessons":["How mining systems are classified","Major issues in data mining"],"promptHTML":"<p>Explain classification schemes of mining systems and analyze challenges to reliable discovery.</p>\n","solutionHTML":"<p><strong>Classification axes:</strong> Data type (relational/transactional/web/temporal/spatial), mined knowledge (association/classification/clustering/outlier/evolution), method (statistics, database, machine learning, visualization), and application (health/retail/finance). Give an example along each axis.</p>\n<p><strong>Issues:</strong> Methodology and user interaction (multiple pattern types, interestingness, domain knowledge); efficiency and scalability (large/high-dimensional/distributed/incremental data); heterogeneous data; uncertainty/noise and evaluation; privacy and interpretation. End by explaining why those factors affect algorithm and system design.</p>\n","paper_kind":"cat2026"},{"title":"KDD stages and why mining is central","module":2,"origin":"CAT-I 12 Aug 2026 · Q4","marks":10,"prompt":"Explain the complete KDD process in order and why data mining is its core stage.","solution":"**Stages:** Cleaning → integration → selection → transformation → **data mining** → pattern evaluation → presentation. Describe input/output and a bank fraud example for each. State pipeline is iterative and begins with user/business goals. Mining learns candidate rules/models; the other stages prepare data, judge useful patterns, and communicate findings.","lessons":["The seven KDD stages"],"promptHTML":"<p>Explain the complete KDD process in order and why data mining is its core stage.</p>\n","solutionHTML":"<p><strong>Stages:</strong> Cleaning → integration → selection → transformation → <strong>data mining</strong> → pattern evaluation → presentation. Describe input/output and a bank fraud example for each. State pipeline is iterative and begins with user/business goals. Mining learns candidate rules/models; the other stages prepare data, judge useful patterns, and communicate findings.</p>\n","paper_kind":"cat2026"},{"title":"Pearson correlation + cleaning","module":3,"origin":"CAT-I 12 Aug 2026 · Q5","marks":10,"prompt":"Given five Mathematics scores 45,55,60,70,80 and Data Mining scores 50,60,65,75,85, find Pearson r and discuss cleaning.","solution":"Every data-mining score satisfies `y=x+5`. Since y is a strictly increasing linear transformation of x, **r=+1** (perfect positive linear correlation). You may verify via `r=[nΣxy−ΣxΣy]/sqrt([...][...])`.\n\nData cleaning handles missing entries, noise, inconsistent units, duplicate records and erroneous values using imputation, smoothing, constraints, deduplication and domain checks. Explain why cleaned data improves discovered patterns.","lessons":["Pearson correlation and covariance","Missing, noisy, inconsistent data"],"promptHTML":"<p>Given five Mathematics scores 45,55,60,70,80 and Data Mining scores 50,60,65,75,85, find Pearson r and discuss cleaning.</p>\n","solutionHTML":"<p>Every data-mining score satisfies <code>y=x+5</code>. Since y is a strictly increasing linear transformation of x, <strong>r=+1</strong> (perfect positive linear correlation). You may verify via <code>r=[nΣxy−ΣxΣy]/sqrt([...][...])</code>.</p>\n<p>Data cleaning handles missing entries, noise, inconsistent units, duplicate records and erroneous values using imputation, smoothing, constraints, deduplication and domain checks. Explain why cleaned data improves discovered patterns.</p>\n","paper_kind":"cat2026"},{"title":"Min–max and 4 equal-width bins","module":3,"origin":"CAT-II 30 Sep 2026 · Q1","marks":10,"prompt":"Values 18,27,35,49,62,70,81,96; normalize 70 into [0,1], and equal-width-bin them with k=4. Name appropriate dimensionality reduction strategy.","solution":"Data reduction addresses redundant/inconsequential customer measurements; approaches: dimensionality reduction (PCA, wavelets, attribute selection), numerosity reduction (sampling, regression, histograms, clusters, aggregation), compression.\n\n`70'=(70−18)/(96−18)=52/78≈0.6667`. Width `(96−18)/4=19.5`.\n\nBins: `[18,37.5) = {18,27,35}`; `[37.5,57)={49}`; `[57,76.5)={62,70}`; `[76.5,96]={81,96}`. State right-open convention except last bin.","lessons":["Normalization: three essential formulas","Binning and smoothing — complete numerical method"],"promptHTML":"<p>Values 18,27,35,49,62,70,81,96; normalize 70 into [0,1], and equal-width-bin them with k=4. Name appropriate dimensionality reduction strategy.</p>\n","solutionHTML":"<p>Data reduction addresses redundant/inconsequential customer measurements; approaches: dimensionality reduction (PCA, wavelets, attribute selection), numerosity reduction (sampling, regression, histograms, clusters, aggregation), compression.</p>\n<p><code>70'=(70−18)/(96−18)=52/78≈0.6667</code>. Width <code>(96−18)/4=19.5</code>.</p>\n<p>Bins: <code>[18,37.5) = {18,27,35}</code>; <code>[37.5,57)={49}</code>; <code>[57,76.5)={62,70}</code>; <code>[76.5,96]={81,96}</code>. State right-open convention except last bin.</p>\n","paper_kind":"cat2026"},{"title":"Z-score and four equal-frequency bins","module":3,"origin":"Re-CAT-II 22 Oct 2026 · Q1","marks":10,"prompt":"Scores 42,48,55,63,71,76,84,95. Standardize 71 by z-score and split into 4 equal-frequency bins. Explain cube aggregation.","solution":"`Mean=Σx/8=66.75`. Population SD: `sqrt(Σ(x−66.75)^2/8)` ≈ **17.013**; therefore `z(71) ≈ (71−66.75)/17.013 = 0.250`. If the question explicitly requests sample SD, use denominator `n−1` instead (z≈0.234).\n\nEqual-frequency bins (2 per bin): `{42,48}`, `{55,63}`, `{71,76}`, `{84,95}`.\n\nData cube aggregation reduces detailed transactions to summaries such as daily→monthly or city→state, retaining chosen measures for efficient analysis.","lessons":["Normalization: three essential formulas","Binning and smoothing — complete numerical method"],"promptHTML":"<p>Scores 42,48,55,63,71,76,84,95. Standardize 71 by z-score and split into 4 equal-frequency bins. Explain cube aggregation.</p>\n","solutionHTML":"<p><code>Mean=Σx/8=66.75</code>. Population SD: <code>sqrt(Σ(x−66.75)^2/8)</code> ≈ <strong>17.013</strong>; therefore <code>z(71) ≈ (71−66.75)/17.013 = 0.250</code>. If the question explicitly requests sample SD, use denominator <code>n−1</code> instead (z≈0.234).</p>\n<p>Equal-frequency bins (2 per bin): <code>{42,48}</code>, <code>{55,63}</code>, <code>{71,76}</code>, <code>{84,95}</code>.</p>\n<p>Data cube aggregation reduces detailed transactions to summaries such as daily→monthly or city→state, retaining chosen measures for efficient analysis.</p>\n","paper_kind":"cat2026"},{"title":"FP-Growth exact 30 September dataset","module":4,"origin":"CAT-II 30 Sep 2026 · Q2","marks":10,"prompt":"T101 I1 I2 I5; T102 I2 I3 I4; T103 I1 I2 I3; T104 I1 I3 I5; T105 I2 I3 I4 I5; T106 I1 I2 I4; T107 I1 I3 I5; T108 I2 I3 I4. Min support count=3. Build FP-tree and report all frequent itemsets.","solution":"Frequency counts: I2=6, I3=6, I1=5, I4=4, I5=4; choose global order I2>I3>I1>I4>I5 (ties lexicographically). Ordered transactions and full tree are in the linked worked lesson.\n\n**Frequent singleton counts:** I1:5, I2:6, I3:6, I4:4, I5:4.\n**Pairs:** I1I2:3, I1I3:3, I1I5:3, I2I3:4, I2I4:4, I3I4:3, I3I5:3.\n**Triple:** I2I3I4:3.\nAll other larger sets below support 3. Show conditional pattern bases/tree, not just results.","lessons":["Construct the actual CAT-II FP-tree","Mine the frequent patterns from the CAT-II tree"],"promptHTML":"<p>T101 I1 I2 I5; T102 I2 I3 I4; T103 I1 I2 I3; T104 I1 I3 I5; T105 I2 I3 I4 I5; T106 I1 I2 I4; T107 I1 I3 I5; T108 I2 I3 I4. Min support count=3. Build FP-tree and report all frequent itemsets.</p>\n","solutionHTML":"<p>Frequency counts: I2=6, I3=6, I1=5, I4=4, I5=4; choose global order I2&gt;I3&gt;I1&gt;I4&gt;I5 (ties lexicographically). Ordered transactions and full tree are in the linked worked lesson.</p>\n<p><strong>Frequent singleton counts:</strong> I1:5, I2:6, I3:6, I4:4, I5:4.\n<strong>Pairs:</strong> I1I2:3, I1I3:3, I1I5:3, I2I3:4, I2I4:4, I3I4:3, I3I5:3.\n<strong>Triple:</strong> I2I3I4:3.\nAll other larger sets below support 3. Show conditional pattern bases/tree, not just results.</p>\n","paper_kind":"cat2026"},{"title":"Four validation designs","module":5,"origin":"CAT-II 30 Sep 2026 · Q3","marks":10,"prompt":"Hospital: a single fixed split, rotating folds, class-ratio-preserving folds and each individual held out in turn. Identify and contrast all four.","solution":"1. **Holdout:** one train/test partition; cheap/high split variance. 2. **k-fold CV:** k rotations, each fold tested once; average outcomes. 3. **Stratified k-fold:** k rotations maintaining outcome class proportions, useful for rare readmissions. 4. **LOOCV:** k=N, one patient held out per fit, N fits, expensive. Mention leakage avoidance and performance averaging.","lessons":["Cross-validation methods"],"promptHTML":"<p>Hospital: a single fixed split, rotating folds, class-ratio-preserving folds and each individual held out in turn. Identify and contrast all four.</p>\n","solutionHTML":"<ol>\n<li><strong>Holdout:</strong> one train/test partition; cheap/high split variance. 2. <strong>k-fold CV:</strong> k rotations, each fold tested once; average outcomes. 3. <strong>Stratified k-fold:</strong> k rotations maintaining outcome class proportions, useful for rare readmissions. 4. <strong>LOOCV:</strong> k=N, one patient held out per fit, N fits, expensive. Mention leakage avoidance and performance averaging.</li>\n</ol>\n","paper_kind":"cat2026"},{"title":"Classification vs numeric prediction + validation","module":5,"origin":"CAT-II 30 Sep 2026 · Q4","marks":10,"prompt":"Predict a bank applicant's risk category and maximum loan amount; explain classification's two steps and reliable evaluation.","solution":"Risk category = **classification**; maximum loan amount = **regression/numeric prediction**. Training/model construction: collect labeled records, prepare data, learn feature-to-class mapping. Model use: predict new applicants. Reliability: held-out/stratified k-fold validation, confusion matrix, precision, recall, F1, specificity; check imbalanced outcomes, leakage, robustness and overfit. Numeric loan amount uses MAE/RMSE.","lessons":["Classification vs regression and the two-step process","Cross-validation methods","Confusion matrix — get the direction right"],"promptHTML":"<p>Predict a bank applicant's risk category and maximum loan amount; explain classification's two steps and reliable evaluation.</p>\n","solutionHTML":"<p>Risk category = <strong>classification</strong>; maximum loan amount = <strong>regression/numeric prediction</strong>. Training/model construction: collect labeled records, prepare data, learn feature-to-class mapping. Model use: predict new applicants. Reliability: held-out/stratified k-fold validation, confusion matrix, precision, recall, F1, specificity; check imbalanced outcomes, leakage, robustness and overfit. Numeric loan amount uses MAE/RMSE.</p>\n","paper_kind":"cat2026"},{"title":"ID3 cardiac risk, full solution","module":5,"origin":"CAT-II 30 Sep 2026 · Q5","marks":10,"prompt":"Use the eight-patient cardiac dataset from the slides; compute class entropy/gains, construct ID3, classify Young + Low Exercise + High Cholesterol.","solution":"Target entropy=1. `Gain(Age)=0.65564`; `Gain(Exercise)=0.18872`; `Gain(Cholesterol)=0.18872`. So root **Age**. Young→No, Old→Yes. In Middle, Exercise split creates pure High→No and Low→Yes. Predicted **No**. Include H for Middle=0.91830 and branch-weighted calculations to earn full working marks.","lessons":["ID3 exam solution: cardiac risk"],"promptHTML":"<p>Use the eight-patient cardiac dataset from the slides; compute class entropy/gains, construct ID3, classify Young + Low Exercise + High Cholesterol.</p>\n","solutionHTML":"<p>Target entropy=1. <code>Gain(Age)=0.65564</code>; <code>Gain(Exercise)=0.18872</code>; <code>Gain(Cholesterol)=0.18872</code>. So root <strong>Age</strong>. Young→No, Old→Yes. In Middle, Exercise split creates pure High→No and Low→Yes. Predicted <strong>No</strong>. Include H for Middle=0.91830 and branch-weighted calculations to earn full working marks.</p>\n","paper_kind":"cat2026"},{"title":"Re-CAT frequent itemsets","module":4,"origin":"Re-CAT-II 22 Oct 2026 · Q2","marks":10,"prompt":"Re-CAT transactions A/B/C/D/E (eight TIDs), minsup=3. Build FP-tree and list all frequent itemsets.","solution":"Global order B,C,A,D,E; singleton support B=6,C=6,A=5,D=4,E=4. Pairs: AB3,AC3,AD3,BC4,BE4,CD3,CE3. Triple: BCE3. The exact tree and its branches are reproduced in the linked worked lesson. Note that the itemset answers differ from the regular CAT-II despite equal singleton count distributions.","lessons":["Re-CAT FP-Growth — second solved dataset"],"promptHTML":"<p>Re-CAT transactions A/B/C/D/E (eight TIDs), minsup=3. Build FP-tree and list all frequent itemsets.</p>\n","solutionHTML":"<p>Global order B,C,A,D,E; singleton support B=6,C=6,A=5,D=4,E=4. Pairs: AB3,AC3,AD3,BC4,BE4,CD3,CE3. Triple: BCE3. The exact tree and its branches are reproduced in the linked worked lesson. Note that the itemset answers differ from the regular CAT-II despite equal singleton count distributions.</p>\n","paper_kind":"cat2026"},{"title":"Kappa and MCC from a 1000-patient confusion matrix","module":5,"origin":"Re-CAT-II 22 Oct 2026 · Q3","marks":10,"prompt":"TP=140, TN=740, FP=60, FN=60. Compute Cohen's kappa and MCC, compare to overall accuracy.","solution":"Accuracy=(140+740)/1000=.88. Chance agreement `pe=[(200×200)+(800×800)]/1000²=.68`. **κ=(.88−.68)/(1−.68)=0.625**. **MCC=(140×740−60×60)/sqrt(200×200×800×800)=0.625**. The 88% raw accuracy is somewhat inflated by class prevalence; kappa corrects expected agreement and MCC uses all four cells.","lessons":["MCC and Cohen's Kappa"],"promptHTML":"<p>TP=140, TN=740, FP=60, FN=60. Compute Cohen's kappa and MCC, compare to overall accuracy.</p>\n","solutionHTML":"<p>Accuracy=(140+740)/1000=.88. Chance agreement <code>pe=[(200×200)+(800×800)]/1000²=.68</code>. <strong>κ=(.88−.68)/(1−.68)=0.625</strong>. <strong>MCC=(140×740−60×60)/sqrt(200×200×800×800)=0.625</strong>. The 88% raw accuracy is somewhat inflated by class prevalence; kappa corrects expected agreement and MCC uses all four cells.</p>\n","paper_kind":"cat2026"},{"title":"Prepruning, postpruning and attribute criterion drawbacks","module":5,"origin":"Re-CAT-II 22 Oct 2026 · Q4","marks":10,"prompt":"Retail purchase tree memorizes noise; show how both pruning forms help and critique information gain, gain ratio and Gini.","solution":"**Prepruning:** stop splits early via max-depth/min-samples/min-gain; fast but risks underfitting. **Postpruning:** grow then remove branches with insufficient validation benefit; more accurate search but costlier. **Information gain:** prefers many-valued ID fields. **Gain ratio:** penalizes fragmentation but can favor very skewed splits. **Gini:** may focus majority and uses greedy local criteria. Use unbiased validation to select complexity.","lessons":["Overfitting and pruning","Gain ratio, Gini and continuous attributes"],"promptHTML":"<p>Retail purchase tree memorizes noise; show how both pruning forms help and critique information gain, gain ratio and Gini.</p>\n","solutionHTML":"<p><strong>Prepruning:</strong> stop splits early via max-depth/min-samples/min-gain; fast but risks underfitting. <strong>Postpruning:</strong> grow then remove branches with insufficient validation benefit; more accurate search but costlier. <strong>Information gain:</strong> prefers many-valued ID fields. <strong>Gain ratio:</strong> penalizes fragmentation but can favor very skewed splits. <strong>Gini:</strong> may focus majority and uses greedy local criteria. Use unbiased validation to select complexity.</p>\n","paper_kind":"cat2026"},{"title":"ID3 loan approval, full solution","module":5,"origin":"Re-CAT-II 22 Oct 2026 · Q5","marks":10,"prompt":"Eight customers with income, credit score, employment and approval. Compute all information gains and predict Low Income, Poor Credit, Permanent Employment.","solution":"Target 4 Yes / 4 No → H=1. Gains: **Income=0.65564**, **Employment=0.18872**, **Credit=0.04879**. Root Income. High→Yes, Low→No; Medium→Employment (Permanent→Yes, Temporary→No). Therefore new Low customer gets **No**. Draw tree and calculate branch values.","lessons":["ID3 re-CAT solution: loan approval"],"promptHTML":"<p>Eight customers with income, credit score, employment and approval. Compute all information gains and predict Low Income, Poor Credit, Permanent Employment.</p>\n","solutionHTML":"<p>Target 4 Yes / 4 No → H=1. Gains: <strong>Income=0.65564</strong>, <strong>Employment=0.18872</strong>, <strong>Credit=0.04879</strong>. Root Income. High→Yes, Low→No; Medium→Employment (Permanent→Yes, Temporary→No). Therefore new Low customer gets <strong>No</strong>. Draw tree and calculate branch values.</p>\n","paper_kind":"cat2026"},{"title":"K-medoids swap cost","module":6,"origin":"Module 6 source DOCX · worked exercise","marks":10,"prompt":"PAM starts with (4,5),(8,5) with Manhattan total cost 20. Swap (8,5)→(8,4) produces total 22. Explain the decision and algorithm.","solution":"Initial cost=20; candidate cost=22; **Δcost=22−20=+2**. A positive swap cost is worse, so **reject**, keep original medoids. Explain k initial representatives, assign nearest, sum dissimilarities, test all relevant medoid/nonmedoid swaps and stop when no improvement. A medoid must be an observed point.","lessons":["K-medoids / PAM — numerical swaps"],"promptHTML":"<p>PAM starts with (4,5),(8,5) with Manhattan total cost 20. Swap (8,5)→(8,4) produces total 22. Explain the decision and algorithm.</p>\n","solutionHTML":"<p>Initial cost=20; candidate cost=22; <strong>Δcost=22−20=+2</strong>. A positive swap cost is worse, so <strong>reject</strong>, keep original medoids. Explain k initial representatives, assign nearest, sum dissimilarities, test all relevant medoid/nonmedoid swaps and stop when no improvement. A medoid must be an observed point.</p>\n","paper_kind":"extra"},{"title":"Agglomerative linkage numeric","module":6,"origin":"Supplemental module-aligned practice","marks":10,"prompt":"Clusters A={1,2}, B={5,8}, absolute distance. Find single, complete, average linkage and interpret clustering behavior.","solution":"Cross-cluster distances: {4,7,3,6}. Single=min=**3**; complete=max=**7**; average=(4+7+3+6)/4=**5**. Single may chain across elongated groups; complete prefers compact groups; average is intermediate. Agglomerative starts with points as singleton clusters and repeatedly merges minimum linkage distance.","lessons":["Hierarchical clustering and linkage"],"promptHTML":"<p>Clusters A={1,2}, B={5,8}, absolute distance. Find single, complete, average linkage and interpret clustering behavior.</p>\n","solutionHTML":"<p>Cross-cluster distances: {4,7,3,6}. Single=min=<strong>3</strong>; complete=max=<strong>7</strong>; average=(4+7+3+6)/4=<strong>5</strong>. Single may chain across elongated groups; complete prefers compact groups; average is intermediate. Agglomerative starts with points as singleton clusters and repeatedly merges minimum linkage distance.</p>\n","paper_kind":"extra"},{"title":"Web search precision & recall","module":7,"origin":"WEB MINING.pdf pp. 26–27","marks":10,"prompt":"200 relevant web pages exist; 210 are returned, including 190 relevant. Calculate precision and recall, interpret.","solution":"Precision=190/210≈**90.48%**. Recall=190/200=**95%**. The search returned some irrelevant results (20) and missed 10 relevant pages. Precision denominator=retrieved; recall denominator=all relevant.","lessons":["Search precision and recall"],"promptHTML":"<p>200 relevant web pages exist; 210 are returned, including 190 relevant. Calculate precision and recall, interpret.</p>\n","solutionHTML":"<p>Precision=190/210≈<strong>90.48%</strong>. Recall=190/200=<strong>95%</strong>. The search returned some irrelevant results (20) and missed 10 relevant pages. Precision denominator=retrieved; recall denominator=all relevant.</p>\n","paper_kind":"extra"},{"title":"HITS adjacency and one iteration","module":7,"origin":"Supplemental module-aligned practice","marks":10,"prompt":"Edges A→B, A→C, B→C; start hub scores all 1. Compute authority and next hub vector.","solution":"Adjacency matrix rows/cols A,B,C: [[0,1,1],[0,0,1],[0,0,0]]. `a=Aᵀ[1,1,1]=[0,1,2]`. `h=Aa=[3,2,0]`. If normalization requested, divide a by √5 and h by √13. Explain why C is strongest authority and A is strongest hub.","lessons":["HITS: hubs and authorities"],"promptHTML":"<p>Edges A→B, A→C, B→C; start hub scores all 1. Compute authority and next hub vector.</p>\n","solutionHTML":"<p>Adjacency matrix rows/cols A,B,C: [[0,1,1],[0,0,1],[0,0,0]]. <code>a=Aᵀ[1,1,1]=[0,1,2]</code>. <code>h=Aa=[3,2,0]</code>. If normalization requested, divide a by √5 and h by √13. Explain why C is strongest authority and A is strongest hub.</p>\n","paper_kind":"extra"},{"title":"Active spatial triggers vs periodic remine","module":7,"origin":"M7 reference PDF · STING+","marks":10,"prompt":"Explain STING+, its grid hierarchy, cumulative spatial trigger updates, and why it is efficient.","solution":"Partition space into hierarchical rectangular cells with statistics. Monitor candidate hotspot cells and neighbor areas, create sub-triggers, accumulate primitive updates, evaluate only when a composite event may make the spatial predicate true, maintain cell indexes (PK-tree in the lecture). It avoids expensive complete repeated mining when updates are localized.","lessons":["Spatial mining and STING+"],"promptHTML":"<p>Explain STING+, its grid hierarchy, cumulative spatial trigger updates, and why it is efficient.</p>\n","solutionHTML":"<p>Partition space into hierarchical rectangular cells with statistics. Monitor candidate hotspot cells and neighbor areas, create sub-triggers, accumulate primitive updates, evaluate only when a composite event may make the spatial predicate true, maintain cell indexes (PK-tree in the lecture). It avoids expensive complete repeated mining when updates are localized.</p>\n","paper_kind":"extra"}],"formulas":[{"module":1,"name":"Number of cuboids","eq":"2^d","definition":"For d simple dimensions (each present or ALL), the subset lattice has 2^d cuboids.","example":"3 dimensions → 8 cuboids.","priority":"core"},{"module":1,"name":"AVG from partial aggregates","eq":"AVG = SUM / COUNT","definition":"Algebraic OLAP measure combines fixed-size summaries.","example":"Maintain sum and count for each group.","priority":"reference"},{"module":2,"name":"KDD pipeline","eq":"Clean → Integrate → Select → Transform → Mine → Evaluate → Present","definition":"The complete iterative knowledge discovery sequence.","example":"","priority":"reference"},{"module":3,"name":"Expected cell count","eq":"Eᵢⱼ = (rowᵢ total × colⱼ total) / N","definition":"Expected count under categorical independence.","example":"","priority":"core"},{"module":3,"name":"Chi-square","eq":"χ² = Σ(O−E)²/E","definition":"Measure disparity between observed and expected contingency counts.","example":"","priority":"core"},{"module":3,"name":"Chi-square degrees of freedom","eq":"df=(r−1)(c−1)","definition":"r rows and c columns in contingency table.","example":"","priority":"core"},{"module":3,"name":"Population mean","eq":"μ = Σxᵢ/n","definition":"Average of n values.","example":"","priority":"reference"},{"module":3,"name":"Sample mean","eq":"x̄ = Σxᵢ/n","definition":"Average of observed sample values.","example":"","priority":"reference"},{"module":3,"name":"Population variance","eq":"σ² = Σ(xᵢ−μ)² / n","definition":"Average squared deviation across the population.","example":"","priority":"reference"},{"module":3,"name":"Sample variance","eq":"s² = Σ(xᵢ−x̄)² / (n−1)","definition":"Unbiased classical sample variance estimator.","example":"","priority":"reference"},{"module":3,"name":"Standard deviation","eq":"σ=√σ² ; s=√s²","definition":"Spread in original measurement units.","example":"","priority":"reference"},{"module":3,"name":"Population covariance","eq":"Cov(X,Y)=Σ(xᵢ−x̄)(yᵢ−ȳ)/n","definition":"Joint variation; use n−1 for sample covariance.","example":"","priority":"reference"},{"module":3,"name":"Pearson correlation (centered)","eq":"r=Σ[(x−x̄)(y−ȳ)]/√[Σ(x−x̄)²·Σ(y−ȳ)²]","definition":"Unitless linear association, −1 to +1.","example":"","priority":"core"},{"module":3,"name":"Pearson correlation (raw sums)","eq":"r=[nΣxy−ΣxΣy]/√{[nΣx²−(Σx)²][nΣy²−(Σy)²]}","definition":"Convenient for tabular exam numericals.","example":"","priority":"core"},{"module":3,"name":"Min–max","eq":"x' = a + (x−min)/(max−min) × (b−a)","definition":"Normalize original range to [a,b].","example":"70 from min18,max96 → 0.6667 on [0,1].","priority":"core"},{"module":3,"name":"Z-score","eq":"z = (x−μ)/σ","definition":"Standardized deviation from mean.","example":"","priority":"core"},{"module":3,"name":"Decimal scaling","eq":"x' = x/10ʲ","definition":"Smallest nonnegative j such that max(|x'|)<1.","example":"","priority":"reference"},{"module":3,"name":"Equal-width bin","eq":"w=(max−min)/k","definition":"k intervals of the same numerical width.","example":"18–96, k4 → 19.5.","priority":"core"},{"module":3,"name":"PCA covariance matrix","eq":"Σ=XcenteredᵀXcentered/(n−1)","definition":"Eigenvectors of Σ define ordered orthogonal components.","example":"","priority":"reference"},{"module":3,"name":"PCA explained variance","eq":"EVRᵢ=λᵢ/Σⱼλⱼ","definition":"Eigenvalue share of captured total variance.","example":"","priority":"reference"},{"module":4,"name":"Support count","eq":"σ(X)=|{T∈D : X⊆T}|","definition":"Transactions that contain every item in X.","example":"","priority":"core"},{"module":4,"name":"Support","eq":"s(X)=σ(X)/N","definition":"Itemset support fraction.","example":"","priority":"core"},{"module":4,"name":"Rule support","eq":"s(X→Y)=σ(X∪Y)/N","definition":"Support of combined antecedent and consequent.","example":"","priority":"core"},{"module":4,"name":"Confidence","eq":"conf(X→Y)=σ(X∪Y)/σ(X)","definition":"Conditional prevalence of Y given X.","example":"","priority":"core"},{"module":4,"name":"Lift","eq":"lift(X→Y)=conf(X→Y)/s(Y)","definition":"Ratio of observed association to independence baseline.","example":"","priority":"core"},{"module":4,"name":"Leverage","eq":"lev(X→Y)=s(X∪Y)−s(X)s(Y)","definition":"Difference from expected independent co-occurrence.","example":"","priority":"reference"},{"module":4,"name":"Conviction","eq":"conv(X→Y)=[1−s(Y)]/[1−conf(X→Y)]","definition":"Measures implication departure from independence.","example":"","priority":"reference"},{"module":5,"name":"Entropy","eq":"H(D)=−Σᵢpᵢlog₂(pᵢ)","definition":"Impurity/uncertainty of class labels.","example":"","priority":"core"},{"module":5,"name":"Split entropy","eq":"Infoₐ(D)=Σᵥ(|Dᵥ|/|D|)H(Dᵥ)","definition":"Expected entropy after splitting on A.","example":"","priority":"core"},{"module":5,"name":"Information gain","eq":"Gain(A)=H(D)−Infoₐ(D)","definition":"ID3 selects maximum gain.","example":"","priority":"core"},{"module":5,"name":"Split information","eq":"SplitInfo(A)=−Σᵥqᵥlog₂(qᵥ)","definition":"Entropy of branch sizes, qᵥ=|Dᵥ|/|D|.","example":"","priority":"core"},{"module":5,"name":"Gain ratio","eq":"GainRatio(A)=Gain(A)/SplitInfo(A)","definition":"C4.5 criterion, denominator nonzero.","example":"","priority":"core"},{"module":5,"name":"Gini impurity","eq":"Gini(D)=1−Σᵢpᵢ²","definition":"CART impurity; pure 0.","example":"","priority":"core"},{"module":5,"name":"Bayes theorem","eq":"P(C|X)=P(X|C)P(C)/P(X)","definition":"Posterior = likelihood × prior / evidence.","example":"","priority":"core"},{"module":5,"name":"Naïve Bayes score","eq":"score(C)=P(C)∏ⱼP(xⱼ|C)","definition":"Predict class with max posterior score.","example":"","priority":"core"},{"module":5,"name":"Laplace smoothing","eq":"P(x=v|C)=[count(v,C)+1]/[n_C+K]","definition":"Avoid zero categorical probabilities.","example":"","priority":"reference"},{"module":5,"name":"BBN factorization","eq":"P(X₁,…,Xₙ)=∏ᵢP(Xᵢ|Parents(Xᵢ))","definition":"Joint distribution for Bayesian network DAG.","example":"","priority":"reference"},{"module":5,"name":"Accuracy","eq":"(TP+TN)/(TP+TN+FP+FN)","definition":"Fraction of correct predictions.","example":"","priority":"core"},{"module":5,"name":"Error rate","eq":"(FP+FN)/N","definition":"Fraction of wrong predictions.","example":"","priority":"reference"},{"module":5,"name":"Precision / PPV","eq":"TP/(TP+FP)","definition":"Correct among predicted positives.","example":"","priority":"core"},{"module":5,"name":"Recall / sensitivity / TPR","eq":"TP/(TP+FN)","definition":"Retrieved among actual positives.","example":"","priority":"core"},{"module":5,"name":"Specificity / TNR","eq":"TN/(TN+FP)","definition":"Correct among actual negatives.","example":"","priority":"core"},{"module":5,"name":"False positive rate","eq":"FP/(FP+TN)","definition":"ROC x-axis = 1−specificity.","example":"","priority":"reference"},{"module":5,"name":"F1-score","eq":"2TP/(2TP+FP+FN)","definition":"Harmonic mean of precision and recall.","example":"","priority":"core"},{"module":5,"name":"Balanced accuracy","eq":"(Recall+Specificity)/2","definition":"Treat class-wise recall symmetrically.","example":"","priority":"reference"},{"module":5,"name":"Matthews correlation coefficient","eq":"(TP·TN−FP·FN)/√[(TP+FP)(TP+FN)(TN+FP)(TN+FN)]","definition":"All four confusion cells, range roughly −1 to 1.","example":"","priority":"core"},{"module":5,"name":"Cohen's Kappa","eq":"κ=(pₒ−pₑ)/(1−pₑ)","definition":"Chance-corrected agreement.","example":"","priority":"core"},{"module":5,"name":"Kappa expected agreement","eq":"pₑ=[(TP+FP)(TP+FN)+(TN+FN)(TN+FP)]/N²","definition":"Expected by prediction/actual marginal rates.","example":"","priority":"core"},{"module":5,"name":"Mean absolute error","eq":"MAE=Σ|y−ŷ|/n","definition":"Numerical-prediction average absolute error.","example":"","priority":"reference"},{"module":5,"name":"Mean squared error","eq":"MSE=Σ(y−ŷ)²/n","definition":"Numerical-prediction squared error average.","example":"","priority":"reference"},{"module":6,"name":"Euclidean distance","eq":"d₂(x,y)=√Σ(xᵢ−yᵢ)²","definition":"Shortest straight-line distance.","example":"","priority":"core"},{"module":6,"name":"Manhattan distance","eq":"d₁(x,y)=Σ|xᵢ−yᵢ|","definition":"City-block distance.","example":"","priority":"core"},{"module":6,"name":"Minkowski distance","eq":"dₚ(x,y)=[Σ|xᵢ−yᵢ|ᵖ]^(1/p)","definition":"Generalization of L1 and L2.","example":"","priority":"reference"},{"module":6,"name":"Chebyshev distance","eq":"d∞(x,y)=maxᵢ|xᵢ−yᵢ|","definition":"Largest coordinate difference.","example":"","priority":"reference"},{"module":6,"name":"Cosine similarity","eq":"sim(x,y)=(x·y)/(||x||·||y||)","definition":"Angular similarity of nonzero vectors.","example":"","priority":"reference"},{"module":6,"name":"Jaccard resemblance","eq":"J(A,B)=|A∩B|/|A∪B|","definition":"Set overlap; 1−J for Jaccard distance.","example":"","priority":"reference"},{"module":6,"name":"K-means objective","eq":"WCSS=Σ_C Σ_(x∈C)||x−μ_C||²","definition":"Minimize within-cluster squared Euclidean distances.","example":"","priority":"core"},{"module":6,"name":"Medoid/PAM cost","eq":"Cost=Σ_points d(point, assigned medoid)","definition":"Choose medoid swaps that reduce cost.","example":"","priority":"core"},{"module":6,"name":"Single linkage","eq":"min_{a∈A,b∈B} d(a,b)","definition":"Closest cross-cluster pair.","example":"","priority":"reference"},{"module":6,"name":"Complete linkage","eq":"max_{a∈A,b∈B} d(a,b)","definition":"Farthest cross-cluster pair.","example":"","priority":"reference"},{"module":6,"name":"Average linkage","eq":"Σ_{a∈A,b∈B}d(a,b)/(|A||B|)","definition":"Average of all cross-cluster pairs.","example":"","priority":"reference"},{"module":6,"name":"Z-score outlier","eq":"z=(x−μ)/σ","definition":"Often inspect |z|>3 for near-normal numeric data.","example":"","priority":"reference"},{"module":6,"name":"IQR outlier fences","eq":"Q1−1.5·IQR ; Q3+1.5·IQR","definition":"Flag values outside inner fences.","example":"","priority":"reference"},{"module":7,"name":"HITS authority update","eq":"a←Aᵀh","definition":"Incoming hub strength; normalize between iterations.","example":"","priority":"reference"},{"module":7,"name":"HITS hub update","eq":"h←Aa","definition":"Outgoing authority strength; normalize between iterations.","example":"","priority":"reference"},{"module":7,"name":"Normalized PageRank","eq":"PR(u)=(1−d)/N + dΣ_(v→u) PR(v)/outdegree(v)","definition":"Standard normalized ranks with damping factor d.","example":"","priority":"core"},{"module":7,"name":"Course PageRank convention","eq":"PR(u)=(1−d)+dΣ_(v→u)PR(v)/outdegree(v)","definition":"Unnormalized slide formula; approximate sum N.","example":"","priority":"core"},{"module":7,"name":"Search precision","eq":"relevant retrieved / all retrieved","definition":"190/210=90.48%.","example":"","priority":"core"},{"module":7,"name":"Search recall","eq":"relevant retrieved / all relevant","definition":"190/200=95%.","example":"","priority":"core"},{"module":7,"name":"Shingle resemblance","eq":"|Sₐ∩Sᵦ|/|Sₐ∪Sᵦ|","definition":"Jaccard overlap for document shingles.","example":"","priority":"reference"},{"module":7,"name":"Document containment","eq":"|Sₐ∩Sᵦ|/|Sₐ|","definition":"Fraction of A's shingles found in B.","example":"","priority":"reference"}],"sources":[{"name":"CAT - II QP DM1 (1).pdf","parts":[{"page":1,"text":"                                                                      REG.NO.:\n\n                                                                 SLOT: D2\n             SCHOOL OF COMPUTER SCIENCE AND ENGINEERING\n
