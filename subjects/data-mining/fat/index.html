ated"},{"page":19,"text":"<number>\nVisually Evaluating Correlation\nScatter plots showing the similarity from –1 to 1."},{"page":20,"text":"<number>\nCorrelation (viewed as linear relationship)\nCorrelation measures the linear relationship between objects\nTo compute correlation, we standardize data objects, A and B, and then take their dot product"},{"page":21,"text":"<number>\nCovariance (Numeric Data)\nCovariance is similar to correlation\n\n\n\n\nwhere n is the number of tuples,      and      are the respective mean or expected values of A and B, σA and σB are the respective standard deviation of A and B.\nPositive covariance: If CovA,B > 0, then A and B both tend to be larger than their expected values.\nNegative covariance: If CovA,B < 0 then if A is larger than its expected value, B is likely to be smaller than its expected value.\nIndependence: CovA,B = 0 but the converse is not true:\nSome pairs of random variables may have a covariance of 0 but are not independent. Only under some additional assumptions (e.g., the data follow multivariate normal distributions) does a covariance of 0 imply independence\nCorrelation coefficient:"},{"page":22,"text":"Co-Variance: An Example\n\nIt can be simplified in computation as\n\nSuppose two stocks A and B have the following values in one week:  (2, 5), (3, 8), (5, 10), (4, 11), (6, 14). \nQuestion:  If the stocks are affected by the same industry trends, will their prices rise or fall together?\nE(A) = (2 + 3 + 5 + 4 + 6)/ 5 = 20/5 = 4\nE(B) = (5 + 8 + 10 + 11 + 14) /5 = 48/5 = 9.6\nCov(A,B) = (2×5+3×8+5×10+4×11+6×14)/5 − 4 × 9.6 = 4\nThus, A and B rise together since Cov(A, B) > 0."},{"page":23,"text":"<number>\n<number>\nChapter 3: Data Preprocessing\nData Preprocessing: An Overview\nData Quality\nMajor Tasks in Data Preprocessing\nData Cleaning\nData Integration\nData Reduction\nData Transformation and Data Discretization\nSummary\n"},{"page":24,"text":"<number>\nData Reduction Strategies\nData reduction: Obtain a reduced representation of the data set that is much smaller in volume but yet produces the same (or almost the same) analytical results\nWhy data reduction? — A database/data warehouse may store terabytes of data.  Complex data analysis may take a very long time to run on the complete data set.\nData reduction strategies\nDimensionality reduction, e.g., remove unimportant attributes\nWavelet transforms\nPrincipal Components Analysis (PCA)\nFeature subset selection, feature creation\nNumerosity reduction (some simply call it: Data Reduction)\nRegression and Log-Linear Models\nHistograms, clustering, sampling\nData cube aggregation\nData compression"},{"page":25,"text":"<number>\nData Reduction 1: Dimensionality Reduction\nCurse of dimensionality\nWhen dimensionality increases, data becomes increasingly sparse\nDensity and distance between points, which is critical to clustering, outlier analysis, becomes less meaningful\nThe possible combinations of subspaces will grow exponentially\nDimensionality reduction\nAvoid the curse of dimensionality\nHelp eliminate irrelevant features and reduce noise\nReduce time and space required in data mining\nAllow easier visualization\nDimensionality reduction techniques\nWavelet transforms\nPrincipal Component Analysis\nSupervised and nonlinear techniques (e.g., feature selection)"},{"page":26,"text":"<number>\nMapping Data to a New Space\n\n\n\n\nTwo Sine Waves\nTwo Sine Waves + Noise\nFrequency\nFourier transform\nWavelet transform "},{"page":27,"text":"<number>\nWhat Is Wavelet Transform?\nDecomposes a signal into different frequency subbands\nApplicable to n-dimensional signals\nData are transformed to preserve relative distance between objects at different levels of resolution\nAllow natural clusters to become more distinguishable\nUsed for image compression"},{"page":28,"text":"<number>\nWavelet Transformation \nDiscrete wavelet transform (DWT) for linear signal processing, multi-resolution analysis\nCompressed approximation: store only a small fraction of the strongest of the wavelet coefficients\nSimilar to discrete Fourier transform (DFT), but better lossy compression, localized in space\nMethod:\nLength, L, must be an integer power of 2 (padding with 0’s, when necessary)\nEach transform has 2 functions: smoothing, difference\nApplies to pairs of data, resulting in two set of data of length L/2\nApplies two functions recursively, until reaches the desired length"},{"page":29,"text":"<number>\nWavelet Decomposition\nWavelets: A math tool for space-efficient hierarchical decomposition of functions \nS = [2, 2, 0, 2, 3, 5, 4, 4] can be transformed to S^ = [23/4, -11/4, 1/2, 0, 0, -1, -1, 0]\nCompression: many small detail coefficients can be replaced by 0’s, and only the significant coefficients are retained"},{"page":30,"text":"<number>\nHaar Wavelet Coefficients \n Coefficient “Supports”\n2              2   0            2   3            5   4               4\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n+\n-\n+\n+\n+\n+\n+\n+\n+\n-\n-\n-\n-\n-\n-\n\n\n Original frequency distribution\nHierarchical decomposition structure (a.k.a. “error tree”)"},{"page":31,"text":"<number>\nWhy Wavelet Transform?\nUse hat-shape filters\nEmphasize region where points cluster\nSuppress weaker information in their boundaries  \nEffective removal of outliers\nInsensitive to noise, insensitive to input order\nMulti-resolution\nDetect arbitrary shaped clusters at different scales\nEfficient\nComplexity O(N)\nOnly applicable to low dimensional data"},{"page":32,"text":"<number>\nPrincipal Component Analysis (PCA)\nFind a projection that captures the largest amount of variation in data\nThe original data are projected onto a much smaller space, resulting in dimensionality reduction. We find the eigenvectors of the covariance matrix, and these eigenvectors define the new space\n"},{"page":33,"text":"<number>\nGiven N data vectors from n-dimensions, find k ≤ n orthogonal vectors (principal components) that can be best used to represent data \nNormalize input data: Each attribute falls within the same range\nCompute k orthonormal (unit) vectors, i.e., principal components\nEach input data (vector) is a linear combination of the k principal component vectors\nThe principal components are sorted in order of decreasing “significance” or strength\nSince the components are sorted, the size of the data can be reduced by eliminating the weak components, i.e., those with low variance (i.e., using the strongest principal components, it is possible to reconstruct a good approximation of the original data)\nWorks for numeric data only\nPrincipal Component Analysis (Steps)"},{"page":34,"text":"<number>\nAttribute Subset Selection\nAnother way to reduce dimensionality of data\nRedundant attributes \nDuplicate much or all of the information contained in one or more other attributes\nE.g., purchase price of a product and the amount of sales tax paid\nIrrelevant attributes\nContain no information that is useful for the data mining task at hand\nE.g., students' ID is often irrelevant to the task of predicting students' GPA\n\n"},{"page":35,"text":"<number>\nHeuristic Search in Attribute Selection\nThere are 2d possible attribute combinations of d  attributes\nTypical heuristic attribute selection methods:\nBest single attribute under the attribute independence assumption: choose by significance tests\nBest step-wise feature selection:\nThe best single-attribute is picked first\nThen next best attribute condition to the first, ...\nStep-wise attribute elimination:\nRepeatedly eliminate the worst attribute\nBest combined attribute selection and elimination\nOptimal branch and bound:\nUse attribute elimination and backtracking"},{"page":36,"text":"<number>\nAttribute Creation (Feature Generation)\nCreate new attributes (features) that can capture the important information in a data set more effectively than the original ones\nThree general methodologies\nAttribute extraction\n Domain-specific\nMapping data to new space (see: data reduction)\nE.g., Fourier transformation, wavelet transformation, manifold approaches (not covered)\nAttribute construction \nCombining features (see: discriminative frequent patterns in Chapter 7)\nData discretization"},{"page":37,"text":"<number>\nData Reduction 2: Numerosity Reduction\nReduce data volume by choosing alternative, smaller forms of data representation\nParametric methods (e.g., regression)\nAssume the data fits some model, estimate model parameters, store only the parameters, and discard the data (except possible outliers)\nEx.: Log-linear models—obtain value at a point in m-D space as the product on appropriate marginal subspaces \nNon-parametric methods \nDo not assume models\nMajor families: histograms, clustering, sampling, … "},{"page":38,"text":"<number>\nParametric Data Reduction: Regression and Log-Linear Models\nLinear regression\nData modeled to fit a straight line\nOften uses the least-square method to fit the line\nMultiple regression\nAllows a response variable Y to be modeled as a linear function of multidimensional feature vector\nLog-linear model\nApproximates discrete multidimensional probability distributions"},{"page":39,"text":"<number>\nRegression Analysis\nRegression analysis: A collective name for techniques for the modeling and analysis of numerical data consisting of values of a dependent variable (also called response variable or measurement) and of one or more independent variables (aka. explanatory variables or predictors)\nThe parameters are estimated so as to give a \"best fit\" of the data\nMost commonly the best fit is evaluated by using the least squares method, but other criteria have also been used\nUsed for prediction (including forecasting of time-series data), inference, hypothesis testing, and modeling of causal relationships\ny"},{"page":40,"text":"<number>\nLinear regression: Y = w X + b\nTwo regression coefficients, w and b, specify the line and are to be estimated by using the data at hand\nUsing the least squares criterion to the known values of Y1, Y2, …, X1, X2, ….\nMultiple regression: Y = b0 + b1 X1 + b2 X2\nMany nonlinear functions can be transformed into the above\nLog-linear models:\nApproximate discrete multidimensional probability distributions\nEstimate the probability of each point (tuple) in a multi-dimensional space for a set of discretized attributes, based on a smaller subset of dimensional combinations\nUseful for dimensionality reduction and data smoothing\nRegress Analysis and Log-Linear Models"},{"page":41,"text":"<number>\nHistogram Analysis\nDivide data into buckets and store average (sum) for each bucket\nPartitioning rules:\nEqual-width: equal bucket range\nEqual-frequency (or equal-depth)\n"},{"page":42,"text":"<number>\nClustering\nPartition data set into clusters based on similarity, and store cluster representation (e.g., centroid and diameter) only\nCan be very effective if data is clustered but not if data is “smeared”\nCan have hierarchical clustering and be stored in multi-dimensional index tree structures\nThere are many choices of clustering definitions and clustering algorithms\nCluster analysis will be studied in depth in Chapter 10"},{"page":43,"text":"<number>\nSampling\nSampling: obtaining a small sample s to represent the whole data set N\nAllow a mining algorithm to run in complexity that is potentially sub-linear to the size of the data\nKey principle: Choose a representative subset of the data\nSimple random sampling may have very poor performance in the presence of skew\nDevelop adaptive sampling methods, e.g., stratified sampling: \nNote: Sampling may not reduce database I/Os (page at a time)"},{"page":44,"text":"<number>\nTypes of Sampling\nSimple random sampling\nThere is an equal probability of selecting any particular item\nSampling without replacement\nOnce an object is selected, it is removed from the population\nSampling with replacement\nA selected object is not removed from the population\nStratified sampling: \nPartition the data set, and draw samples from each partition (proportionally, i.e., approximately the same percentage of the data) \nUsed in conjunction with skewed data\n"},{"page":45,"text":"<number>\nSampling: With or without Replacement\nSRSWOR\n(simple random\n sample without \nreplacement)\nSRSWR\n\n"},{"page":46,"text":"<number>\nSampling: Cluster or Stratified Sampling\n\nRaw Data \nCluster/Stratified Sample"},{"page":47,"text":"<number>\nData Cube Aggregation\nThe lowest level of a data cube (base cuboid)\nThe aggregated data for an individual entity of interest\nE.g., a customer in a phone calling data warehouse\nMultiple levels of aggregation in data cubes\nFurther reduce the size of data to deal with\nReference appropriate levels\nUse the smallest representation which is enough to solve the task\nQueries regarding aggregated information should be answered using data cube, when possible"},{"page":48,"text":"<number>\nData Reduction 3: Data Compression\nString compression\nThere are extensive theories and well-tuned algorithms\nTypically lossless, but only limited manipulation is possible without expansion\nAudio/video compression\nTypically lossy compression, with progressive refinement\nSometimes small fragments of signal can be reconstructed without reconstructing the whole\nTime sequence is not audio\nTypically short and vary slowly with time\nDimensionality and numerosity reduction may also be considered as forms of data compression\n"},{"page":49,"text":"<number>\nData Compression\nOriginal Data\nCompressed \nData\n\n\nlossless\nOriginal Data\nApproximated \n\nlossy"},{"page":50,"text":"<number>\nChapter 3: Data Preprocessing\nData Preprocessing: An Overview\nData Quality\nMajor Tasks in Data Preprocessing\nData Cleaning\nData Integration\nData Reduction\nData Transformation and Data Discretization\nSummary\n"},{"page":51,"text":"<number>\nData Transformation\nA function that maps the entire set of values of a given attribute to a new set of replacement values s.t. each old value can be identified with one of the new values\nMethods\nSmoothing: Remove noise from data\nAttribute/feature construction\nNew attributes constructed from the given ones\nAggregation: Summarization, data cube construction\nNormalization: Scaled to fall within a smaller, specified range\nmin-max normalization\nz-score normalization\nnormalization by decimal scaling\nDiscretization: Concept hierarchy climbing"},{"page":52,"text":"<number>\nNormalization\nMin-max normalization: to [new_minA, new_maxA]\n\n\nEx.  Let income range $12,000 to $98,000 normalized to [0.0, 1.0].  Then $73,000 is mapped to  \nZ-score normalization (μ: mean, σ: standard deviation):\n\n\nEx. Let μ = 54,000, σ = 16,000.  Then\nNormalization by decimal scaling\nWhere j is the smallest integer such that Max(|ν’|) < 1"},{"page":53,"text":"<number>\nDiscretization \nThree types of attributes\nNominal—values from an unordered set, e.g., color, profession\nOrdinal—values from an ordered set, e.g., military or academic rank \nNumeric—real numbers, e.g., integer or real numbers\nDiscretization: Divide the range of a continuous attribute into intervals\nInterval labels can then be used to replace actual data values \nReduce data size by discretization\nSupervised vs. unsupervised\nSplit (top-down) vs. merge (bottom-up)\nDiscretization can be performed recursively on an attribute\nPrepare for further analysis, e.g., classification"},{"page":54,"text":"<number>\nData Discretization Methods\nTypical methods: All the methods can be applied recursively\nBinning \nTop-down split, unsupervised\nHistogram analysis\nTop-down split, unsupervised\nClustering analysis (unsupervised, top-down split or bottom-up merge)\nDecision-tree analysis (supervised, top-down split)\nCorrelation (e.g., 2) analysis (unsupervised, bottom-up merge)"},{"page":55,"text":"<number>\nSimple Discretization: Binning\nEqual-width (distance) partitioning\nDivides the range into N intervals of equal size: uniform grid\nif A and B are the lowest and highest values of the attribute, the width of intervals will be: W = (B –A)/N.\nThe most straightforward, but outliers may dominate presentation\nSkewed data is not handled well\nEqual-depth (frequency) partitioning\nDivides the range into N intervals, each containing approximately same number of samples\nGood data scaling\nManaging categorical attributes can be tricky"},{"page":56,"text":"<number>\nBinning Methods for Data Smoothing\nSorted data for price (in dollars): 4, 8, 9, 15, 21, 21, 24, 25, 26, 28, 29, 34\n*  Partition into equal-frequency (equi-depth) bins:\n      - Bin 1: 4, 8, 9, 15\n      - Bin 2: 21, 21, 24, 25\n      - Bin 3: 26, 28, 29, 34\n*  Smoothing by bin means:\n      - Bin 1: 9, 9, 9, 9\n      - Bin 2: 23, 23, 23, 23\n      - Bin 3: 29, 29, 29, 29\n*  Smoothing by bin boundaries:\n      - Bin 1: 4, 4, 4, 15\n      - Bin 2: 21, 21, 25, 25\n      - Bin 3: 26, 26, 26, 34"},{"page":57,"text":"<number>\nDiscretization Without Using Class Labels\u000b(Binning vs. Clustering) \n\nData\nEqual interval width (binning)\nEqual frequency (binning)\nK-means clustering leads to better results"},{"page":58,"text":"<number>\nDiscretization by Classification & Correlation Analysis\nClassification (e.g., decision tree analysis)\nSupervised: Given class labels, e.g., cancerous vs. benign\nUsing entropy to determine split point (discretization point)\nTop-down, recursive split\nDetails to be covered in Chapter 7\nCorrelation analysis (e.g., Chi-merge: χ2-based discretization)\nSupervised: use class information\nBottom-up merge: find the best neighboring intervals (those having similar distributions of classes, i.e., low χ2 values) to merge\nMerge performed recursively, until a predefined stopping condition\n\n"},{"page":59,"text":"<number>\nConcept Hierarchy Generation\nConcept hierarchy organizes concepts (i.e., attribute values) hierarchically and is usually associated with each dimension in a data warehouse\nConcept hierarchies facilitate drilling and rolling in data warehouses to view data in multiple granularity\nConcept hierarchy formation: Recursively reduce the data by collecting and replacing low level concepts (such as numeric values for age) by higher level concepts (such as youth, adult, or senior)\nConcept hierarchies can be explicitly specified by domain experts and/or data warehouse designers\nConcept hierarchy can be automatically formed for both numeric and nominal data.  For numeric data, use discretization methods shown.\n"},{"page":60,"text":"<number>\nConcept Hierarchy Generation \u000bfor Nominal Data\nSpecification of a partial/total ordering of attributes explicitly at the schema level by users or experts\nstreet < city < state < country\nSpecification of a hierarchy for a set of values by explicit data grouping\n{Urbana, Champaign, Chicago} < Illinois\nSpecification of only a partial set of attributes\nE.g., only street < city, not others\nAutomatic generation of hierarchies (or attribute levels) by the analysis of the number of distinct values\nE.g., for a set of attributes: {street, city, state, country}"},{"page":61,"text":"<number>\nAutomatic Concept Hierarchy Generation\nSome hierarchies can be automatically generated based on the analysis of the number of distinct values per attribute in the data set \nThe attribute with the most distinct values is placed at the lowest level of the hierarchy\nExceptions, e.g., weekday, month, quarter, year"},{"page":62,"text":"<number>\nChapter 3: Data Preprocessing\nData Preprocessing: An Overview\nData Quality\nMajor Tasks in Data Preprocessing\nData Cleaning\nData Integration\nData Reduction\nData Transformation and Data Discretization\nSummary\n"},{"page":63,"text":"<number>\nSummary\nData quality: accuracy, completeness, consistency, timeliness, believability, interpretability\nData cleaning: e.g. missing/noisy values, outliers\nData integration from multiple sources: \nEntity identification problem\nRemove redundancies\nDetect inconsistencies\nData reduction\nDimensionality reduction\nNumerosity reduction\nData compression\nData transformation and data discretization\nNormalization\nConcept hierarchy generation\n\n\n"},{"page":64,"text":"<number>\nReferences\nD. P. Ballou and G. K. Tayi. Enhancing data quality in data warehouse environments. Comm. of ACM, 42:73-78, 1999\nA. Bruce, D. Donoho, and H.-Y. Gao. Wavelet analysis. IEEE Spectrum, Oct 1996\nT. Dasu and T. Johnson.  Exploratory Data Mining and Data Cleaning. John Wiley, 2003\nJ. Devore and R. Peck. Statistics: The Exploration and Analysis of Data. Duxbury Press, 1997.\nH. Galhardas, D. Florescu, D. Shasha, E. Simon, and C.-A. Saita. Declarative data cleaning: Language, model, and algorithms. VLDB'01\nM. Hua and J. Pei. Cleaning disguised missing data: A heuristic approach. KDD'07\nH. V. Jagadish, et al., Special Issue on Data Reduction Techniques.  Bulletin of the Technical Committee on Data Engineering, 20(4), Dec. 1997\nH. Liu and H. Motoda (eds.). Feature Extraction, Construction, and Selection: A Data Mining Perspective. Kluwer Academic, 1998\nJ. E. Olson. Data Quality: The Accuracy Dimension.  Morgan Kaufmann, 2003\nD. Pyle. Data Preparation for Data Mining.  Morgan Kaufmann, 1999\nV. Raman and J. Hellerstein. Potters Wheel: An Interactive Framework for Data Cleaning and Transformation, VLDB’2001\nT. Redman. Data Quality: The Field Guide. Digital Press (Elsevier), 2001\nR. Wang, V. Storey, and C. Firth. A framework for analysis of data quality research. IEEE Trans. Knowledge and Data Engineering, 7:623-640, 1995"}]},{"name":"Converted legacy slides / M1 DM.pptx","parts":[{"page":1,"text":"\u000b\n \n<number>\n\nMs. MAHESWARI .B\nAssistant Professor, SCOPE\n(PRP ANNEX- 101L)\nmaheswari.b@vit.ac.in\nBCSE208L -Data Mining"},{"page":2,"text":"<number>\n<number>\n\u000b\u000bModule 1\u000bData Warehousing\u000b "},{"page":3,"text":"Introduction  to Data Warehouse \nWhy data warehouse?\n\nWhat is data warehouse?\n\n<number>"},{"page":4,"text":"<number>\n\n\nWhat is a Data Warehouse?\n \tA single, complete and consistent store of data obtained from a variety of different sources made available to end users in a way they can understand and use in a business context.\n\n\t[Barry Devlin]\nNovember 16, 2026"},{"page":5,"text":"<number>\n\n\nWhat is Data Warehousing?\n \tA process of transforming data into information and making it available to users in a timely enough manner to make a difference\n\n[Forrester Research, April 1996]\nNovember 16, 2026"},{"page":6,"text":"<number>\nWhat is a Data Warehouse?\nDefined in many different ways, but not rigorously.\nA decision support database that is maintained separately from the organization’s operational database\nSupport information processing by providing a solid platform of consolidated, historical data for analysis.\n“A data warehouse is a subject-oriented, integrated, time-variant, and nonvolatile collection of data in support of management’s decision-making process.”—W. H. Inmon\nData warehousing:\nThe process of constructing and using data warehouses"},{"page":7,"text":"Introduction to Data warehouse\nData\twarehouse\trefers\tto\ta\tdata\trepository\nthat\tis\tmaintained\nseparately from an organization’s operational databases.\nData\twarehouse\tsystems\tallow\tfor\tintegration\tof\ta\tvariety\tof\napplication systems.\nThey support information processing by providing a solid platform of \tconsolidated historic data for analysis.\nDefinition - A data warehouse is a subject-oriented, integrated, time-\nvariant,\tand\tnonvolatile\tcollection\tof\tdata\tin\tsupport\tof\nmanagement’s decision making process.\nIt’s a process of transforming data into information and making it \tavailable for users to make a difference in a timely way."},{"page":8,"text":"Collecting\tand\nmanaging\tdata\tfrom\tdiverse\tsources\tto\tprovide\nmeaningful insights into the business.\nData\tWarehouse\tis\ttypically\tused\tto\tconnect\tand\tanalyze \theterogeneous sources of business data."},{"page":9,"text":"Characteristics of Data Warehousing\nSubject Oriented\nprovides  information  on  a  topic  rather  than  the  ongoing \toperations of organizations. (ie. Day to day transactions of the \tdata)\nTopics include – customer, supplier, inventory, promotion etc\nFocuses on the modeling and analysis of data for decision makers.\nthe\tinformation\tnot\tused\tfor\tthe\tdecision\tmaking\nExcludes \tprocess.\nIntegrated\nconstructed by integrating multiple heterogeneous sources, such \tas relational databases, flat files, and online transaction records.\nstandard unit of measurement from the different databases for all\nthe similar data"},{"page":10,"text":"Time-variant:\nData are stored to provide information from an historic perspective (e.g., the past 5–10 years).\nEvery key structure in the data warehouse contains, either \timplicitly or explicitly, a time element.\nNon-Volatile\nprior data will not be erased when new data are entered \tinto it.\nData is read-only, only updated regularly.\nThe transaction process, recovery, and competitiveness \tcontrol mechanisms are not required.\nIt usually requires only two operations in data accessing:\ninitial loading of data andDHeaebac. Jc/SCeOPsE s of data."},{"page":11,"text":""},{"page":12,"text":"\nBuilding a data warehouse\nThe first step is data extraction, whereby large amounts of \tdata gets collected from multiple source points.\nUpon processing the data, it goes into data cleaning, the method  of  combing  for  errors  through  the  data  and removing or excluding any found errors.\nThe cleaned-up data is then transformed from a format for the computer to a form for the warehouse.\nWhen processed in the facility, the data goes through \tprocessing, consolidating, summing, etc. to make it more \torganized and user-friendly.\nThroughout  time,  as  the  multiple  data  points  are \tmodified, additional data is introduced to the warehouse."},{"page":13,"text":"Datawarehouse vs Database\nA database is a transactional system set to track and change the data \tin real-time so that only the most current data is available (query-driven approach).\nA database is configured over a period to store the structured data.\nFor example, a database could only have a customer’s most current \taddress, while a data warehouse could have all the addresses in \twhich the consumer has resided for the past ten years (update driven approach)."},{"page":14,"text":"Datawarehouse architecture (Multitiered Architecture)\n\nBottom Tier → Store data \nMiddle Tier → Process data \nTop Tier → Show reports "},{"page":15,"text":"Design of Data Warehouse: A Business Analysis Framework\nFour views regarding the design of a data warehouse \nTop-down view\nallows selection of the relevant information necessary for the data warehouse\nData source view\nexposes the information being captured, stored, and managed by operational systems\nData warehouse view\nconsists of fact tables and dimension tables\nBusiness query view \nsees the perspectives of data in the warehouse from the view of end-user\n<number>"},{"page":16,"text":"<number>\nWhy a Separate Data Warehouse?\nHigh performance for both systems\nDBMS— tuned for OLTP: access methods, indexing, concurrency control, recovery\nWarehouse—tuned for OLAP: complex OLAP queries, multidimensional view, consolidation\nDifferent functions and different data:\nmissing data: Decision support requires historical data which operational DBs do not typically maintain\ndata consolidation:  DS requires consolidation (aggregation, summarization) of data from heterogeneous sources\ndata quality: different sources typically use inconsistent data representations, codes and formats which have to be reconciled\nNote: There are more and more systems which perform OLAP analysis directly on relational databases"},{"page":17,"text":"<number>\n\nData Warehouse: A Multi-Tiered Architecture\n\nData\nWarehouse\n\n\nOLAP Engine\nAnalysis\nQuery\nReports\nData mining\nMonitor\n&\nIntegrator\nMetadata\n\nData Sources\nFront-End Tools\nServe\n\n\n\n\n\nData Marts\n\n\n\n\n\n\n\n\nData Storage\n\n\n\n\nOLAP Server\n"},{"page":18,"text":"<number>\nExtraction, Transformation, and Loading (ETL)\nData extraction\nget data from multiple, heterogeneous, and external sources\nData cleaning\ndetect errors in the data and rectify them when possible\nData transformation\nconvert data from legacy or host format to warehouse format\nLoad\nsort, summarize, consolidate, compute views, check integrity, and build indicies and partitions\nRefresh\npropagate the updates from the data sources to the warehouse"},{"page":19,"text":"<number>\nMetadata Repository\nMeta data is the data defining warehouse objects.  It stores:\nDescription of the structure of the data warehouse\nschema, view, dimensions, hierarchies, derived data defn, data mart locations and contents\nOperational meta-data\ndata lineage (history of migrated data and transformation path), currency of data (active, archived, or purged), monitoring information (warehouse usage statistics, error reports, audit trails)\nThe algorithms used for summarization\nThe mapping from operational environment to the data warehouse\nData related to system performance\nwarehouse schema, view and derived data definitions\nBusiness data\nbusiness terms and definitions, ownership of data, charging policies"},{"page":20,"text":"<number>\nThree Data Warehouse Models\nEnterprise warehouse\ncollects all of the information about subjects spanning the entire organization\nData Mart\na subset of corporate-wide data that is of value to a specific groups of users.  Its scope is confined to specific, selected groups, such as marketing data mart\nIndependent vs. dependent (directly from warehouse) data mart\nVirtual warehouse\nA set of views over operational databases\nOnly some of the possible summary views may be materialized"},{"page":21,"text":"Data Warehouse models\nFrom the architecture point of view, there are three data warehouse \tmodels:\nthe enterprise warehouse,\nthe data mart, and\nthe virtual warehouse.\nEnterprise warehouse\ncollects all of the information about subjects spanning the entire \torganization.\nIt provides corporate-wide data integration, usually from one or more operational systems or external information providers, and is cross-functional in scope. (Large volume of data) – implemented in super computer/parallel architectures"},{"page":22,"text":"Data Mart\nContains a subset of corporate-wide data that is of value to a specific group of users. (specific selected subjects)\n For example, a marketing data may confine its subjects to customer, item, and sales.\nImplemented on low-cost departmental\tservers that are Unix/Linux or Windows based.\n Independent (collect data from sources instead of data warehouse \tand dependent data marts (collect data from data warehouse)"},{"page":23,"text":"Virtual warehouse:\nA virtual warehouse is a set of views over operational databases.\nFor efficient query processing, only some of the possible summary views may be materialized."},{"page":24,"text":"Data warehouse modelling"},{"page":25,"text":"Data warehouse modelling"},{"page":26,"text":"<number>\nFrom Tables and Spreadsheets to \u000bData Cubes\nA data warehouse is based on a multidimensional data model which views data in the form of a data cube\nA data cube, such as sales, allows data to be modeled and viewed in multiple dimensions\nDimension tables, such as item (item_name, brand, type), or time(day, week, month, quarter, year) \nFact table contains measures (such as dollars_sold) and keys to each of the related dimension tables\nIn data warehousing literature, an n-D base cube is called a base cuboid. The top most 0-D cuboid, which holds the highest-level of summarization, is called the apex cuboid.  The lattice of cuboids forms a data cube."},{"page":27,"text":"Suppose you want to perform operations – summing, average, \tmanipulation the you need a fact table\n\nThe fact table contains the names of the facts, or measures, as well as keys to  each  of  the  related  dimension tables."},{"page":28,"text":"<number>\nCube: A Lattice of Cuboids\ntime,item\ntime,item,location\ntime, item, location, supplier"},{"page":29,"text":"<number>\nOLTP vs. OLAP\n"},{"page":30,"text":"Online Analytical Processing (OLAP) and data mining are two types of access tools \tthat have been developed to meet the demands of management users. OLAP is a design paradigm that provides a method to extract useful information from a \tphysical data store.\nDefining OLAP: OLAP can be defined as 'the dynamic synthesis, analysis, and\nconsolidation of large volumes of multi-dimensional data’.\nApplications\nFeatures of OLAP\nMulti-dimensional view of data\nTime intelligence\nComplex calculations support"},{"page":31,"text":"\nOLAP Benefits\nIncreased productivity of end-users.\nRetention of organizational control over the integrity of corporate data.\nReduced backlog of applications development for IT staff.\nImproved profitability and potential revenue.\nReduced query drag and network traffic on the data warehouse or OLTP \tsystems.\nStrengths of OLAP\nIt is a powerful visualization tool.\nOLAP tools are good for analyzing time series.\nIt provides fast, interactive response time.\nOLAP tools are offered by many vendors.\nIt can be of help in identifying outliers and clusters."},{"page":32,"text":"Representation of multidimensional data\n(a) Relational model,\n(b) Two dimensional view\nIf we consider large databases consisting of thousands of cities, the time that  it  takes  a  relational  DBMS  to  perform  such  calculation  becomes significant. A typical RDBMS can scan a few hundred records per second."},{"page":33,"text":"Relational model representation\nThree dimensional view"},{"page":34,"text":"Data Cube\nA Data Cube is described in terms of dimensions and facts. It represents data in different dimensions. Here, the dimensions are generally the entities which an organization preserves as records.\n2-D view of sales data (i.e item and time)\nIf the user wishes to see the data of sales along with one more dimension, let us \tsuppose, the location dimension, then three dimensional view may be helpful in \tthis case."},{"page":35,"text":"3-D view of time, item, location"},{"page":36,"text":"Cubical 3-D view of sales data"},{"page":37,"text":"OLAP Operations\nOLAP is implemented with data cubes, on which the following operations may be \tapplied:\nRoll-up: The roll-up operation (also called the drill-up operation by some \tvendors)  performs  aggregation  on  a  data  cube,  either  by  climbing  up  a \tconcept hierarchy for a dimension or by dimension reduction.\n\nThis hierarchy was defined as the total order “street < city < province or state\n< country.” The roll-up operation shown aggregates the data by ascending the\nlocation hierarchy from the level of city to the level of country.\n\nIn other words, rather than grouping the data by city, the resulting cube groups the data by country. When roll-up is performed by dimension reduction, one or more dimensions are removed from the given cube."},{"page":38,"text":"Drill-down: Drill-down is the reverse of roll-up. It navigates from less \tdetailed data to more detailed data.\nDrill-down\tcan\tbe\trealized\tby\teither\tstepping\tdown\ta concept hierarchy for a dimension or introducing additional dimensions.\nDrill-down occurs by descending the time hierarchy from the level of\nquarter to the more detailed level of month.\nThe resulting data cube details the total sales per month rather than \tsummarizing them by quarter.\nBecause a drill-down adds more detail to the given data, it can also be \tperformed by adding new dimensions to a cube."},{"page":39,"text":"\nSlice and dice: Slice and dice represent the way to view the information from different perspectives.\nThe slice operation gives a new sub-cube by selecting one particular dimension from a specified cube.\nThe dice operation defines a subcube by performing a selection on two or more dimensions.\nDice operation on the central cube based on the following selection criteria that involve three dimensions: (location\tD “Toronto” or Vancouver”) and (time D “Q1” or “Q2”) and (item\tD “home entertainment” or “computer”).\nPivot: Pivot (also called rotate) is a visualization operation that rotates the data axes in view to provide an alternative data presentation\n\n\n\nNovember 16, 2026\nData Mining: Concepts and Techniques\n<number>"},{"page":40,"text":"Consider this table for implementing OLAP operations"},{"page":41,"text":"Data cube"},{"page":42,"text":"<number>\nTypical OLAP Operations\nRoll up (drill-up): summarize data\nby climbing up hierarchy or by dimension reduction\nDrill down (roll down): reverse of roll-up\nfrom higher level summary to lower level summary or detailed data, or introducing new dimensions\nSlice and dice: project and select \nPivot (rotate): \nreorient the cube, visualization, 3D to series of 2D planes\nOther operations\ndrill across: involving (across) more than one fact table\ndrill through: through the bottom level of the cube to its back-end relational tables (using SQL)"},{"page":43,"text":"OLAP \noperations"},{"page":44,"text":"Schema\nThe entity-relationship data model is commonly used in the design of relational \tdatabases, where a database schema consists of a set of entities and the \trelationships between them.\nSuch a data model is appropriate for online transaction processing.\nA data warehouse, however, requires a concise, subject-oriented schema that \tfacilitates online data analysis.\nLogical descriptions of database are known as Schema.\nThe most popular data model for a data warehouse is a multidimensional model, \twhich can exist in the form of\na star schema, a snowflake schema, or a fact constellation schema."},{"page":45,"text":"<number>\nConceptual Modeling of Data Warehouses\nModeling data warehouses: dimensions & measures\nStar schema: A fact table in the middle connected to a set of dimension tables \nSnowflake schema:  A refinement of star schema where some dimensional hierarchy is normalized into a set of smaller dimension tables, forming a shape similar to snowflake\nFact constellations:  Multiple fact tables share dimension tables, viewed as a collection of stars, therefore called galaxy schema or fact constellation "},{"page":46,"text":"Star Schema\nThe most common modeling paradigm is the star schema, in which \tthe data warehouse contains\n(1) a large central table (fact table) containing the bulk of the data, with no \tredundancy, and\n(2)  a  set  of  smaller  attendant  tables  (dimension  tables),  one  for  each \tdimension.\nThe schema contains a central fact table for sales that contains keys \tto each of the four dimensions along with two measures: dollars sold \tand units sold. To minimize the size of the fact table, dimension \tidentifiers  (e.g.,  time  key  and  item  key)  are  system-generated \tidentifiers\nEach table contains a set of attributes. For example, the location \tdimension table contains the attribute set location key, street, city, \tprovince or state, country.\nDrawback – redundancy"},{"page":47,"text":"Snowflake schema: The snowflake schema is a variant of the star \tschema  model,  where  some  dimension  tables  are  normalized, \tthereby further splitting the data into additional tables.\nThe resulting schema graph forms a shape similar to a snowflake.\nThe major difference between the snowflake and star schema models \tis that the dimension tables of the snowflake model may be kept in \tnormalized form to reduce redundancies.\nSuch a table is easy to maintain and saves storage space.\nThe main difference between the two schemas is in the definition of \tdimension tables.\nThe single dimension table for item in the star schema is normalized \tin the snowflake schema, resulting in new item and supplier tables."},{"page":48,"text":"Fact constellation: Sophisticated applications may require multiple \tfact tables to share dimension tables. This kind of schema can be \tviewed as a collection of stars, and hence is called a galaxy schema or \ta fact constellation.\nThis schema specifies two fact tables, sales and shipping."},{"page":49,"text":"<number>\nExample of Star Schema\n   \n\nSales Fact Table\n\n           time_key\n              item_key\n\n           branch_key\n\n         location_key\n\n            units_sold\n\n         dollars_sold\n\n             avg_sales\nMeasures\n\n\n\n\n\n\n"},{"page":50,"text":"<number>\nExample of Snowflake Schema\n\nSales Fact Table\n\n           time_key\n              item_key\n\n           branch_key\n\n         location_key\n\n            units_sold\n\n         dollars_sold\n\n             avg_sales\nMeasures\n\n\n\n\n\n\n\n\n"},{"page":51,"text":"<number>\nExample of Fact Constellation\n\nSales Fact Table\n\ntime_key\n         item_key\n\n      branch_key\n\n    location_key\n\n        units_sold\n\n     dollars_sold\n\n         avg_sales\nMeasures\n\n\n\n\n\n\n\n\nShipping Fact Table\n\ntime_key\n         item_key\n\n     shipper_key\n\n  from_location\n\n      to_location\n\n     dollars_cost\n\n   units_shipped\n\n\n\n\n\n\n\n\n\n"},{"page":52,"text":"<number>\nA Concept Hierarchy: \u000bDimension (location)\nall\nEurope\nNorth_America\nMexico\nCanada\nSpain\nGermany\nVancouver\nM. Wind\nL. Chan\n...\n...\n...\n...\n...\n...\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nall\nregion\noffice\n\n\n\n\ncountry\n\n\n\n\nToronto\nFrankfurt\ncity"},{"page":53,"text":"<number>\nData Cube Measures: Three Categories\nDistributive: if the result derived by applying the function to n aggregate values is the same as that derived by applying the function on all the data without partitioning\nE.g., count(), sum(), min(), max()\nAlgebraic: if it can be computed by an algebraic function with M arguments (where M is a bounded integer), each of which is obtained by applying a distributive aggregate function\nE.g.,  avg(), min_N(), standard_deviation()\nHolistic: if there is no constant bound on the storage size needed to describe a subaggregate.  \nE.g., median(), mode(), rank()"},{"page":54,"text":"<number>\nMultidimensional Data\nSales volume as a function of product, month, and region\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nProduct\nRegion\nMonth\n\n\nDimensions: Product, Location, Time\nHierarchical summarization paths\nIndustry   Region         Year\n\nCategory   Country  Quarter\n\nProduct      City     Month    Week\n\n                   Office         Day\n\n\n\n\n\n\n\n\n\n"},{"page":55,"text":"<number>\nA Sample Data Cube\n\nTotal annual sales\nof  TVs in U.S.A."},{"page":56,"text":"<number>\nCuboids Corresponding to the Cube\n\n\n\n\n\n\n\n\nall\n\n\n\n\n\n\n\n\n\n\n\n\nproduct\ndate\ncountry\nproduct,date\nproduct,country\ndate, country\nproduct, date, country\n0-D (apex) cuboid\n1-D cuboids\n2-D cuboids\n3-D (base) cuboid"},{"page":57,"text":"<number>\nA Star-Net Query Model\n \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nShipping Method\nAIR-EXPRESS\nTRUCK\nORDER\n\nCustomer Orders\nCONTRACTS\nCustomer\nProduct\nPRODUCT GROUP\nPRODUCT LINE\nPRODUCT ITEM\nSALES PERSON\nDISTRICT\nDIVISION\nOrganization\nPromotion\nCITY\nCOUNTRY\nREGION\nLocation\nDAILY\nQTRLY\nANNUALY\nTime\n\n\n\n\n\nEach circle is called a footprint"}]}]}</script><script>

function restoreSidebarPosition(){
 const side=$('.sidebar');if(!side)return;
 side.scrollTop=sidebarRemembered;
 const active=side.querySelector('.side-lessons button.active');
 if(active&&active.getClientRects().length){
  const sr=side.getBoundingClientRect(), ar=active.getBoundingClientRect();
  const topSafe=sr.top+55, bottomSafe=sr.bottom-48;
  if(ar.top<topSafe)side.scrollTop-=topSafe-ar.top;
  else if(ar.bottom>bottomSafe)side.scrollTop+=ar.bottom-bottomSafe;
 }
 sidebarRemembered=side.scrollTop;
 side.addEventListener('scroll',()=>{
  sidebarRemembered=side.scrollTop;
  try{sessionStorage.setItem('dm-fat-sidebar-position',String(sidebarRemembered))}catch(_){}
 },{passive:true});
}

 seq.forEach(item=>{let c=node.ch.find(x=>x.k===item);if(!c){c={k:item,n:0,ch:[]};node.ch.push(c)}c.n++;node=c});

 node.ch.forEach((x,i)=>{let last=i===node.ch.length-1;rows.push(prefix+(last?'└─ ':'├─ ')+x.k+':'+x.n);rows.push(fpTreeASCII(x,prefix+(last?'   ':'│  '),last))});

function metricNums(){let [TP,FP,TN,FN]=state.demo.metric.map(x=>Math.max(0,+x||0)),N=TP+FP+TN+FN,div=(a,b)=>b?a/b:NaN,po=div(TP+TN,N),pe=N?((TP+FP)*(TP+FN)+(TN+FN)*(TN+FP))/(N*N):NaN;
 return{TP,FP,TN,FN,N,accuracy:po,precision:div(TP,TP+FP),recall:div(TP,TP+FN),specificity:div(TN,TN+FP),f1:div(2*TP,2*TP+FP+FN),mcc:div(TP*TN-FP*FN,Math.sqrt((TP+FP)*(TP+FN)*(TN+FP)*(TN+FN))),kappa:div(po-pe,1-pe),pe};}

 <div class="demo-output"><div class="eyebrow">CLASSIFICATION MATRIX</div>${dataTable(['ACTUAL \\ PREDICTED','Positive','Negative'],[['Positive','TP = '+v.TP,'FN = '+v.FN],['Negative','FP = '+v.FP,'TN = '+v.TN]])}
 <div class="eyebrow">PERFORMANCE MEASURES</div>${dataTable(['METRIC','SCORE'],[['Accuracy',pct(v.accuracy)],['Precision',pct(v.precision)],['Recall',pct(v.recall)],['Specificity',pct(v.specificity)],['F1',pct(v.f1)],['Chance agreement pe',fmt(v.pe)],["Cohen's Kappa",fmt(v.kappa)],['MCC',fmt(v.mcc)]])}</div>

function cvDemo(){

 return demoBox('Cross-validation fold viewer','M05 / HOLDOUT · K-FOLD · STRATIFIED · LOO',

 <div style="display:flex;gap:6px;margin:20px 0">${Array.from({length:mode==='loo'?10:5},(_,i)=>{let test=mode==='holdout'?i===4:mode==='loo'?i===state.demo.cv%10:i===f;return `<div style="flex:1;background:${test?'var(--accent)':'var(--deep)'};color:var(--bg);padding:18px 3px;text-align:center;border-radius:4px;font:10px var(--mono)">${test?'TEST':'TRAIN'}<br>${i+1}</div>`}).join('')}</div>
 <p style="font-size:13px">${mode==='holdout'?'One fixed holdout test subset; fit the model once.':mode==='loo'?'Example shows 10 records; 1 is tested on each of 10 iterations, 9 used to train.':mode==='strat'?'The selected fold is tested; each fold maintains approximately the same class proportions.':'Each of five folds is tested exactly once; other four provide training data.'}</p>
 <div class="control-row"><button class="btn small" data-act="cvPrev">← Previous fold</button><strong class="mono">TEST FOLD ${mode==='holdout'?'5':state.demo.cv%(mode==='loo'?10:5)+1}</strong><button class="btn small" data-act="cvNext">Next fold →</button></div>
 <small>Never normalize/impute on the full dataset before performing each training–validation split; that leaks test information.</small>`);

 let points=[1,2,4,10,11,12],c=state.demo.kmeans,old=[1,10],newC=[7/3,11],centers=c===0?old:newC,assignment=points.map(x=>Math.abs(x-centers[0])<=Math.abs(x-centers[1])?0:1);
 const toX=x=>30+(x-0)*42;

 const marks=centers.map((x,i)=>`<path d="M${toX(x)-9} ${i?84:27} l18 0 m-9 -9 v18" stroke="${i?'#b97256':'#326957'}" stroke-width="3"/>`).join('');

 `<p>Six 1D points, k=2. Start with centroids 1 and 10 and see how assignment leads to new means.</p>
 <svg viewBox="0 0 560 175" style="width:100%;height:auto;max-height:210px;border:1px solid var(--line);border-radius:7px;background:var(--tint)" aria-label="One dimensional cluster points">${Array.from({length:13},(_,x)=>`<line x1="${toX(x)}" y1="145" x2="${toX(x)}" y2="154" stroke="var(--muted)"/><text x="${toX(x)}" y="166" fill="var(--muted)" font-size="9" text-anchor="middle">${x}</text>`).join('')}<line x1="30" y1="144" x2="534" y2="144" stroke="var(--muted)"/>${dots}${marks}</svg>
 <div class="control-row"><button class="btn small" data-act="kmPrev">← Previous</button><span class="mono">ITERATION ${c}</span><button class="btn small" data-act="kmNext">Next →</button></div>
 <div class="demo-output"><strong>${c===0?'Initial centroids: μ₁=1, μ₂=10':c===1?'Recomputed centroids: μ₁=7/3≈2.333, μ₂=11':'No assignments change: converged.'}</strong><p>Cluster A = {1,2,4}. Cluster B = {10,11,12}. Current centroids: (${fmt(centers[0])}, ${fmt(centers[1])}).</p></div>
 <small>A centroid need not be a data point. A medoid must be an observed point.</small>`);
}
const DBPTS=[[45,60],[60,50],[75,63],[55,75],[85,75],[150,50],[166,65],[179,47],[155,81],[260,145],[295,30],[290,115]];
function dbscanCompute(eps,minpts=3){
 const visited=new Set(),labs=DBPTS.map(()=>-1);
 const neighbors=i=>DBPTS.map((p,j)=>Math.hypot(p[0]-DBPTS[i][0],p[1]-DBPTS[i][1])<=eps?j:-1).filter(j=>j>=0);
 let group=0,core=DBPTS.map((_,i)=>neighbors(i).length>=minpts);
 DBPTS.forEach((_,i)=>{if(visited.has(i))return;visited.add(i);let ns=neighbors(i);if(ns.length<minpts)return;let queue=[...ns],seen=new Set(queue);labs[i]=group;
 for(let a=0;a<queue.length;a++){const j=queue[a];if(!visited.has(j)){visited.add(j);const nb=neighbors(j);if(nb.length>=minpts)nb.forEach(k=>{if(!seen.has(k)){queue.push(k);seen.add(k)}})}if(labs[j]===-1)labs[j]=group}
 group++;
 });return {labs,core,clusters:group};
}
function dbscanDemo(){
 let eps=state.demo.dbEps,rs=dbscanCompute(eps),colors=['#a56a4b','#5d8278','#8676a7','#ba8a4f'];
 return demoBox('DBSCAN — what is a core point?','M06 / NEIGHBORHOOD DENSITY',
 `<div class="frow"><label>Epsilon radius: <strong>${eps}</strong><input id="db-eps" type="range" min="15" max="80" value="${eps}"></label><label>MinPts: <strong>3 (includes point itself)</strong></label></div><svg viewBox="0 0 360 190" style="width:100%;max-height:265px;background:var(--tint);border:1px solid var(--line);border-radius:8px">${DBPTS.map((p,i)=>`<g><circle cx="${p[0]+20}" cy="${p[1]+10}" r="${eps}" fill="none" stroke="${rs.labs[i]===-1?'#b95d58':colors[rs.labs[i]%4]}" stroke-opacity="${rs.core[i]?'.08':'0'}" stroke-width="1"/><circle cx="${p[0]+20}" cy="${p[1]+10}" r="${rs.core[i]?9:6}" fill="${rs.labs[i]===-1?'#c14b52':colors[rs.labs[i]%4]}" stroke="${rs.core[i]?'var(--ink)':'#fff'}" stroke-width="${rs.core[i]?'2':'1'}"><title>Point ${i+1}: ${rs.core[i]?'CORE':rs.labs[i]===-1?'NOISE':'BORDER'}</title></circle></g>`).join('')}</svg>
 <div class="demo-output"><strong>${rs.clusters} cluster(s) found, ${rs.labs.filter(x=>x===-1).length} noise point(s)</strong><p>Outlined larger dots = core. Smaller colored dots = border. Red dots = noise. Increase epsilon to see nearby dense groups merge.</p></div><small>DBSCAN's core-point criterion uses neighborhood count; changing Eps can turn noise into border/core or connect clusters.</small>`);
}
const LINKS=[[0,1],[1,0],[1,2],[2,3],[3,0]];
function pageScores(steps,type){
 const n=4,d=.7,A=Array.from({length:n},()=>Array(n).fill(0)),out=Array(n).fill(0);
 LINKS.forEach(([i,j])=>{A[i][j]=1;out[i]++});
 let pr=Array(n).fill(1/n),hub=Array(n).fill(1),auth=Array(n).fill(1);
 for(let k=0;k<steps;k++){
  if(type==='pagerank'){pr=pr.map((_,i)=>(1-d)/n+d*LINKS.filter(e=>e[1]===i).reduce((s,[j])=>s+pr[j]/out[j],0));}
  else{auth=auth.map((_,j)=>A.reduce((s,row,i)=>s+row[j]*hub[i],0));let nA=Math.hypot(...auth)||1;auth=auth.map(x=>x/nA);hub=hub.map((_,i)=>A[i].reduce((s,e,j)=>s+e*auth[j],0));let nH=Math.hypot(...hub)||1;hub=hub.map(x=>x/nH)}
 }
 return type==='pagerank'?{pr}:{hub,auth}
}
function webDemo(){
 let step=state.demo.web,type=state.demo.webType,sc=pageScores(step,type);
 const names=['A','B','C','D'],coords=[[50,70],[160,32],[170,124],[290,78]];
 const graph=`<svg viewBox="0 0 355 180" style="width:100%;max-height:195px"><defs><marker id="arrowdm" markerWidth="8" markerHeight="8" refX="20" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="var(--accent)"/></marker></defs>${LINKS.map(([a,b])=>`<line x1="${coords[a][0]}" y1="${coords[a][1]}" x2="${coords[b][0]}" y2="${coords[b][1]}" stroke="var(--accent)" stroke-width="1.8" marker-end="url(#arrowdm)"/>`).join('')}${coords.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="19" fill="var(--deep)"/><text x="${p[0]}" y="${p[1]+5}" text-anchor="middle" font-family="monospace" font-size="15" fill="var(--bg)">${names[i]}</text>`).join('')}</svg>`;
 let rr=type==='pagerank'?sc.pr:sc.auth;
 return demoBox('Rank the web graph','M07 / HITS & PAGERANK ITERATIONS',
 `<div class="control-row"><button class="pill ${type==='pagerank'?'active':''}" data-act="webType" data-value="pagerank">PageRank</button><button class="pill ${type==='hits'?'active':''}" data-act="webType" data-value="hits">HITS (hub + authority)</button></div><div style="display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:14px"><div>${graph}</div><div><div class="eyebrow">${type==='pagerank'?'NORMALIZED RANK':'AUTHORITY SCORES'}</div>${rr.map((v,i)=>`<div class="vizbar"><span>Page ${names[i]}</span><div class="bar" style="width:${Math.max(3,v/Math.max(...rr)*100)}%;max-width:110px"></div><b>${fmt(v)}</b></div>`).join('')}${type==='hits'?`<div class="eyebrow" style="margin-top:17px">HUB VECTOR</div><p style="font:12px var(--mono)">${sc.hub.map((v,i)=>names[i]+':'+fmt(v)).join(' · ')}</p>`:''}</div></div><div class="control-row"><button class="btn small" data-act="webPrev">← Step back</button><strong class="mono">ITERATION ${step}</strong><button class="btn small" data-act="webNext">Next iteration →</button></div><small>${type==='pagerank'?'Normalized PageRank: (1−d)/N term, d=0.7. The course slide sometimes uses (1−d) and unnormalized scores; relative rankings agree.':'Authority = Aᵀh, Hub = Aa. Both are L₂-normalized after every iteration.'}</small>`);
}


function rerenderPreserve(focusSelector){
 const y=window.scrollY;
 render();
 window.scrollTo({top:y,behavior:'instant'});
 if(focusSelector){let x=$(focusSelector);if(x){x.focus();let n=x.value.length;x.setSelectionRange?.(n,n)}}
}
function updateMiniQuiz(node,answer){
 const parent=node.closest('#check-output'),correct=+node.dataset.answer,selected=+node.dataset.option;
 if(!parent||parent.dataset.answered)return;
 parent.dataset.answered='1';
 $$('.option',parent).forEach(b=>{b.disabled=true;let o=+b.dataset.option;b.classList.toggle('correct',o===correct);b.classList.toggle('wrong',o===selected&&selected!==correct)});
 const p=document.createElement('p');p.className='explain';p.textContent=(selected===correct?'✓ Correct. ':'✗ Try reviewing the explanation. ')+node.dataset.explain;
 parent.appendChild(p);
}
function clickHandler(ev){
 let el=ev.target.closest('[data-act]');if(!el)return;
 let a=el.dataset.act, v=el.dataset.value, m=+el.dataset.m,l=+el.dataset.l;
 if(a==='closePalette'){if(ev.target.classList.contains('overlay')){state.palette=false;render()}return}
 ev.preventDefault();
 if(a==='route'){state.palette=false;routeTo(el.dataset.go);return}
 if(a==='read'){routeTo(`read/${m}-${l}`);return}
 if(a==='openModule'){routeTo(`read/${m}-0`);return}
 if(a==='impToggle'){state.impOnly=!state.impOnly;rerenderPreserve();return}
 if(a==='theme'){state.theme=state.theme==='light'?'dark':'light';store();rerenderPreserve();return}
 if(a==='palette'){state.palette=true;state.paletteQuery='';rerenderPreserve();return}
 if(a==='done'||a==='bookmark'||a==='weak'){
   let field=a==='done'?'done':a==='bookmark'?'bookmarks':'weak',key=id(m,l);
   state[field][key]=!state[field][key];store();rerenderPreserve();return
 }
 if(a==='print'){window.print();return}
 if(a==='copy'){const txt=el.dataset.copy;Promise.resolve(navigator.clipboard?.writeText?.(txt)).then(()=>{el.textContent='COPIED ✓'}).catch(()=>{let t=document.createElement('textarea');t.value=txt;document.body.append(t);t.select();document.execCommand('copy');t.remove();el.textContent='COPIED ✓'});return}
 if(a==='inlineAnswer'){updateMiniQuiz(el);return}
 if(a==='formulaFocus'){state.formulaFocus=(v==='core');rerenderPreserve();return}
 if(a==='examMode'){state.examMode=v;state.examFilter=0;rerenderPreserve();return}
 if(a==='formulaFilter'){state.formulaFilter=+el.dataset.filter;rerenderPreserve();return}
 if(a==='examFilter'){state.examFilter=+el.dataset.filter;rerenderPreserve();return}
 if(a==='flashFilter'){state.flashModule=+el.dataset.filter;state.flashAt=0;state.flashFlip=false;rerenderPreserve();return}
 if(a==='startQuiz'){let pool=QUIZZES.filter(q=>!state.quizModule||q.module===state.quizModule);state.quizQuestions=shuffle(pool).slice(0,Math.min(state.quizCount,pool.length));state.quizAt=0;state.quizAnswers=[];state.quizStart=true;rerenderPreserve();return}
 if(a==='quizAnswer'){
   if(state.quizAnswers[state.quizAt]!==undefined)return;
   state.quizAnswers[state.quizAt]=+el.dataset.option;rerenderPreserve();return
 }
 if(a==='quizNext'){state.quizAt++;rerenderPreserve();return}
 if(a==='flipFlash'){state.flashFlip=!state.flashFlip;rerenderPreserve();return}
 if(a==='flashPrev'){state.flashAt=Math.max(0,state.flashAt-1);state.flashFlip=false;rerenderPreserve();return}
 if(a==='flashNext'){let n=flashCards().filter(c=>!state.flashModule||c.module===state.flashModule).length;state.flashAt=(state.flashAt+1)%n;state.flashFlip=false;rerenderPreserve();return}
 if(a==='olap'){state.demo.olap=v;rerenderPreserve();return}
 if(a==='recalcBins'){state.demo.binInput=$('#bin-input')?.value||'';state.demo.binTarget=+$('#bin-target')?.value;state.demo.binK=+$('#bin-k')?.value;rerenderPreserve();return}
 if(a==='aprioriMin'){state.demo.aprMin=+v;rerenderPreserve();return}
 if(a==='fpdata'){state.demo.fpdata=+v;state.demo.fptree=0;rerenderPreserve();return}
 if(a==='fpPrev'){state.demo.fptree=Math.max(0,state.demo.fptree-1);rerenderPreserve();return}
 if(a==='fpNext'){state.demo.fptree=Math.min(FPDB[state.demo.fpdata].length,state.demo.fptree+1);rerenderPreserve();return}
 if(a==='id3set'){state.demo.id3set=v;rerenderPreserve();return}
 if(a==='recalcMetric'){state.demo.metric=['TP','FP','TN','FN'].map(z=>+$('#m-'+z)?.value||0);rerenderPreserve();return}
 if(a==='cvType'){state.demo.cvType=v;state.demo.cv=0;rerenderPreserve();return}
 if(a==='cvPrev'){state.demo.cv=Math.max(0,state.demo.cv-1);rerenderPreserve();return}
 if(a==='cvNext'){state.demo.cv=(state.demo.cv+1)%(state.demo.cvType==='loo'?10:5);rerenderPreserve();return}
 if(a==='kmPrev'){state.demo.kmeans=Math.max(0,state.demo.kmeans-1);rerenderPreserve();return}
 if(a==='kmNext'){state.demo.kmeans=Math.min(2,state.demo.kmeans+1);rerenderPreserve();return}
 if(a==='webType'){state.demo.webType=v;state.demo.web=0;rerenderPreserve();return}
 if(a==='webPrev'){state.demo.web=Math.max(0,state.demo.web-1);rerenderPreserve();return}
 if(a==='webNext'){state.demo.web=Math.min(25,state.demo.web+1);rerenderPreserve();return}
}
