decision tree"},{"page":4,"text":"Decision tree with two internal nodes"},{"page":5,"text":"Advantages of decision tree "},{"page":6,"text":""},{"page":7,"text":""},{"page":8,"text":""},{"page":9,"text":"Decision tree algorithms\nID3, C4.5 and CART adopt a greedy approach in which decision trees constructed in a top down recursive divide and conquer manner. \nThe training set is recursively partitioned into smaller subsets as the tree is being built.\nThe basic algorithm for inducing a decision tree with three parameters\nD- Data partition(initially complete set of training tuples and their associated class labels\nAttribute_list – list of attributes describing the tuples.\nAttribute_selection method -  specifies a heuristic procedure for selecting the attribute the best discriminates the given tuples according to class\n"},{"page":10,"text":"Methods for Splitting "},{"page":11,"text":"Methods for Splitting "},{"page":12,"text":"Splitting based on Nominal Attributes"},{"page":13,"text":"Splitting based on Ordinal Attributes "},{"page":14,"text":"Attribute Selection Measures"},{"page":15,"text":"\n"},{"page":16,"text":""},{"page":17,"text":""},{"page":18,"text":""},{"page":19,"text":"\n\n\n\n\n\n"},{"page":20,"text":"\n\n\n\n\n\nTo choose Root node  we use ID3"},{"page":21,"text":"ID 3"},{"page":22,"text":""},{"page":23,"text":""},{"page":24,"text":"Entropy\u000b\nWe need to calculate the entropy first. Decision column consists of 14 instances and includes two labels: yes and no. There are 9 decisions labeled yes, and 5 decisions labeled no.\nEntropy(Decision) = – p(Yes) . log2p(Yes) – p(No) . log2p(No)\nEntropy(Decision) = – (9/14) . log2(9/14) – (5/14) . log2(5/14) = 0.940\nNow, we need to find the most dominant factor for decisioning.\n"},{"page":25,"text":"P:yes =9   n:no =5\n\n\n\n\n\nog(0.642)/log(2)\n\t       =-0.639\n\nI(9,5) = 0.940"},{"page":26,"text":""},{"page":27,"text":""},{"page":28,"text":""},{"page":29,"text":""},{"page":30,"text":""},{"page":31,"text":""},{"page":32,"text":""},{"page":33,"text":""},{"page":34,"text":""},{"page":35,"text":""},{"page":36,"text":""},{"page":37,"text":""},{"page":38,"text":""},{"page":39,"text":""},{"page":40,"text":""},{"page":41,"text":""},{"page":42,"text":""},{"page":43,"text":""},{"page":44,"text":""},{"page":45,"text":""},{"page":46,"text":""},{"page":47,"text":""},{"page":48,"text":""},{"page":49,"text":""},{"page":50,"text":""},{"page":51,"text":""},{"page":52,"text":""},{"page":53,"text":""},{"page":54,"text":""},{"page":55,"text":""},{"page":56,"text":""},{"page":57,"text":"Pandas is a Python library.\u000bPandas is used to analyse data.\nimport pandas as pd\ndf = pd.read_csv(r'F:\\anaconda\\Lib\\site-packages\\pandas\\io\\Mall_customers.csv')\ndf.head()\n\n"},{"page":58,"text":"Read and print the data set:\nimport pandas as pd\nfrom sklearn import tree\nimport pydotplus\nfrom sklearn.tree import DecisionTreeClassifier\nimport matplotlib.pyplot as plt\nimport matplotlib.image as pltimg\ndf = pd.read_csv(r'F:\\anaconda\\Lib\\site-packages\\pandas\\io\\Mall_customers.csv')\nprint(df)"},{"page":59,"text":"Read and print the data set:"},{"page":60,"text":"Change string values into numerical values:\nTo make a decision tree, all data has to be numerical.\nWe have to convert the non numerical columns ‘Genre' and 'Go' into numerical values.\nPandas has a map() method that takes a dictionary with information on how to convert the values.\n\nd = {'Male': 0, 'Female': 1}\ndf['Genre'] = df['Genre'].map(d)\nprint(df)"},{"page":61,"text":"Change string values into numerical values:"},{"page":62,"text":"# feature selection\u000b\nfeature_cols = ['Pregnancies', 'Insulin', 'BMI', 'Age', 'Glucose', 'BloodPressure', 'DiabetesPedigreeFunction']\nx = pima[feature_cols]\ny = pima.Outcome\n"},{"page":63,"text":"cont"},{"page":64,"text":"# split data\u000b\nX_train, X_test, Y_train, Y_test = train_test_split(x, y, test_size = 0.3, random_state=1)\n# build model\nclassifier = DecisionTreeClassifier()\nclassifier = classifier.fit(X_train, Y_train)\n# predict\ny_pred = classifier.predict(X_test)\nprint(y_pred)"},{"page":65,"text":"#predict"},{"page":66,"text":"# confusion matrix\u000b\n# confusion matrix\nfrom sklearn.metrics import confusion_matrix\nconfusion_matrix(Y_test, y_pred)\nprint(confusion_matrix(Y_test, y_pred))\n# accuracy\nprint(\"Accuracy:\", metrics.accuracy_score(Y_test,y_pred))\n"}]},{"name":"DM CAT 2 NOTES/M5 DM/M5 BBN.pptx","parts":[{"page":1,"text":"Bayesian Belief Network\nA Bayesian Belief Network (BBN) is a probabilistic graphical model.\nIt represents variables as nodes and probabilistic dependencies as directed edges.\nEach node has a Conditional Probability Table (CPT) showing probabilities given its parents.\nBBN breaks a complicated joint probability into smaller conditional probabilities and multiplies them together"},{"page":2,"text":"Calculating Conditional Probability of Events in a Bayesian Network\u000b\nFind the probability that 'P1' is true (P1 has called 'gfg'), 'P2' is true (P2 has called 'gfg') when the alarm 'A' rang, but no burglary 'B' and fire 'F' has occurred.  \n=> P ( P1, P2, A, ~B, ~F) [ where- P1, P2 & A are 'true' events and '~B' & '~F' are 'false' events]\n[ Note: The values mentioned below are neither calculated nor computed. They have observed values ]\n"},{"page":3,"text":"\nBurglary 'B' -\nP (B=T) = 0.001 ('B' is true i.e burglary has occurred)\nP (B=F) = 0.999  ('B' is false i.e burglary has not occurred)\nFire 'F' -\nP (F=T) = 0.002 ('F' is true i.e fire has occurred)\nP (F=F) = 0.998 ('F' is false i.e fire has not occurred)\n"},{"page":4,"text":"Alarm 'A' -\nB\tF\tP (A=T)\tP (A=F)\nT\tT\t0.95\t0.05\nT\tF\t0.94\t0.06\nF\tT\t0.29\t0.71\nF\tF\t0.001\t0.999"},{"page":5,"text":"Person 'P1' -\nA | P (P1=T) | P (P1=F)\nT | 0.95 | 0.05\nF | 0.05 | 0.95\nThe person 'P1' node can be 'true' or 'false' (i.e may have called the person 'gfg' or not) . It has a parent node, the alarm 'A', which can be 'true' or 'false' (i.e may have rung or may not have rung ,upon burglary 'B' or fire 'F')."},{"page":6,"text":"Person 'P2' -\nA | P (P2=T) | P (P2=F)\nT | 0.80 | 0.20\nF | 0.01 | 0.99\nThe person 'P2' node can be 'true' or false' (i.e may have called the person 'gfg' or not). It has a parent node, the alarm 'A', which can be 'true' or 'false' (i.e may have rung or may not have rung, upon burglary 'B' or fire 'F')."},{"page":7,"text":"Solution: Considering the observed probabilistic scan -\nWith respect to the question —  P ( P1, P2, A, ~B, ~F) , we need to get the probability of 'P1'. We find it with regard to its parent node - alarm 'A'. To get the probability of 'P2', we find it with regard to its parent node — alarm 'A'.\nWe find the probability of alarm 'A' node with regard to '~B' & '~F' since burglary 'B' and fire 'F' are parent nodes of alarm 'A'. \nFrom the observed probabilistic scan, we can deduce - \n P ( P1, P2, A, ~B, ~F)\n= P (P1/A) * P (P2/A) * P (A/~B~F) * P (~B) * P (~F)\n= 0.95 * 0.80 * 0.001 * 0.999 * 0.998\n= 0.00075\n"},{"page":8,"text":"\nA student's success in getting a job interview depends on their exam result, which in turn depends on whether they studied and the difficulty of the exam.\nCalculate the probability that a student Studied, Passed the Exam, but Did Not get an Interview.\nHere is the Bayesian Belief Network and the required probability tables:\n\n\n"},{"page":9,"text":""},{"page":10,"text":"Answer\nWe need to calculate the joint probability P(Study=True, Pass=True, Interview=False) \nwe must also consider the Difficulty variable, as it influences the Pass variable. \n\nSince the difficulty isn't specified in the question, we have to calculate the probability for both scenarios (Difficulty=High and Difficulty=Low) and add them together."},{"page":11,"text":""},{"page":12,"text":""},{"page":13,"text":""},{"page":14,"text":"\nFinal Step: Add the Two Scenarios\nTotal Probability = 0.042 + 0.0798 = 0.1218\nThe probability that a student Studied, Passed the Exam, but Did Not get an Interview is 0.1218, or 12.18%."},{"page":15,"text":"\nNetwork:                                   Find:  P(P1,∼P2,A,∼B,F)\nB → A ← F\u000bA → P1\u000bA → P2\nGiven:\nP(B) = 0.01\nP(F) = 0.02\nP(A | B,F) = 0.90\nP(A | B,~F) = 0.80\nP(A | ~B,F) = 0.40\nP(A | ~B,~F) = 0.05\nP(P1 | A) = 0.90\nP(P2 | A) = 0.70\n"},{"page":16,"text":"\nAlarm A | P(P1 = T | A) | P(P1 = F | A)\nT | 0.95 | ?\nF | 0.05 | 0.95\n\nP(P1=T∣A)+P(P1=F∣A)=1"}]},{"name":"DM CAT 2 NOTES/M5 DM/Model Evaluation and Selection.pptx","parts":[{"page":1,"text":"Model Evaluation and Selection\nEvaluation metrics: How can we measure accuracy?  Other metrics to consider?\nUse validation test set of class-labeled tuples instead of training set when assessing accuracy\nMethods for estimating a classifier’s accuracy: \nHoldout method, random subsampling\nCross-validation\nBootstrap\nROC Curves\n*"},{"page":2,"text":"Classifier Evaluation Metrics: Confusion Matrix\nActual class\\Predicted class | buy_computer =  yes | buy_computer = no | Total\nbuy_computer = yes | 6954 | 46 | 7000\nbuy_computer = no | 412 | 2588 | 3000\nTotal | 7366 | 2634 | 10000\nGiven m classes, an entry, CMi,j  in a confusion matrix indicates # of tuples in class i  that were labeled by the classifier as class j\nMay have extra rows/columns to provide totals\nConfusion Matrix:\nActual class\\Predicted class | C1 | ¬ C1\nC1 | True Positives (TP) | False Negatives (FN)\n¬ C1 | False Positives (FP) | True Negatives (TN)\nExample of Confusion Matrix:\n*"},{"page":3,"text":"Classifier Evaluation Metrics: Accuracy, Error Rate, Sensitivity and Specificity\nClassifier Accuracy, or recognition rate: percentage of test set tuples that are correctly classified\nAccuracy = (TP + TN)/All\nError rate: 1 – accuracy, or\nError rate = (FP + FN)/All\nClass Imbalance Problem: \nOne class may be rare, e.g. fraud, or HIV-positive\nSignificant majority of the negative class and minority of the positive class\nSensitivity: True Positive recognition rate\nSensitivity = TP/P\nSpecificity: True Negative recognition rate\nSpecificity = TN/N\nA\\P | C | ¬C | \nC | TP | FN | P\n¬C | FP | TN | N\n | P’ | N’ | All\n*"},{"page":4,"text":"Classifier Evaluation Metrics: \u000bPrecision and Recall, and F-measures\nPrecision: exactness – what % of tuples that the classifier labeled as positive are actually positive\n\nRecall: completeness – what % of positive tuples did the classifier label as positive?\nPerfect score is 1.0\nInverse relationship between precision & recall\nF measure (F1 or F-score): harmonic mean of precision and recall,\n\nFß:  weighted measure of precision and recall\nassigns ß times as much weight to recall as to precision\n\n*"},{"page":5,"text":"Classifier Evaluation Metrics: Example\n\n*\nPrecision = 90/230 = 39.13%             Recall = 90/300 = 30.00%\n\nActual Class\\Predicted class | cancer = yes | cancer = no | Total | Recognition(%)\ncancer = yes | 90 | 210 | 300 | 30.00 (sensitivity\ncancer = no | 140 | 9560 | 9700 | 98.56 (specificity)\nTotal | 230 | 9770 | 10000 | 96.40 (accuracy)"},{"page":6,"text":"Evaluating Classifier Accuracy:\u000bHoldout & Cross-Validation Methods\nHoldout method\nGiven data is randomly partitioned into two independent sets\nTraining set (e.g., 2/3) for model construction\nTest set (e.g., 1/3) for accuracy estimation\nRandom sampling: a variation of holdout\nRepeat holdout k times, accuracy = avg. of the accuracies obtained\nCross-validation (k-fold, where k = 10 is most popular)\nRandomly partition the data into k mutually exclusive subsets, each approximately equal size\nAt i-th iteration, use Di as test set and others as training set\nLeave-one-out: k folds where k = # of tuples, for small sized data\n*Stratified cross-validation*: folds are stratified so that class dist. in each fold is approx. the same as that in the initial data\n*"},{"page":7,"text":"Evaluating Classifier Accuracy: Bootstrap\nBootstrap\nWorks well with small data sets\nSamples the given training tuples uniformly with replacement\ni.e., each time a tuple is selected, it is equally likely to be selected again and re-added to the training set\nSeveral bootstrap methods, and a common one is .632 boostrap\nA data set with d tuples is sampled d times, with replacement, resulting in a training set of d samples.  The data tuples that did not make it into the training set end up forming the test set.  About 63.2% of the original data end up in the bootstrap, and the remaining 36.8% form the test set (since (1 – 1/d)d ≈ e-1 = 0.368)\nRepeat the sampling procedure k times, overall accuracy of the model:\n*"},{"page":8,"text":"Model Selection: ROC Curves\nROC (Receiver Operating Characteristics) curves: for visual comparison of classification models\nOriginated from signal detection theory\nShows the trade-off between the true positive rate and the false positive rate\nThe area under the ROC curve is a measure of the accuracy of the model\nRank the test tuples in decreasing order: the one that is most likely to belong to the positive class appears at the top of the list\nThe closer to the diagonal line (i.e., the closer the area is to 0.5), the less accurate is the model\nVertical axis represents the true positive rate\nHorizontal axis rep. the false positive rate\nThe plot also shows a diagonal line\nA model with perfect accuracy will have an area of 1.0\n*"},{"page":9,"text":"Issues Affecting Model Selection\nAccuracy\nclassifier accuracy: predicting class label\nSpeed\ntime to construct the model (training time)\ntime to use the model (classification/prediction time)\nRobustness: handling noise and missing values\nScalability: efficiency in disk-resident databases \nInterpretability\nunderstanding and insight provided by the model\nOther measures, e.g., goodness of rules, such as decision tree size or compactness of classification rules\n*"},{"page":10,"text":"Ensemble Methods: Increasing the Accuracy\nEnsemble methods\nUse a combination of models to increase accuracy\nCombine a series of k learned models, M1, M2, …, Mk, with the aim of creating an improved model M*\nPopular ensemble methods\nBagging: averaging the prediction over a collection of classifiers\nBoosting: weighted vote with a collection of classifiers\nEnsemble: combining a set of heterogeneous classifiers\n*"},{"page":11,"text":"Bagging: Boostrap Aggregation\nAnalogy: Diagnosis based on multiple doctors’ majority vote\nTraining\nGiven a set D of d tuples, at each iteration i, a training set Di of d tuples is sampled with replacement from D (i.e., bootstrap)\nA classifier model Mi is learned for each training set Di\nClassification: classify an unknown sample X \nEach classifier Mi returns its class prediction\nThe bagged classifier M* counts the votes and assigns the class with the most votes to X\nPrediction: can be applied to the prediction of continuous values by taking the average value of each prediction for a given test tuple\nAccuracy\nOften significantly better than a single classifier derived from D\nFor noise data: not considerably worse, more robust \nProved improved accuracy in prediction\n*"},{"page":12,"text":"Boosting\nAnalogy: Consult several doctors, based on a combination of weighted diagnoses—weight assigned based on the previous diagnosis accuracy\nHow boosting works?\nWeights are assigned to each training tuple\nA series of k classifiers is iteratively learned\nAfter a classifier Mi is learned, the weights are updated to allow the subsequent classifier, Mi+1, to pay more attention to the training tuples that were misclassified by Mi\nThe final M* combines the votes of each individual classifier, where the weight of each classifier's vote is a function of its accuracy\nBoosting algorithm can be extended for numeric prediction\nComparing with bagging: Boosting tends to have greater accuracy, but it also risks overfitting the model to misclassified data\n*"},{"page":13,"text":"*\nAdaboost (Freund and Schapire, 1997)\nGiven a set of d class-labeled tuples, (X1, y1), …, (Xd, yd)\nInitially, all the weights of tuples are set the same (1/d)\nGenerate k classifiers in k rounds.  At round i,\nTuples from D are sampled (with replacement) to form a training set Di of the same size\nEach tuple’s chance of being selected is based on its weight\nA classification model Mi is derived from Di\nIts error rate is calculated using Di as a test set\nIf a tuple is misclassified, its weight is increased, o.w. it is decreased\nError rate: err(Xj) is the misclassification error of tuple Xj. Classifier Mi error rate is the sum of the weights of the misclassified tuples: \n\n\nThe weight of classifier Mi’s vote is"},{"page":14,"text":"Random Forest (Breiman 2001) \nRandom Forest: \nEach classifier in the ensemble is a decision tree classifier and is generated using a random selection of attributes at each node to determine the split\nDuring classification, each tree votes and the most popular class is returned\nTwo Methods to construct Random Forest:\nForest-RI (random input selection):  Randomly select, at each node, F attributes as candidates for the split at the node. The CART methodology is used to grow the trees to maximum size\nForest-RC (random linear combinations):  Creates new attributes (or features) that are a linear combination of the existing attributes (reduces the correlation between individual classifiers)\nComparable in accuracy to Adaboost, but more robust to errors and outliers \nInsensitive to the number of attributes selected for consideration at each split, and faster than bagging or boosting\n*"}]},{"name":"DM CAT 2 NOTES/M5 DM/CLASSIFICATION VS PREDICTION.pptx","parts":[{"page":1,"text":"*\nData Mining: Concepts and Techniques\n*\nClassification  \npredicts categorical class labels (discrete or nominal)\nclassifies data (constructs a model) based on the training set and the values (class labels) in a classifying attribute and uses it in classifying new data\nPrediction  \nmodels continuous-valued functions, i.e., predicts unknown or missing values \nTypical applications\nCredit approval\nTarget marketing\nMedical diagnosis\nFraud detection\nClassification vs. Prediction"},{"page":2,"text":"Problem | Type | Output\nWill a customer buy a product? | ___________ | Yes / No\nIs a transaction fraudulent? | ________ | Fraud / Not Fraud\nWhat will a student's salary be? | ________ | ₹45,000\nWhat will tomorrow's temperature be? | _________ | 32.5°C"},{"page":3,"text":"*\nData Mining: Concepts and Techniques\n*\nClassification—A Two-Step Process \nModel construction: describing a set of predetermined classes\nEach tuple/sample is assumed to belong to a predefined class, as determined by the class label attribute\nThe set of tuples used for model construction is training set\nThe model is represented as classification rules, decision trees, or mathematical formulae\nModel usage: for classifying future or unknown objects\nEstimate accuracy of the model\nThe known label of test sample is compared with the classified result from the model\nAccuracy rate is the percentage of test set samples that are correctly classified by the model\nTest set is independent of training set, otherwise over-fitting will occur\nIf the accuracy is acceptable, use the model to classify data tuples whose class labels are not known"},{"page":4,"text":"*\nData Mining: Concepts and Techniques\n*\nProcess (1): Model Construction\n\n\nClassification\nAlgorithms\n\nIF rank = ‘professor’\nOR years > 6\nTHEN tenured = ‘yes’ \n\n\n"},{"page":5,"text":"*\nData Mining: Concepts and Techniques\n*\nProcess (2): Using the Model in Prediction \n\n\n\n\n(Jeff, Professor, 4)\n\n\n\nTenured?"},{"page":6,"text":"*\nData Mining: Concepts and Techniques\n*\nSupervised vs. Unsupervised Learning\nSupervised learning (classification)\nSupervision: The training data (observations, measurements, etc.) are accompanied by labels indicating the class of the observations\nNew data is classified based on the training set\nUnsupervised learning (clustering)\nThe class labels of training data is unknown\nGiven a set of measurements, observations, etc. with the aim of establishing the existence of classes or clusters in the data"},{"page":7,"text":"*\nData Mining: Concepts and Techniques\n*\nIssues: Data Preparation\nData cleaning\nPreprocess data in order to reduce noise and handle missing values\nRelevance analysis (feature selection)\nRemove the irrelevant or redundant attributes\nData transformation\nGeneralize and/or normalize data"},{"page":8,"text":"*\nData Mining: Concepts and Techniques\n*\nIssues: Evaluating Classification Methods\nAccuracy\nclassifier accuracy: predicting class label\npredictor accuracy: guessing value of predicted attributes\nSpeed\ntime to construct the model (training time)\ntime to use the model (classification/prediction time)\nRobustness: handling noise and missing values\nScalability: efficiency in disk-resident databases \nInterpretability\nunderstanding and insight provided by the model\nOther measures, e.g., goodness of rules, such as decision tree size or compactness of classification rules"},{"page":9,"text":"\nThe most notable types of decision tree algorithms are:-\n1. Iterative Dichotomiser 3 (ID3): This algorithm uses Information Gain to decide which attribute is to be used to classify the current subset of the data. For each level of the tree, information gain is calculated for the remaining data recursively.\n2. C4.5: This algorithm is the successor of the ID3 algorithm. This algorithm uses either Information gain or Gain ratio to decide upon the classifying attribute. It is a direct improvement from the ID3 algorithm as it can handle both continuous and missing attribute values.\n3. Classification and Regression Tree(CART): It is a dynamic learning algorithm which can produce a regression tree as well as a classification tree depending upon the dependent variable.\nEntropy measures the impurity/uncertainty in the dataset.\n*\nData Mining: Concepts and Techniques\n*"},{"page":10,"text":"*\nData Mining: Concepts and Techniques\n*\nDecision Tree Induction: Training Dataset\nThis follows an  example of Quinlan’s ID3 (Playing Tennis)"},{"page":11,"text":"*\nData Mining: Concepts and Techniques\n*\nOutput: A Decision Tree for “buys_computer”"},{"page":12,"text":"*\nData Mining: Concepts and Techniques\n*\nAlgorithm for Decision Tree Induction\nBasic algorithm (a greedy algorithm)\nTree is constructed in a top-down recursive divide-and-conquer manner\nAt start, all the training examples are at the root\nAttributes are categorical (if continuous-valued, they are discretized in advance)\nExamples are partitioned recursively based on selected attributes\nTest attributes are selected on the basis of a heuristic or statistical measure (e.g., information gain)\nConditions for stopping partitioning\nAll samples for a given node belong to the same class\nThere are no remaining attributes for further partitioning – majority voting is employed for classifying the leaf\nThere are no samples left"},{"page":13,"text":"9/10/2026\nData Mining: Concepts and Techniques\n12\nAlgorithm for Decision Tree Induction\n1. Calculate total entropy-Entropy(D)\n2. Calculate entropy after splitting by each attribute\nAge,Income,Student, Credit Rating\n3. Calculate Information Gain\nIG(Attribute) =Entropy(parent) − Weighted Entropy(children)\n4. Select the attribute with highest IG   Highest IG → Root\n5. Split the dataset\n6. Check each branch\nIf all records are the same:\n\nYES → Leaf = Yes\nNO  → Leaf = No\nIf records are mixed:\nCalculate Information Gain again\n7. Continue until every branch can be classified"},{"page":14,"text":"*\nData Mining: Concepts and Techniques\n*\nAttribute Selection Measure: Information Gain (ID3/C4.5)\nSelect the attribute with the highest information gain\nLet pi be the probability that an arbitrary tuple in D belongs to class Ci, estimated by |Ci, D|/|D|\nExpected information (entropy) needed to classify a tuple in D:\n\nInformation needed (after using A to split D into v partitions) to classify D:\n\nInformation gained by branching on attribute A"},{"page":15,"text":"*\nData Mining: Concepts and Techniques\n*\nAttribute Selection: Information Gain\nClass P: buys_computer = “yes”\nClass N: buys_computer = “no”\n            means “age <=30” has 5 out of 14 samples, with 2 yes’es  and 3 no’s.   Hence\n\n\nSimilarly,"},{"page":16,"text":"*\nData Mining: Concepts and Techniques\n*\nComputing Information-Gain for Continuous-Value Attributes\nLet attribute A be a continuous-valued attribute\nMust determine the best split point for A\nSort the value A in increasing order\nTypically, the midpoint between each pair of adjacent values is considered as a possible split point\n(ai+ai+1)/2 is the midpoint between the values of ai and ai+1\nThe point with the minimum expected information requirement for A is selected as the split-point for A\nSplit:\nD1 is the set of tuples in D satisfying A ≤ split-point, and D2 is the set of tuples in D satisfying A > split-point"},{"page":17,"text":"*\nData Mining: Concepts and Techniques\n*\nGain Ratio for Attribute Selection (C4.5)\nInformation gain measure is biased towards attributes with a large number of values\nC4.5 (a successor of ID3) uses gain ratio to overcome the problem (normalization to information gain)\n\n\nGainRatio(A) = Gain(A)/SplitInfo(A)\nEx.\ngain_ratio(income) = 0.029/0.926 = 0.031\nThe attribute with the maximum gain ratio is selected as the splitting attribute"},{"page":18,"text":"*\nData Mining: Concepts and Techniques\n*\nGini index (CART, IBM IntelligentMiner)\nIf a data set D contains examples from n classes, gini index, gini(D) is defined as\n\n    \n     where pj is the relative frequency of class j in D\nIf a data set D  is split on A into two subsets D1 and D2, the gini index gini(D) is defined as\n\n\nReduction in Impurity:\n\n\nThe attribute provides the smallest ginisplit(D) (or the largest reduction in impurity) is chosen to split the node (need to enumerate all the possible splitting points for each attribute)"},{"page":19,"text":"*\nData Mining: Concepts and Techniques\n*\nGini index (CART, IBM IntelligentMiner)\nEx.  D has 9 tuples in buys_computer = “yes” and 5 in “no”\n\n\nSuppose the attribute income partitions D into 10 in D1: {low, medium} and 4 in D2\n\n\n\nbut gini{medium,high} is 0.30 and thus the best since it is the lowest\nAll attributes are assumed continuous-valued\nMay need other tools, e.g., clustering, to get the possible split values\nCan be modified for categorical attributes"},{"page":20,"text":"*\nData Mining: Concepts and Techniques\n*\nComparing Attribute Selection Measures\nThe three measures, in general, return good results but\nInformation gain: \nbiased towards multivalued attributes\nGain ratio: \ntends to prefer unbalanced splits in which one partition is much smaller than the others\nGini index: \nbiased to multivalued attributes\nhas difficulty when # of classes is large\ntends to favor tests that result in equal-sized partitions and purity in both partitions"},{"page":21,"text":"*\nData Mining: Concepts and Techniques\n*\nExample: Rule extraction from our buys_computer decision-tree\nIF age = young AND student = no             THEN buys_computer = no\nIF age = young AND student = yes            THEN buys_computer = yes\nIF age = mid-age \t\t\t    THEN buys_computer = yes\nIF age = old AND credit_rating = excellent  THEN buys_computer = yes\nIF age = young AND credit_rating = fair     THEN buys_computer = no\nRule Extraction from a Decision Tree\nRules are easier to understand than large trees\nOne rule is created for each path from the root to a leaf\nEach attribute-value pair along a path forms a conjunction: the leaf holds the class prediction \nRules are mutually exclusive and exhaustive"}]},{"name":"DM CAT 2 NOTES/M5 DM/M5 PPT 1 dt.pptx","parts":[{"page":1,"text":"Decision Tree\nMaheswari B\nAsst Prof/SCOPE"},{"page":2,"text":"Decision Tree\nA Decision Tree is a supervised machine learning algorithm used for classification and regression. It makes decisions by asking a series of simple questions about the input data. The structure looks like a tree, where each question divides the data into smaller groups until a final prediction is reached.\nBasic Structure of a Decision Tree\ni) Root Node \nThe starting point of the tree \nContains the entire dataset \nExample: Is Age > 30? \nii) Decision/Internal Node \nRepresents a question or condition \nExample: Is Income > ₹50,000? \niii) Branch \nRepresents the answer to a decision \nExample: Yes / No \niv) Leaf Node \nRepresents the final output or prediction \nExample: Buy = Yes or Buy = No\n"},{"page":3,"text":"Decision Tree\nMain Uses of Decision Trees\ni) Classification\nUsed when the output is a category or class\nExamples:\nDisease → Yes / No \nEmail → Spam / Not Spam \nLoan → Approved / Rejected \nCustomer → Will Buy / Will Not Buy \nii) Regression\nUsed when the output is a continuous numerical value\nExamples:\nPredict house price \nPredict salary \nPredict temperature \nPredict sales \nOther Applications\nMedical diagnosis \nFraud detection \nCredit risk assessment \nCustomer segmentation \nStudent performance prediction \nMarketing and recommendation systems "},{"page":4,"text":"Advantages of Decision Tree\u000b\nEasy to understand :The decision process can be represented as simple questions \nEasy to visualize :The complete model can be shown as a tree \nRequires less data preprocessing :Scaling and normalization are usually not required \nWorks with numerical and categorical data \nUseful for both classification and regression \nProvides interpretable decisions: We can understand why a particular prediction was made \nCan identify important features: Features used near the top of the tree are often important for prediction\n"},{"page":5,"text":"Disadvantages of Decision Tree\u000b\nCan overfit :A very deep tree may learn the training data too closely \nSensitive to small changes in data: A small change in the training dataset can produce a different tree \nDeep trees can become complicated: The model becomes difficult to interpret when there are many branches \nCan be biased toward certain features: Some splitting methods may prefer features with many possible values \nUsually less stable than ensemble methods: A single decision tree may not perform as well as Random Forest or Gradient Boosting \nPruning may be required: The tree may need to be shortened to reduce overfitting"},{"page":6,"text":"Decision Tree\nWorking Principle\nStart with the complete dataset at the root node \nSelect the best feature for splitting the data \nDivide the data into different groups \nRepeat the process for each group \nStop when a suitable stopping condition is reached \nThe final leaf node gives the prediction \nThe algorithm chooses a good split using measures such as:\nGini Index \nEntropy \nInformation Gain \nGain Ratio \nMean Squared Error, mainly for regression"},{"page":7,"text":"ID3\nID3 (Iterative Dichotomiser 3) is a Decision Tree algorithm used mainly for classification problems. It builds a decision tree by selecting the best feature at each step and dividing the data based on that feature.\nThe main idea of ID3 is simple: choose the feature that gives the most useful information about the target class. ID3 uses Entropy and Information Gain to decide which feature should be selected for splitting.\n\n"},{"page":8,"text":"ID3\n1. Entropy\n\tEntropy measures the impurity or uncertainty in a dataset. If all samples belong to the same class, entropy is 0. If the classes are equally mixed, entropy is high.\n\n\n2. Information Gain\n\tInformation Gain measures how much an attribute helps to reduce the uncertainty in the dataset.\n\tThe ID3 algorithm selects the attribute with the highest Information Gain as the splitting attribute.\n\n"},{"page":9,"text":"ID3 (Algorithm)\nStep 1: Start with the complete dataset\nAll training examples are placed at the root node.\nStep 2: Calculate Entropy\nEntropy measures how mixed or impure the classes are.\nIf all examples belong to the same class → Entropy = 0 \nIf the classes are highly mixed → Entropy is higher \nStep 3: Calculate Information Gain\nFor every available feature, ID3 calculates the Information Gain.\nInformation Gain tells us how much the uncertainty is reduced after splitting the data.\nStep 4: Select the feature with the highest Information Gain\nThe feature having the highest Information Gain becomes the decision node.\nStep 5: Split the dataset\nThe dataset is divided according to the selected feature.\nStep 6: Repeat the process\nFor each resulting group, ID3 again calculates Information Gain and selects the next best feature.\nStep 7: Stop when the final classes are obtained\nThe final nodes become leaf nodes, which provide the prediction."},{"page":10,"text":""},{"page":11,"text":""},{"page":12,"text":""},{"page":13,"text":""},{"page":14,"text":""},{"page":15,"text":""},{"page":16,"text":""},{"page":17,"text":""},{"page":18,"text":"CART\nCART stands for Classification and Regression Trees. It is a decision tree algorithm used for both classification and regression problems. CART builds the tree by repeatedly splitting the dataset into two groups, so it always produces a binary decision tree.\n1. CART for Classification\nFor classification, CART mainly uses the Gini Impurity to decide the best split.\nGini Impurity\nGini Impurity measures how mixed the classes are in a node.\n\n\n"},{"page":19,"text":"CART\n2. CART for Regression\nFor regression, the target value is continuous, such as salary, house price, temperature, or disease score.\nCART commonly uses Mean Squared Error (MSE) to select the best split."},{"page":20,"text":""},{"page":21,"text":"Step 2: Compute Gini_index for each of the attribute and each of the subset in the attribute"},{"page":22,"text":""},{"page":23,"text":"Remaining calculations kindly check your notebook"},{"page":24,"text":""},{"page":25,"text":"0.1684\n0.2184-0.1684=0.050"},{"page":26,"text":""},{"page":27,"text":""},{"page":28,"text":""},{"page":29,"text":""},{"page":30,"text":" 0.1684                             0.050"},{"page":31,"text":""},{"page":32,"text":"Feature | ID3 | CART\nFull form | Iterative Dichotomiser 3 | Classification and Regression Trees\nSplitting method | Information Gain | Gini Impurity\nUses | Mainly classification | Classification and regression\nNumber of branches | Can have more than 2 branches | Always 2 branches\nGenerally preferred | Good for simple classification | Often preferred for practical applications"}]},{"name":"DM CAT 2 NOTES/M5 DM/Classification.pptx","parts":[{"page":1,"text":"*\nData Mining: \u000b Concepts and Techniques\u000b (3rd ed.)\u000b\u000b— Chapter 8 —\nJiawei Han, Micheline Kamber, and Jian Pei\nUniversity of Illinois at Urbana-Champaign &\nSimon Fraser University\n©2011 Han, Kamber & Pei.  All rights reserved."},{"page":2,"text":"*\nChapter 8. Classification: Basic Concepts\nClassification: Basic Concepts\nDecision Tree Induction\nBayes Classification Methods\nRule-Based Classification\nModel Evaluation and Selection\nTechniques to Improve Classification Accuracy: Ensemble Methods\nSummary\n"},{"page":3,"text":"*\nSupervised vs. Unsupervised Learning\nSupervised learning (classification)\nSupervision: The training data (observations, measurements, etc.) are accompanied by labels indicating the class of the observations\nNew data is classified based on the training set\nUnsupervised learning (clustering)\nThe class labels of training data is unknown\nGiven a set of measurements, observations, etc. with the aim of establishing the existence of classes or clusters in the data"},{"page":4,"text":"*\nClassification  \npredicts categorical class labels (discrete or nominal)\nclassifies data (constructs a model) based on the training set and the values (class labels) in a classifying attribute and uses it in classifying new data\nNumeric Prediction  \nmodels continuous-valued functions, i.e., predicts unknown or missing values \nTypical applications\nCredit/loan approval:\nMedical diagnosis: if a tumor is cancerous or benign\nFraud detection: if a transaction is fraudulent\nWeb page categorization: which category it is\nPrediction Problems: Classification vs. Numeric Prediction"},{"page":5,"text":"*\nClassification—A Two-Step Process \nModel construction: describing a set of predetermined classes\nEach tuple/sample is assumed to belong to a predefined class, as determined by the class label attribute\nThe set of tuples used for model construction is training set\nThe model is represented as classification rules, decision trees, or mathematical formulae\nModel usage: for classifying future or unknown objects\nEstimate accuracy of the model\nThe known label of test sample is compared with the classified result from the model\nAccuracy rate is the percentage of test set samples that are correctly classified by the model\nTest set is independent of training set (otherwise overfitting) \nIf the accuracy is acceptable, use the model to classify new data\nNote: If the test set is used to select models, it is called validation (test) set"},{"page":6,"text":"*\nProcess (1): Model Construction\n\n\nClassification\nAlgorithms\n\nIF rank = ‘professor’\nOR years > 6\nTHEN tenured = ‘yes’ \n\n\n"},{"page":7,"text":"*\nProcess (2): Using the Model in Prediction \n\n\n\n\n(Jeff, Professor, 4)\n\n\n\nTenured?"},{"page":8,"text":"*\nChapter 8. Classification: Basic Concepts\nClassification: Basic Concepts\nDecision Tree Induction\nBayes Classification Methods\nRule-Based Classification\nModel Evaluation and Selection\nTechniques to Improve Classification Accuracy: Ensemble Methods\nSummary\n"},{"page":9,"text":"*\nDecision Tree Induction: An Example\nTraining data set: Buys_computer\nThe data set follows an example of Quinlan’s ID3 (Playing Tennis)\nResulting tree:"},{"page":10,"text":"*\nAlgorithm for Decision Tree Induction\nBasic algorithm (a greedy algorithm)\nTree is constructed in a top-down recursive divide-and-conquer manner\nAt start, all the training examples are at the root\nAttributes are categorical (if continuous-valued, they are discretized in advance)\nExamples are partitioned recursively based on selected attributes\nTest attributes are selected on the basis of a heuristic or statistical measure (e.g., information gain)\nConditions for stopping partitioning\nAll samples for a given node belong to the same class\nThere are no remaining attributes for further partitioning – majority voting is employed for classifying the leaf\nThere are no samples left"},{"page":11,"text":"Brief Review of Entropy\n*\nm = 2"},{"page":12,"text":"*\nAttribute Selection Measure: Information Gain (ID3/C4.5)\nSelect the attribute with the highest information gain\nLet pi be the probability that an arbitrary tuple in D belongs to class Ci, estimated by |Ci, D|/|D|\nExpected information (entropy) needed to classify a tuple in D:\n\nInformation needed (after using A to split D into v partitions) to classify D:\n\nInformation gained by branching on attribute A"},{"page":13,"text":"*\nAttribute Selection: Information Gain\nClass P: buys_computer = “yes”\nClass N: buys_computer = “no”\n            means “age <=30” has 5 out of 14 samples, with 2 yes’es  and 3 no’s.   Hence\n\n\nSimilarly,"},{"page":14,"text":"*\nComputing Information-Gain for Continuous-Valued Attributes\nLet attribute A be a continuous-valued attribute\nMust determine the best split point for A\nSort the value A in increasing order\nTypically, the midpoint between each pair of adjacent values is considered as a possible split point\n(ai+ai+1)/2 is the midpoint between the values of ai and ai+1\nThe point with the minimum expected information requirement for A is selected as the split-point for A\nSplit:\nD1 is the set of tuples in D satisfying A ≤ split-point, and D2 is the set of tuples in D satisfying A > split-point"},{"page":15,"text":"*\nGain Ratio for Attribute Selection (C4.5)\nInformation gain measure is biased towards attributes with a large number of values\nC4.5 (a successor of ID3) uses gain ratio to overcome the problem (normalization to information gain)\n\n\nGainRatio(A) = Gain(A)/SplitInfo(A)\nEx.\n\ngain_ratio(income) = 0.029/1.557 = 0.019\nThe attribute with the maximum gain ratio is selected as the splitting attribute"},{"page":16,"text":"*\nGini Index (CART, IBM IntelligentMiner)\nIf a data set D contains examples from n classes, gini index, gini(D) is defined as\n\n    \t\twhere pj is the relative frequency of class j in D\nIf a data set D  is split on A into two subsets D1 and D2, the gini index gini(D) is defined as\n\nReduction in Impurity:\n\nThe attribute provides the smallest ginisplit(D) (or the largest reduction in impurity) is chosen to split the node (need to enumerate all the possible splitting points for each attribute)"},{"page":17,"text":"*\nComputation of Gini Index \nEx.  D has 9 tuples in buys_computer = “yes” and 5 in “no”\n\nSuppose the attribute income partitions D into 10 in D1: {low, medium} and 4 in D2\n\n\n\n Gini{low,high} is 0.458; Gini{medium,high} is 0.450.  Thus, split on the {low,medium} (and {high}) since it has the lowest Gini index\nAll attributes are assumed continuous-valued\nMay need other tools, e.g., clustering, to get the possible split values\nCan be modified for categorical attributes"},{"page":18,"text":"*\nComparing Attribute Selection Measures\nThe three measures, in general, return good results but\nInformation gain: \nbiased towards multivalued attributes\nGain ratio: \ntends to prefer unbalanced splits in which one partition is much smaller than the others\nGini index: \nbiased to multivalued attributes\nhas difficulty when # of classes is large\ntends to favor tests that result in equal-sized partitions and purity in both partitions"},{"page":19,"text":"*\nOther Attribute Selection Measures\nCHAID: a popular decision tree algorithm, measure based on χ2 test for independence\nC-SEP: performs better than info. gain and gini index in certain cases\nG-statistic: has a close approximation to χ2 distribution \nMDL (Minimal Description Length) principle (i.e., the simplest solution is preferred): \nThe best tree as the one that requires the fewest # of bits to both (1) encode the tree, and (2) encode the exceptions to the tree\nMultivariate splits (partition based on multiple variable combinations)\nCART: finds multivariate splits based on a linear comb. of attrs.\nWhich attribute selection measure is the best?\n Most give good results, none is significantly superior than others"},{"page":20,"text":"*\nOverfitting and Tree Pruning\nOverfitting:  An induced tree may overfit the training data \nToo many branches, some may reflect anomalies due to noise or outliers\nPoor accuracy for unseen samples\nTwo approaches to avoid overfitting \nPrepruning: Halt tree construction early ̵ do not split a node if this would result in the goodness measure falling below a threshold\nDifficult to choose an appropriate threshold\nPostpruning: Remove branches from a “fully grown” tree—get a sequence of progressively pruned trees\nUse a set of data different from the training data to decide which is the “best pruned tree”"},{"page":21,"text":"*\nEnhancements to Basic Decision Tree Induction\nAllow for continuous-valued attributes\nDynamically define new discrete-valued attributes that partition the continuous attribute value into a discrete set of intervals\nHandle missing attribute values\nAssign the most common value of the attribute\nAssign probability to each of the possible values\nAttribute construction\nCreate new attributes based on existing ones that are sparsely represented\nThis reduces fragmentation, repetition, and replication\n\n\n"},{"page":22,"text":"*\nClassification in Large Databases\nClassification—a classical problem extensively studied by statisticians and machine learning researchers\nScalability: Classifying data sets with millions of examples and hundreds of attributes with reasonable speed\nWhy is decision tree induction popular?\nrelatively faster learning speed (than other classification methods)\nconvertible to simple and easy to understand classification rules\ncan use SQL queries for accessing databases\ncomparable classification accuracy with other methods\nRainForest (VLDB’98 — Gehrke, Ramakrishnan & Ganti)\nBuilds an AVC-list (attribute, value, class label)"},{"page":23,"text":"*\nChapter 8. Classification: Basic Concepts\nClassification: Basic Concepts\nDecision Tree Induction\nBayes Classification Methods\nRule-Based Classification\nModel Evaluation and Selection\nTechniques to Improve Classification Accuracy: Ensemble Methods\nSummary\n"},{"page":24,"text":"*\nBayesian Classification: Why?\nA statistical classifier: performs probabilistic prediction, i.e., predicts class membership probabilities\nFoundation: Based on Bayes’ Theorem. \nPerformance: A simple Bayesian classifier, naïve Bayesian classifier, has comparable performance with decision tree and selected neural network classifiers\nIncremental: Each training example can incrementally increase/decrease the probability that a hypothesis is correct — prior knowledge can be combined with observed data\nStandard: Even when Bayesian methods are computationally intractable, they can provide a standard of optimal decision making against which other methods can be measured"},{"page":25,"text":"*\nBayes’ Theorem: Basics\nTotal probability Theorem:\n\nBayes’ Theorem:\n\nLet X be a data sample (“evidence”): class label is unknown\nLet H be a hypothesis that X belongs to class C \nClassification is to determine P(H|X), (i.e., posteriori probability):  the probability that the hypothesis holds given the observed data sample X\nP(H) (prior probability): the initial probability\nE.g., X will buy computer, regardless of age, income, …\nP(X): probability that sample data is observed\nP(X|H) (likelihood): the probability of observing the sample X, given that the hypothesis holds\nE.g., Given that X will buy computer, the prob. that X is 31..40, medium income"},{"page":26,"text":"*\nPrediction Based on Bayes’ Theorem\nGiven training data X, posteriori probability of a hypothesis H, P(H|X), follows the Bayes’ theorem\n\t\t\t\n\nInformally, this can be viewed as \n\t\tposteriori = likelihood x prior/evidence\nPredicts X belongs to Ci iff the probability P(Ci|X) is the highest among all the P(Ck|X) for all the k classes\nPractical difficulty:  It requires initial knowledge of many probabilities, involving significant computational cost"},{"page":27,"text":"*\nClassification Is to Derive the Maximum Posteriori\nLet D be a training set of tuples and their associated class labels, and each tuple is represented by an n-D attribute vector X = (x1, x2, …, xn)\nSuppose there are m classes C1, C2, …, Cm.\nClassification is to derive the maximum posteriori, i.e., the maximal P(Ci|X)\nThis can be derived from Bayes’ theorem\n\n\nSince P(X) is constant for all classes, only                                        \n\nneeds to be maximized"},{"page":28,"text":"*\nNaïve Bayes Classifier \nA simplified assumption: attributes are conditionally independent (i.e., no dependence relation between attributes):\n\nThis greatly reduces the computation cost: Only counts the class distribution\nIf Ak is categorical, P(xk|Ci) is the # of tuples in Ci having value xk for Ak divided by |Ci, D| (# of tuples of Ci in D)\nIf Ak is continous-valued, P(xk|Ci) is usually computed based on Gaussian distribution with a mean μ and standard deviation σ\n\nand P(xk|Ci) is \n"},{"page":29,"text":"*\nNaïve Bayes Classifier: Training Dataset\nClass:\nC1:buys_computer = ‘yes’\nC2:buys_computer = ‘no’\n\nData to be classified: \nX = (age <=30, \nIncome = medium,\nStudent = yes\nCredit_rating = Fair)"},{"page":30,"text":"*\nNaïve Bayes Classifier: An Example\nP(Ci):    P(buys_computer = “yes”)  = 9/14 = 0.643\n                   P(buys_computer = “no”) = 5/14= 0.357\nCompute P(X|Ci) for each class\n     P(age = “<=30” | buys_computer = “yes”)  = 2/9 = 0.222\n     P(age = “<= 30” | buys_computer = “no”) = 3/5 = 0.6\n     P(income = “medium” | buys_computer = “yes”) = 4/9 = 0.444\n     P(income = “medium” | buys_computer = “no”) = 2/5 = 0.4\n     P(student = “yes” | buys_computer = “yes) = 6/9 = 0.667\n     P(student = “yes” | buys_computer = “no”) = 1/5 = 0.2\n     P(credit_rating = “fair” | buys_computer = “yes”) = 6/9 = 0.667\n     P(credit_rating = “fair” | buys_computer = “no”) = 2/5 = 0.4\n X = (age <= 30 , income = medium, student = yes, credit_rating = fair)\n P(X|Ci) : P(X|buys_computer = “yes”) = 0.222 x 0.444 x 0.667 x 0.667 = 0.044\n                P(X|buys_computer = “no”) = 0.6 x 0.4 x 0.2 x 0.4 = 0.019\nP(X|Ci)*P(Ci) : P(X|buys_computer = “yes”) * P(buys_computer = “yes”) = 0.028\n\t\t             P(X|buys_computer = “no”) * P(buys_computer = “no”) = 0.007\nTherefore,  X belongs to class (“buys_computer = yes”)\t\t"},{"page":31,"text":"*\nAvoiding the Zero-Probability Problem\nNaïve Bayesian prediction requires each conditional prob. be non-zero.  Otherwise, the predicted prob. will be zero\n\n\t\nEx. Suppose a dataset with 1000 tuples, income=low (0), income= medium (990), and income = high (10)\nUse Laplacian correction (or Laplacian estimator)\nAdding 1 to each case\nProb(income = low) = 1/1003\nProb(income = medium) = 991/1003\nProb(income = high) = 11/1003\nThe “corrected” prob. estimates are close to their “uncorrected” counterparts"},{"page":32,"text":"*\nNaïve Bayes Classifier: Comments\nAdvantages \nEasy to implement \nGood results obtained in most of the cases\nDisadvantages\nAssumption: class conditional independence, therefore loss of accuracy\nPractically, dependencies exist among variables \nE.g.,  hospitals: patients: Profile: age, family history, etc. \n Symptoms: fever, cough etc., Disease: lung cancer, diabetes, etc. \nDependencies among these cannot be modeled by Naïve Bayes Classifier\nHow to deal with these dependencies? Bayesian Belief Networks (Chapter 9)"},{"page":33,"text":"*\nChapter 8. Classification: Basic Concepts\nClassification: Basic Concepts\nDecision Tree Induction\nBayes Classification Methods\nRule-Based Classification\nModel Evaluation and Selection\nTechniques to Improve Classification Accuracy: Ensemble Methods\nSummary\n"},{"page":34,"text":"*\nChapter 8. Classification: Basic Concepts\nClassification: Basic Concepts\nDecision Tree Induction\nBayes Classification Methods\nRule-Based Classification\nModel Evaluation and Selection\nTechniques to Improve Classification Accuracy: Ensemble Methods\nSummary\n"},{"page":35,"text":"Model Evaluation and Selection\nEvaluation metrics: How can we measure accuracy?  Other metrics to consider?\nUse validation test set of class-labeled tuples instead of training set when assessing accuracy\nMethods for estimating a classifier’s accuracy: \nHoldout method, random subsampling\nCross-validation\nBootstrap\nComparing classifiers:\nConfidence intervals\nCost-benefit analysis and ROC Curves\n*"},{"page":36,"text":"Classifier Evaluation Metrics: Confusion Matrix\nActual class\\Predicted class | buy_computer =  yes | buy_computer = no | Total\nbuy_computer = yes | 6954 | 46 | 7000\nbuy_computer = no | 412 | 2588 | 3000\nTotal | 7366 | 2634 | 10000\nGiven m classes, an entry, CMi,j  in a confusion matrix indicates # of tuples in class i  that were labeled by the classifier as class j\nMay have extra rows/columns to provide totals\nConfusion Matrix:\nActual class\\Predicted class | C1 | ¬ C1\nC1 | True Positives (TP) | False Negatives (FN)\n¬ C1 | False Positives (FP) | True Negatives (TN)\nExample of Confusion Matrix:\n*"},{"page":37,"text":"Classifier Evaluation Metrics: Accuracy, Error Rate, Sensitivity and Specificity\nClassifier Accuracy, or recognition rate: percentage of test set tuples that are correctly classified\nAccuracy = (TP + TN)/All\nError rate: 1 – accuracy, or\nError rate = (FP + FN)/All\nClass Imbalance Problem: \nOne class may be rare, e.g. fraud, or HIV-positive\nSignificant majority of the negative class and minority of the positive class\nSensitivity: True Positive recognition rate\nSensitivity = TP/P\nSpecificity: True Negative recognition rate\nSpecificity = TN/N\nA\\P | C | ¬C | \nC | TP | FN | P\n¬C | FP | TN | N\n | P’ | N’ | All\n*"},{"page":38,"text":"Classifier Evaluation Metrics: \u000bPrecision and Recall, and F-measures\nPrecision: exactness – what % of tuples that the classifier labeled as positive are actually positive\n\nRecall: completeness – what % of positive tuples did the classifier label as positive?\nPerfect score is 1.0\nInverse relationship between precision & recall\nF measure (F1 or F-score): harmonic mean of precision and recall,\n\nFß:  weighted measure of precision and recall\nassigns ß times as much weight to recall as to precision\n\n*"},{"page":39,"text":"Classifier Evaluation Metrics: Example\n\n*\nPrecision = 90/230 = 39.13%             Recall = 90/300 = 30.00%\n\nActual Class\\Predicted class | cancer = yes | cancer = no | Total | Recognition(%)\ncancer = yes | 90 | 210 | 300 | 30.00 (sensitivity\ncancer = no | 140 | 9560 | 9700 | 98.56 (specificity)\nTotal | 230 | 9770 | 10000 | 96.40 (accuracy)"},{"page":40,"text":"Issues Affecting Model Selection\nAccuracy\nclassifier accuracy: predicting class label\nSpeed\ntime to construct the model (training time)\ntime to use the model (classification/prediction time)\nRobustness: handling noise and missing values\nScalability: efficiency in disk-resident databases \nInterpretability\nunderstanding and insight provided by the model\nOther measures, e.g., goodness of rules, such as decision tree size or compactness of classification rules\n*"},{"page":41,"text":"*\nChapter 8. Classification: Basic Concepts\nClassification: Basic Concepts\nDecision Tree Induction\nBayes Classification Methods\nRule-Based Classification\nModel Evaluation and Selection\nTechniques to Improve Classification Accuracy: Ensemble Methods\nSummary\n"},{"page":42,"text":"Ensemble Methods: Increasing the Accuracy\nEnsemble methods\nUse a combination of models to increase accuracy\nCombine a series of k learned models, M1, M2, …, Mk, with the aim of creating an improved model M*\nPopular ensemble methods\nBagging: averaging the prediction over a collection of classifiers\nBoosting: weighted vote with a collection of classifiers\nEnsemble: combining a set of heterogeneous classifiers\n*"},{"page":43,"text":"Bagging: Boostrap Aggregation\nAnalogy: Diagnosis based on multiple doctors’ majority vote\nTraining\nGiven a set D of d tuples, at each iteration i, a training set Di of d tuples is sampled with replacement from D (i.e., bootstrap)\nA classifier model Mi is learned for each training set Di\nClassification: classify an unknown sample X \nEach classifier Mi returns its class prediction\nThe bagged classifier M* counts the votes and assigns the class with the most votes to X\nPrediction: can be applied to the prediction of continuous values by taking the average value of each prediction for a given test tuple\nAccuracy\nOften significantly better than a single classifier derived from D\nFor noise data: not considerably worse, more robust \nProved improved accuracy in prediction\n*"},{"page":44,"text":"Boosting\nAnalogy: Consult several doctors, based on a combination of weighted diagnoses—weight assigned based on the previous diagnosis accuracy\nHow boosting works?\nWeights are assigned to each training tuple\nA series of k classifiers is iteratively learned\nAfter a classifier Mi is learned, the weights are updated to allow the subsequent classifier, Mi+1, to pay more attention to the training tuples that were misclassified by Mi\nThe final M* combines the votes of each individual classifier, where the weight of each classifier's vote is a function of its accuracy\nBoosting algorithm can be extended for numeric prediction\nComparing with bagging: Boosting tends to have greater accuracy, but it also risks overfitting the model to misclassified data\n*"},{"page":45,"text":"*\nAdaboost (Freund and Schapire, 1997)\nGiven a set of d class-labeled tuples, (X1, y1), …, (Xd, yd)\nInitially, all the weights of tuples are set the same (1/d)\nGenerate k classifiers in k rounds.  At round i,\nTuples from D are sampled (with replacement) to form a training set Di of the same size\nEach tuple’s chance of being selected is based on its weight\nA classification model Mi is derived from Di\nIts error rate is calculated using Di as a test set\nIf a tuple is misclassified, its weight is increased, o.w. it is decreased\nError rate: err(Xj) is the misclassification error of tuple Xj. Classifier Mi error rate is the sum of the weights of the misclassified tuples: \n\n\nThe weight of classifier Mi’s vote is"},{"page":46,"text":"Random Forest (Breiman 2001) \nRandom Forest: \nEach classifier in the ensemble is a decision tree classifier and is generated using a random selection of attributes at each node to determine the split\nDuring classification, each tree votes and the most popular class is returned\nTwo Methods to construct Random Forest:\nForest-RI (random input selection):  Randomly select, at each node, F attributes as candidates for the split at the node. The CART methodology is used to grow the trees to maximum size\nForest-RC (random linear combinations):  Creates new attributes (or features) that are a linear combination of the existing attributes (reduces the correlation between individual classifiers)\nComparable in accuracy to Adaboost, but more robust to errors and outliers \nInsensitive to the number of attributes selected for consideration at each split, and faster than bagging or boosting\n*"},{"page":47,"text":"Classification of Class-Imbalanced Data Sets\nClass-imbalance problem: Rare positive example but numerous negative ones, e.g., medical diagnosis, fraud, oil-spill, fault, etc. \nTraditional methods assume a balanced distribution of classes and equal error costs: not suitable for class-imbalanced data\nTypical methods for imbalance data in 2-class classification: \nOversampling: re-sampling of data from positive class\nUnder-sampling: randomly eliminate  tuples from negative class\nThreshold-moving: moves the decision threshold, t, so that the rare class tuples are easier to classify, and hence, less chance of costly false negative errors\nEnsemble techniques: Ensemble multiple classifiers introduced above\nStill difficult for class imbalance problem on multiclass tasks\n*"},{"page":48,"text":"*\nChapter 8. Classification: Basic Concepts\nClassification: Basic Concepts\nDecision Tree Induction\nBayes Classification Methods\nRule-Based Classification\nModel Evaluation and Selection\nTechniques to Improve Classification Accuracy: Ensemble Methods\nSummary\n"},{"page":49,"text":"*\nIssues: Evaluating Classification Methods\nAccuracy\nclassifier accuracy: predicting class label\npredictor accuracy: guessing value of predicted attributes\nSpeed\ntime to construct the model (training time)\ntime to use the model (classification/prediction time)\nRobustness: handling noise and missing values\nScalability: efficiency in disk-resident databases \nInterpretability\nunderstanding and insight provided by the model\nOther measures, e.g., goodness of rules, such as decision tree size or compactness of classification rules"},{"page":50,"text":"*\nPredictor Error Measures\nMeasure predictor accuracy: measure how far off the predicted value is from the actual known value\nLoss function: measures the error betw. yi and the predicted value yi’\nAbsolute error: | yi – yi’| \nSquared error:  (yi – yi’)2 \nTest error (generalization error): the average loss over the test set\nMean absolute error:                  Mean squared error:\n\nRelative absolute error:               Relative squared error:\n\nThe mean squared-error exaggerates the presence of outliers\nPopularly use (square) root mean-square error, similarly, root relative squared error"},{"page":51,"text":"*\nThank You"}]},{"name":"Converted legacy slides / M3.1 DM.pptx","parts":[{"page":1,"text":"\u000b\n \n<number>\n\nMs. MAHESWARI .B\nAssistant Professor, SCOPE\n(PRP ANNEX- 101L)\nmaheswari.b@vit.ac.in\nBCSE208L -Data Mining"},{"page":2,"text":"<number>\nData Mining: \u000b Concepts and Techniques\u000b (3rd ed.)\u000b\u000b— Chapter 3 —\nJiawei Han, Micheline Kamber, and Jian Pei\nUniversity of Illinois at Urbana-Champaign &\nSimon Fraser University\n©2011 Han, Kamber & Pei.  All rights reserved."},{"page":3,"text":"Module 3\n11/16/26\nData Mining: Concepts and Techniques\n<number>"},{"page":4,"text":"<number>\n<number>\nChapter 3: Data Preprocessing\nData Preprocessing: An Overview\nData Quality\nMajor Tasks in Data Preprocessing\nData Cleaning\nData Integration\nData Reduction\nData Transformation and Data Discretization\nSummary\n"},{"page":5,"text":"<number>\nData Quality: Why Preprocess the Data?\nMeasures for data quality: A multidimensional view\nAccuracy: correct or wrong, accurate or not\nCompleteness: not recorded, unavailable, …\nConsistency: some modified but some not, dangling, …\nTimeliness: timely update? \nBelievability: how trustable the data are correct?\nInterpretability: how easily the data can be understood?"},{"page":6,"text":"<number>\nMajor Tasks in Data Preprocessing\nData cleaning\nFill in missing values, smooth noisy data, identify or remove outliers, and resolve inconsistencies\nData integration\nIntegration of multiple databases, data cubes, or files\nData reduction\nDimensionality reduction\nNumerosity reduction\nData compression\nData transformation and data discretization\nNormalization \nConcept hierarchy generation"},{"page":7,"text":"<number>\n<number>\nChapter 3: Data Preprocessing\nData Preprocessing: An Overview\nData Quality\nMajor Tasks in Data Preprocessing\nData Cleaning\nData Integration\nData Reduction\nData Transformation and Data Discretization\nSummary\n"},{"page":8,"text":"<number>\nData Cleaning\nData in the Real World Is Dirty: Lots of potentially incorrect data, e.g., instrument faulty, human or computer error, transmission error\nincomplete: lacking attribute values, lacking certain attributes of interest, or containing only aggregate data\ne.g., Occupation=“ ” (missing data)\nnoisy: containing noise, errors, or outliers\ne.g., Salary=“−10” (an error)\ninconsistent: containing discrepancies in codes or names, e.g.,\nAge=“42”, Birthday=“03/07/2010”\nWas rating “1, 2, 3”, now rating “A, B, C”\ndiscrepancy between duplicate records\nIntentional (e.g., disguised missing data)\nJan. 1 as everyone’s birthday?"},{"page":9,"text":"<number>\nIncomplete (Missing) Data\nData is not always available\nE.g., many tuples have no recorded value for several attributes, such as customer income in sales data\nMissing data may be due to \nequipment malfunction\ninconsistent with other recorded data and thus deleted\ndata not entered due to misunderstanding\ncertain data may not be considered important at the time of entry\nnot register history or changes of the data\nMissing data may need to be inferred"},{"page":10,"text":"<number>\nHow to Handle Missing Data?\nIgnore the tuple: usually done when class label is missing (when doing classification)—not effective when the % of missing values per attribute varies considerably\nFill in the missing value manually: tedious + infeasible?\nFill in it automatically with\na global constant : e.g., “unknown”, a new class?! \nthe attribute mean\nthe attribute mean for all samples belonging to the same class: smarter\nthe most probable value: inference-based such as Bayesian formula or decision tree"},{"page":11,"text":"<number>\nNoisy Data\nNoise: random error or variance in a measured variable\nIncorrect attribute values may be due to\nfaulty data collection instruments\ndata entry problems\ndata transmission problems\ntechnology limitation\ninconsistency in naming convention \nOther data problems which require data cleaning\nduplicate records\nincomplete data\ninconsistent data"},{"page":12,"text":"<number>\nHow to Handle Noisy Data?\nBinning\nfirst sort data and partition into (equal-frequency) bins\nthen one can smooth by bin means,  smooth by bin median, smooth by bin boundaries, etc.\nRegression\nsmooth by fitting the data into regression functions\nClustering\ndetect and remove outliers\nCombined computer and human inspection\ndetect suspicious values and check by human (e.g., deal with possible outliers)"},{"page":13,"text":"<number>\nData Cleaning as a Process\nData discrepancy detection\nUse metadata (e.g., domain, range, dependency, distribution)\nCheck field overloading \nCheck uniqueness rule, consecutive rule and null rule\nUse commercial tools\nData scrubbing: use simple domain knowledge (e.g., postal code, spell-check) to detect errors and make corrections\nData auditing: by analyzing data to discover rules and relationship to detect violators (e.g., correlation and clustering to find outliers)\nData migration and integration\nData migration tools: allow transformations to be specified\nETL (Extraction/Transformation/Loading) tools: allow users to specify transformations through a graphical user interface\nIntegration of the two processes\nIterative and interactive (e.g., Potter’s Wheels)"},{"page":14,"text":"<number>\n<number>\nChapter 3: Data Preprocessing\nData Preprocessing: An Overview\nData Quality\nMajor Tasks in Data Preprocessing\nData Cleaning\nData Integration\nData Reduction\nData Transformation and Data Discretization\nSummary\n"},{"page":15,"text":"<number>\n<number>\nData Integration\nData integration: \nCombines data from multiple sources into a coherent store\nSchema integration: e.g., A.cust-id  B.cust-#\nIntegrate metadata from different sources\nEntity identification problem: \nIdentify real world entities from multiple data sources, e.g., Bill Clinton = William Clinton\nDetecting and resolving data value conflicts\nFor the same real world entity, attribute values from different sources are different\nPossible reasons: different representations, different scales, e.g., metric vs. British units"},{"page":16,"text":"<number>\n<number>\nHandling Redundancy in Data Integration\nRedundant data occur often when integration of multiple databases\nObject identification:  The same attribute or object may have different names in different databases\nDerivable data: One attribute may be a “derived” attribute in another table, e.g., annual revenue\nRedundant attributes may be able to be detected by correlation analysis and covariance analysis\nCareful integration of the data from multiple sources may help reduce/avoid redundancies and inconsistencies and improve mining speed and quality"},{"page":17,"text":"<number>\nCorrelation Analysis (Nominal Data)\nΧ2 (chi-square) test\n\n\nThe larger the Χ2 value, the more likely the variables are related\nThe cells that contribute the most to the Χ2 value are those whose actual count is very different from the expected count\nCorrelation does not imply causality\n# of hospitals and # of car-theft in a city are correlated\nBoth are causally linked to the third variable: population"},{"page":18,"text":"<number>\nChi-Square Calculation: An Example\n\n\n\n\nΧ2 (chi-square) calculation (numbers in parenthesis are expected counts calculated based on the data distribution in the two categories)\n\n\nIt shows that like_science_fiction and play_chess are correlated in the group\n | Play chess | Not play chess | Sum (row)\nLike science fiction | 250(90) | 200(360) | 450\nNot like science fiction | 50(210) | 1000(840) | 1050\nSum(col.) | 300 | 1200 | 1500"},{"page":19,"text":"<number>\nCorrelation Analysis (Numeric Data)\nCorrelation coefficient (also called Pearson’s product moment coefficient)\n\n\n\nwhere n is the number of tuples,       and      are the respective means of A and B, σA and σB are the respective standard deviation of A and B, and Σ(aibi) is the sum of the AB cross-product.\nIf rA,B > 0, A and B are positively correlated (A’s values increase as B’s).  The higher, the stronger correlation.\nrA,B = 0: independent;  rAB < 0: negatively correlated"},{"page":20,"text":"<number>\nVisually Evaluating Correlation\nScatter plots showing the similarity from –1 to 1."},{"page":21,"text":"<number>\nCorrelation (viewed as linear relationship)\nCorrelation measures the linear relationship between objects\nTo compute correlation, we standardize data objects, A and B, and then take their dot product"},{"page":22,"text":"<number>\nCovariance (Numeric Data)\nCovariance is similar to correlation\n\n\n\n\nwhere n is the number of tuples,      and      are the respective mean or expected values of A and B, σA and σB are the respective standard deviation of A and B.\nPositive covariance: If CovA,B > 0, then A and B both tend to be larger than their expected values.\nNegative covariance: If CovA,B < 0 then if A is larger than its expected value, B is likely to be smaller than its expected value.\nIndependence: CovA,B = 0 but the converse is not true:\nSome pairs of random variables may have a covariance of 0 but are not independent. Only under some additional assumptions (e.g., the data follow multivariate normal distributions) does a covariance of 0 imply independence\nCorrelation coefficient:"},{"page":23,"text":"Formula (Using Summation)"},{"page":24,"text":"Co-Variance: An Example\n\nIt can be simplified in computation as\n\nSuppose two stocks A and B have the following values in one week:  (2, 5), (3, 8), (5, 10), (4, 11), (6, 14). \nQuestion:  If the stocks are affected by the same industry trends, will their prices rise or fall together?\nE(A) = (2 + 3 + 5 + 4 + 6)/ 5 = 20/5 = 4\nE(B) = (5 + 8 + 10 + 11 + 14) /5 = 48/5 = 9.6\nCov(A,B) = (2×5+3×8+5×10+4×11+6×14)/5 − 4 × 9.6 = 4\nThus, A and B rise together since Cov(A, B) > 0."}]},{"name":"Converted legacy slides / M3 DM.pptx","parts":[{"page":1,"text":"<number>\nData Mining: \u000b Concepts and Techniques\u000b (3rd ed.)\u000b\u000b— Chapter 3 —\nJiawei Han, Micheline Kamber, and Jian Pei\nUniversity of Illinois at Urbana-Champaign &\nSimon Fraser University\n©2011 Han, Kamber & Pei.  All rights reserved."},{"page":2,"text":"Module 3\n11/16/26\nData Mining: Concepts and Techniques\n<number>"},{"page":3,"text":"<number>\n<number>\nChapter 3: Data Preprocessing\nData Preprocessing: An Overview\nData Quality\nMajor Tasks in Data Preprocessing\nData Cleaning\nData Integration\nData Reduction\nData Transformation and Data Discretization\nSummary\n"},{"page":4,"text":"<number>\nData Quality: Why Preprocess the Data?\nMeasures for data quality: A multidimensional view\nAccuracy: correct or wrong, accurate or not\nCompleteness: not recorded, unavailable, …\nConsistency: some modified but some not, dangling, …\nTimeliness: timely update? \nBelievability: how trustable the data are correct?\nInterpretability: how easily the data can be understood?"},{"page":5,"text":"<number>\nMajor Tasks in Data Preprocessing\nData cleaning\nFill in missing values, smooth noisy data, identify or remove outliers, and resolve inconsistencies\nData integration\nIntegration of multiple databases, data cubes, or files\nData reduction\nDimensionality reduction\nNumerosity reduction\nData compression\nData transformation and data discretization\nNormalization \nConcept hierarchy generation"},{"page":6,"text":"<number>\n<number>\nChapter 3: Data Preprocessing\nData Preprocessing: An Overview\nData Quality\nMajor Tasks in Data Preprocessing\nData Cleaning\nData Integration\nData Reduction\nData Transformation and Data Discretization\nSummary\n"},{"page":7,"text":"<number>\nData Cleaning\nData in the Real World Is Dirty: Lots of potentially incorrect data, e.g., instrument faulty, human or computer error, transmission error\nincomplete: lacking attribute values, lacking certain attributes of interest, or containing only aggregate data\ne.g., Occupation=“ ” (missing data)\nnoisy: containing noise, errors, or outliers\ne.g., Salary=“−10” (an error)\ninconsistent: containing discrepancies in codes or names, e.g.,\nAge=“42”, Birthday=“03/07/2010”\nWas rating “1, 2, 3”, now rating “A, B, C”\ndiscrepancy between duplicate records\nIntentional (e.g., disguised missing data)\nJan. 1 as everyone’s birthday?"},{"page":8,"text":"<number>\nIncomplete (Missing) Data\nData is not always available\nE.g., many tuples have no recorded value for several attributes, such as customer income in sales data\nMissing data may be due to \nequipment malfunction\ninconsistent with other recorded data and thus deleted\ndata not entered due to misunderstanding\ncertain data may not be considered important at the time of entry\nnot register history or changes of the data\nMissing data may need to be inferred"},{"page":9,"text":"<number>\nHow to Handle Missing Data?\nIgnore the tuple: usually done when class label is missing (when doing classification)—not effective when the % of missing values per attribute varies considerably\nFill in the missing value manually: tedious + infeasible?\nFill in it automatically with\na global constant : e.g., “unknown”, a new class?! \nthe attribute mean\nthe attribute mean for all samples belonging to the same class: smarter\nthe most probable value: inference-based such as Bayesian formula or decision tree"},{"page":10,"text":"<number>\nNoisy Data\nNoise: random error or variance in a measured variable\nIncorrect attribute values may be due to\nfaulty data collection instruments\ndata entry problems\ndata transmission problems\ntechnology limitation\ninconsistency in naming convention \nOther data problems which require data cleaning\nduplicate records\nincomplete data\ninconsistent data"},{"page":11,"text":"<number>\nHow to Handle Noisy Data?\nBinning\nfirst sort data and partition into (equal-frequency) bins\nthen one can smooth by bin means,  smooth by bin median, smooth by bin boundaries, etc.\nRegression\nsmooth by fitting the data into regression functions\nClustering\ndetect and remove outliers\nCombined computer and human inspection\ndetect suspicious values and check by human (e.g., deal with possible outliers)"},{"page":12,"text":"<number>\nData Cleaning as a Process\nData discrepancy detection\nUse metadata (e.g., domain, range, dependency, distribution)\nCheck field overloading \nCheck uniqueness rule, consecutive rule and null rule\nUse commercial tools\nData scrubbing: use simple domain knowledge (e.g., postal code, spell-check) to detect errors and make corrections\nData auditing: by analyzing data to discover rules and relationship to detect violators (e.g., correlation and clustering to find outliers)\nData migration and integration\nData migration tools: allow transformations to be specified\nETL (Extraction/Transformation/Loading) tools: allow users to specify transformations through a graphical user interface\nIntegration of the two processes\nIterative and interactive (e.g., Potter’s Wheels)"},{"page":13,"text":"<number>\n<number>\nChapter 3: Data Preprocessing\nData Preprocessing: An Overview\nData Quality\nMajor Tasks in Data Preprocessing\nData Cleaning\nData Integration\nData Reduction\nData Transformation and Data Discretization\nSummary\n"},{"page":14,"text":"<number>\n<number>\nData Integration\nData integration: \nCombines data from multiple sources into a coherent store\nSchema integration: e.g., A.cust-id  B.cust-#\nIntegrate metadata from different sources\nEntity identification problem: \nIdentify real world entities from multiple data sources, e.g., Bill Clinton = William Clinton\nDetecting and resolving data value conflicts\nFor the same real world entity, attribute values from different sources are different\nPossible reasons: different representations, different scales, e.g., metric vs. British units"},{"page":15,"text":
