s</strong> on an eight-value signal. Fourier transforms instead emphasize global frequencies; wavelets localize changes by position and scale.</p>\n<h3>Attribute selection and generation</h3>\n<ul>\n<li><strong>Attribute subset selection:</strong> Forward selection, backward elimination, combined stepwise selection, tree-based importance. With d attributes there are <code>2ᵈ</code> possible subsets.</li>\n<li><strong>Feature generation:</strong> Make meaningful new attributes (e.g. <code>debt_to_income = debt/income</code>) to capture relationships.</li>\n</ul>\n<p><strong>Contrast:</strong> Feature <strong>selection</strong> retains some original dimensions; <strong>extraction</strong> (PCA) constructs different axes.</p>\n"},{"title":"Numerosity reduction and compression","short":"Shrinking rows and summaries, not just features.","body":"### Parametric representations\n**Linear regression:** Fit `y = wx+b` by least squares; a small set of parameters approximates many points. Multiple regression `y=b₀+b₁x₁+b₂x₂+…`. **Log-linear models** approximate discrete multi-attribute distributions using a compact set of parameters.\n\n### Non-parametric representations\n- **Histograms:** Group values into bins and store bucket counts/statistics.\n- **Clustering:** Store cluster representatives and memberships rather than inspecting every object.\n- **Sampling:** Select a representative subset; simple random sampling with/without replacement, cluster and stratified sampling.\n- **Data cube aggregation:** Summarize detailed data at higher levels (`day→month`, `city→country`).\n\n### Compression\n- **Lossless:** Reconstruct original data exactly (e.g. classical dictionary coding).\n- **Lossy:** Smaller representation with reconstruction error (e.g. dropping low-significance wavelet coefficients).\n\n**Exam differentiation:** Reducing columns = dimensionality reduction; replacing millions of records with cluster centroids = numerosity reduction; reducing encoded bytes = compression.","source":"M3 DM.ppt slides 37–49","exam":"","type":"core","html":"<h3>Parametric representations</h3>\n<p><strong>Linear regression:</strong> Fit <code>y = wx+b</code> by least squares; a small set of parameters approximates many points. Multiple regression <code>y=b₀+b₁x₁+b₂x₂+…</code>. <strong>Log-linear models</strong> approximate discrete multi-attribute distributions using a compact set of parameters.</p>\n<h3>Non-parametric representations</h3>\n<ul>\n<li><strong>Histograms:</strong> Group values into bins and store bucket counts/statistics.</li>\n<li><strong>Clustering:</strong> Store cluster representatives and memberships rather than inspecting every object.</li>\n<li><strong>Sampling:</strong> Select a representative subset; simple random sampling with/without replacement, cluster and stratified sampling.</li>\n<li><strong>Data cube aggregation:</strong> Summarize detailed data at higher levels (<code>day→month</code>, <code>city→country</code>).</li>\n</ul>\n<h3>Compression</h3>\n<ul>\n<li><strong>Lossless:</strong> Reconstruct original data exactly (e.g. classical dictionary coding).</li>\n<li><strong>Lossy:</strong> Smaller representation with reconstruction error (e.g. dropping low-significance wavelet coefficients).</li>\n</ul>\n<p><strong>Exam differentiation:</strong> Reducing columns = dimensionality reduction; replacing millions of records with cluster centroids = numerosity reduction; reducing encoded bytes = compression.</p>\n"},{"title":"Transformation and the exam answer template","short":"Smoothing, aggregation, scaling, construction, hierarchy.","body":"### Five transformations commonly named\n- **Smoothing:** Remove measurement noise using binning/regression/clusters.\n- **Aggregation:** Daily purchases → monthly totals; data-cube summaries.\n- **Generalization:** Low-level concepts → higher-level labels (`city→country`).\n- **Normalization:** Map numerical values to useful comparable scales.\n- **Attribute construction:** Derive a useful column from existing ones (`BMI=mass/height²`).\n\n**Exam structure for a 5-marker:** Give definition → motivation → name a method → demonstrate with tiny values → state limitation.\n\n### Direct problem-solving checklist\n**Missing data:** why missing + deletion/imputation.\n**Chi-square:** observed table → row/col totals → expected table → sum χ² → interpret.\n**Pearson:** calculate columns `x, y, x², y², xy` → formula → sign/strength.\n**Min–max:** write original bounds and new bounds.\n**Z-score:** state whether σ means population or sample SD.\n**Equal-width:** determine class boundaries before allocating data.\n**Equal-frequency:** sort data before allocating bins.","source":"M3 DM.ppt slides 51–63; CAT-I/CAT-II question papers","exam":"","type":"core","html":"<h3>Five transformations commonly named</h3>\n<ul>\n<li><strong>Smoothing:</strong> Remove measurement noise using binning/regression/clusters.</li>\n<li><strong>Aggregation:</strong> Daily purchases → monthly totals; data-cube summaries.</li>\n<li><strong>Generalization:</strong> Low-level concepts → higher-level labels (<code>city→country</code>).</li>\n<li><strong>Normalization:</strong> Map numerical values to useful comparable scales.</li>\n<li><strong>Attribute construction:</strong> Derive a useful column from existing ones (<code>BMI=mass/height²</code>).</li>\n</ul>\n<p><strong>Exam structure for a 5-marker:</strong> Give definition → motivation → name a method → demonstrate with tiny values → state limitation.</p>\n<h3>Direct problem-solving checklist</h3>\n<p><strong>Missing data:</strong> why missing + deletion/imputation.\n<strong>Chi-square:</strong> observed table → row/col totals → expected table → sum χ² → interpret.\n<strong>Pearson:</strong> calculate columns <code>x, y, x², y², xy</code> → formula → sign/strength.\n<strong>Min–max:</strong> write original bounds and new bounds.\n<strong>Z-score:</strong> state whether σ means population or sample SD.\n<strong>Equal-width:</strong> determine class boundaries before allocating data.\n<strong>Equal-frequency:</strong> sort data before allocating bins.</p>\n"}]},{"number":4,"title":"Frequent Pattern Mining","kicker":"CO-OCCURRENCE","description":"Apriori, FP-Growth, vertical TID sets and the logic of association rules.","accent":"#a47740","source":"DM CAT 2 NOTES / M4 DM: Association-Rule-Mining, FP GROWTH ALGORITHMS, M4 DM, supplementary DOCX","lessons":[{"title":"Transactions, itemsets and rules","short":"Support is frequency; confidence is conditional reliability.","body":"### Vocabulary\n- **Item:** Individual product/event, e.g. `Bread`.\n- **Transaction:** Set of items bought together, e.g. `T1={Milk,Bread}`.\n- **k-itemset:** Set of exactly k distinct items.\n- **Support count σ(X):** Number of transactions containing **all** items in X.\n- **Support fraction s(X):** `σ(X)/N` for N total transactions.\n- **Frequent itemset:** `σ(X) ≥ minimum support count` (or `s(X) ≥ minsup fraction`).\n- **Association rule:** `X → Y` with `X∩Y=∅`.\n\n### Three measures\n**Support(X→Y) = σ(X∪Y)/N**.\n**Confidence(X→Y) = σ(X∪Y)/σ(X) = P(Y|X)**.\n**Lift(X→Y) = confidence(X→Y)/support(Y)**.\n\n**Example:** 10 transactions; Bread appears 6, Milk 5, both 4:\n`support(B→M)=4/10=40%`;\n`confidence(B→M)=4/6≈66.7%`;\n`lift=(4/6)/(5/10)≈1.333`.\n\n**Lift > 1** means positive co-occurrence relative to independent baseline, **=1** no observed association, **<1** negative. This is **association, not causation**.\n\nAdditional measures in DOCX sources: **leverage = s(XY)−s(X)s(Y)** and **conviction = [1−s(Y)]/[1−confidence(X→Y)]** (infinite if confidence=1 with meaningful denominator).","source":"M4 DM.pptx slides 3–10; Association-Rule-Mining-.pptx slides 3–14","exam":"","type":"core","html":"<h3>Vocabulary</h3>\n<ul>\n<li><strong>Item:</strong> Individual product/event, e.g. <code>Bread</code>.</li>\n<li><strong>Transaction:</strong> Set of items bought together, e.g. <code>T1={Milk,Bread}</code>.</li>\n<li><strong>k-itemset:</strong> Set of exactly k distinct items.</li>\n<li><strong>Support count σ(X):</strong> Number of transactions containing <strong>all</strong> items in X.</li>\n<li><strong>Support fraction s(X):</strong> <code>σ(X)/N</code> for N total transactions.</li>\n<li><strong>Frequent itemset:</strong> <code>σ(X) ≥ minimum support count</code> (or <code>s(X) ≥ minsup fraction</code>).</li>\n<li><strong>Association rule:</strong> <code>X → Y</code> with <code>X∩Y=∅</code>.</li>\n</ul>\n<h3>Three measures</h3>\n<p><strong>Support(X→Y) = σ(X∪Y)/N</strong>.\n<strong>Confidence(X→Y) = σ(X∪Y)/σ(X) = P(Y|X)</strong>.\n<strong>Lift(X→Y) = confidence(X→Y)/support(Y)</strong>.</p>\n<p><strong>Example:</strong> 10 transactions; Bread appears 6, Milk 5, both 4:\n<code>support(B→M)=4/10=40%</code>;\n<code>confidence(B→M)=4/6≈66.7%</code>;\n<code>lift=(4/6)/(5/10)≈1.333</code>.</p>\n<p><strong>Lift &gt; 1</strong> means positive co-occurrence relative to independent baseline, <strong>=1</strong> no observed association, <strong>&lt;1</strong> negative. This is <strong>association, not causation</strong>.</p>\n<p>Additional measures in DOCX sources: <strong>leverage = s(XY)−s(X)s(Y)</strong> and <strong>conviction = [1−s(Y)]/[1−confidence(X→Y)]</strong> (infinite if confidence=1 with meaningful denominator).</p>\n"},{"title":"Frequent, closed and maximal itemsets","short":"Do not confuse these three sets.","body":"**Frequent itemset:** At least minsup transactions contain the set.\n\n**Closed frequent itemset:** Frequent set for which **no proper superset has exactly the same support**. It keeps enough information to reconstruct support counts of frequent subsets via closure.\n\n**Maximal frequent itemset:** Frequent set for which **no proper superset is frequent at all**. Saves more output but **loses support counts for subsets**.\n\n### Set relationship\n`Maximal frequent ⊆ Closed frequent ⊆ Frequent`.\n\n**Tiny counterexample:** Transactions `{A,B}`, `{A,B}`, `{A}` and minsup=2.\n- `A`: support 3, closed (no equal-support superset), **not maximal** because `{A,B}` frequent.\n- `{A,B}`: support 2, closed **and maximal**.\n- `B`: support 2, **not closed** because `{A,B}` also has support 2, not maximal.\n\n**Exam trick:** Check *all proper supersets*, not just one arbitrary extension. Maximal and closed have different definitions.","source":"Frequent Item set in Data set (Association Rule Mining).docx","exam":"","type":"core","html":"<p><strong>Frequent itemset:</strong> At least minsup transactions contain the set.</p>\n<p><strong>Closed frequent itemset:</strong> Frequent set for which <strong>no proper superset has exactly the same support</strong>. It keeps enough information to reconstruct support counts of frequent subsets via closure.</p>\n<p><strong>Maximal frequent itemset:</strong> Frequent set for which <strong>no proper superset is frequent at all</strong>. Saves more output but <strong>loses support counts for subsets</strong>.</p>\n<h3>Set relationship</h3>\n<p><code>Maximal frequent ⊆ Closed frequent ⊆ Frequent</code>.</p>\n<p><strong>Tiny counterexample:</strong> Transactions <code>{A,B}</code>, <code>{A,B}</code>, <code>{A}</code> and minsup=2.</p>\n<ul>\n<li><code>A</code>: support 3, closed (no equal-support superset), <strong>not maximal</strong> because <code>{A,B}</code> frequent.</li>\n<li><code>{A,B}</code>: support 2, closed <strong>and maximal</strong>.</li>\n<li><code>B</code>: support 2, <strong>not closed</strong> because <code>{A,B}</code> also has support 2, not maximal.</li>\n</ul>\n<p><strong>Exam trick:</strong> Check <em>all proper supersets</em>, not just one arbitrary extension. Maximal and closed have different definitions.</p>\n"},{"title":"Apriori: downward-closure principle","short":"If a subset is infrequent, every superset is infrequent.","body":"### Anti-monotone property\nIf `support(A)<minsup`, then any set `B⊃A` also has `support(B)<minsup`, because a transaction containing B must contain A.\n\n### Algorithm\n1. Scan dataset for frequent singletons `L₁`.\n2. **Join** `Lₖ₋₁` with itself to generate candidate sets `Cₖ`.\n3. **Prune** candidate c if **any** `(k−1)` subset of c is not in `Lₖ₋₁`.\n4. Scan transactions, count candidate support.\n5. Retain `Lₖ={c∈Cₖ:σ(c)≥minsup}`.\n6. Repeat until `Lₖ` empty.\n\nNotation: `Ck` candidate k-itemsets, `Lk` frequent k-itemsets.\n\n### Worked tiny dataset\n`T1={A,B,C}; T2={A,C}; T3={A,B}; T4={B,C}; T5={A,B,C}`. minsup=3.\n\n- `L₁`: A=4, B=4, C=4.\n- `C₂`: AB=3, AC=3, BC=3 → all in `L₂`.\n- `C₃`: ABC=2 → **not frequent**. Stop.\n\n**Apriori runs repeated scans** and candidate sets can explode when minsup is low or transactions are long.","source":"Association-Rule-Mining-.pptx slides 17–27","exam":"","type":"core","html":"<h3>Anti-monotone property</h3>\n<p>If <code>support(A)&lt;minsup</code>, then any set <code>B⊃A</code> also has <code>support(B)&lt;minsup</code>, because a transaction containing B must contain A.</p>\n<h3>Algorithm</h3>\n<ol>\n<li>Scan dataset for frequent singletons <code>L₁</code>.</li>\n<li><strong>Join</strong> <code>Lₖ₋₁</code> with itself to generate candidate sets <code>Cₖ</code>.</li>\n<li><strong>Prune</strong> candidate c if <strong>any</strong> <code>(k−1)</code> subset of c is not in <code>Lₖ₋₁</code>.</li>\n<li>Scan transactions, count candidate support.</li>\n<li>Retain <code>Lₖ={c∈Cₖ:σ(c)≥minsup}</code>.</li>\n<li>Repeat until <code>Lₖ</code> empty.</li>\n</ol>\n<p>Notation: <code>Ck</code> candidate k-itemsets, <code>Lk</code> frequent k-itemsets.</p>\n<h3>Worked tiny dataset</h3>\n<p><code>T1={A,B,C}; T2={A,C}; T3={A,B}; T4={B,C}; T5={A,B,C}</code>. minsup=3.</p>\n<ul>\n<li><code>L₁</code>: A=4, B=4, C=4.</li>\n<li><code>C₂</code>: AB=3, AC=3, BC=3 → all in <code>L₂</code>.</li>\n<li><code>C₃</code>: ABC=2 → <strong>not frequent</strong>. Stop.</li>\n</ul>\n<p><strong>Apriori runs repeated scans</strong> and candidate sets can explode when minsup is low or transactions are long.</p>\n\n<section class=\"imp-deepdive\"><div class=\"imp-depth-head\"><strong>★ EXAM-READY EXPANSION</strong><small>Source: Association-Rule-Mining-.pptx slides 17–28</small></div>\n<h3>Apriori: every step and what you write in an answer</h3><ol>\n<li>Write <b>minimum support count</b> = ceil(minimum support proportion × transaction count).</li>\n<li>Scan the database once for single-item supports. Keep <b>L1</b>: items satisfying minsup.</li>\n<li>Self-join L1 to generate candidate pairs <b>C2</b>; count candidates and retain frequent pairs <b>L2</b>.</li>\n<li>Self-join L2 to get candidate triples <b>C3</b>. If any two-item subset is not in L2, prune the triple <em>before</em> a support scan.</li>\n<li>Repeat for size k until no frequent k-itemsets remain.</li>\n<li>If asked for rules, generate A→B from frequent unions and test <b>confidence = support(A∪B) / support(A)</b>.</li></ol>\n<div class=\"imp-answer\"><b>Key proof:</b> Every transaction containing {A,B,C} also contains {A,B}. Therefore support({A,B,C}) ≤ support({A,B}). If {A,B} is below minsup, no superset containing it can be frequent.</div>\n<p><b>What not to do:</b> Never generate all 3-item candidates without checking their 2-item subsets; never confuse confidence with overall support; never count duplicate occurrences of the same item twice in one basket.</p></section>"},{"title":"Apriori candidate generation and speedups","short":"Join carefully; prune before counting.","body":"### Join example from lectures\nGiven `L₃={abc, abd, acd, ace, bcd}`, join compatible ordered triples (same first k−2 items) to propose 4-itemsets such as `abcd` and `acde`. **Prune** any candidate whose 3-subsets are not all frequent; e.g. `acde` fails if `ade` or `cde` is missing.\n\n### Efficiency ideas\n- **Hash-based candidate counting:** Buckets eliminate candidates that cannot meet minsup.\n- **Transaction reduction:** Skip a transaction once it cannot contain any further large candidates.\n- **Partitioning:** Mine local candidates, then verify globally.\n- **Sampling:** Get candidates from a representative subset, then check full data.\n- **Dynamic itemset counting:** Add selected candidates while scanning.\n- **AprioriTid / vertical structures:** Maintain occurrence lists to reduce repeated table scans.\n\nThe slides explicitly discuss **join**, **prune**, support counting bottlenecks and transaction reduction.\n\n**Why doesn't high confidence guarantee a strong rule?** A rule can have 100% confidence while covering just one transaction. Require minimum support too; lift additionally checks baseline prevalence.","source":"Association-Rule-Mining-.pptx slides 20–28; some efficiency approaches are textbook elaboration","exam":"","type":"core","html":"<h3>Join example from lectures</h3>\n<p>Given <code>L₃={abc, abd, acd, ace, bcd}</code>, join compatible ordered triples (same first k−2 items) to propose 4-itemsets such as <code>abcd</code> and <code>acde</code>. <strong>Prune</strong> any candidate whose 3-subsets are not all frequent; e.g. <code>acde</code> fails if <code>ade</code> or <code>cde</code> is missing.</p>\n<h3>Efficiency ideas</h3>\n<ul>\n<li><strong>Hash-based candidate counting:</strong> Buckets eliminate candidates that cannot meet minsup.</li>\n<li><strong>Transaction reduction:</strong> Skip a transaction once it cannot contain any further large candidates.</li>\n<li><strong>Partitioning:</strong> Mine local candidates, then verify globally.</li>\n<li><strong>Sampling:</strong> Get candidates from a representative subset, then check full data.</li>\n<li><strong>Dynamic itemset counting:</strong> Add selected candidates while scanning.</li>\n<li><strong>AprioriTid / vertical structures:</strong> Maintain occurrence lists to reduce repeated table scans.</li>\n</ul>\n<p>The slides explicitly discuss <strong>join</strong>, <strong>prune</strong>, support counting bottlenecks and transaction reduction.</p>\n<p><strong>Why doesn't high confidence guarantee a strong rule?</strong> A rule can have 100% confidence while covering just one transaction. Require minimum support too; lift additionally checks baseline prevalence.</p>\n\n<section class=\"imp-deepdive\"><div class=\"imp-depth-head\"><strong>★ EXAM-READY EXPANSION</strong><small>Source: Association-Rule-Mining-.pptx slides 20–28; original arithmetic</small></div>\n<h3>Full original Apriori candidate/pruning example</h3>\n<p><b>Six transactions:</b> T1=ABCD; T2=ABC; T3=ABD; T4=ACD; T5=ABC; T6=ABD. <b>Min support count=3.</b> Every listed transaction is treated as a set.</p>\n<div class=\"table-scroll\"><table><thead><tr><th>Pass</th><th>Candidates and counts</th><th>Keep</th></tr></thead><tbody>\n<tr><td>C1 → L1</td><td>A:6, B:5, C:4, D:4</td><td>A, B, C, D</td></tr>\n<tr><td>C2 → L2</td><td>AB:5, AC:4, AD:4, BC:3, BD:3, CD:2</td><td>AB, AC, AD, BC, BD; reject CD</td></tr>\n<tr><td>C3 → L3</td><td>ABC:3, ABD:3; ACD and BCD are <b>pruned</b> because CD was infrequent</td><td>ABC, ABD</td></tr>\n<tr><td>C4 → L4</td><td>ABCD fails because ACD/BCD are not frequent</td><td>None; stop</td></tr>\n</tbody></table></div>\n<p><b>Rule example:</b> B→A from AB: support=5/6=83.33%; confidence=5/5=100%. A→B has the <em>same support</em> but confidence=5/6=83.33%. At 80% min confidence, both pass. A→C has confidence 4/6=66.67%, so it fails even though AC is frequent.</p>\n<p><b>Answer format:</b> TID table → minsup count → C1/L1 → C2/L2 → C3/L3 → final frequent sets → optional strong rules.</p><p class=\"imp-practice\"><b>Practice:</b> Why is ACD pruned even without counting its support? Because its subset CD is not in L2.</p></section>"},{"title":"FP-Growth: the idea","short":"Compress frequent common prefixes; avoid candidate enumeration.","body":"FP-Growth is a **pattern-growth** alternative to Apriori. It compresses transactions into an **FP-tree** and recursively mines conditional databases.\n\n### Six steps in the supplied slides\n1. First scan: count singleton supports, discard infrequent items.\n2. Order remaining items by **descending global frequency**. Resolve ties consistently, e.g. lexicographically.\n3. Second scan: reorder each transaction; insert it into an **FP-tree**, incrementing shared prefix counts.\n4. For each suffix item, find its **conditional pattern base**: prefix paths ending at its occurrences, with path counts.\n5. Build the **conditional FP-tree** after dropping items with insufficient **conditional support**.\n6. Combine suffix with mined prefixes; recurse.\n\n**Why it works:** Frequent prefixes such as B→C are represented once with counters, rather than restated in every transaction. The header table/node links allow all occurrences of an item to be visited.\n\n**Critical exam detail:** There is no unique visual FP-tree when global support values tie. State your tie-breaking rule and use it consistently; frequent itemset support counts remain invariant.","source":"FP GROWTH ALGORITHMS.pptx slides 2–16","exam":"","type":"core","html":"<p>FP-Growth is a <strong>pattern-growth</strong> alternative to Apriori. It compresses transactions into an <strong>FP-tree</strong> and recursively mines conditional databases.</p>\n<h3>Six steps in the supplied slides</h3>\n<ol>\n<li>First scan: count singleton supports, discard infrequent items.</li>\n<li>Order remaining items by <strong>descending global frequency</strong>. Resolve ties consistently, e.g. lexicographically.</li>\n<li>Second scan: reorder each transaction; insert it into an <strong>FP-tree</strong>, incrementing shared prefix counts.</li>\n<li>For each suffix item, find its <strong>conditional pattern base</strong>: prefix paths ending at its occurrences, with path counts.</li>\n<li>Build the <strong>conditional FP-tree</strong> after dropping items with insufficient <strong>conditional support</strong>.</li>\n<li>Combine suffix with mined prefixes; recurse.</li>\n</ol>\n<p><strong>Why it works:</strong> Frequent prefixes such as B→C are represented once with counters, rather than restated in every transaction. The header table/node links allow all occurrences of an item to be visited.</p>\n<p><strong>Critical exam detail:</strong> There is no unique visual FP-tree when global support values tie. State your tie-breaking rule and use it consistently; frequent itemset support counts remain invariant.</p>\n\n<section class=\"imp-deepdive\"><div class=\"imp-depth-head\"><strong>★ EXAM-READY EXPANSION</strong><small>Source: FP GROWTH ALGORITHMS.pptx slides 2–16</small></div>\n<h3>FP-Growth: two scans, then conditional mining</h3>\n<p><b>Pass 1:</b> count singleton frequency, remove items below min support, sort frequent items in descending frequency (use a consistent tie-break rule).</p>\n<p><b>Pass 2:</b> reorder each transaction by that global item order; insert into the FP-tree. If a prefix already exists, increase the existing node counts. Otherwise create child nodes. Connect same-name nodes through a header-table link.</p>\n<p><b>Mining:</b> start from a suffix item; follow its linked nodes and collect all <em>prefix paths</em> with counts → its <b>conditional pattern base</b>. Count items in that base, drop those below minsup, build a <b>conditional FP-tree</b>, and recursively append frequent prefixes to the suffix.</p>\n<div class=\"imp-answer\"><b>Contrast:</b> Apriori generates explicit candidate itemsets and repeatedly scans the original database. FP-Growth compresses shared transaction prefixes and mines conditional patterns without generating every candidate combination.</div>\n<p><b>Five pitfalls:</b> inconsistent ordering for ties; forgetting node counts; including an item itself in its conditional prefix; using unweighted paths for conditional support; forgetting to list final itemsets.</p></section>"},{"title":"Construct the actual CAT-II FP-tree","short":"Eight transactions, minsup count = 3.","body":"### Dataset (30 September 2026 exam)\n`T101={I1,I2,I5}` · `T102={I2,I3,I4}` · `T103={I1,I2,I3}` · `T104={I1,I3,I5}` · `T105={I2,I3,I4,I5}` · `T106={I1,I2,I4}` · `T107={I1,I3,I5}` · `T108={I2,I3,I4}`.\n\n### Pass 1: singleton counts\n`I2=6, I3=6, I1=5, I4=4, I5=4` → **all frequent** for minsup=3.\n\nBreak frequency ties by ascending item ID:\n`I2 > I3 > I1 > I4 > I5`.\n\n### Pass 2: reorder each transaction\n| TID | Ordered items |\n|---|---|\n| T101 | I2, I1, I5 |\n| T102 | I2, I3, I4 |\n| T103 | I2, I3, I1 |\n| T104 | I3, I1, I5 |\n| T105 | I2, I3, I4, I5 |\n| T106 | I2, I1, I4 |\n| T107 | I3, I1, I5 |\n| T108 | I2, I3, I4 |\n\n### Final tree (indentation means child)\n```text\n∅\n├─ I2:6\n│  ├─ I1:2\n│  │  ├─ I5:1\n│  │  └─ I4:1\n│  └─ I3:4\n│     ├─ I4:3\n│     │  └─ I5:1\n│     └─ I1:1\n└─ I3:2\n   └─ I1:2\n      └─ I5:2\n```\n\n**Verify:** Sum counts of **all occurrences** of each item across branches = its global support.\nFor I5: `1+1+2=4`; for I1: `2+1+2=5`.","source":"CAT - II QP DM1 (1).pdf Q2; FP-Growth slides 4–14","exam":"Directly reproduces 10-mark 2026 CAT-II problem with explicit tie rule.","type":"core","html":"<h3>Dataset (30 September 2026 exam)</h3>\n<p><code>T101={I1,I2,I5}</code> · <code>T102={I2,I3,I4}</code> · <code>T103={I1,I2,I3}</code> · <code>T104={I1,I3,I5}</code> · <code>T105={I2,I3,I4,I5}</code> · <code>T106={I1,I2,I4}</code> · <code>T107={I1,I3,I5}</code> · <code>T108={I2,I3,I4}</code>.</p>\n<h3>Pass 1: singleton counts</h3>\n<p><code>I2=6, I3=6, I1=5, I4=4, I5=4</code> → <strong>all frequent</strong> for minsup=3.</p>\n<p>Break frequency ties by ascending item ID:\n<code>I2 &gt; I3 &gt; I1 &gt; I4 &gt; I5</code>.</p>\n<h3>Pass 2: reorder each transaction</h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>TID</th>\n  <th>Ordered items</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>T101</td>\n  <td>I2, I1, I5</td>\n</tr>\n<tr>\n  <td>T102</td>\n  <td>I2, I3, I4</td>\n</tr>\n<tr>\n  <td>T103</td>\n  <td>I2, I3, I1</td>\n</tr>\n<tr>\n  <td>T104</td>\n  <td>I3, I1, I5</td>\n</tr>\n<tr>\n  <td>T105</td>\n  <td>I2, I3, I4, I5</td>\n</tr>\n<tr>\n  <td>T106</td>\n  <td>I2, I1, I4</td>\n</tr>\n<tr>\n  <td>T107</td>\n  <td>I3, I1, I5</td>\n</tr>\n<tr>\n  <td>T108</td>\n  <td>I2, I3, I4</td>\n</tr>\n</tbody>\n</table></div>\n<h3>Final tree (indentation means child)</h3>\n<pre><code class=\"language-text\">∅\n├─ I2:6\n│  ├─ I1:2\n│  │  ├─ I5:1\n│  │  └─ I4:1\n│  └─ I3:4\n│     ├─ I4:3\n│     │  └─ I5:1\n│     └─ I1:1\n└─ I3:2\n   └─ I1:2\n      └─ I5:2\n</code></pre>\n<p><strong>Verify:</strong> Sum counts of <strong>all occurrences</strong> of each item across branches = its global support.\nFor I5: <code>1+1+2=4</code>; for I1: <code>2+1+2=5</code>.</p>\n\n<section class=\"imp-deepdive\"><div class=\"imp-depth-head\"><strong>★ EXAM-READY EXPANSION</strong><small>Source: CAT - II QP DM1 (1).pdf Q2; FP GROWTH ALGORITHMS.pptx</small></div>\n<h3>Reconstruct this FP-tree from scratch</h3>\n<p>There are <b>8 transactions, minsup count 3</b>. Global counts (from your faculty CAT): I2=6, I3=6, I1=5, I4=4, I5=4. With the documented item-ID tie-break: <b>I2 → I3 → I1 → I4 → I5</b>.</p>\n<p>Verify the first four sorted transactions before drawing: T101 = I2,I1,I5; T102 = I2,I3,I4; T103 = I2,I3,I1; T104 = I3,I1,I5. T104 starts a separate root branch because it has no I2.</p>\n<p><b>Marking checklist:</b> frequency count ✓ global sorting order ✓ reordered transaction list ✓ root branches and counts ✓ all terminal branches ✓ header-table explanation ✓. A tree with the correct items but incorrect branch counts is not a complete answer.</p></section>"},{"title":"Mine the frequent patterns from the CAT-II tree","short":"Conditional pattern bases → local frequent items → results.","body":"### Conditional pattern bases (from the tree above)\nEach prefix path is weighted by the suffix node's count.\n\n| Suffix | Conditional pattern base |\n|---|---|\n| I5 | `(I2,I1):1`, `(I2,I3,I4):1`, `(I3,I1):2` |\n| I4 | `(I2,I1):1`, `(I2,I3):3` |\n| I1 | `(I2):2`, `(I2,I3):1`, `(I3):2` |\n| I3 | `(I2):4` |\n\nWhen mining I5, weighted local supports are `I1:3, I3:3, I2:2, I4:1`; retain I1 and I3 for minsup=3, but their **joint** conditional support is only 2. So the suffix gives `{I1,I5}:3` and `{I3,I5}:3`.\n\n### Complete frequent itemsets (minsup 3)\n**1-itemsets:** `{I1}:5`, `{I2}:6`, `{I3}:6`, `{I4}:4`, `{I5}:4`.\n\n**2-itemsets:** `{I1,I2}:3`, `{I1,I3}:3`, `{I1,I5}:3`, `{I2,I3}:4`, `{I2,I4}:4`, `{I3,I4}:3`, `{I3,I5}:3`.\n\n**3-itemsets:** `{I2,I3,I4}:3`.\n\nNo frequent itemsets of size 4 or larger.\n\n### Exam verification\n`{I2,I3,I4}` appears in T102, T105 and T108 exactly → count 3. Show both the FP-tree **and** frequent-pattern output for full marks.\n\n**Subtlety:** Some lecture examples use **minsup=2** and a different nine-transaction database. **Never copy those support counts into the CAT-II minsup=3 question.**","source":"CAT - II QP DM1 (1).pdf Q2; computed from supplied transaction database","exam":"","type":"core","html":"<h3>Conditional pattern bases (from the tree above)</h3>\n<p>Each prefix path is weighted by the suffix node's count.</p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Suffix</th>\n  <th>Conditional pattern base</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>I5</td>\n  <td><code>(I2,I1):1</code>, <code>(I2,I3,I4):1</code>, <code>(I3,I1):2</code></td>\n</tr>\n<tr>\n  <td>I4</td>\n  <td><code>(I2,I1):1</code>, <code>(I2,I3):3</code></td>\n</tr>\n<tr>\n  <td>I1</td>\n  <td><code>(I2):2</code>, <code>(I2,I3):1</code>, <code>(I3):2</code></td>\n</tr>\n<tr>\n  <td>I3</td>\n  <td><code>(I2):4</code></td>\n</tr>\n</tbody>\n</table></div>\n<p>When mining I5, weighted local supports are <code>I1:3, I3:3, I2:2, I4:1</code>; retain I1 and I3 for minsup=3, but their <strong>joint</strong> conditional support is only 2. So the suffix gives <code>{I1,I5}:3</code> and <code>{I3,I5}:3</code>.</p>\n<h3>Complete frequent itemsets (minsup 3)</h3>\n<p><strong>1-itemsets:</strong> <code>{I1}:5</code>, <code>{I2}:6</code>, <code>{I3}:6</code>, <code>{I4}:4</code>, <code>{I5}:4</code>.</p>\n<p><strong>2-itemsets:</strong> <code>{I1,I2}:3</code>, <code>{I1,I3}:3</code>, <code>{I1,I5}:3</code>, <code>{I2,I3}:4</code>, <code>{I2,I4}:4</code>, <code>{I3,I4}:3</code>, <code>{I3,I5}:3</code>.</p>\n<p><strong>3-itemsets:</strong> <code>{I2,I3,I4}:3</code>.</p>\n<p>No frequent itemsets of size 4 or larger.</p>\n<h3>Exam verification</h3>\n<p><code>{I2,I3,I4}</code> appears in T102, T105 and T108 exactly → count 3. Show both the FP-tree <strong>and</strong> frequent-pattern output for full marks.</p>\n<p><strong>Subtlety:</strong> Some lecture examples use <strong>minsup=2</strong> and a different nine-transaction database. <strong>Never copy those support counts into the CAT-II minsup=3 question.</strong></p>\n\n<section class=\"imp-deepdive\"><div class=\"imp-depth-head\"><strong>★ EXAM-READY EXPANSION</strong><small>Source: CAT - II QP DM1 (1).pdf Q2; conditional mining computed from those transactions</small></div>\n<h3>Conditional mining — one suffix, fully explained</h3>\n<p>Take suffix <b>I5</b> in the faculty FP-tree. The conditional prefixes (weighted by suffix count) are <code>(I2,I1):1</code>, <code>(I2,I3,I4):1</code>, <code>(I3,I1):2</code>.</p>\n<ol><li>Count items across these weighted paths: I1=1+2=3; I3=1+2=3; I2=1+1=2; I4=1.</li>\n<li>With minsup 3, retain only I1 and I3 in the conditional base.</li>\n<li>I1 and I3 together appear in only two of the weighted prefixes, so the triple {I1,I3,I5} is <b>not</b> frequent.</li>\n<li>Append the suffix: frequent pairs are <b>{I1,I5}:3</b> and <b>{I3,I5}:3</b>.</li></ol>\n<p><b>Exam trap:</b> Count prefixes with their path weights, not the number of drawn nodes. Repeat this mining for the other suffix items to list <em>all</em> frequent itemsets, including a possible frequent triple.</p></section>"},{"title":"Vertical mining: TID-set intersections","short":"Turn transactions into lists of transaction IDs.","body":"### Horizontal vs vertical storage\n**Horizontal:** `T1 → {A,B,C}`; one row per transaction.\n\n**Vertical:** `A → {T1,T2,T5}`, `B → {T1,T3,T5}`, etc.; one list of transaction IDs per item.\n\nTo get the TID set of `AB`, compute **TID(A) ∩ TID(B)**. Its set size is support count. ECLAT (Equivalence-Class Transformation) recursively intersects TID sets in a depth-first search.\n\n**Example:** \n`A:{1,2,3,5}`, `B:{1,3,4,5}`, `C:{1,2,4,5}`.\n`AB={1,3,5}` count 3; `AC={1,2,5}` count 3; `BC={1,4,5}` count 3; `ABC={1,5}` count 2.\n\nFor minsup=3, all pairs are frequent but triple is not.\n\n### Comparison\n- **Apriori:** Frequent joins with horizontal transaction counting; costly many passes.\n- **FP-Growth:** Compress into an FP-tree; mine conditional trees.\n- **Vertical / ECLAT:** Intersect transaction-ID lists; efficient when list representations and intersections are manageable.\n\n**Pitfall:** Intersection of **item sets** is not the operation; intersect **sets of transaction IDs**.\n\n### Full worked ECLAT problem from the professor’s image-only handout\nThe handout uses **nine transactions**, with **minimum support count = 2**:\n\n| TID | Items |\n|---|---|\n| T100 | I1, I2, I5 |\n| T200 | I2, I4 |\n| T300 | I2, I3 |\n| T400 | I1, I2, I4 |\n| T500 | I1, I3 |\n| T600 | I2, I3 |\n| T700 | I1, I3 |\n| T800 | I1, I2, I3, I5 |\n| T900 | I1, I2, I3 |\n\n**Step 1 — transpose transactions into vertical TID sets.**\n\n- I1 = {T100, T400, T500, T700, T800, T900} → **support 6**.\n- I2 = {T100, T200, T300, T400, T600, T800, T900} → **support 7**.\n- I3 = {T300, T500, T600, T700, T800, T900} → **support 6**.\n- I4 = {T200, T400} → **support 2**.\n- I5 = {T100, T800} → **support 2**.\n\n**Step 2 — intersect TID sets to generate frequent pairs.**\n\n| Itemset | Intersection result | Support | Frequent? |\n|---|---|---:|---|\n| I1,I2 | T100, T400, T800, T900 | 4 | ✓ |\n| I1,I3 | T500, T700, T800, T900 | 4 | ✓ |\n| I1,I5 | T100, T800 | 2 | ✓ |\n| I2,I3 | T300, T600, T800, T900 | 4 | ✓ |\n| I2,I4 | T200, T400 | 2 | ✓ |\n| I2,I5 | T100, T800 | 2 | ✓ |\n| I1,I4 | T400 | 1 | ✗ |\n| I3,I5 | T800 | 1 | ✗ |\n\nOther pairs involving I4 have support zero.\n\n**Step 3 — intersect frequent pairs with a compatible singleton.**\n- {I1,I2,I3} = TID(I1,I2) ∩ TID(I3) = **{T800,T900}**, support **2**.\n- {I1,I2,I5} = TID(I1,I2) ∩ TID(I5) = **{T100,T800}**, support **2**.\n- There are **two frequent 3-itemsets**; no frequent 4-itemset survives.\n\n**Mark-scoring trick:** Show every intermediate TID intersection, compare its cardinality against minsup, and prune any supersets of infrequent candidates.\n","source":"Mining frequent item sets.docx pp. 1–2 (image-only worked TID-set example); ACP Module 4","exam":"","type":"core","html":"<h3>Horizontal vs vertical storage</h3>\n<p><strong>Horizontal:</strong> <code>T1 → {A,B,C}</code>; one row per transaction.</p>\n<p><strong>Vertical:</strong> <code>A → {T1,T2,T5}</code>, <code>B → {T1,T3,T5}</code>, etc.; one list of transaction IDs per item.</p>\n<p>To get the TID set of <code>AB</code>, compute <strong>TID(A) ∩ TID(B)</strong>. Its set size is support count. ECLAT (Equivalence-Class Transformation) recursively intersects TID sets in a depth-first search.</p>\n<p><strong>Example:</strong>\n<code>A:{1,2,3,5}</code>, <code>B:{1,3,4,5}</code>, <code>C:{1,2,4,5}</code>.\n<code>AB={1,3,5}</code> count 3; <code>AC={1,2,5}</code> count 3; <code>BC={1,4,5}</code> count 3; <code>ABC={1,5}</code> count 2.</p>\n<p>For minsup=3, all pairs are frequent but triple is not.</p>\n<h3>Comparison</h3>\n<ul>\n<li><strong>Apriori:</strong> Frequent joins with horizontal transaction counting; costly many passes.</li>\n<li><strong>FP-Growth:</strong> Compress into an FP-tree; mine conditional trees.</li>\n<li><strong>Vertical / ECLAT:</strong> Intersect transaction-ID lists; efficient when list representations and intersections are manageable.</li>\n</ul>\n<p><strong>Pitfall:</strong> Intersection of <strong>item sets</strong> is not the operation; intersect <strong>sets of transaction IDs</strong>.</p>\n<h3>Full worked ECLAT problem from the professor’s image-only handout</h3>\n<p>The handout uses <strong>nine transactions</strong>, with <strong>minimum support count = 2</strong>:</p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>TID</th>\n  <th>Items</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>T100</td>\n  <td>I1, I2, I5</td>\n</tr>\n<tr>\n  <td>T200</td>\n  <td>I2, I4</td>\n</tr>\n<tr>\n  <td>T300</td>\n  <td>I2, I3</td>\n</tr>\n<tr>\n  <td>T400</td>\n  <td>I1, I2, I4</td>\n</tr>\n<tr>\n  <td>T500</td>\n  <td>I1, I3</td>\n</tr>\n<tr>\n  <td>T600</td>\n  <td>I2, I3</td>\n</tr>\n<tr>\n  <td>T700</td>\n  <td>I1, I3</td>\n</tr>\n<tr>\n  <td>T800</td>\n  <td>I1, I2, I3, I5</td>\n</tr>\n<tr>\n  <td>T900</td>\n  <td>I1, I2, I3</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Step 1 — transpose transactions into vertical TID sets.</strong></p>\n<ul>\n<li>I1 = {T100, T400, T500, T700, T800, T900} → <strong>support 6</strong>.</li>\n<li>I2 = {T100, T200, T300, T400, T600, T800, T900} → <strong>support 7</strong>.</li>\n<li>I3 = {T300, T500, T600, T700, T800, T900} → <strong>support 6</strong>.</li>\n<li>I4 = {T200, T400} → <strong>support 2</strong>.</li>\n<li>I5 = {T100, T800} → <strong>support 2</strong>.</li>\n</ul>\n<p><strong>Step 2 — intersect TID sets to generate frequent pairs.</strong></p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Itemset</th>\n  <th>Intersection result</th>\n  <th style=\"text-align:right\">Support</th>\n  <th>Frequent?</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>I1,I2</td>\n  <td>T100, T400, T800, T900</td>\n  <td style=\"text-align:right\">4</td>\n  <td>✓</td>\n</tr>\n<tr>\n  <td>I1,I3</td>\n  <td>T500, T700, T800, T900</td>\n  <td style=\"text-align:right\">4</td>\n  <td>✓</td>\n</tr>\n<tr>\n  <td>I1,I5</td>\n  <td>T100, T800</td>\n  <td style=\"text-align:right\">2</td>\n  <td>✓</td>\n</tr>\n<tr>\n  <td>I2,I3</td>\n  <td>T300, T600, T800, T900</td>\n  <td style=\"text-align:right\">4</td>\n  <td>✓</td>\n</tr>\n<tr>\n  <td>I2,I4</td>\n  <td>T200, T400</td>\n  <td style=\"text-align:right\">2</td>\n  <td>✓</td>\n</tr>\n<tr>\n  <td>I2,I5</td>\n  <td>T100, T800</td>\n  <td style=\"text-align:right\">2</td>\n  <td>✓</td>\n</tr>\n<tr>\n  <td>I1,I4</td>\n  <td>T400</td>\n  <td style=\"text-align:right\">1</td>\n  <td>✗</td>\n</tr>\n<tr>\n  <td>I3,I5</td>\n  <td>T800</td>\n  <td style=\"text-align:right\">1</td>\n  <td>✗</td>\n</tr>\n</tbody>\n</table></div>\n<p>Other pairs involving I4 have support zero.</p>\n<p><strong>Step 3 — intersect frequent pairs with a compatible singleton.</strong></p>\n<ul>\n<li>{I1,I2,I3} = TID(I1,I2) ∩ TID(I3) = <strong>{T800,T900}</strong>, support <strong>2</strong>.</li>\n<li>{I1,I2,I5} = TID(I1,I2) ∩ TID(I5) = <strong>{T100,T800}</strong>, support <strong>2</strong>.</li>\n<li>There are <strong>two frequent 3-itemsets</strong>; no frequent 4-itemset survives.</li>\n</ul>\n<p><strong>Mark-scoring trick:</strong> Show every intermediate TID intersection, compare its cardinality against minsup, and prune any supersets of infrequent candidates.</p>\n"},{"title":"Generate rules from frequent itemsets","short":"Support belongs to union; confidence has direction.","body":"From frequent itemset `F`, enumerate all nonempty proper subsets `X` and form rules `X → F\\X`. For each:\n\n`confidence(X→Y) = σ(X∪Y)/σ(X)`; retain if at least minconf.\n\n**Example:** In the CAT-II dataset, `{I2,I3,I4}:3`, `{I2,I3}:4`, `{I3,I4}:3`, `{I2,I4}:4`, and `{I4}:4`.\n\n- `I2,I3 → I4`: confidence `3/4 = 75%`.\n- `I3,I4 → I2`: confidence `3/3 = 100%`.\n- `I4 → I2,I3`: confidence `3/4 = 75%`.\n\n**Same support** (3/8 =37.5%) for all three rules, because union is the same; **different confidence** because antecedent differs.\n\n**Lift example:** `I3,I4 → I2` has confidence=1 and support(I2)=6/8=0.75 → lift=`1/0.75=1.333`.\n\n**Rule direction matters:** Generally `confidence(X→Y) ≠ confidence(Y→X)` even though their support fractions are equal.","source":"Association-Rule-Mining-.pptx slides 9–19; CAT - II QP DM1 (1).pdf Q2","exam":"","type":"core","html":"<p>From frequent itemset <code>F</code>, enumerate all nonempty proper subsets <code>X</code> and form rules <code>X → F\\X</code>. For each:</p>\n<p><code>confidence(X→Y) = σ(X∪Y)/σ(X)</code>; retain if at least minconf.</p>\n<p><strong>Example:</strong> In the CAT-II dataset, <code>{I2,I3,I4}:3</code>, <code>{I2,I3}:4</code>, <code>{I3,I4}:3</code>, <code>{I2,I4}:4</code>, and <code>{I4}:4</code>.</p>\n<ul>\n<li><code>I2,I3 → I4</code>: confidence <code>3/4 = 75%</code>.</li>\n<li><code>I3,I4 → I2</code>: confidence <code>3/3 = 100%</code>.</li>\n<li><code>I4 → I2,I3</code>: confidence <code>3/4 = 75%</code>.</li>\n</ul>\n<p><strong>Same support</strong> (3/8 =37.5%) for all three rules, because union is the same; <strong>different confidence</strong> because antecedent differs.</p>\n<p><strong>Lift example:</strong> <code>I3,I4 → I2</code> has confidence=1 and support(I2)=6/8=0.75 → lift=<code>1/0.75=1.333</code>.</p>\n<p><strong>Rule direction matters:</strong> Generally <code>confidence(X→Y) ≠ confidence(Y→X)</code> even though their support fractions are equal.</p>\n"},{"title":"Re-CAT FP-Growth — second solved dataset","short":"A different tie-consistent tree and all frequent sets.","body":"### 22 October 2026 re-CAT question\n`T201={A,B,D}`, `T202={B,C,E}`, `T203={A,B,C}`, `T204={A,C,D}`, `T205={B,C,D,E}`, `T206={A,B,E}`, `T207={A,C,D}`, `T208={B,C,E}`; minsup=3.\n\n**Counts:** B=6, C=6, A=5, D=4, E=4. Stable global order: **B, C, A, D, E**.\n\n### Final FP-tree\n```text\n∅\n├─ B:6\n│  ├─ A:2\n│  │  ├─ D:1\n│  │  └─ E:1\n│  └─ C:4\n│     ├─ E:2\n│     └─ A:1\n│        └─ D:1\n│           └─ E:1\n└─ C:2\n   └─ A:2\n      └─ D:2\n```\n\n**Frequent pairs:** `AB:3`, `AC:3`, `AD:3`, `BC:4`, `BE:4`, `CD:3`, `CE:3`.\n\n**Frequent triple:** `BCE:3`. All singletons frequent; no other triple reaches support 3.\n\n**Why two exam questions look alike:** Same count profile (6,6,5,4,4) but **different item co-occurrence structure**. You still must build the tree from the exact transactions.","source":"CAT - II recatQP DM1 (1).pdf Q2; computed from supplied transactions","exam":"","type":"core","html":"<h3>22 October 2026 re-CAT question</h3>\n<p><code>T201={A,B,D}</code>, <code>T202={B,C,E}</code>, <code>T203={A,B,C}</code>, <code>T204={A,C,D}</code>, <code>T205={B,C,D,E}</code>, <code>T206={A,B,E}</code>, <code>T207={A,C,D}</code>, <code>T208={B,C,E}</code>; minsup=3.</p>\n<p><strong>Counts:</strong> B=6, C=6, A=5, D=4, E=4. Stable global order: <strong>B, C, A, D, E</strong>.</p>\n<h3>Final FP-tree</h3>\n<pre><code class=\"language-text\">∅\n├─ B:6\n│  ├─ A:2\n│  │  ├─ D:1\n│  │  └─ E:1\n│  └─ C:4\n│     ├─ E:2\n│     └─ A:1\n│        └─ D:1\n│           └─ E:1\n└─ C:2\n   └─ A:2\n      └─ D:2\n</code></pre>\n<p><strong>Frequent pairs:</strong> <code>AB:3</code>, <code>AC:3</code>, <code>AD:3</code>, <code>BC:4</code>, <code>BE:4</code>, <code>CD:3</code>, <code>CE:3</code>.</p>\n<p><strong>Frequent triple:</strong> <code>BCE:3</code>. All singletons frequent; no other triple reaches support 3.</p>\n<p><strong>Why two exam questions look alike:</strong> Same count profile (6,6,5,4,4) but <strong>different item co-occurrence structure</strong>. You still must build the tree from the exact transactions.</p>\n"}]},{"number":5,"title":"Classification & Evaluation","kicker":"SUPERVISED LEARNING","description":"Decision trees, Bayes, lazy learners, validation, metrics and ensembles.","accent":"#a05f70","source":"DM CAT 2 NOTES / M5 DM: Classification, M5 CLASSIFICATION & DT, BBN, Model Evaluation","lessons":[{"title":"Classification vs regression and the two-step process","short":"First learn the model, then test and use it.","body":"**Classification** predicts a **categorical** class such as `loan=approved/rejected`. **Regression/numerical prediction** estimates a **continuous quantity** such as `maximum loan amount`.\n\n### Step 1 — Model construction (training)\nUse labeled tuples `(features X, class y)`. Clean and prepare the training data, then learn a model that maps X → y (decision tree, Bayes, kNN etc.).\n\n### Step 2 — Model usage / prediction\nEvaluate on **unseen data** (held-out data or cross-validation) and apply the learned model to new examples. Evaluate both correctness and practical reliability.\n\n**Actual CAT-II scenario:** Historical income, credit, liabilities and prior outcomes → model to predict **risk category** (classification) and **maximum loan amount** (regression). Reliability is assessed with data not used in fitting.\n\n### Supervised vs unsupervised\nClassification has class labels during training; clustering does not. Do not evaluate a classifier only on training records—the model might memorize them.\n\n**Data preparation:** Clean missing values, relevance and redundancy analysis, feature selection, suitable transformation, then careful train/test isolation.","source":"Classification.pptx slides 3–7; CLASSIFICATION VS PREDICTION.pptx slides 1–8; CAT-II Q4","exam":"2026 CAT-II Q4 is a 10-mark theory/application question.","type":"core","html":"<p><strong>Classification</strong> predicts a <strong>categorical</strong> class such as <code>loan=approved/rejected</code>. <strong>Regression/numerical prediction</strong> estimates a <strong>continuous quantity</strong> such as <code>maximum loan amount</code>.</p>\n<h3>Step 1 — Model construction (training)</h3>\n<p>Use labeled tuples <code>(features X, class y)</code>. Clean and prepare the training data, then learn a model that maps X → y (decision tree, Bayes, kNN etc.).</p>\n<h3>Step 2 — Model usage / prediction</h3>\n<p>Evaluate on <strong>unseen data</strong> (held-out data or cross-validation) and apply the learned model to new examples. Evaluate both correctness and practical reliability.</p>\n<p><strong>Actual CAT-II scenario:</strong> Historical income, credit, liabilities and prior outcomes → model to predict <strong>risk category</strong> (classification) and <strong>maximum loan amount</strong> (regression). Reliability is assessed with data not used in fitting.</p>\n<h3>Supervised vs unsupervised</h3>\n<p>Classification has class labels during training; clustering does not. Do not evaluate a classifier only on training records—the model might memorize them.</p>\n<p><strong>Data preparation:</strong> Clean missing values, relevance and redundancy analysis, feature selection, suitable transformation, then careful train/test isolation.</p>\n"},{"title":"ID3 — entropy and information gain","short":"Choose the feature that reduces uncertainty the most.","body":"### Entropy\nFor binary classes with positive fraction p and negative fraction 1−p:\n\n**H(D) = −p·log₂(p) − (1−p)·log₂(1−p)**.\n\nGeneral: `H(D) = −Σᵢ pᵢ log₂ pᵢ`, with `0 log 0 = 0`.\n\n- All one class → entropy **0** (pure).\n- 50% yes, 50% no → entropy **1 bit**.\n- 3 yes, 1 no → `−0.75log₂0.75−0.25log₂0.25 ≈ 0.8113`.\n\n### Weighted entropy after a split\nFor candidate attribute A with branches v:\n\n**Infoₐ(D) = Σᵥ (|Dᵥ|/|D|) · H(Dᵥ)**.\n\n**Gain(A) = H(D) − Infoₐ(D)**. Choose the **largest information gain** at each node.\n\n### ID3 algorithm\n1. If all samples have the same class → create leaf.\n2. If no attributes remain → majority-class leaf.\n3. Compute gains for available attributes.\n4. Choose highest gain as test node.\n5. Partition data by attribute values; recurse on each subset.\n6. Handle empty branches with parent majority class.\n\n**Critical detail:** After choosing an attribute for a branch, recompute entropy and gain **on that branch's rows only**, not the original dataset. Basic ID3 creates categorical multiway splits; extensions handle continuous features.","source":"Classification.pptx slides 9–14; M5 CLASSIFICATION & DT.pptx slides 8–18","exam":"High priority: full ID3 numerical in both 2026 CAT-II papers.","type":"core","html":"<h3>Entropy</h3>\n<p>For binary classes with positive fraction p and negative fraction 1−p:</p>\n<p><strong>H(D) = −p·log₂(p) − (1−p)·log₂(1−p)</strong>.</p>\n<p>General: <code>H(D) = −Σᵢ pᵢ log₂ pᵢ</code>, with <code>0 log 0 = 0</code>.</p>\n<ul>\n<li>All one class → entropy <strong>0</strong> (pure).</li>\n<li>50% yes, 50% no → entropy <strong>1 bit</strong>.</li>\n<li>3 yes, 1 no → <code>−0.75log₂0.75−0.25log₂0.25 ≈ 0.8113</code>.</li>\n</ul>\n<h3>Weighted entropy after a split</h3>\n<p>For candidate attribute A with branches v:</p>\n<p><strong>Infoₐ(D) = Σᵥ (|Dᵥ|/|D|) · H(Dᵥ)</strong>.</p>\n<p><strong>Gain(A) = H(D) − Infoₐ(D)</strong>. Choose the <strong>largest information gain</strong> at each node.</p>\n<h3>ID3 algorithm</h3>\n<ol>\n<li>If all samples have the same class → create leaf.</li>\n<li>If no attributes remain → majority-class leaf.</li>\n<li>Compute gains for available attributes.</li>\n<li>Choose highest gain as test node.</li>\n<li>Partition data by attribute values; recurse on each subset.</li>\n<li>Handle empty branches with parent majority class.</li>\n</ol>\n<p><strong>Critical detail:</strong> After choosing an attribute for a branch, recompute entropy and gain <strong>on that branch's rows only</strong>, not the original dataset. Basic ID3 creates categorical multiway splits; extensions handle continuous features.</p>\n"},{"title":"ID3 exam solution: cardiac risk","short":"Eight patient records — every root gain, final tree and prediction.","body":"### Data from 30 September 2026 CAT-II\n8 patients, target `Risk`: **4 Yes, 4 No** → `H(D)=1`.\n\n| Attribute | Weighted child entropy | Information gain |\n|---|---:|---:|\n| **Age Group** | `(3/8)H(0/3)+(3/8)H(2/3)+(2/8)H(2/2)` = **0.34436** | **0.65564** |\n| Exercise Level | `(4/8)H(1/4)+(4/8)H(3/4)` = **0.81128** | **0.18872** |\n| Cholesterol | `(4/8)H(1/4)+(4/8)H(3/4)` = **0.81128** | **0.18872** |\n\nRoot = **Age Group**, because 0.65564 is largest.\n\n### Recurse on the impure Middle branch\n**Young** → all No. **Old** → all Yes. **Middle** has 1 No, 2 Yes, `H≈0.91830`.\n\nWithin Middle:\n- Exercise High: P4 → No (pure).\n- Exercise Low: P5,P6 → Yes (pure).\nThus Exercise gives gain `0.91830−0=0.91830`.\n\n### Final decision tree\n```text\nAge Group?\n├─ Young → No\n├─ Old   → Yes\n└─ Middle\n   └─ Exercise?\n      ├─ High → No\n      └─ Low  → Yes\n```\n\n**Predict:** Young, Low Exercise, High Cholesterol → **No cardiac risk** in this learned toy model because `Young` ends at a pure No leaf.\n\n**Exam writing:** Show target counts and H, gain of each candidate, best root, branch-specific gain, labeled tree, and final prediction.","source":"CAT - II QP DM1 (1).pdf Q5; independently checked calculations","exam":"","type":"core","html":"<h3>Data from 30 September 2026 CAT-II</h3>\n<p>8 patients, target <code>Risk</code>: <strong>4 Yes, 4 No</strong> → <code>H(D)=1</code>.</p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Attribute</th>\n  <th style=\"text-align:right\">Weighted child entropy</th>\n  <th style=\"text-align:right\">Information gain</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td><strong>Age Group</strong></td>\n  <td style=\"text-align:right\"><code>(3/8)H(0/3)+(3/8)H(2/3)+(2/8)H(2/2)</code> = <strong>0.34436</strong></td>\n  <td style=\"text-align:right\"><strong>0.65564</strong></td>\n</tr>\n<tr>\n  <td>Exercise Level</td>\n  <td style=\"text-align:right\"><code>(4/8)H(1/4)+(4/8)H(3/4)</code> = <strong>0.81128</strong></td>\n  <td style=\"text-align:right\"><strong>0.18872</strong></td>\n</tr>\n<tr>\n  <td>Cholesterol</td>\n  <td style=\"text-align:right\"><code>(4/8)H(1/4)+(4/8)H(3/4)</code> = <strong>0.81128</strong></td>\n  <td style=\"text-align:right\"><strong>0.18872</strong></td>\n</tr>\n</tbody>\n</table></div>\n<p>Root = <strong>Age Group</strong>, because 0.65564 is largest.</p>\n<h3>Recurse on the impure Middle branch</h3>\n<p><strong>Young</strong> → all No. <strong>Old</strong> → all Yes. <strong>Middle</strong> has 1 No, 2 Yes, <code>H≈0.91830</code>.</p>\n<p>Within Middle:</p>\n<ul>\n<li>Exercise High: P4 → No (pure).</li>\n<li>Exercise Low: P5,P6 → Yes (pure).\nThus Exercise gives gain <code>0.91830−0=0.91830</code>.</li>\n</ul>\n<h3>Final decision tree</h3>\n<pre><code class=\"language-text\">Age Group?\n├─ Young → No\n├─ Old   → Yes\n└─ Middle\n   └─ Exercise?\n      ├─ High → No\n      └─ Low  → Yes\n</code></pre>\n<p><strong>Predict:</strong> Young, Low Exercise, High Cholesterol → <strong>No cardiac risk</strong> in this learned toy model because <code>Young</code> ends at a pure No leaf.</p>\n<p><strong>Exam writing:</strong> Show target counts and H, gain of each candidate, best root, branch-specific gain, labeled tree, and final prediction.</p>\n"},{"title":"ID3 re-CAT solution: loan approval","short":"Same math, different features, final decision tree.","body":"### Eight records, four Yes / four No\n`H(Loan Approved)=1`.\n\n| Candidate feature | Expected entropy | Gain |\n|---|---:|---:|\n| Income Group | `(3/8)·0+(3/8)·0.91830+(2/8)·0 = 0.34436` | **0.65564** |\n| Credit Score | `(5/8)·0.97095+(3/8)·0.91830 = 0.95121` | **0.04879** |\n| Employment Status | `(4/8)·0.81128+(4/8)·0.81128 = 0.81128` | **0.18872** |\n\nSo choose **Income Group**.\n\n- High income: 3 Yes → pure Yes leaf.\n- Low income: 2 No → pure No leaf.\n- Medium: 1 Yes, 2 No. Split by Employment Status: Permanent → Yes, Temporary → No, giving pure leaves.\n\n```text\nIncome Group?\n├─ High   → Yes\n├─ Low    → No\n└─ Medium\n   └─ Employment Status?\n      ├─ Permanent → Yes\n      └─ Temporary → No\n```\n\n**Prediction:** Low Income, Poor Credit, Permanent Employment → **No**. The Low branch is already pure; credit/employment don't need testing.","source":"CAT - II recatQP DM1 (1).pdf Q5; independently checked calculations","exam":"","type":"core","html":"<h3>Eight records, four Yes / four No</h3>\n<p><code>H(Loan Approved)=1</code>.</p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Candidate feature</th>\n  <th style=\"text-align:right\">Expected entropy</th>\n  <th style=\"text-align:right\">Gain</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Income Group</td>\n  <td style=\"text-align:right\"><code>(3/8)·0+(3/8)·0.91830+(2/8)·0 = 0.34436</code></td>\n  <td style=\"text-align:right\"><strong>0.65564</strong></td>\n</tr>\n<tr>\n  <td>Credit Score</td>\n  <td style=\"text-align:right\"><code>(5/8)·0.97095+(3/8)·0.91830 = 0.95121</code></td>\n  <td style=\"text-align:right\"><strong>0.04879</strong></td>\n</tr>\n<tr>\n  <td>Employment Status</td>\n  <td style=\"text-align:right\"><code>(4/8)·0.81128+(4/8)·0.81128 = 0.81128</code></td>\n  <td style=\"text-align:right\"><strong>0.18872</strong></td>\n</tr>\n</tbody>\n</table></div>\n<p>So choose <strong>Income Group</strong>.</p>\n<ul>\n<li>High income: 3 Yes → pure Yes leaf.</li>\n<li>Low income: 2 No → pure No leaf.</li>\n<li>Medium: 1 Yes, 2 No. Split by Employment Status: Permanent → Yes, Temporary → No, giving pure leaves.</li>\n</ul>\n<pre><code class=\"language-text\">Income Group?\n├─ High   → Yes\n├─ Low    → No\n└─ Medium\n   └─ Employment Status?\n      ├─ Permanent → Yes\n      └─ Temporary → No\n</code></pre>\n<p><strong>Prediction:</strong> Low Income, Poor Credit, Permanent Employment → <strong>No</strong>. The Low branch is already pure; credit/employment don't need testing.</p>\n"},{"title":"Gain ratio, Gini and continuous attributes","short":"Why information gain can favor the wrong feature.","body":"### ID3: information gain\n`Gain(A)=H(D)−Σᵥ(|Dᵥ|/|D|)H(Dᵥ)`. **Weakness:** High-cardinality attributes such as a unique customer ID can give nearly perfect training purity but generalize badly.\n\n### C4.5: gain ratio\n**SplitInfo(A) = −Σᵥ (|Dᵥ|/|D|)log₂(|Dᵥ|/|D|)**.\n\n**GainRatio(A) = Gain(A)/SplitInfo(A)** (when denominator nonzero). Penalizes highly fragmented splits; may favor skewed splits, so conventional C4.5 uses guards such as sufficiently high gain.\n\n### CART: Gini index\n**Gini(D) = 1−Σ pᵢ²**, binary case `2p(1−p)`. For balanced binary data, Gini = 0.5; pure data, 0.\n\n**Gini after split = Σᵥ(|Dᵥ|/|D|)Gini(Dᵥ)**. Select the **smallest weighted post-split Gini**, i.e. maximum decrease.\n\n### Continuous-valued features\nSort candidate split points; for adjacent observed values such as 12 and 18, test threshold 15: `Age≤15` vs `Age>15`. Calculate gain/Gini for each candidate threshold; select best.\n\n| Criterion | Select | Typical algorithm |\n|---|---|---|\n| Information gain | Maximum gain | ID3 |\n| Gain ratio | Maximum adjusted gain | C4.5 |\n| Gini | Minimum weighted impurity | CART |\n\nOther slide content: CHAID uses χ² significance; rule extraction translates root-to-leaf paths into `IF ... THEN class`.","source":"Classification.pptx slides 12–21; M5 CLASSIFICATION & DT.pptx slides 14–24","exam":"Re-CAT Q4 asks limitations of selection measures.","type":"core","html":"<h3>ID3: information gain</h3>\n<p><code>Gain(A)=H(D)−Σᵥ(|Dᵥ|/|D|)H(Dᵥ)</code>. <strong>Weakness:</strong> High-cardinality attributes such as a unique customer ID can give nearly perfect training purity but generalize badly.</p>\n<h3>C4.5: gain ratio</h3>\n<p><strong>SplitInfo(A) = −Σᵥ (|Dᵥ|/|D|)log₂(|Dᵥ|/|D|)</strong>.</p>\n<p><strong>GainRatio(A) = Gain(A)/SplitInfo(A)</strong> (when denominator nonzero). Penalizes highly fragmented splits; may favor skewed splits, so conventional C4.5 uses guards such as sufficiently high gain.</p>\n<h3>CART: Gini index</h3>\n<p><strong>Gini(D) = 1−Σ pᵢ²</strong>, binary case <code>2p(1−p)</code>. For balanced binary data, Gini = 0.5; pure data, 0.</p>\n<p><strong>Gini after split = Σᵥ(|Dᵥ|/|D|)Gini(Dᵥ)</strong>. Select the <strong>smallest weighted post-split Gini</strong>, i.e. maximum decrease.</p>\n<h3>Continuous-valued features</h3>\n<p>Sort candidate split points; for adjacent observed values such as 12 and 18, test threshold 15: <code>Age≤15</code> vs <code>Age&gt;15</code>. Calculate gain/Gini for each candidate threshold; select best.</p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Criterion</th>\n  <th>Select</th>\n  <th>Typical algorithm</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Information gain</td>\n  <td>Maximum gain</td>\n  <td>ID3</td>\n</tr>\n<tr>\n  <td>Gain ratio</td>\n  <td>Maximum adjusted gain</td>\n  <td>C4.5</td>\n</tr>\n<tr>\n  <td>Gini</td>\n  <td>Minimum weighted impurity</td>\n  <td>CART</td>\n</tr>\n</tbody>\n</table></div>\n<p>Other slide content: CHAID uses χ² significance; rule extraction translates root-to-leaf paths into <code>IF ... THEN class</code>.</p>\n"},{"title":"Overfitting and pruning","short":"When a deep tree memorizes noise.","body":"A tree with dozens of narrowly tailored branches may achieve high training accuracy but fail on unseen customers: **overfitting**.\n\n### Prepruning (early stopping)\nPrevent splitting when:\n- gain/impurity decrease is too small,\n- node has too few training samples,\n- maximum depth reached,\n- significance condition fails.\n\n**Benefit:** Fast, compact tree. **Risk:** Stop too early and miss beneficial later splits (**underfitting**).\n\n### Postpruning\nFirst grow a large tree, then **replace subtrees by leaves** when a validation-based or complexity-adjusted evaluation favors simplification (reduced-error pruning, pessimistic error estimates, cost-complexity pruning).\n\n**Benefit:** Can assess complex alternatives before simplifying. **Cost:** More training/validation effort; depends on sound pruning criterion.\n\n**Re-CAT answer:** Excessive branching makes tree sensitive to training noise → prunings reduce variance and improve generalization, but too much pruning creates bias.\n\n**Related limitations:** Information gain biases many-way attributes; gain ratio can be unstable for very low split information; Gini may favor the majority class on imbalanced data; greedy local splits may miss globally best trees.","source":"Classification.pptx slides 18–21; CAT - II recatQP DM1 (1).pdf Q4","exam":"","type":"core","html":"<p>A tree with dozens of narrowly tailored branches may achieve high training accuracy but fail on unseen customers: <strong>overfitting</strong>.</p>\n<h3>Prepruning (early stopping)</h3>\n<p>Prevent splitting when:</p>\n<ul>\n<li>gain/impurity decrease is too small,</li>\n<li>node has too few training samples,</li>\n<li>maximum depth reached,</li>\n<li>significance condition fails.</li>\n</ul>\n<p><strong>Benefit:</strong> Fast, compact tree. <strong>Risk:</strong> Stop too early and miss beneficial later splits (<strong>underfitting</strong>).</p>\n<h3>Postpruning</h3>\n<p>First grow a large tree, then <strong>replace subtrees by leaves</strong> when a validation-based or complexity-adjusted evaluation favors simplification (reduced-error pruning, pessimistic error estimates, cost-complexity pruning).</p>\n<p><strong>Benefit:</strong> Can assess complex alternatives before simplifying. <strong>Cost:</strong> More training/validation effort; depends on sound pruning criterion.</p>\n<p><strong>Re-CAT answer:</strong> Excessive branching makes tree sensitive to training noise → prunings reduce variance and improve generalization, but too much pruning creates bias.</p>\n<p><strong>Related limitations:</strong> Information gain biases many-way attributes; gain ratio can be unstable for very low split information; Gini may favor the majority class on imbalanced data; greedy local splits may miss globally best trees.</p>\n"},{"title":"Naïve Bayes worked out","short":"Conditional independence makes probability calculations simple.","body":"### Bayes' theorem\n**P(C|X) = P(X|C)P(C)/P(X)**. When comparing candidate classes, P(X) is common:\n\n**Predict = argmax_C P(C) × ∏ⱼ P(xⱼ|C)**.\n\nThe “naïve” assumption is **features conditionally independent given class**—not independent in reality.\n\n### Toy example\n10 emails: 4 spam, 6 ham.\n- Among spam: `offer=yes` in 3/4 and `link=yes` in 2/4.\n- Among ham: `offer=yes` in 1/6 and `link=yes` in 2/6.\n\nFor new email offer=yes, link=yes:\n- Score(spam) = `(4/10)(3/4)(2/4)=0.15`\n- Score(ham) = `(6/10)(1/6)(2/6)≈0.0333`\n\nNormalize: `P(spam|features)≈0.15/(0.15+0.0333)=0.8182`. Predict **spam**.\n\n### Zero-frequency problem\nIf a categorical feature value is absent in a class, raw probability zero annihilates the product. **Laplace/add-one smoothing:** `P(x=v|C)=(count(v,C)+1)/(n_C+K)` for K possible values.\n\n**Advantages:** Simple, fast, works with many features. **Limitation:** Correlated predictors violate conditional independence and probabilities may be miscalibrated. For many features, add **log probabilities** to avoid numeric underflow.","source":"Classification.pptx slides 24–32","exam":"","type":"core","html":"<h3>Bayes' theorem</h3>\n<p><strong>P(C|X) = P(X|C)P(C)/P(X)</strong>. When comparing candidate classes, P(X) is common:</p>\n<p><strong>Predict = argmax_C P(C) × ∏ⱼ P(xⱼ|C)</strong>.</p>\n<p>The “naïve” assumption is <strong>features conditionally independent given class</strong>—not independent in reality.</p>\n<h3>Toy example</h3>\n<p>10 emails: 4 spam, 6 ham.</p>\n<ul>\n<li>Among spam: <code>offer=yes</code> in 3/4 and <code>link=yes</code> in 2/4.</li>\n<li>Among ham: <code>offer=yes</code> in 1/6 and <code>link=yes</code> in 2/6.</li>\n</ul>\n<p>For new email offer=yes, link=yes:</p>\n<ul>\n<li>Score(spam) = <code>(4/10)(3/4)(2/4)=0.15</code></li>\n<li>Score(ham) = <code>(6/10)(1/6)(2/6)≈0.0333</code></li>\n</ul>\n<p>Normalize: <code>P(spam|features)≈0.15/(0.15+0.0333)=0.8182</code>. Predict <strong>spam</strong>.</p>\n<h3>Zero-frequency problem</h3>\n<p>If a categorical feature value is absent in a class, raw probability zero annihilates the product. <strong>Laplace/add-one smoothing:</strong> <code>P(x=v|C)=(count(v,C)+1)/(n_C+K)</code> for K possible values.</p>\n<p><strong>Advantages:</strong> Simple, fast, works with many features. <strong>Limitation:</strong> Correlated predictors violate conditional independence and probabilities may be miscalibrated. For many features, add <strong>log probabilities</strong> to avoid numeric underflow.</p>\n"},{"title":"Bayesian belief networks (BBNs)","short":"Directed graph + conditional probability tables.","body":"A **Bayesian belief network** is a **directed acyclic graph (DAG)** where each node is a random variable and each edge represents a direct probabilistic dependency. Each node has a **conditional probability table (CPT)** given its parents.\n\n### Joint distribution factorization\n**P(X₁,…,Xₙ) = ∏ᵢ P(Xᵢ | Parents(Xᵢ))**.\n\n### Lecture's burglar network\n`Burglary (B) → Alarm (A) ← Earthquake (E)`, then `Alarm (A) → Person1Calls (P1)` and `Alarm (A) → Person2Calls (P2)`.\n\nThus:\n`P(B,E,A,P1,P2) = P(B)·P(E)·P(A|B,E)·P(P1|A)·P(P2|A)`.\n\n**Numerical procedure:** Identify full joint event → read prior probabilities and CPT cells → multiply factors. For a marginal query, **sum** joint probabilities over variables not specified.\n\n**Example factor calculation (illustrative, not an exact slide entry):**\n`P(B=1)=0.01`, `P(E=0)=0.98`, `P(A=1|B=1,E=0)=0.94`, `P(P1=1|A=1)=0.95`, `P(P2=0|A=1)=0.20` → joint probability `0.01×0.98×0.94×0.95×0.20≈0.00175028`.\n\n**Naïve Bayes is a restricted graph** with one class parent and conditionally independent features; a general BBN can represent more complex dependencies.","source":"M5 BBN.pptx slides 1–16; M5 BBN EXAMPLE.pptx slides 1–11","exam":"","type":"core","html":"<p>A <strong>Bayesian belief network</strong> is a <strong>directed acyclic graph (DAG)</strong> where each node is a random variable and each edge represents a direct probabilistic dependency. Each node has a <strong>conditional probability table (CPT)</strong> given its parents.</p>\n<h3>Joint distribution factorization</h3>\n<p><strong>P(X₁,…,Xₙ) = ∏ᵢ P(Xᵢ | Parents(Xᵢ))</strong>.</p>\n<h3>Lecture's burglar network</h3>\n<p><code>Burglary (B) → Alarm (A) ← Earthquake (E)</code>, then <code>Alarm (A) → Person1Calls (P1)</code> and <code>Alarm (A) → Person2Calls (P2)</code>.</p>\n<p>Thus:\n<code>P(B,E,A,P1,P2) = P(B)·P(E)·P(A|B,E)·P(P1|A)·P(P2|A)</code>.</p>\n<p><strong>Numerical procedure:</strong> Identify full joint event → read prior probabilities and CPT cells → multiply factors. For a marginal query, <strong>sum</strong> joint probabilities over variables not specified.</p>\n<p><strong>Example factor calculation (illustrative, not an exact slide entry):</strong>\n<code>P(B=1)=0.01</code>, <code>P(E=0)=0.98</code>, <code>P(A=1|B=1,E=0)=0.94</code>, <code>P(P1=1|A=1)=0.95</code>, <code>P(P2=0|A=1)=0.20</code> → joint probability <code>0.01×0.98×0.94×0.95×0.20≈0.00175028</code>.</p>\n<p><strong>Naïve Bayes is a restricted graph</strong> with one class parent and conditionally independent features; a general BBN can represent more complex dependencies.</p>\n"},{"title":"Lazy learners: kNN and case-based reasoning","short":"Store training cases; compute at query time.","body":"### k-nearest neighbours (kNN)\nUnlike eager decision trees, **kNN delays generalization** until a new point appears.\n1. Choose k and distance metric.\n2. Compute distance to each training example.\n3. Select the nearest k examples.\n4. **Classification:** Majority vote (possibly distance-weighted). **Regression:** Average of neighbor values.\n\n**Euclidean:** `d(x,y)=√Σ(xᵢ−yᵢ)²`.\n**Manhattan:** `Σ|xᵢ−yᵢ|`.\n\n**Toy kNN:** New value x=5, training `(2,A),(4,A),(6,B),(9,B)`; k=3 chooses 4(A),6(B),2(A) → label A (distances 1,1,3).\n\n### Main issues\nFeature scale strongly affects distance (normalize first); k too small overfits, k too large oversmooths; high dimension hurts distance meaning; costly predictions for very large training sets.\n\n**Case-based reasoning:** Retrieve similar past cases, reuse/adapt their solutions, revise based on feedback, retain new cases.\n\n**Exam contrast:** Eager learners build an explicit model while training; lazy learners store examples and do significant work during prediction.","source":"ACP Module 5 includes lazy learners; relevant lecture coverage supplemented with standard worked example","exam":"Syllabus explicitly names lazy learners.","type":"core","html":"<h3>k-nearest neighbours (kNN)</h3>\n<p>Unlike eager decision trees, <strong>kNN delays generalization</strong> until a new point appears.</p>\n<ol>\n<li>Choose k and distance metric.</li>\n<li>Compute distance to each training example.</li>\n<li>Select the nearest k examples.</li>\n<li><strong>Classification:</strong> Majority vote (possibly distance-weighted). <strong>Regression:</strong> Average of neighbor values.</li>\n</ol>\n<p><strong>Euclidean:</strong> <code>d(x,y)=√Σ(xᵢ−yᵢ)²</code>.\n<strong>Manhattan:</strong> <code>Σ|xᵢ−yᵢ|</code>.</p>\n<p><strong>Toy kNN:</strong> New value x=5, training <code>(2,A),(4,A),(6,B),(9,B)</code>; k=3 chooses 4(A),6(B),2(A) → label A (distances 1,1,3).</p>\n<h3>Main issues</h3>\n<p>Feature scale strongly affects distance (normalize first); k too small overfits, k too large oversmooths; high dimension hurts distance meaning; costly predictions for very large training sets.</p>\n<p><strong>Case-based reasoning:</strong> Retrieve similar past cases, reuse/adapt their solutions, revise based on feedback, retain new cases.</p>\n<p><strong>Exam contrast:</strong> Eager learners build an explicit model while training; lazy learners store examples and do significant work during prediction.</p>\n"},{"title":"Confusion matrix — get the direction right","short":"Everything in evaluation starts from TP, FP, TN and FN.","body":"With **positive** as the event of interest (disease, fraud, default):\n\n| Actual \\ Predicted | Positive | Negative |\n|---|---:|---:|\n| **Positive** | TP | FN |\n| **Negative** | FP | TN |\n\n- **TP:** Actual positive predicted positive.\n- **FN:** Actual positive predicted negative (**missed case**).\n- **FP:** Actual negative predicted positive (**false alarm**).\n- **TN:** Actual negative predicted negative.\n\n### Metrics — one table, many formulas\n- **Accuracy:** `(TP+TN)/N`; **Error rate** `(FP+FN)/N`.\n- **Precision / PPV:** `TP/(TP+FP)` — when model says positive, how often correct?\n- **Recall / sensitivity / TPR:** `TP/(TP+FN)` — of actual positives, how many found?\n- **Specificity / TNR:** `TN/(TN+FP)` — of actual negatives, how many correctly rejected?\n- **FPR:** `FP/(FP+TN)=1−specificity`.\n- **FNR:** `FN/(FN+TP)=1−recall`.\n- **F1:** `2PR/(P+R)=2TP/(2TP+FP+FN)`.\n- **Balanced accuracy:** `(sensitivity+specificity)/2`.\n\n### Example\nTP=40, FN=10, FP=20, TN=130, N=200:\nAccuracy=170/200=85%; precision=40/60=66.67%; recall=40/50=80%; specificity=130/150=86.67%; F1=80/110=72.73%.\n\n**Accuracy can deceive:** If only 1% are fraudulent, a model predicting “legitimate” for everyone gets 99% accuracy but **zero fraud recall**.","source":"Classification.pptx slides 35–39; PERFORMANCEMETRICS.docx","exam":"","type":"core","html":"<p>With <strong>positive</strong> as the event of interest (disease, fraud, default):</p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Actual \\ Predicted</th>\n  <th style=\"text-align:right\">Positive</th>\n  <th style=\"text-align:right\">Negative</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td><strong>Positive</strong></td>\n  <td style=\"text-align:right\">TP</td>\n  <td style=\"text-align:right\">FN</td>\n</tr>\n<tr>\n  <td><strong>Negative</strong></td>\n  <td style=\"text-align:right\">FP</td>\n  <td style=\"text-align:right\">TN</td>\n</tr>\n</tbody>\n</table></div>\n<ul>\n<li><strong>TP:</strong> Actual positive predicted positive.</li>\n<li><strong>FN:</strong> Actual positive predicted negative (<strong>missed case</strong>).</li>\n<li><strong>FP:</strong> Actual negative predicted positive (<strong>false alarm</strong>).</li>\n<li><strong>TN:</strong> Actual negative predicted negative.</li>\n</ul>\n<h3>Metrics — one table, many formulas</h3>\n<ul>\n<li><strong>Accuracy:</strong> <code>(TP+TN)/N</code>; <strong>Error rate</strong> <code>(FP+FN)/N</code>.</li>\n<li><strong>Precision / PPV:</strong> <code>TP/(TP+FP)</code> — when model says positive, how often correct?</li>\n<li><strong>Recall / sensitivity / TPR:</strong> <code>TP/(TP+FN)</code> — of actual positives, how many found?</li>\n<li><strong>Specificity / TNR:</strong> <code>TN/(TN+FP)</code> — of actual negatives, how many correctly rejected?</li>\n<li><strong>FPR:</strong> <code>FP/(FP+TN)=1−specificity</code>.</li>\n<li><strong>FNR:</strong> <code>FN/(FN+TP)=1−recall</code>.</li>\n<li><strong>F1:</strong> <code>2PR/(P+R)=2TP/(2TP+FP+FN)</code>.</li>\n<li><strong>Balanced accuracy:</strong> <code>(sensitivity+specificity)/2</code>.</li>\n</ul>\n<h3>Example</h3>\n<p>TP=40, FN=10, FP=20, TN=130, N=200:\nAccuracy=170/200=85%; precision=40/60=66.67%; recall=40/50=80%; specificity=130/150=86.67%; F1=80/110=72.73%.</p>\n<p><strong>Accuracy can deceive:</strong> If only 1% are fraudulent, a model predicting “legitimate” for everyone gets 99% accuracy but <strong>zero fraud recall</strong>.</p>\n"},{"title":"MCC and Cohen's Kappa","short":"The two harder re-CAT performance formulas.","body":"### Matthews Correlation Coefficient (MCC)\n**MCC = (TP·TN − FP·FN) / √[(TP+FP)(TP+FN)(TN+FP)(TN+FN)]**.\n\nRange −1 to +1: +1 perfect, 0 chance-like/uncorrelated predictions, −1 perfect disagreement in balanced binary interpretation. MCC considers all four cells.\n\n### Cohen's Kappa\n**κ = (pₒ − pₑ)/(1−pₑ)**.\n`pₒ = (TP+TN)/N` observed agreement.\n\nFor binary predictions:\n**pₑ = [(TP+FP)(TP+FN)+(TN+FN)(TN+FP)]/N²**.\n\n### Actual 22 October 2026 re-CAT Q3\nTP=140, TN=740, FP=60, FN=60; N=1000.\n\n- Observed accuracy `pₒ=(140+740)/1000=0.88`.\n- Positive marginals: predicted 200, actual 200. Negative marginals: predicted 800, actual 800.\n- `pₑ=(200×200 + 800×800)/1000² = 0.68`.\n- **Kappa** `(0.88−0.68)/(1−0.68) = 0.625`.\n- **MCC** `(140×740−60×60)/√(200×200×800×800) = 100000/160000 = 0.625`.\n\nBoth **0.625** indicate meaningful but imperfect agreement/association beyond naive accuracy in this particular case. The equality is **specific to the numbers**, not a general identity.","source":"CAT - II recatQP DM1 (1).pdf Q3; performance metrics reference","exam":"Actual 10-mark re-CAT numerical solved fully.","type":"core","html":"<h3>Matthews Correlation Coefficient (MCC)</h3>\n<p><strong>MCC = (TP·TN − FP·FN) / √[(TP+FP)(TP+FN)(TN+FP)(TN+FN)]</strong>.</p>\n<p>Range −1 to +1: +1 perfect, 0 chance-like/uncorrelated predictions, −1 perfect disagreement in balanced binary interpretation. MCC considers all four cells.</p>\n<h3>Cohen's Kappa</h3>\n<p><strong>κ = (pₒ − pₑ)/(1−pₑ)</strong>.\n<code>pₒ = (TP+TN)/N</code> observed agreement.</p>\n<p>For binary predictions:\n<strong>pₑ = [(TP+FP)(TP+FN)+(TN+FN)(TN+FP)]/N²</strong>.</p>\n<h3>Actual 22 October 2026 re-CAT Q3</h3>\n<p>TP=140, TN=740, FP=60, FN=60; N=1000.</p>\n<ul>\n<li>Observed accuracy <code>pₒ=(140+740)/1000=0.88</code>.</li>\n<li>Positive marginals: predicted 200, actual 200. Negative marginals: predicted 800, actual 800.</li>\n<li><code>pₑ=(200×200 + 800×800)/1000² = 0.68</code>.</li>\n<li><strong>Kappa</strong> <code>(0.88−0.68)/(1−0.68) = 0.625</code>.</li>\n<li><strong>MCC</strong> <code>(140×740−60×60)/√(200×200×800×800) = 100000/160000 = 0.625</code>.</li>\n</ul>\n<p>Both <strong>0.625</strong> indicate meaningful but imperfect agreement/association beyond naive accuracy in this particular case. The equality is <strong>specific to the numbers</strong>, not a general identity.</p>\n"},{"title":"Cross-validation methods","short":"Know exactly what is trained and what is tested.","body":"### 1. Holdout\nOne train/test split (e.g. 80/20). Cheap, but score changes with the random split and test sample may be small.\n\n### 2. k-fold CV\nDivide into k folds; train on `k−1`, test on remaining fold, repeat k times. Average metrics. Each example serves as validation **once**. Example with N=100 and k=5: five tests of 20 examples, each model trained on 80.\n\n### 3. Stratified k-fold\nAs above but each fold approximately preserves the **class proportions**. Very helpful when classes are imbalanced; e.g. roughly 10% positive in each fold instead of a fold with none.\n\n### 4. Leave-one-out (LOOCV)\nSpecial case of k-fold with **k=N**. Train N models using N−1 training samples and 1 test sample each; expensive for large N.\n\n### 5. Leave-p-out\nFor each possible set of p held-out objects, train on remaining N−p; total `C(N,p)` combinations. Quickly computationally prohibitive.\n\n### 6. Bootstrap\nDraw N samples **with replacement** from N training records. Some appear multiple times; others are out-of-bag. Used to estimate model variation/generalization, and foundational to bagging.\n\n**Leakage warning:** Preprocessing and hyperparameter selection must be fit **inside each training fold**. For time series, ordinary shuffled CV may leak the future; use chronological splits.\n\n**Actual CAT-II Q3 four designs:** holdout → k-fold → stratified k-fold → leave-one-out.","source":"Cross-validation Techniques.docx; Model Evaluation and Selection.pptx slides 6–7; CAT-II Q3","exam":"","type":"core","html":"<h3>1. Holdout</h3>\n<p>One train/test split (e.g. 80/20). Cheap, but score changes with the random split and test sample may be small.</p>\n<h3>2. k-fold CV</h3>\n<p>Divide into k folds; train on <code>k−1</code>, test on remaining fold, repeat k times. Average metrics. Each example serves as validation <strong>once</strong>. Example with N=100 and k=5: five tests of 20 examples, each model trained on 80.</p>\n<h3>3. Stratified k-fold</h3>\n<p>As above but each fold approximately preserves the <strong>class proportions</strong>. Very helpful when classes are imbalanced; e.g. roughly 10% positive in each fold instead of a fold with none.</p>\n<h3>4. Leave-one-out (LOOCV)</h3>\n<p>Special case of k-fold with <strong>k=N</strong>. Train N models using N−1 training samples and 1 test sample each; expensive for large N.</p>\n<h3>5. Leave-p-out</h3>\n<p>For each possible set of p held-out objects, train on remaining N−p; total <code>C(N,p)</code> combinations. Quickly computationally prohibitive.</p>\n<h3>6. Bootstrap</h3>\n<p>Draw N samples <strong>with replacement</strong> from N training records. Some appear multiple times; others are out-of-bag. Used to estimate model variation/generalization, and foundational to bagging.</p>\n<p><strong>Leakage warning:</strong> Preprocessing and hyperparameter selection must be fit <strong>inside each training fold</strong>. For time series, ordinary shuffled CV may leak the future; use chronological splits.</p>\n<p><strong>Actual CAT-II Q3 four designs:</strong> holdout → k-fold → stratified k-fold → leave-one-out.</p>\n\n<section class=\"imp-deepdive\"><div class=\"imp-depth-head\"><strong>★ EXAM-READY EXPANSION</strong><small>Source: Cross-validation Techniques.docx, full document; Model Evaluation and Selection.pptx; CAT-II Q3</small></div>\n<h3>K-fold versus LOOCV — 100-record numerical</h3>\n<div class=\"table-scroll\"><table><thead><tr><th>Method</th><th>Models trained</th><th>Train per run</th><th>Validation per run</th></tr></thead><tbody>\n<tr><td>5-fold</td><td>5</td><td>80</td><td>20</td></tr><tr><td>10-fold</td><td>10</td><td>90</td><td>10</td></tr><tr><td>LOOCV (k=N)</td><td>100</td><td>99</td><td>1</td></tr><tr><td>Leave-2-out</td><td>C(100,2)=4,950</td><td>98</td><td>2</td></tr>\n</tbody></table></div>\n<p><strong>Exact rule:</strong> In k-fold CV, each sample appears in validation <em>once</em> and training <em>k−1</em> times. LOOCV is k-fold with k=N; the validation fold contains one sample. It often costs far more because it fits N models.</p>\n<h4>Every method listed in the faculty document</h4>\n<ol><li><b>Holdout:</b> one fixed train/validation split; fast but sensitive to the split.</li><li><b>K-fold:</b> rotate through k validation folds; average the k scores.</li><li><b>Stratified k-fold:</b> preserve class ratios in each fold; useful for imbalanced classes.</li><li><b>Leave-p-out:</b> enumerate C(N,p) test subsets; costly.
