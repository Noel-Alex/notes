 22 –\n20 and 2 >0 As the swap cost is not less than\nzero, we undo the swap. Hence (4, 5) and (8, 5)"},{"page":7,"text":"are the final medoids. The clustering would be\nin the following way. The time complexity is\n                                     .\n\n\n\n\n\nAdvantages:\n  1.It  is simple to understand and easy to\n   implement.\n 2.K-Medoid Algorithm is fast and converges\n    in a fixed number of steps."},{"page":8,"text":" 3.PAM is less sensitive to outliers than other\n    partitioning algorithms.\nDisadvantages:\n  1.The  main  disadvantage  of  K-Medoid\n   algorithms  is that  it  is not suitable for\n    clustering   non-spherical    (arbitrarily\n   shaped) groups of objects. This is because\n     it  relies  on  minimizing  the  distances\n   between the non-medoid objects and the\n   medoid (the cluster center) – briefly,  it\n   uses compactness as  clustering  criteria\n   instead of connectivity.\n  2.It may obtain different results for different\n   runs on the same dataset because the first\n   k medoids are chosen randomly."}]},{"name":"CAT 1 NOTES/DATA MINING INTRO.pptx","parts":[{"page":1,"text":"\u000b\n \n1\n  Data Mining Lab (BCSE208P)\n\nMs. MAHESWARI .B\nAssistant Professor, SCOPE\n(PRP ANNEX- 101L)\nmaheswari.b@vit.ac.in"},{"page":2,"text":"\t\n\nHave you ever used Amazon, Netflix, Instagram, YouTube or Google?\n2"},{"page":3,"text":"\nHow does Amazon know what product you may like?\nHow does Netflix suggest movies?\nHow does Google rank websites?\nHow does Instagram show reels based on your interests?\nThe answer is: Data Mining\n\n\n\n3"},{"page":4,"text":"What is Data?\nData means raw facts.\n\n4\nStudent Name | Marks\nRavi | 80\nPriya | 90\nKumar | 75"},{"page":5,"text":"What is Information?\nWhen data is processed and becomes useful, it is called information\nClass Average = 81.6\nHighest Mark = 90\nLowest Mark = 75\n\n\n5"},{"page":6,"text":"What is Data Mining?\nData Mining is the process of finding useful patterns and hidden knowledge from large amounts of data.\n\n6"},{"page":7,"text":"7\nReal Life Example\nSupermarket Data:\n\nCustomer 1 → Milk, Bread\n\nCustomer 2 → Milk, Bread\n\nCustomer 3 → Milk, Bread, Butter\nAfter analysis: \nPeople buying Milk often buy Bread\nThis hidden pattern is discovered using Data Mining."},{"page":8,"text":"Why Do We Need Data Mining?\nToday every organization generates huge data\nIf data is huge, humans cannot analyze manually.\nData Mining helps us analyze automatically.\nExamples:\n\n8\nOrganization | Data Generated\nHospital | Patient records\nBank | Transactions\nCollege | Student records\nAmazon | Purchase history\nFacebook | User activities"},{"page":9,"text":"COURSE OBJECTIVES\n\n\n\n \n9"},{"page":10,"text":"COURSE OUTCOME"},{"page":11,"text":"INDICATIVE EXPERIMENTS\n11"},{"page":12,"text":"\n\nTHANK YOU!\n12"}]},{"name":"CAT 1 NOTES/M2 DM.pptx","parts":[{"page":1,"text":"\u000b\n \n1\n\nMs. MAHESWARI .B\nAssistant Professor, SCOPE\n(PRP ANNEX- 101L)\nmaheswari.b@vit.ac.in\nBCSE208L -Data Mining"},{"page":2,"text":"M2: Data Mining\n\n2"},{"page":3,"text":"What Is Data Mining?\nData mining refers to extracting or mining \tknowledge from large amounts of data.\nMining of gold from rocks or sand\nKnowledge mining from data, knowledge \textraction, data/pattern analysis, data \tarcheology, and data dreding.\nKnowledge Discovery from data, or KDD\n\n3"},{"page":4,"text":"Data Mining: A KDD Process\n– Data mining: the core of knowledge discovery process.\nData Cleaning\nData Integration\nDatabases\nData Warehouse\nTask-relevant Data\nSelection Transformation\nData Mining\nPattern Evaluation\n36\n"},{"page":5,"text":"Steps of a KDD Process\nData cleaning\nData integration\nData selection\nData transformation\nData mining\nPattern evaluation\nKnowledge presentaion\n\n5"},{"page":6,"text":"Steps of a KDD Process\nLearning the application domain:\nrelevant prior knowledge and goals of \tapplication\nCreating a target data set: data selection\nData cleaning and preprocessing\nData reduction and transformation:\nFind useful features, dimensionality/variable \treduction, invariant representation.\n\n6"},{"page":7,"text":"Steps of a KDD Process\nChoosing functions of data mining\n\tsummarization, classification, regression, association, clustering.\nChoosing the mining algorithms\nData mining: search for patterns of interest\nPattern evaluation and knowledge presentation\nvisualization, transformation, removing redundant \tpatterns, etc.\nUse of discovered knowledge\n\n7"},{"page":8,"text":"Architecture of a Typical Data Mining System\nData Warehouse\nFiltering\nDatabases\nDatabase or data warehouse server\nData cleaning & data integration\nGraphical user interface\nPattern evaluation Data mining engine\nKnowledge-base\n\n8"},{"page":9,"text":"Data Mining and Business Intelligence\nIncreasing potential to support\nbusiness decisions\nEnd User\nBusiness Analyst\nData Analyst\nDBA\nMaking Decisions\nData Presentation\nVisualization Techniques\nData Mining\nInformation Discovery\n\nData Exploration\nStatistical Analysis, Querying and Reporting\nData Warehouses / Data Marts\nOLAP, MDA\nData Sources\nPaper, Files, Information Providers, Database Systems, OLTP\n9"},{"page":10,"text":"Data Mining: On What Kind of Data?\n\n10"},{"page":11,"text":"Answer : On any kind of data.\n\n11"},{"page":12,"text":"Data Mining: On What Kind of Data?\nRelational databases\nData warehouses\nTransactional databases\n\n12"},{"page":13,"text":"Data Mining: On What Kind of Data?\nAdvanced DB and information repositories\nObject-oriented and object-relational databases\nSpatial databases\nTime-series data and temporal data\nText databases and multimedia databases\nHeterogeneous and legacy databases\nWWW\n\n13"},{"page":14,"text":""},{"page":15,"text":"Data Mining Functionalities -What kind of patterns can be mined?\n\n15"},{"page":16,"text":"Data mining tasks generally classified into two categories.\n\nDescriptive :It characterize the general properties of data in the database.\nPredictive :It performs inference(interpretation) on the current data in order to make predictions.\n\n16"},{"page":17,"text":"Data Mining Functionalities\nConcept description: Characterization and \tdiscrimination\nData can be associated with classes or concepts\nEx. AllElectronics store classes of items for sale include \tcomputer and printers.\nDescription of class or concept is called class/concept \tdescription.\n\tData characterization : summarization of general features of target class of data.\nData discrimination : comparison of target class with one or\nmore.\n48\n"},{"page":18,"text":"Data Mining Functionalities\nAssociation Analysis\nMulti-dimensional vs. single-dimensional \tassociation\nage(X, “20..29”) ^ income(X, “20..29K”) => buys(X, \t“PC”) [support = 2%, confidence = 60%]\ncontains(T, “computer”)\t=> contains(x, \t“software”) [support=1%, confidence=75%]\n\n18"},{"page":19,"text":"Data Mining Functionalities\nClassification and Prediction\nFinding models (functions) that describe and \tdistinguish data classes or concepts for predict the \tclass whose label is unknown\nE.g., classify countries based on climate, or classify \tcars based on gas mileage\nModels: decision-tree, classification rules (if-then), \tneural network\nPrediction: Predict some unknown or missing \tnumerical values\n\n19"},{"page":20,"text":"Data Mining Functionalities\nCluster analysis\nAnalyze class-labeled data objects, clustering \tanalyze data objects without consulting a known \tclass label.\nClustering based on the principle: maximizing the \tintra-class similarity and minimizing the interclass \tsimilarity\n\n20"},{"page":21,"text":"Data Mining Functionalities\nOutlier analysis\nOutlier: a data object that does not comply(fulfill) with the general \tbehavior of the model of the data\nIt can be considered as noise or exception but is quite useful in fraud \tdetection, rare events analysis\nTrend and evolution analysis\nTrend and deviation: regression analysis\nSequential pattern mining, periodicity analysis\nSimilarity-based analysis\n\n21"},{"page":22,"text":"Data Mining: Classification Schemes\n\n\n22"},{"page":23,"text":"Data Mining: Confluence of Multiple Disciplines\nData Mining\nDatabase Technology\nStatistics\nOther Disciplines\nVisualization\nInformation Science\nMachineLearning\n23"},{"page":24,"text":"Data Mining systems: Classification Schemes\nGeneral functionality\nDescriptive data mining\nPredictive data mining\nData mining various criteria's:\nKinds of databases to be mined\nKinds of knowledge to be discovered\nKinds of techniques utilized\nKinds of applications adopted\n\n24"},{"page":25,"text":"Data Mining: Classification Schemes\nDatabases to be mined\nRelational, transactional, object-oriented, object-\trelational, active, spatial, time-series, text, multi-media, \theterogeneous, legacy, WWW, etc.\nKnowledge to be mined\nCharacterization, discrimination, association, classification, \tclustering, trend, deviation and outlier analysis, etc.\nMultiple/integrated functions and mining at multiple \tlevels\n\n25"},{"page":26,"text":"Data Mining: Classification Schemes\nTechniques utilized\nDatabase-oriented, data warehouse (OLAP), machine learning, statistics, visualization, neural network, etc.\nApplications adopted\nRetail, telecommunication, banking, fraud analysis, DNA mining, stock market\n\n26"},{"page":27,"text":"Major Issues in Data Mining\n\n27"},{"page":28,"text":"Major Issues in Data Mining\nMining methodology and user interaction issues\nMining different kinds of knowledge in databases\nInteractive mining of knowledge at multiple levels of \tabstraction\nIncorporation of background knowledge\nData mining query languages and ad-hoc data mining\nExpression and visualization of data mining results\nHandling noise and incomplete data\nPattern evaluation: the interestingness problem\n\n28"},{"page":29,"text":"Major Issues in Data Mining\nPerformance issues\nEfficiency and scalability of data mining algorithms\nParallel, distributed and incremental mining \tmethods\n\n29"},{"page":30,"text":"Major Issues in Data Mining\nIssues relating to the diversity of data types\n\nHandling relational(simple) and complex types of \tdata.\n\nMining information from heterogeneous databases \tand global information systems (WWW)\n\n30"}]},{"name":"CAT 1 NOTES/BCSE208L_DATA-MINING_TH_1.0_71_BCSE208L_66 ACP (1).pdf","parts":[{"page":1,"text":"                                                                Item 66/20 - Annexure - 16\n\n\n\nCourse code                     Course Title                  L  T  P C\nBCSE208L                        Data Mining                   2  0  0  2\nPre-requisite    NIL                                             Syllabus version\n                                                                             1.0\nCourse Objectives\n    1. To introduce the fundamental processes data warehousing and major issues in data\n       mining.\n    2. To impart the knowledge on various data mining concepts and techniques that can\n      be applied to text mining, web mining etc.\n    3. To develop the knowledge for application of data mining and social impacts of data\n       mining.\n\nCourse Outcome\nUpon completion of the course the student will be able to\n    1.  Interpret the contribution of data warehousing and data mining to the decision-\n       support systems.\n    2.  Construct the data needed for data mining using preprocessing techniques.\n    3.  Discover interesting patterns from large amounts of data using Association Rule\n       Mining.\n    4.  Extract useful information from the labeled data using various classifiers and Compile\n       unlabeled data into clusters applying various clustering algorithms.\n    5.  Demonstrate capacity to perform a self-directed piece of practical work that requires\n       the application of data mining techniques.\n\nModule:1  Data Warehousing                                          4 hours\nIntroduction to Data warehouse - Data Warehouse models- Data warehouse architecture:\nThree-tier data warehouse architecture - Data warehouse modeling: Data cube and OLAP –\nStar and Snowflake Schema.\nModule:2  Introduction to Data Mining                                  3 hours\nIntroduction to data mining - Data mining functionalities - Steps in data mining process-\nClassification of data mining systems - Major issues in data mining.\nModule:3  Data Preprocessing                                        3 hours\nData Preprocessing: An overview - Data cleaning - Data integration -Data reduction - Data\ntransformation.\nModule:4  Frequent Pattern Mining                                     4 hours\nFrequent Pattern Mining: Basic Concepts and a Road Map - Efficient and scalable frequent\nitem set mining methods: Apriori algorithm, FP-Growth algorithm - Mining frequent item sets\nusing vertical data format.\nModule:5  Classification Techniques                                   5 hours\nGeneral approach to  classification  -                                                            - Bayes\nclassification  methods  -  Model  evaluation  and  selection   -  Techniques  to  improve\nclassification accuracy - advanced classification methods: Bayesian belief networks- Lazy\nlearners.\nModule:6  Cluster Analysis                                           5 hours\nTypes of data in cluster analysis - Partitioning methods - K Medoid Clustering - Density\nbased methods - Grid based methods - Outlier analysis.\nModule:7  Data Mining Trends and Research                            4 hours\n           Frontiers\nOverview of Web mining-Temporal and Spatial mining-Other methodologies of data mining:\nStatistical data mining- Data mining applications.\nModule:8  Contemporary Issues                                       2 hours\n\n\n\n\n\n                 Proceedings of the 66th Academic Council (16.06.2022)              327"},{"page":2,"text":"                                                                Item 66/20 - Annexure - 16\n\n\n\n                                  Total Lecture hours:                    30 hours\n\n\nText Book(s)\n    Jiawei Han and Micheline Kamber, Data Mining: Concepts and Techniques, Morgan\n1.\n   Kaufmann Publishers, third edition, 2013.\nReference Books\n    Parteek  Bhatia,  Data  Mining  and  Data  Warehousing:  Principles  and  Practical\n1.    Techniques, Cambridge University Press, 2019.\n    Pang-Ning Tan, Michael Steinbach, Anuj Karpatne, Vipin Kumar, Introduction to Data\n2.    Mining, Pearson, 2nd Edition, 2019.\nMode of Evaluation : Continuous Assessment Tests, Quizzes, Assignment, Final\nAssessment Test\nRecommended by Board of Studies  12-05-2022\nApproved by Academic Council      No. 66         Date    16-06-2022\n\n\n\n\n\n                 Proceedings of the 66th Academic Council (16.06.2022)              328"}]},{"name":"DM CAT 2 NOTES/BCSE208L_DATA-MINING_TH_1.0_71_BCSE208L_66 ACP (1).pdf","parts":[{"page":1,"text":"                                                                Item 66/20 - Annexure - 16\n\n\n\nCourse code                     Course Title                  L  T  P C\nBCSE208L                        Data Mining                   2  0  0  2\nPre-requisite    NIL                                             Syllabus version\n                                                                             1.0\nCourse Objectives\n    1. To introduce the fundamental processes data warehousing and major issues in data\n       mining.\n    2. To impart the knowledge on various data mining concepts and techniques that can\n      be applied to text mining, web mining etc.\n    3. To develop the knowledge for application of data mining and social impacts of data\n       mining.\n\nCourse Outcome\nUpon completion of the course the student will be able to\n    1.  Interpret the contribution of data warehousing and data mining to the decision-\n       support systems.\n    2.  Construct the data needed for data mining using preprocessing techniques.\n    3.  Discover interesting patterns from large amounts of data using Association Rule\n       Mining.\n    4.  Extract useful information from the labeled data using various classifiers and Compile\n       unlabeled data into clusters applying various clustering algorithms.\n    5.  Demonstrate capacity to perform a self-directed piece of practical work that requires\n       the application of data mining techniques.\n\nModule:1  Data Warehousing                                          4 hours\nIntroduction to Data warehouse - Data Warehouse models- Data warehouse architecture:\nThree-tier data warehouse architecture - Data warehouse modeling: Data cube and OLAP –\nStar and Snowflake Schema.\nModule:2  Introduction to Data Mining                                  3 hours\nIntroduction to data mining - Data mining functionalities - Steps in data mining process-\nClassification of data mining systems - Major issues in data mining.\nModule:3  Data Preprocessing                                        3 hours\nData Preprocessing: An overview - Data cleaning - Data integration -Data reduction - Data\ntransformation.\nModule:4  Frequent Pattern Mining                                     4 hours\nFrequent Pattern Mining: Basic Concepts and a Road Map - Efficient and scalable frequent\nitem set mining methods: Apriori algorithm, FP-Growth algorithm - Mining frequent item sets\nusing vertical data format.\nModule:5  Classification Techniques                                   5 hours\nGeneral approach to  classification  -                                                            - Bayes\nclassification  methods  -  Model  evaluation  and  selection   -  Techniques  to  improve\nclassification accuracy - advanced classification methods: Bayesian belief networks- Lazy\nlearners.\nModule:6  Cluster Analysis                                           5 hours\nTypes of data in cluster analysis - Partitioning methods - K Medoid Clustering - Density\nbased methods - Grid based methods - Outlier analysis.\nModule:7  Data Mining Trends and Research                            4 hours\n           Frontiers\nOverview of Web mining-Temporal and Spatial mining-Other methodologies of data mining:\nStatistical data mining- Data mining applications.\nModule:8  Contemporary Issues                                       2 hours\n\n\n\n\n\n                 Proceedings of the 66th Academic Council (16.06.2022)              327"},{"page":2,"text":"                                                                Item 66/20 - Annexure - 16\n\n\n\n                                  Total Lecture hours:                    30 hours\n\n\nText Book(s)\n    Jiawei Han and Micheline Kamber, Data Mining: Concepts and Techniques, Morgan\n1.\n   Kaufmann Publishers, third edition, 2013.\nReference Books\n    Parteek  Bhatia,  Data  Mining  and  Data  Warehousing:  Principles  and  Practical\n1.    Techniques, Cambridge University Press, 2019.\n    Pang-Ning Tan, Michael Steinbach, Anuj Karpatne, Vipin Kumar, Introduction to Data\n2.    Mining, Pearson, 2nd Edition, 2019.\nMode of Evaluation : Continuous Assessment Tests, Quizzes, Assignment, Final\nAssessment Test\nRecommended by Board of Studies  12-05-2022\nApproved by Academic Council      No. 66         Date    16-06-2022\n\n\n\n\n\n                 Proceedings of the 66th Academic Council (16.06.2022)              328"}]},{"name":"DM CAT 2 NOTES/M4 DM/Mining frequent item sets.docx","parts":[{"page":1,"text":"\n\n\n\n\n\n\n\n\n\n\n\n"}]},{"name":"DM CAT 2 NOTES/M4 DM/FP GROWTH ALGORITHMS.pptx","parts":[{"page":1,"text":"A Pattern Growth Approach\n1"},{"page":2,"text":"FP-growth: Frequent Pattern-Growth\nThe Apriori algorithm works by:\n\nGenerate candidates → calculate support → prune → generate larger candidates → repeat\n\nThis becomes expensive when:\n\nDatabase is very large\nNumber of items is very large\nFrequent patterns are long\n\nFP-Growth solves this problem by using a different idea:\n\nCompress the transaction database into an FP-tree and mine the tree instead of repeatedly scanning the original database."},{"page":3,"text":"FP-growth: Frequent Pattern-Growth\n\nAdopts a divide and conquer strategy\n\nCompress the database representing frequent items into a frequent –pattern tree or FP-tree\n\nRetains the itemset association information \n\nDivide the compressed database into a set of conditional databases, each associated with one frequent item \n\n\nMine each such databases separately"},{"page":4,"text":" Main idea of FP-Growth\n\n\nStep 1:Scan the database and find frequent 1-itemsets.\n\nStep 2: Sort the frequent items according to their support.\n\nStep 3: Construct an FP-tree.\n\nStep 4: For each item, construct its: Conditional Pattern Base\n\nStep 5: Construct a: Conditional FP-tree\n\nStep 6: Generate frequent patterns recursively.\n\n\nDatabase → Frequent items → Ordered transactions → FP-tree → Conditional Pattern Base → Conditional FP-tree → Frequent patterns"},{"page":5,"text":"Example: FP-growth\n\nThe first scan of data is the same as Apriori\nDerive the set of frequent 1-itemsets\nTID | List of item IDS\nT100 | I1,I2,I5\nT200 | I2,I4\nT300 | I2,I3\nT400 | I1,I2,I4\nT500 | I1,I3\nT600 | I2,I3\nT700 | I1,I3\nT800 | I1,I2,I3,I5\nT900 | I1,I2,I3\nTransactional Database\nItem ID | Support count\nI1 | 6\nI2 | 7\nI3 | 6\nI4 | 2\nI5 | 2\nItem ID | Support count\nI2 | 7\nI1 | 6\nI3 | 6\nI4 | 2\nI5 | 2\nLet min-sup=2\nGenerate a set of ordered items \n       (apply  condition (min-sup=2) &    \n       write in descending order)  "},{"page":6,"text":"Construct the FP-Tree\n\nTransactional Database\nItem ID | Support count\nI2 | 7\nI1 | 6\nI3 | 6\nI4 | 2\nI5 | 2\n\nnull\n      - Create a branch for each transaction\n     - Items in each transaction are processed in order \n1- Order the items T100: {I2,I1,I5}\n2- Construct the first branch: \n<I2:1>, <I1:1>,<I5:1>\n\nTID | Items | TID | Items | TID | Items\nT100 | I1,I2,I5 | T400 | I1,I2,I4 | T700 | I1,I3\nT200 | I2,I4 | T500 | I1,I3 | T800 | I1,I2,I3,I5\nT300 | I2,I3 | T600 | I2,I3 | T900 | I1,I2,I3\n\nI2:1\n\nI1:1\n\nI5:1"},{"page":7,"text":"Construct the FP-Tree\n\nTransactional Database\nItem ID | Support count\nI2 | 7\nI1 | 6\nI3 | 6\nI4 | 2\nI5 | 2\n\nnull\n      - Create a branch for each transaction\n     - Items in each transaction are processed in order \n1- Order the items T200: {I2,I4}\n2- Construct the second branch: \n<I2:1>, <I4:1>\n\nTID | Items | TID | Items | TID | Items\nT100 | I1,I2,I5 | T400 | I1,I2,I4 | T700 | I1,I3\nT200 | I2,I4 | T500 | I1,I3 | T800 | I1,I2,I3,I5\nT300 | I2,I3 | T600 | I2,I3 | T900 | I1,I2,I3\n\nI2:1\n\nI1:1\n\nI5:1\n\nI4:1\n\nI2:2"},{"page":8,"text":"Construct the FP-Tree\n\nTransactional Database\nItem ID | Support count\nI2 | 7\nI1 | 6\nI3 | 6\nI4 | 2\nI5 | 2\n\nnull\n      - Create a branch for each transaction\n     - Items in each transaction are processed in order \n1- Order the items T300: {I2,I3}\n2- Construct the third branch: \n<I2:2>, <I3:1>\n\nTID | Items | TID | Items | TID | Items\nT100 | I1,I2,I5 | T400 | I1,I2,I4 | T700 | I1,I3\nT200 | I2,I4 | T500 | I1,I3 | T800 | I1,I2,I3,I5\nT300 | I2,I3 | T600 | I2,I3 | T900 | I1,I2,I3\n\nI2:2\n\nI1:1\n\nI5:1\n\nI4:1\n\nI3:1\nI2:3"},{"page":9,"text":"Construct the FP-Tree\n\nTransactional Database\nItem ID | Support count\nI2 | 7\nI1 | 6\nI3 | 6\nI4 | 2\nI5 | 2\n\nnull\n      - Create a branch for each transaction\n     - Items in each transaction are processed in order \n1- Order the items T400: {I2,I1,I4}\n2- Construct the fourth branch: \n<I2:3>, <I1:1>,<I4:1>\n\nTID | Items | TID | Items | TID | Items\nT100 | I1,I2,I5 | T400 | I1,I2,I4 | T700 | I1,I3\nT200 | I2,I4 | T500 | I1,I3 | T800 | I1,I2,I3,I5\nT300 | I2,I3 | T600 | I2,I3 | T900 | I1,I2,I3\n\n\nI1:1\n\nI5:1\n\nI4:1\n\nI3:1\nI2:3\n\nI4:1\nI1:2\nI2:4"},{"page":10,"text":"Construct the FP-Tree\n\nTransactional Database\nItem ID | Support count\nI2 | 7\nI1 | 6\nI3 | 6\nI4 | 2\nI5 | 2\n\nnull\n      - Create a branch for each transaction\n     - Items in each transaction are processed in order \n1- Order the items T400: {I1,I3}\n2- Construct the fifth branch: \n<I1:1>, <I3:1>\n\nTID | Items | TID | Items | TID | Items\nT100 | I1,I2,I5 | T400 | I1,I2,I4 | T700 | I1,I3\nT200 | I2,I4 | T500 | I1,I3 | T800 | I1,I2,I3,I5\nT300 | I2,I3 | T600 | I2,I3 | T900 | I1,I2,I3\n\n\nI1:2\n\nI5:1\n\nI4:1\n\nI3:1\nI2:4\n\nI4:1\n\nI1:1\n\nI3:1"},{"page":11,"text":"Construct the FP-Tree\n\nTransactional Database\nItem ID | Support count\nI2 | 7\nI1 | 6\nI3 | 6\nI4 | 2\nI5 | 2\n\nnull\nTID | Items | TID | Items | TID | Items\nT100 | I1,I2,I5 | T400 | I1,I2,I4 | T700 | I1,I3\nT200 | I2,I4 | T500 | I1,I3 | T800 | I1,I2,I3,I5\nT300 | I2,I3 | T600 | I2,I3 | T900 | I1,I2,I3\n\n\nI1:4\n\nI5:1\n\nI4:1\n\nI3:2\nI2:7\n\nI4:1\n\nI1:2\n\nI3:2\n\nI3:2\n\nI5:1\n      When a branch of a transaction is added, the count for each node along a common prefix is incremented by 1"},{"page":12,"text":"Construct the FP-Tree\n\nItem ID | Support count\nI2 | 7\nI1 | 6\nI3 | 6\nI4 | 2\nI5 | 2\n\nnull\n\n\nI1:4\n\nI5:1\n\nI4:1\n\nI3:2\nI2:7\n\nI4:1\n\nI1:2\n\nI3:2\n\nI3:2\n\nI5:1\n      The problem of mining frequent patterns in databases is transformed to that of mining the FP-tree"},{"page":13,"text":"Construct the FP-Tree\n      -Occurrences of I5: <I2,I1,I5> and <I2,I1,I3,I5>\n      -Two prefix Paths <I2, I1: 1> and <I2,I1,I3: 1>\n      -Conditional FP tree contains only  <I2: 2, I1: 2>, I3 is not considered because its support count of 1 is less than the minimum support count.\n      -Frequent patterns {I2,I5:2}, {I1,I5:2},{I2,I1,I5:2}\n     \n\nItem ID | Support count\nI2 | 7\nI1 | 6\nI3 | 6\nI4 | 2\nI5 | 2\n\nnull\n\n\nI1:4\n\nI5:1\n\nI4:1\n\nI3:2\nI2:7\n\nI4:1\n\nI1:2\n\nI3:2\n\nI3:2\n\nI5:1"},{"page":14,"text":"Construct the FP-Tree\nTID | Conditional Pattern Base | Conditional FP-tree\nI5 | {{I2,I1:1},{I2,I1,I3:1}} | <I2:2,I1:2>\nI4 | {{I2,I1:1},{I2:1}} | <I2:2>\nI3 | {{I2,I1:2},{I2:2}, {I1:2}} | <I2:4,I1:2>,<I1:2>\nI1 | {I2:4} | <I2:4>"},{"page":15,"text":"Construct the FP-Tree\nTID | Conditional FP-tree | Frequent Patterns Generated\nI5 | <I2:2,I1:2> | {I2,I5:2}, {I1,I5:2},{I2,I1,I5:2}\nI4 | <I2:2> | {I2,I4:2}\nI3 | <I2:4,I1:2>,<I1:2> | {I2,I3:4},{I1,I3:4},{I2,I1,I3:2}\nI1 | <I2:4> | {I2,I1:4}"},{"page":16,"text":"FP-growth properties\n\nFP-growth transforms the problem of finding long frequent patterns to searching for shorter once recursively  and  concatenating the suffix\n\nIt uses the least frequent suffix offering a good selectivity\n\nIt reduces the search cost\n\nIf the tree does not fit into main memory, partition the database\n\nEfficient and scalable for mining both long and short frequent patterns"}]},{"name":"DM CAT 2 NOTES/M4 DM/Association-Rule-Mining-.pptx","parts":[{"page":1,"text":" Association Rule Mining \n\n"},{"page":2,"text":"Mining Association Rules in Large Databases\n\nAssociation rule mining.\nMining single-dimensional Boolean association rules from transactional databases.\nMining multilevel association rules from transactional databases.\nMining multidimensional association rules from transactional databases and data warehouse.\nFrom association mining to correlation analysis.\nConstraint-based association mining.\n\t\t"},{"page":3,"text":"What Is Association Mining?\n\nAssociation rule mining\nFinding frequent patterns, associations, correlations, or causal structures among sets of items or objects in transaction databases, relational databases, and other information repositories.\n\nApplications\nBasket data analysis, cross-marketing, catalog design, loss-leader analysis, clustering, classification, etc."},{"page":4,"text":"Association Mining\nRule form-\n   Prediction (Boolean variables) =>Prediction (Boolean variables) [support, confidence]\nComputer => antivirus _software\n [support =2%, confidence = 60%]\nbuys (x, “computer”) ®  buys (x, “antivirus_software”) \t\t[S=0.5%, C=60%]\n"},{"page":5,"text":"Association Rule: Basic Concepts\n\nGiven a database of transactions each transaction is a list of items (purchased by a customer in a visit).\nFind all rules that correlate the presence of one set of items with that of another set of items.\nFind frequent patterns.\nExample for frequent item-set mining is market basket analysis.\n"},{"page":6,"text":"Mining Frequent Patterns, Associations and correlations\nFrequent Patterns : As the name suggests patterns that occur frequently in data.\n\nFrequent Itemset : A set of items that frequently appear together in a transactional data set, such as milk and bread. \n\nFrequent Sequential Pattern : A frequently occurring subsequence, such as the pattern that customers tend to purchase first a PC, followed by a digital camera, and then a memory card."},{"page":7,"text":"Contd….\nSubstructure : Refer to different structural forms, such as graphs, trees, or lattices, which may be combined with itemsets or subsequences. \n\nIf a substructure occurs frequently, it is called a (frequent) structured pattern. \n\nMining frequent patterns leads to the discovery of interesting associations and correlations within data."},{"page":8,"text":"Contd….\nAssociation Analysis: from marketing perspective, determining which items are frequently purchased together within the same transaction. \nExample: An example is mined from the (some store) AllElectronic transactional database.\nbuys (X, “Computers”)  buys (X, “software”) [Support = 1%, confidence = 50% ]\nX represents customer\nConfidence or certainty = 50% , if a customer buys a computer there is a 50% chance that he/she will buy software as well.\nSupport = 1%, means that 1% of all the transactions under analysis showed that computer and software were purchased together. "},{"page":9,"text":"Support and Confidence\nSupport count: The support count of an itemset X, denoted by X.count, in a data set T is the number of transactions in T that contain X. Assume T has n transactions. \nThen, \n\n"},{"page":10,"text":"Contd….\nBag\nBooks\nBag\nBag\nUniform\nBag\nCrayons\nBooks\nUniform\nPencil\nUniform\nBag\nUniform\nPencil\nCrayons\nPencil\nUniform\nCrayons\nCrayons\nUniform\nCrayons\nUniform\nPencil\nBook\nBag\nBook\nBag\nBag\nPencil\nBooks\nSupport for {Bag, Uniform} = \n   5/10 = 0.5 \n\n\nConfidence for Bag  Uniform = \n    5/8 = 0.625"},{"page":11,"text":"Association rule performance measures\nConfidence\nSupport\nMinimum support threshold\nMinimum confidence threshold"},{"page":12,"text":"Rule Measures: Support and Confidence\nFind all the rules X & Y   Z with minimum confidence and support\nsupport, s, probability that a transaction contains {X  Y  Z}\nconfidence, c, conditional probability that a transaction having {X  Y} also contains Z\nLet minimum support 50%, and minimum confidence 50%, we have\nA   C  (50%, 66.6%)\nC   A  (50%, 100%)\n\n\n\n\n\nstudent\nbuys pen\nstudent\nbuys both\nstudent\nbuys note\n"},{"page":13,"text":"\n"},{"page":14,"text":"Martket Basket Analysis\nShopping baskets\nEach item has a Boolean variable representing the presence or absence of that item. \nEach basket can be represented by a Boolean vector of values assigned to these variables.\nIdentify patterns from Boolean vector.\nPatterns can be represented by association rules."},{"page":15,"text":"Association Rule Mining: A Road Map\nBoolean vs. quantitative associations\n    - Based on the types of values handled\nbuys(x, “SQLServer”) ^ buys(x, “DMBook”) =>  buys(x, “DBMiner”) [0.2%, 60%]\nage(x, “30..39”) ^ income(x, “42..48K”) => buys(x, “PC”) [1%, 75%]\nSingle dimension vs. multiple dimensional associations\nSingle level vs. multiple-level analysis"},{"page":16,"text":"Mining single-dimensional Boolean association rules from transactional databases\u000b\n"},{"page":17,"text":"Apriori Algorithm\nSingle dimensional, single-level, Boolean frequent item sets.\nFinding frequent item sets using candidate generation.\nGenerating association rules from frequent item sets."},{"page":18,"text":"Mining Association Rules—An Example\nFor rule A  C:\nsupport = support({A C}) = 50%\nconfidence = support({A C})/support({A}) = 66.6%\nThe Apriori principle:\nAny subset of a frequent itemset must be frequent\nMin. support 50%\nMin. confidence 50%\n"},{"page":19,"text":"Mining Frequent Itemsets: the Key Step\nFind the frequent itemsets: the sets of items that have minimum support\nA subset of a frequent itemset must also be a frequent itemset\ni.e., if {AB} is a frequent itemset, both {A} and {B} should be a frequent itemset\nIteratively find frequent itemsets with cardinality from 1 to k (k-itemset)\nUse the frequent itemsets to generate association rules."},{"page":20,"text":"The Apriori Algorithm\nLk: Set of frequent itemsets of size k (those with min support)\nCk: Set of candidate itemset of size k (potentially frequent itemsets)\n\nL1 = {frequent items};\nfor (k = 1; Lk !=; k++) do begin\n     Ck+1 = candidates generated from Lk;\n    for each transaction t in database do\n       increment the count of all candidates in Ck+1                            that are contained in t\n    Lk+1  = candidates in Ck+1 with min_support\n    end\nreturn k Lk;"},{"page":21,"text":"The Apriori Algorithm\nJoin Step\nCk is generated by joining Lk-1with itself\n\nPrune Step\n Any (k-1)-itemset that is not frequent cannot be a subset of a frequent k-itemset"},{"page":22,"text":"The Apriori Algorithm — Example\nScan D\n\nC1\nL1\nL2\nC2\nC2\n\nScan D\n\n\nC3\nL3\nScan D\n\n\n\nDatabase D\nMin support =50% = 2 trans"},{"page":23,"text":"\n"},{"page":24,"text":"How to Generate Candidates?\nSuppose the items in Lk-1 are listed in  order\nStep 1: self-joining Lk-1 \ninsert into Ck\nselect p.item1, p.item2, …, p.itemk-1, q.itemk-1\nfrom Lk-1 p, Lk-1 q\nwhere p.item1=q.item1, …, p.itemk-2=q.itemk-2, p.itemk-1 < q.itemk-1\nStep 2: pruning\nforall itemsets c in Ck do\nforall (k-1)-subsets s of c do\nif (s is not in Lk-1) then delete c from Ck"},{"page":25,"text":"Example of Generating Candidates\nL3={abc, abd, acd, ace, bcd}\nSelf-joining: L3*L3\nabcd  from abc and abd\nacde  from acd and ace\nPruning:\nacde is removed because ade is not in L3\nC4={abcd}"},{"page":26,"text":"How to Count Supports of Candidates?\nWhy counting supports of candidates a problem?\nThe total number of candidates can be very huge\n One transaction may contain many candidates\nMethod:\nCandidate itemsets are stored in a hash-tree\nLeaf node of hash-tree contains a list of itemsets and counts\nInterior node contains a hash table\nSubset function: finds all the candidates contained in a transaction"},{"page":27,"text":"Is Apriori Fast Enough? — Performance Bottlenecks\nThe core of the Apriori algorithm:\nUse frequent (k – 1)-itemsets to generate candidate frequent k-itemsets\nUse database scan and pattern matching to collect counts for the candidate itemsets\nThe bottleneck of Apriori: candidate generation\nHuge candidate sets:\n104 frequent 1-itemset will generate 107 candidate 2-itemsets\nTo discover a frequent pattern of size 100, e.g., {a1, a2, …, a100}, one needs to generate 2100  1030 candidates.\nMultiple scans of database: \nNeeds (n +1 ) scans, n  is the length of the longest pattern"},{"page":28,"text":"Methods to Improve Apriori’s Efficiency\nTransaction reduction: A transaction that does not contain any frequent k-itemset is useless in subsequent scans\nPartitioning: Any itemset that is potentially frequent in DB must be frequent in at least one of the partitions of DB\nSampling: mining on a subset of given data, lower support threshold + a method to determine the completeness\nDynamic itemset counting: add new candidate itemsets only when all of their subsets are estimated to be frequent"}]},{"name":"DM CAT 2 NOTES/M4 DM/Frequent Item set in Data set (Association Rule Mining).docx","parts":[{"page":1,"text":"Frequent Item set in Data set (Association Rule Mining)\n\nINTRODUCTION:\nFrequent item sets, also known as association rules, are a fundamental concept in association rule mining, which is a technique used in data mining to discover relationships between items in a dataset. Association rule mining aims to identify relationships between items in a dataset that occur frequently together.\nA frequent item set is a set of items that occur together frequently in a dataset. The frequency of an item set is measured by the support count, which is the number of transactions or records in the dataset that contain the item set. For example, if a dataset contains 100 transactions and the item set {milk, bread} appears in 20 of those transactions, the support count for {milk, bread} is 20.\nAssociation rule mining algorithms, such as Apriori or FP-Growth, are used to find frequent item sets and generate association rules. These algorithms work by iteratively generating candidate item sets and pruning those that do not meet the minimum support threshold. Once the frequent item sets are found, association rules can be generated by using the concept of confidence, which is the ratio of the number of transactions that contain the item set and the number of transactions that contain the antecedent (left-hand side) of the rule.\nFrequent item sets and association rules can be used for a variety of tasks such as market basket analysis, cross-selling and recommendation systems. However, it should be noted that association rule mining can generate a large number of rules, many of which may be irrelevant or uninteresting. Therefore, it is important to use appropriate measures such as lift and conviction to evaluate the interestingness of the generated rules.\nAssociation Mining searches for frequent items in the data set. In frequent mining usually, interesting associations and correlations between item sets in transactional and relational databases are found. In short, Frequent Mining shows which items appear together in a transaction or relationship. \n\nNeed of Association Mining: Frequent mining is the generation of association rules from a Transactional Dataset. If there are 2 items X and Y purchased frequently then it’s good to put them together in stores or provide some discount offer on one item on purchase of another item. This can really increase sales. For example, it is likely to find that if a customer buys Milk and bread he/she also buys Butter. So the association rule is [‘milk]^[‘bread’]=>[‘butter’]. So the seller can suggest the customer buy butter if he/she buys Milk and Bread.\n\nImportant Definitions :\nSupport : It is one of the measures of interestingness. This tells about the usefulness and certainty of rules. 5% Support means total 5% of transactions in the database follow the rule.\nSupport(A -> B) = Support_count(A ∪ B)\n\nConfidence: A confidence of 60% means that 60% of the customers who purchased a milk and bread also bought butter.\nConfidence(A -> B) = Support_count(A ∪ B) / Support_count(A)\nIf a rule satisfies minimum support and minimum confidence, it is strong. \n\nSupport_count(X): Number of transactions in which X appears. If X is A union B then it is the number of transactions in which A and B both are present.\n\nMaximal Itemset: An itemset is maximal frequent if none of its supersets are frequent.\n\nClosed Itemset: An itemset is closed if none of its immediate supersets have same support count same as Itemset.\n\n\nK- Itemset: Itemset which contains K items is a K-itemset. So it can be said that an itemset is frequent if the corresponding support count is greater than the minimum support count.\n\nExample On finding Frequent Itemsets – Consider the given dataset with given transactions. \nLets say minimum support count is 3\nRelation hold is maximal frequent => closed => frequent\n1-frequent: {A} = 3; // not closed due to {A, C} and not maximal {B} = 4; // not closed due to {B, D} and no maximal {C} = 4; // not closed due to {C, D} not maximal {D} = 5; // closed item-set since not immediate super-set has same count. Not maximal \n2-frequent: {A, B} = 2 // not frequent because support count < minimum support count so ignore {A, C} = 3 // not closed due to {A, C, D} {A, D} = 3 // not closed due to {A, C, D} {B, C} = 3 // not closed due to {B, C, D} {B, D} = 4 // closed but not maximal due to {B, C, D} {C, D} = 4 // closed but not maximal due to {B, C, D} \n3-frequent: {A, B, C} = 2 // ignore not frequent because support count < minimum support count {A, B, D} = 2 // ignore not frequent because support count < minimum support count {A, C, D} = 3 // maximal frequent {B, C, D} = 3 // maximal frequent \n4-frequent: {A, B, C, D} = 2 //ignore not frequent </\n\nADVANTAGES OR DISADVANTAGES:\nAdvantages of using frequent item sets and association rule mining include:\nEfficient discovery of patterns: Association rule mining algorithms are efficient at discovering patterns in large datasets, making them useful for tasks such as market basket analysis and recommendation systems.\nEasy to interpret: The results of association rule mining are easy to understand and interpret, making it possible to explain the patterns found in the data.\nCan be used in a wide range of applications: Association rule mining can be used in a wide range of applications such as retail, finance, and healthcare, which can help to improve decision-making and increase revenue.\nHandling large datasets: These algorithms can handle large datasets with many items and transactions, which makes them suitable for big-data scenarios.\n\nDisadvantages of using frequent item sets and association rule mining include:\nLarge number of generated rules: Association rule mining can generate a large number of rules, many of which may be irrelevant or uninteresting, which can make it difficult to identify the most important patterns.\nLimited in detecting complex relationships: Association rule mining is limited in its ability to detect complex relationships between items, and it only considers the co-occurrence of items in the same transaction.\nCan be computationally expensive: As the number of items and transactions increases, the number of candidate item sets also increases, which can make the algorithm computationally expensive.\nNeed to define the minimum support and confidence threshold: The minimum support and confidence threshold must be set before the association rule mining process, which can be difficult and requires a good understanding of the data.\n"}]},{"name":"DM CAT 2 NOTES/M4 DM/PERFORMANCEMETRICS.docx","parts":[{"page":1,"text":"\nClassification – Performance measures\n\nClassification is a type of supervised machine learning problem where the goal is to predict, for one or more observations, the category or class they belong to.\n\nConfusion Matrix:\nConfusion Matrix usually causes a lot of confusion even in those who are using them regularly. Terms used in defining a confusion matrix are TP, TN, FP, and FN.\nUse case: Let’s take an example of a patient who has gone to a doctor with certain symptoms. Since it’s the season of Covid, let’s assume that he went with fever, cough, throat ache, and cold. These are symptoms that can occur during any seasonal changes too. Hence, it is tricky for the doctor to do the right diagnosis.\nTrue Positive (TP): \nLet’s say the patient was actually suffering from Covid and on doing the required assessment, the doctor classified him as a Covid patient. This is called TP or True Positive. This is because the case is positive in real and at the same time the case was classified correctly. Now, the patient can be given appropriate treatment which means, the decision made by the doctor will have a positive effect on the patient and society.\nFalse Positive (FP):\nLet’s say the patient was not suffering from Covid and he was only showing symptoms of seasonal flu but the doctor diagnosed him with Covid. This is called FP or False Positive. This is because the case was actually negative but was falsely classified as positive. Now, the patient will end up getting admitted to the hospital or home and will be given treatment for Covid. This is an unnecessary inconvenience for him and others as he will get unwanted treatment and quarantine. This is called Type I Error.\nTrue Negative (TN):\nLet’s say the patient was not suffering from Covid and the doctor also gave him a clean chit. This is called TN or True Negative. This is because the case was actually negative and was also classified as negative which is the right thing to do. Now the patient will get treatment for his actual illness instead of taking Covid treatment.\nFalse Negative (FN):\nLet’s say the patient was suffering from Covid and the doctor did not diagnose him with Covid. This is called FN or False Negative as the case was actually positive but was falsely classified as negative. Now the patient will not get the right treatment and also he will spread the disease to others. This is a highly dangerous situation in this example. This is also called Type II Error.\nSummary: \nIn this particular example, both FN and FP are dangerous and the classification model which has the lowest FN and FP values needs to be chosen for implementation. \nBut in case there is a tie between few models which score very similar when it comes to FP and FN, in this scenario the model with the least FN needs to be chosen. This is because we simply cannot afford to have FNs! The goal of the hospital would be to not let even one patient go undiagnosed (no FNs) even if some patients get diagnosed wrongly (FPs) and asked to go under quarantine and special care.\t\n\nClassification Performance Measures\n\nSuppose a doctor wants to predict whether a patient has COVID or not.\n\nThere are only two possible answers:\n\nPositive = COVID\nNegative = Not COVID\n\nHere is how a confusion matrix looks like:\n\n\n\nAccuracy:\nAccuracy = (TP + TN) / (TP + FP +TN + FN)\nThis term tells us how many right classifications were made out of all the classifications. In other words, how many TPs and TNs were done out of TP + TN + FP + FNs. It tells the ratio of “True”s to the sum of “True”s and “False”s.\nUse case: Out of all the patients who visited the doctor, how many were correctly diagnosed as Covid positive and Covid negative.\nError Rate\nIt is the opposite of accuracy. This metric measures the performance of a model as the name suggests in terms of incorrect predictions.\n\n\n\nOverall, how many predictions did I get correct?\"——?\n\"How many predictions did I get wrong?\"—————-?\nArea Under Curve (AUC) and ROC Curve:\nAUC or Area Under Curve is used in conjecture with ROC Curve which is Receiver Operating Characteristics Curve. AUC is the area under the ROC Curve. So let’s first understand the ROC Curve.\n\nThe ROC (Receiver Operating Characteristics) curve is a plot of the performance of the model (a plot of the true positive rate and the false positive rate) at all classification thresholds. The AUC is the measurement of the entire two-dimensional area under the curve and as such is a measure of the performance of the model at all possible classification thresholds.\nROC curves plot the accuracy of the model and therefore are best suited to diagnose the performance of models where the data is not imbalanced.\n\n\nPrecision\nPrecision measures how good the model is at correctly identifying the positive class. In other words, out of all predictions for the positive class how many were actually correct? Using alone this metric for optimising a model we would be minimising the false positives. This might be desirable for our fraud detection example, but would be less useful for diagnosing cancer as we would have little understanding of positive observations that are missed.\n\nOut of all that were marked as positive, how many are actually truly positive.\nUse case: Let’s take another example of a classification algorithm that marks emails as spam or not. Here, if emails that are of importance get marked as positive, then useful emails will end up going to the “Spam” folder, which is dangerous. Hence, the classification model which has the least FP value needs to be selected. In other words, a model that has the highest precision needs to be selected among all the models.\nRecall\nRecall tell us how good the model is at correctly predicting all the positive observations in the dataset. However, it does not include information about the false positives so would be more useful in the cancer example.\n\nOut of all the actual real positive cases, how many were identified as positive.\nUse case: Out of all the actual Covid patients who visited the doctor, how many were actually diagnosed as Covid positive. Hence, the classification model which has the least FN value needs to be selected. In other words, a model that has the highest recall value needs to be selected among all the models.\n\nUsually, precision and recall are observed together by constructing a precision-recall curve. This can help to visualise the trade-offs between the two metrics at different thresholds.\n\nF1 score\nThe F1 score is the harmonic mean of precision and recall. The F1 score will give a number between 0 and 1. If the F1 score is 1.0 this indicates perfect precision and recall. If the F1 score is 0 this means that either the precision or the recall is 0.\n\n\nF1 score = 2* (Precision * Recall) / (Precision + Recall)\n\n\n\nSpecificity:\nSpecificity = TN/ (TN + FP)\nOut of all the real negative cases, how many were identified as negative.\nUse case: Out of all the non-Covid patients who visited the doctor, how many were diagnosed as non-Covid.\n\nKappa\nThe kappa statistic compares the observed accuracy to an expected accuracy or the accuracy expected from random chance. One of the flaws of pure accuracy is that if a class is imbalanced then making predictions at random could give a high accuracy score. Kappa accounts for this by comparing the model accuracy to the expected accuracy based on the number of instances in each class.\nEssentially it tells us how the model is performing compared to a model that classifies observations at random according to the frequency of each class.\n\n\n\nKappa returns a value at or below 1, negative values are possible. One drawback of this statistic is that there is no agreed standard to interpret its values. Although, a general interpretation of the metric was given by Landis and Koch in 1977.\n\n\nMCC\nMCC (Matthews Correlation Coefficient) is generally considered one of the best measurements of performance for a classification model. This is largely because, unlike any of the previously mentioned metrics, it takes all possible prediction outcomes into account. If there are imbalances in the classes this will therefore be accounted for.\nThe MCC is essentially a correlation coefficient between the observed and predicted classifications. As with any correlation coefficient, its value will lie between -1.0 and +1.0. A value of +1 would indicate a perfect model.\n\n\n\n\n[TABLE]\nActual condition | Doctor's prediction | What is it?\nCOVID | COVID | TP\nNot COVID | COVID | FP\nNot COVID | Not COVID | TN\nCOVID | Not COVID | FN\n[TABLE]\nMeasure |  simple meaning\nTP | Correctly predicted Positive\nTN | Correctly predicted Negative\nFP | Wrongly predicted Positive\nFN | Wrongly predicted Negative\nAccuracy | Overall, how many are correct?\nError Rate | Overall, how many are wrong?\nPrecision | When I say Positive, am I correct?\nRecall | Did I find all the actual Positives?\nSpecificity | Did I correctly find the Negatives?\nF1 Score | Balance of Precision and Recall\nROC | Performance at different thresholds\nAUC | How well can the model separate classes?\nKappa | How good is the model compared with chance?\nMCC | Uses TP, TN, FP, FN; good for imbalanced data"}]},{"name":"DM CAT 2 NOTES/M4 DM/Cross-validation Techniques.docx","parts":[{"page":1,"text":"\nCross-validation Techniques in Machine Learning\n\nCross-Validation is a resampling technique that helps to make our model sure about its efficiency and accuracy on the unseen data. It is a method for evaluating Machine Learning models by training several other Machine learning models on subsets of the available input data set and evaluating them on the subset of the data set.\nWe have different types of Cross-Validation techniques but let’s see the basic functionality of Cross-Validation: The first step is to divide the cleaned data set into K partitions of equal size.\nThen we need to treat the Fold-1 as a test fold while the other K-1 as train folds and compute the score of the test-fold.\nWe need to repeat step 2 for all folds taking another fold as a test while remaining as a train.\nLast step would be to take the average of scores of all the folds.\n\nImagine you have 100 student records and you build a model to predict whether students will pass or fail.\n\nYou don't want to train the model on all 100 and then test it on the same 100.\n\nInstead: Train on some data → Test on different data → Repeat → Take the average score.That's Cross-Validation.\n1. Holdout Method\nThis technique works on removing a part of the training data set and sending that to a model that was trained on the rest of the data set to get the predictions. We then calculate the error estimation which tells how our model is doing on unseen data sets. This is known as the Holdout Method.\nPros\nThis Method is Fully independent of data.\nThis Method only needs to be run once so has lower computational costs.\nCons\nThe Performance is subject to higher variance given the smaller size of the data.\n\n2. K-Fold Cross-Validation\nIn a Data-Driven World, there is never enough data to train your model, on top of that removing a part of it for validation poses a greater problem of Underfitting and we risk losing important patterns and trends in our data set, which in turn increases Bias. So ideally, we require a method that provides ample amounts of data for training the model and leaves ample amounts of data for validation sets.\nIn K-Fold cross-validation, the data is divided into k subsets or we can take it as a holdout method repeated k times, such that each time, one of the k subsets is used as the validation set and the other k-1 subsets as the training set. The error is averaged over all k trials to get the total efficiency of our model.\n\nWe can see that each data point will be in a validation set exactly once and will be in a training set k-1 time. This helps us reduce bias as we are using most of the data for fitting and reduces variance as most of the data is also being used in the validation set.\n\nThere is K-Fold. K-Fold cross validation requires a number, k, that indicates how and where to split your data. Let’s start with k = 5. As a result, the data is divided into five categories. The first 20% would be regarded as test data, while the remaining 80% would be regarded as train data. It then tends to take the next 20%, with the remaining 80% being test data and so on. It then computes a score by using the average of all five data sets.\n\nPros\nThis will help to overcome the problem of computational power.\nModels may not be affected much if an outlier is present in data.\nIt helps us overcome the problem of variability.\nCons\nImbalanced data sets will impact our model.\n\n\n3. Stratified K-Fold Cross-Validation\nK Fold Cross Validation technique will not work as expected for an Imbalanced Data set. When we have an imbalanced data set, we need a slight change to the K Fold cross validation technique, such that each fold contains approximately the same strata of samples of each output class as the complete. This variation of using a stratum in K Fold Cross Validation is known as Stratified K Fold Cross Validation.\n\nThe stratified K-fold cross-validation method is yet another method that involves the division of data sample sets in 'k' subsets or folds. \n \nHowever, in order to ensure that there is no biased division of data in 'k' folds, the process of stratification is conducted to rearrange the data in such a manner that each fold represents the whole data. \n\nPros\nIt can improve different models using hyper-parameter tuning.\nHelps us compare models.\nIt helps in reducing both Bias and Variance.\n\n\n4. Leave-P-Out Cross-Validation\nIn this approach we leave p data points out of training data out of a total n data point, then n-p samples are used to train the model and p points are used as the validation set. This is repeated for all combinations, and then the error is averaged.\nPros\nIt has Zero randomness\nThe Bias will be lower\nCons\nThis method is exhaustive and computationally infeasible.\n\n\nLeave One Out Cross Validation\nThis method identifies one data point from the set of data and trains the remaining data. It then loops through the entire data set, omitting one data point each time. The average is then used to calculate the score. This method will consume a lot of time and a large number of computer resources.\nRolling Cross-Validation\nFor data based on time series, no cross-validation method is effective except the rolling cross-validation method. This method involves taking a subset out of the data set that serves as the training data set. \n \nA consequent subset is used for testing the data that helps go evaluate the accuracy of the model. \n \nOnce the testing is done, the process is repeated by taking a subset from the data sample, training the model with it, and testing another subset on the same. This is known as the rolling method of cross-validation as the subsets keep rolling until all data points are used for training and testing. \n\nMonte Carlo Cross-Validation\n \nThe Monte Carlo cross-validation method refers to a validation method that randomly picks a subset that is used to train the model. The remaining data points are used for testing the model. \n \nThis process is repeated a number of times as the same data sample is used for procuring training and testing data sets. \n \nUnlike the holdout method, the data sample is tried a number of times which ensures that accuracy is maintained and the model is validated in an unbiased manner. \n \nOne of the biggest disadvantages of this method is that particular data points could be left while some data points could be repeatedly used for training and testing. \n\n\n[TABLE]\nTechnique | Think like this\nHoldout | Split once\nK-Fold | Divide into K parts and take turns\nStratified K-Fold | Take turns while keeping same class ratio\nLeave-P-Out | Leave P records for testing\nLeave-One-Out | Leave 1 record for testing\nRolling | Move forward in time\nMonte Carlo | Random split repeatedly"}]},{"name":"DM CAT 2 NOTES/M4 DM/M4 DM.pptx","parts":[{"page":1,"text":"\u000b\n \n1\n  Data Mining  (BCSE208L)\n\nMs. MAHESWARI .B\nAssistant Professor, SCOPE\n(PRP ANNEX- 101L)\nmaheswari.b@vit.ac.in"},{"page":2,"text":"1\n"},{"page":3,"text":"What is Frequent Pattern Mining?\nFrequent Pattern Mining is a Data Mining technique used to discover relationships, associations, or patterns among items in large transactional databases.\n\n5\nTransaction ID | Items Purchased\nT1 | Bread, Milk\nT2 | Bread, Diaper, Beer, Eggs\nT3 | Milk, Diaper, Beer, Coke\nT4 | Bread, Milk, Diaper, Beer\nT5 | Bread, Milk, Diaper, Coke\nHere, we try to identify frequently purchased item combinations."},{"page":4,"text":"What is Frequent Pattern Mining?\n\n\n6\nFrequent Pattern Mining (FPM) is the process of discovering patterns, relationships, correlations or recurring structures that occur frequently in a dataset.\nA frequent pattern occurs at least as often as a user-defined minimum frequency (minimum support).\nMost common use: discovering frequently co-occurring items in transaction databases.\nExample: {Bread, Milk} appearing in many supermarket transactions can reveal a useful purchasing relationship.\nApplications include market basket analysis, recommendation, web usage mining, healthcare, bioinformatics and fraud detection.\n"},{"page":5,"text":"What is Frequent Pattern Mining?\n\n\n4\nIt helps answer questions like:\nWhich products are purchased together? \nWhich medicines are prescribed together? \nWhich web pages are visited together? \nWhich books are borrowed together? "},{"page":6,"text":"What is Association Rule Mining?\u000b\nAssociation Rule Mining finds relationships between items in a transaction.\nGeneral Rule: \nMeans     \"If a customer buys X, they are likely to buy Y.“\n\nExample:  Bread → Milk\nCustomers buying Bread also tend to buy Milk.\n\n\n\n7"},{"page":7,"text":"Important Terms\n1. Item: A single product.\nBread, Milk, Butter\n\n2. Itemset: A collection of one or more items.\n{Bread}\n{Milk}\n{Bread, Milk}\n\n3. Transaction: A customer's purchase.\nT1 = {Bread, Milk, Butter}\n\n\n\n\n8"},{"page":8,"text":"Important Terms\n4. Frequent Itemset: An itemset appearing more than the minimum support threshold. \nExample  Minimum Support = 40%   -Bread appears in 70%  (FI)\n\n5. Support: Support measures how frequently an itemset appears.\nFormula\n\nExample\nTransactions = 5\nBread appears in 4 transactions.\nSupport    80%\n\n\n\n9"},{"page":9,"text":"Important Terms\n5. Confidence: How often item Y appears when item X appears.\n\nBread appears0- 8 TIMES\nBread and Milk together 6 TIMES\nConfidence :6/8 = 0.75  (75% of customers buying Bread also buy Milk.)\n\n\n\n\n\n10\n\n\n\n"},{"page":10,"text":"Important Terms\n\n6. Lift: Lift measures the strength of association between two items.\nLift=Support(Y)/ Confidence(X→Y)​\n\n\n\n\n11\nLift | Meaning\nLift > 1 | Positive Association\nLift = 1 | Independent\nLift < 1 | Negative Association"},{"page":11,"text":"What is Apriori Algorithm?\u000b\nApriori is one of the most popular algorithms used for Association Rule Mining.\nIt finds:\nFrequent Itemsets , Strong Association Rules , by using Support and Confidence.\nIt was proposed by Rakesh Agrawal and Ramakrishnan Srikant (1994).\nThe word Apriori means \"prior knowledge\".\nThe algorithm uses the following prior knowledge:\nIf an itemset is frequent, then all of its subsets must also be frequent.\nThis is called the Apriori Property.\n\n12"},{"page":12,"text":"What is Apriori Algorithm?\u000b\nSuppose:  {Bread, Milk, Butter} is frequent. Then automatically,\n{Bread}\n{Milk}\n{Butter}\n{Bread, Milk}\n{Bread, Butter}\n{Milk, Butter}\n                                                         must also be frequent.\nIf even one subset is not frequent, the larger itemset is discarded immediately.\nThis process is called Pruning.\n\n\n13"},{"page":13,"text":"\n12\nTerm | Definition | Example\nItem | A single object in a transaction | Bread\nTransaction | A collection of items occurring together | T1 = {Bread, Milk}\nItemset | A set of one or more items | {Bread, Milk}\nk-itemset | An itemset containing k items | {A,B,C} is a 3-itemset\nTransaction Database | Collection of transactions | T1, T2, …, Tn\nTID | Unique transaction identifier | T1"},{"page":14,"text":"\n\nTHANK YOU!\n14"}]},{"name":"DM CAT 2 NOTES/M5 DM/M5 BBN EXAMPLE.pptx","parts":[{"page":1,"text":"Bayesian Belief Network\nBayesian belief network is key computer technology for dealing with probabilistic events and to solve a problem which has uncertainty. We can define a Bayesian network as:\n\"A Bayesian network is a probabilistic graphical model which represents a set of variables and their conditional dependencies using a directed acyclic graph.\"\nIt is also called a Bayes network, belief network, decision network, or Bayesian model.\n"},{"page":2,"text":"Real world applications are probabilistic in nature, and to represent the relationship between multiple events, we need a Bayesian network. It can also be used in various tasks including prediction, anomaly detection, diagnostics, automated insight, reasoning, time series prediction, and decision making under uncertainty.\nBayesian Network can be used for building models from data and experts opinions, and it consists of two parts:\nDirected Acyclic Graph\nTable of conditional probabilities.\n"},{"page":3,"text":"\nA Bayesian network graph is made up of nodes and Arcs (directed links)\n\nEach node corresponds to the random variables, and a variable can be continuous or discrete.\n\nArc or directed arrows represent the causal relationship or conditional probabilities between random variables. These directed links or arrows connect the pair of nodes in the graph.\u000bThese links represent that one node directly influence the other node, and if there is no directed link that means that nodes are independent with each other\nIn the above diagram, A, B, C, and D are random variables represented by the nodes of the network graph.\nIf we are considering node B, which is connected with node A by a directed arrow, then node A is called the parent of Node B.\nNode C is independent of node A.\n\n"},{"page":4,"text":"The Bayesian network has mainly two components:\nCausal Component\nActual numbers\nEach node in the Bayesian network has condition probability distribution P(Xi |Parent(Xi) ), which determines the effect of the parent on that node.\nBayesian network is based on Joint probability distribution and conditional probability. So let's first understand the joint probability distribution:\n"},{"page":5,"text":"Joint probability distribution\u000b\nIf we have variables x1, x2, x3,....., xn, then the probabilities of a different combination of x1, x2, x3.. xn, are known as Joint probability distribution.\nP[x1, x2, x3,....., xn], it can be written as the following way in terms of the joint probability distribution.\n= P[x1| x2, x3,....., xn]P[x2, x3,....., xn]\n= P[x1| x2, x3,....., xn]P[x2|x3,....., xn]....P[xn-1|xn]P[xn].\nIn general for each variable Xi, we can write the equation as:\nP(Xi|Xi-1,........., X1) = P(Xi |Parents(Xi ))\n"},{"page":6,"text":"Explanation of Bayesian network by example\u000b\nExample: Harry installed a new burglar alarm at his home to detect burglary. The alarm reliably responds at detecting a burglary but also responds for minor earthquakes. Harry has two neighbours David and Sophia, who have taken a responsibility to inform Harry at work when they hear the alarm. David always calls Harry when he hears the alarm, but sometimes he got confused with the phone ringing and calls at that time too. On the other hand, Sophia likes to listen to high music, so sometimes she misses to hear the alarm. Here we would like to compute the probability of Burglary Alarm.\nProblem:\nCalculate the probability that alarm has sounded, but there is neither a burglary, nor an earthquake occurred, and David and Sophia both called the Harry.\n"},{"page":7,"text":"Solution:\nThe Bayesian network for the above problem is given below. The network structure is showing that burglary and earthquake is the parent node of the alarm and directly affecting the probability of alarm's going off, but David and Sophia's calls depend on alarm probability.\nThe network is representing that our assumptions do not directly perceive the burglary and also do not notice the minor earthquake, and they also not confer before calling.\nThe conditional distributions for each node are given as conditional probabilities table or CPT.\nEach row in the CPT must be sum to 1 because all the entries in the table represent an exhaustive set of cases for the variable.\nIn CPT, a boolean variable with k boolean parents contains 2K probabilities. Hence, if there are two parents, then CPT will contain 4 probability values"},{"page":8,"text":"\nList of all events occurring in this network:\nBurglary (B)\nEarthquake(E)\nAlarm(A)\nDavid Calls(D)\nSophia calls(S)\n"},{"page":9,"text":"\nWe can write the events of problem statement in the form of probability: P[D, S, A, B, E], can rewrite the above probability statement using joint probability distribution:\nP[D, S, A, B, E]= P[D | S, A, B, E]. P[S, A, B, E]\n=P[D | S, A, B, E]. P[S | A, B, E]. P[A, B, E]\n= P [D| A]. P [ S| A, B, E]. P[ A, B, E]\n= P[D | A]. P[ S | A]. P[A| B, E]. P[B, E]\n= P[D | A ]. P[S | A]. P[A| B, E]. P[B ]. P[E]\n"},{"page":10,"text":"\n"},{"page":11,"text":"\nFrom the formula of joint distribution, we can write the problem statement in the form of probability distribution:\nP(S, D, A, ¬B, ¬E) = P (S|A) *P (D|A)*P (A|¬B ^ ¬E) *P (¬B) *P (¬E).\n= 0.75* 0.91* 0.001* 0.998*0.999\n= 0.00068045.\nHence, a Bayesian network can answer any query about the domain by using Joint distribution.\n"}]},{"name":"DM CAT 2 NOTES/M5 DM/M5 CLASSIFICATION & DT.pptx","parts":[{"page":1,"text":"*\nData Mining: Concepts and Techniques\n*\nClassification  \npredicts categorical class labels (discrete or nominal)\nclassifies data (constructs a model) based on the training set and the values (class labels) in a classifying attribute and uses it in classifying new data\nPrediction  \nmodels continuous-valued functions, i.e., predicts unknown or missing values \nTypical applications\nCredit approval\nTarget marketing\nMedical diagnosis\nFraud detection\nClassification tells us which category something belongs to. Prediction tells us what numerical value we can expect.\nClassification vs. Prediction"},{"page":2,"text":"*\nData Mining: Concepts and Techniques\n*\nClassification—A Two-Step Process \nModel construction: describing a set of predetermined classes\nEach tuple/sample is assumed to belong to a predefined class, as determined by the class label attribute\nThe set of tuples used for model construction is training set\nThe model is represented as classification rules, decision trees, or mathematical formulae\nModel usage: for classifying future or unknown objects\nEstimate accuracy of the model\nThe known label of test sample is compared with the classified result from the model\nAccuracy rate is the percentage of test set samples that are correctly classified by the model\nTest set is independent of training set, otherwise over-fitting will occur\nIf the accuracy is acceptable, use the model to classify data tuples whose class labels are not known"},{"page":3,"text":"*\nData Mining: Concepts and Techniques\n*\nProcess (1): Model Construction\n\n\nClassification\nAlgorithms\n\nIF rank = ‘professor’\nOR years > 6\nTHEN tenured = ‘yes’ \n\n\n"},{"page":4,"text":"*\nData Mining: Concepts and Techniques\n*\nProcess (2): Using the Model in Prediction \n\n\n\n\n(Jeff, Professor, 4)\n\n\n\nTenured?"},{"page":5,"text":"*\nData Mining: Concepts and Techniques\n*\nSupervised vs. Unsupervised Learning\nSupervised learning (classification)\nSupervision: The training data (observations, measurements, etc.) are accompanied by labels indicating the class of the observations\nNew data is classified based on the training set\nUnsupervised learning (clustering)\nThe class labels of training data is unknown\nGiven a set of measurements, observations, etc. with the aim of establishing the existence of classes or clusters in the data"},{"page":6,"text":"*\nData Mining: Concepts and Techniques\n*\nIssues: Data Preparation\nData cleaning\nPreprocess data in order to reduce noise and handle missing values\nRelevance analysis (feature selection)\nRemove the irrelevant or redundant attributes\nData transformation\nGeneralize and/or normalize data"},{"page":7,"text":"*\nData Mining: Concepts and Techniques\n*\nIssues: Evaluating Classification Methods\nAccuracy\nclassifier accuracy: predicting class label\npredictor accuracy: guessing value of predicted attributes\nSpeed\ntime to construct the model (training time)\ntime to use the model (classification/prediction time)\nRobustness: handling noise and missing values\nScalability: efficiency in disk-resident databases \nInterpretability\nunderstanding and insight provided by the model\nOther measures, e.g., goodness of rules, such as decision tree size or compactness of classification rules"},{"page":8,"text":"\nA decision tree represents decisions in a tree structure.\nRoot node: First attribute selected.\nInternal node: Decision/test on an attribute.\nBranch: Result of the test.\nLeaf node: Final predicted class.\nExample:\nAge?\n→ Young → Student?\n→ Yes → Buys computer = Yes\n→ No → Buys computer = No\n*\nData Mining: Concepts and Techniques\n*"},{"page":9,"text":"\nThe most notable types of decision tree algorithms are:-\n1. Iterative Dichotomiser 3 (ID3): This algorithm uses Information Gain to decide which attribute is to be used to classify the current subset of the data. For each level of the tree, information gain is calculated for the remaining data recursively.\n2. C4.5: This algorithm is the successor of the ID3 algorithm. This algorithm uses either Information gain or Gain ratio to decide upon the classifying attribute. It is a direct improvement from the ID3 algorithm as it can handle both continuous and missing attribute values.\n3. Classification and Regression Tree(CART): It is a dynamic learning algorithm which can produce a regression tree as well as a classification tree depending upon the dependent variable.\n9/17/2026\nData Mining: Concepts and Techniques\n8"},{"page":10,"text":"*\nData Mining: Concepts and Techniques\n*\nDecision Tree Induction: Training Dataset\nThis follows an  example of Quinlan’s ID3 (Playing Tennis)"},{"page":11,"text":"*\nData Mining: Concepts and Techniques\n*\nOutput: A Decision Tree for “buys_computer”"},{"page":12,"text":"*\nData Mining: Concepts and Techniques\n*\nAlgorithm for Decision Tree Induction\nBasic algorithm (a greedy algorithm)—->At each step, choose the locally best attribute.\nTree is constructed in a top-down recursive divide-and-conquer manner\nAt start, all the training examples are at the root\nAttributes are categorical (if continuous-valued, they are discretized in advance)\nExamples are partitioned recursively based on selected attributes\nTest attributes are selected on the basis of a heuristic or statistical measure (e.g., information gain)\nConditions for stopping partitioning\nAll samples for a given node belong to the same class\nThere are no remaining attributes for further partitioning – majority voting is employed for classifying the leaf\nThere are no samples left"},{"page":13,"text":"\n\nThe algorithm does not try every possible complete tree and then select the globally best one.\nFor example:\nSuppose we have:\nAge → Information Gain = 0.25\nIncome → Information Gain = 0.10\nStudent → Information Gain = 0.15\nThe algorithm chooses Age because it has the highest Information Gain"},{"page":14,"text":"\nWhich attribute should I use first?”\nthree important measures\nInformation Gain\nGain Ratio\nGini Index\nThese measures help us select the splitting attribute.\nInformation Gain is mainly associated with ID3/C4.5.Choose the attribute that gives the highest information gain.Information gain tells us how much uncertainty is reduced after splitting the data.\nEntropy represents the amount of uncertainty or impurity in the data.\nIf all records belong to one class: Entropy = 0, because there is no uncertainty.\nIf the classes are mixed: Entropy is higher. For two classes, entropy is:\nEntropy(D) = −p₁ log₂(p₁) − p₂ log₂(p₂)\nwhere:\np₁ = proportion of class 1\np₂ = proportion of class 2\n"},{"page":15,"text":"\nInformation Gain is:\nGain(A) = Entropy(D) − Expected Entropy after splitting on A\nInformation Gain = Before splitting − After splitting\nHigher Information Gain means the attribute creates a better separation of classes."},{"page":16,"text":"*\nData Mining: Concepts and Techniques\n*\nAttribute Selection Measure: Information Gain (ID3/C4.5)\nSelect the attribute with the highest information gain\nLet pi be the probability that an arbitrary tuple in D belongs to class Ci, estimated by |Ci, D|/|D|\nExpected information (entropy) needed to classify a tuple in D:\n\nInformation needed (after using A to split D into v partitions) to classify D:\n\nInformation gained by branching on attribute A"},{"page":17,"text":"*\nData Mining: Concepts and Techniques\n*\nAttribute Selection: Information Gain\nClass P: buys_computer = “yes”\nClass N: buys_computer = “no”\n            means “age <=30” has 5 out of 14 samples, with 2 yes’es  and 3 no’s.   Hence\n\n\nSimilarly,"},{"page":18,"text":"             AGE\n          /    |     \\\n       ≤30   31-40    >40\nThe algorithm chooses Age because it has the highest Information Gain."},{"page":19,"text":"*\nData Mining: Concepts and Techniques\n*\nComputing Information-Gain for Continuous-Value Attributes\nLet attribute A be a continuous-valued attribute\nMust determine the best split point for A\nSort the value A in increasing order\nTypically, the midpoint between each pair of adjacent values is considered as a possible split point\n(ai+ai+1)/2 is the midpoint between the values of ai and ai+1\nThe point with the minimum expected information requirement for A is selected as the split-point for A\nSplit:\nD1 is the set of tuples in D satisfying A ≤ split-point, and D2 is the set of tuples in D satisfying A > split-point"},{"page":20,"text":"*\nData Mining: Concepts and Techniques\n*\nGain Ratio for Attribute Selection (C4.5)\nInformation gain measure is biased towards attributes with a large number of values\nC4.5 (a successor of ID3) uses gain ratio to overcome the problem (normalization to information gain)\n\n\nGainRatio(A) = Gain(A)/SplitInfo(A)\nEx.\n\ngain_ratio(income) = 0.029/0.926 = 0.031\nThe attribute with the maximum gain ratio is selected as the splitting attribute"},{"page":21,"text":"*\nData Mining: Concepts and Techniques\n*\nGini index (CART, IBM IntelligentMiner)\nIf a data set D contains examples from n classes, gini index, gini(D) is defined as\n\n    \n     where pj is the relative frequency of class j in D\nIf a data set D  is split on A into two subsets D1 and D2, the gini index gini(D) is defined as\n\n\nReduction in Impurity:\n\n\nThe attribute provides the smallest ginisplit(D) (or the largest reduction in impurity) is chosen to split the node (need to enumerate all the possible splitting points for each attribute)"},{"page":22,"text":"*\nData Mining: Concepts and Techniques\n*\nGini index (CART, IBM IntelligentMiner)\nEx.  D has 9 tuples in buys_computer = “yes” and 5 in “no”\n\n\nSuppose the attribute income partitions D into 10 in D1: {low, medium} and 4 in D2\n\n\n\nbut gini{medium,high} is 0.30 and thus the best since it is the lowest\nAll attributes are assumed continuous-valued\nMay need other tools, e.g., clustering, to get the possible split values\nCan be modified for categorical attributes"},{"page":23,"text":"*\nData Mining: Concepts and Techniques\n*\nComparing Attribute Selection Measures\nThe three measures, in general, return good results but\nInformation gain: \nbiased towards multivalued attributes\nGain ratio: \ntends to prefer unbalanced splits in which one partition is much smaller than the others\nGini index:  Gini(D) = 1 − Σ pⱼ² , pⱼ = relative frequency of class j\nbiased to multivalued attributes\nhas difficulty when # of classes is large\ntends to favor tests that result in equal-sized partitions and purity in both partitions"},{"page":24,"text":"*\nData Mining: Concepts and Techniques\n*\nExample: Rule extraction from our buys_computer decision-tree\nIF age = young AND student = no             THEN buys_computer = no\nIF age = young AND student = yes            THEN buys_computer = yes\nIF age = mid-age \t\t\t    THEN buys_computer = yes\nIF age = old AND credit_rating = excellent  THEN buys_computer = yes\nIF age = young AND credit_rating = fair     THEN buys_computer = no\nRule Extraction from a Decision Tree\nRules are easier to understand than large trees\nOne rule is created for each path from the root to a leaf\nEach attribute-value pair along a path forms a conjunction: the leaf holds the class prediction \nRules are mutually exclusive and exhaustive"}]},{"name":"DM CAT 2 NOTES/M5 DM/DECISION TREE.pptx","parts":[{"page":1,"text":""},{"page":2,"text":"Decision Tree"},{"page":3,"text":"Types of
