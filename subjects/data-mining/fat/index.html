</style><link rel="stylesheet" href="../../../assets/easy-mode.css?v=20261121-guided4"></head><body><div id="app"><main style="font-family:Georgia,serif;padding:6vw;max-width:850px;margin:auto"><h1>DATA MINING</h1><p>Loading your comprehensive FAT study guide…</p></main></div><noscript>This interactive guide needs JavaScript. Use the accompanying PDF for reading without it.</noscript><script id="course-data" type="application/json">{"modules":[{"number":1,"title":"Data Warehousing","kicker":"THE FOUNDATION","description":"How transactional data becomes a multidimensional decision-support system.","accent":"#bd6b4d","source":"CAT 1 NOTES / M1 DM.ppt, slides 3–57","lessons":[{"title":"Why a data warehouse exists","short":"Operations record events; warehouses explain patterns.","body":"### The central problem\nA university, hospital, or retailer has several operational systems: transactions, billing, users, and inventory. Each system is optimized to **change a small number of current records quickly**. But a management question such as “Which product categories grew most in each region over eight years?” needs integrated, consistent, historical data and large aggregations.\n\nA **data warehouse (DW)** is a repository kept separately from operational databases, supporting analytical queries and decision making. **Data warehousing** is the process of extracting, transforming, loading, storing, and making the data available for decisions.\n\n| Operational database (OLTP) | Data warehouse / OLAP |\n|---|---|\n| Day-to-day transactions | Historical analysis and decisions |\n| Many short INSERT/UPDATE/DELETE operations | Read-heavy scans, joins, aggregates |\n| Current detailed records | Historical, detailed and summarized records |\n| Often normalized to reduce duplication | Often dimensional: facts and dimensions |\n| Query: “Record this payment” | Query: “How did revenue change by quarter?” |\n| High concurrency, transaction correctness | Fast multidimensional queries |\n\n**OLTP = Online Transaction Processing; OLAP = Online Analytical Processing.** OLAP is an analysis approach/engine and a warehouse is a typical source of OLAP data: they are not identical terms.\n\n### Why not just analyze the transaction database?\nAnalytical queries compete with customer-facing operations; operational systems may disagree on IDs/units; old data may be deleted; schemas are optimized for write integrity, not repeated aggregation. A separate warehouse protects OLTP workloads and provides cleansed, integrated, time-indexed data.\n\n**Exam sentence:** A warehouse is preferred because it integrates heterogeneous sources, preserves historical data, supports complex aggregate queries, and separates decision-support workloads from real-time transactions.","source":"M1 DM.ppt slides 3–8, 13, 16, 29–31","exam":"Likely 10 marks: compare OLTP/OLAP on five parameters and justify decision support.","type":"core","html":"<h3>The central problem</h3>\n<p>A university, hospital, or retailer has several operational systems: transactions, billing, users, and inventory. Each system is optimized to <strong>change a small number of current records quickly</strong>. But a management question such as “Which product categories grew most in each region over eight years?” needs integrated, consistent, historical data and large aggregations.</p>\n<p>A <strong>data warehouse (DW)</strong> is a repository kept separately from operational databases, supporting analytical queries and decision making. <strong>Data warehousing</strong> is the process of extracting, transforming, loading, storing, and making the data available for decisions.</p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Operational database (OLTP)</th>\n  <th>Data warehouse / OLAP</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Day-to-day transactions</td>\n  <td>Historical analysis and decisions</td>\n</tr>\n<tr>\n  <td>Many short INSERT/UPDATE/DELETE operations</td>\n  <td>Read-heavy scans, joins, aggregates</td>\n</tr>\n<tr>\n  <td>Current detailed records</td>\n  <td>Historical, detailed and summarized records</td>\n</tr>\n<tr>\n  <td>Often normalized to reduce duplication</td>\n  <td>Often dimensional: facts and dimensions</td>\n</tr>\n<tr>\n  <td>Query: “Record this payment”</td>\n  <td>Query: “How did revenue change by quarter?”</td>\n</tr>\n<tr>\n  <td>High concurrency, transaction correctness</td>\n  <td>Fast multidimensional queries</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>OLTP = Online Transaction Processing; OLAP = Online Analytical Processing.</strong> OLAP is an analysis approach/engine and a warehouse is a typical source of OLAP data: they are not identical terms.</p>\n<h3>Why not just analyze the transaction database?</h3>\n<p>Analytical queries compete with customer-facing operations; operational systems may disagree on IDs/units; old data may be deleted; schemas are optimized for write integrity, not repeated aggregation. A separate warehouse protects OLTP workloads and provides cleansed, integrated, time-indexed data.</p>\n<p><strong>Exam sentence:</strong> A warehouse is preferred because it integrates heterogeneous sources, preserves historical data, supports complex aggregate queries, and separates decision-support workloads from real-time transactions.</p>\n"},{"title":"The four defining characteristics","short":"Subject-oriented • integrated • time-variant • nonvolatile.","body":"### Remember **S-I-T-N**\n1. **Subject-oriented:** Organized by business subjects—customers, sales, products—not by individual applications.\n2. **Integrated:** Reconciles different formats and naming conventions. Example: `M`, `Male`, and `1` become a consistent gender encoding; currencies may be standardized.\n3. **Time-variant:** Stores snapshots or historical records over years with meaningful time keys; comparisons over time become possible.\n4. **Nonvolatile:** Warehouse records are mainly loaded and read rather than repeatedly overwritten by ordinary transactions. Periodic refreshes still occur.\n\n**Example:** A retailer integrates checkout, online orders, and returns into a historical sales warehouse where monthly trends are available even after operational databases have changed.\n\n### Common trap\n“Nonvolatile” **does not mean never changes**. ETL/ELT refreshes append or update warehouse data in controlled ways; it means the typical user does not modify records with day-to-day transactions.","source":"M1 DM.ppt slides 6–10","exam":"","type":"core","html":"<h3>Remember <strong>S-I-T-N</strong></h3>\n<ol>\n<li><strong>Subject-oriented:</strong> Organized by business subjects—customers, sales, products—not by individual applications.</li>\n<li><strong>Integrated:</strong> Reconciles different formats and naming conventions. Example: <code>M</code>, <code>Male</code>, and <code>1</code> become a consistent gender encoding; currencies may be standardized.</li>\n<li><strong>Time-variant:</strong> Stores snapshots or historical records over years with meaningful time keys; comparisons over time become possible.</li>\n<li><strong>Nonvolatile:</strong> Warehouse records are mainly loaded and read rather than repeatedly overwritten by ordinary transactions. Periodic refreshes still occur.</li>\n</ol>\n<p><strong>Example:</strong> A retailer integrates checkout, online orders, and returns into a historical sales warehouse where monthly trends are available even after operational databases have changed.</p>\n<h3>Common trap</h3>\n<p>“Nonvolatile” <strong>does not mean never changes</strong>. ETL/ELT refreshes append or update warehouse data in controlled ways; it means the typical user does not modify records with day-to-day transactions.</p>\n"},{"title":"Three-tier architecture and ETL","short":"Trace data from sources to the user's report.","body":"### Three-tier architecture\n**Bottom tier — storage:** Operational databases/files/external sources feed staging, the warehouse database, and metadata repository. Integration/ETL prepares trustworthy data.\n\n**Middle tier — OLAP server:** Executes multidimensional aggregation and analytical queries. OLAP servers are commonly **ROLAP** (relational), **MOLAP** (multidimensional cube storage), or **HOLAP** (hybrid).\n\n**Top tier — front end:** Dashboards, queries, reports, exploratory analysis, and data-mining tools.\n\n### ETL: Extract → Transform → Load\n1. **Extract** from heterogeneous sources (SQL databases, logs, ERP, files).\n2. **Transform** by cleaning missing values, deduplicating, standardizing dates/currencies/IDs, joining records, and deriving metrics.\n3. **Load** into the central warehouse or data marts, often with batch or incremental updates.\n\n**Metadata** describes schemas, data lineage, definitions, source mappings, ETL rules, update schedules, and who can access what.\n\n**Textbook diagram to draw in exams:**\n\n`Operational DBs / Files / External → [ETL + staging] → [Warehouse + metadata] → [OLAP server] → [Reports / Query / Data Mining]`\n\nDraw the first portion as **bottom tier**, the OLAP server as **middle**, and user tools as **top**. Add arrows and labels.","source":"M1 DM.ppt slides 12, 14–19","exam":"Actual CAT-I Q2: draw three-tier architecture for eight years of multinational retail sales.","type":"core","html":"<h3>Three-tier architecture</h3>\n<p><strong>Bottom tier — storage:</strong> Operational databases/files/external sources feed staging, the warehouse database, and metadata repository. Integration/ETL prepares trustworthy data.</p>\n<p><strong>Middle tier — OLAP server:</strong> Executes multidimensional aggregation and analytical queries. OLAP servers are commonly <strong>ROLAP</strong> (relational), <strong>MOLAP</strong> (multidimensional cube storage), or <strong>HOLAP</strong> (hybrid).</p>\n<p><strong>Top tier — front end:</strong> Dashboards, queries, reports, exploratory analysis, and data-mining tools.</p>\n<h3>ETL: Extract → Transform → Load</h3>\n<ol>\n<li><strong>Extract</strong> from heterogeneous sources (SQL databases, logs, ERP, files).</li>\n<li><strong>Transform</strong> by cleaning missing values, deduplicating, standardizing dates/currencies/IDs, joining records, and deriving metrics.</li>\n<li><strong>Load</strong> into the central warehouse or data marts, often with batch or incremental updates.</li>\n</ol>\n<p><strong>Metadata</strong> describes schemas, data lineage, definitions, source mappings, ETL rules, update schedules, and who can access what.</p>\n<p><strong>Textbook diagram to draw in exams:</strong></p>\n<p><code>Operational DBs / Files / External → [ETL + staging] → [Warehouse + metadata] → [OLAP server] → [Reports / Query / Data Mining]</code></p>\n<p>Draw the first portion as <strong>bottom tier</strong>, the OLAP server as <strong>middle</strong>, and user tools as <strong>top</strong>. Add arrows and labels.</p>\n\n<section class=\"imp-deepdive\"><div class=\"imp-depth-head\"><strong>★ EXAM-READY EXPANSION</strong><small>Checked against: M1 DM.ppt, slides 14–19</small></div>\n<h3>Data warehouse architecture — draw, label, explain</h3>\n<p>This is a <b>three-tier architecture</b>. The faculty diagram also shows sources, ETL/integration, metadata and data marts. In the exam draw all of them, not just three boxes.</p>\n<div class=\"imp-flow\"><div><strong>TOP TIER: FRONT-END TOOLS</strong><span>Reports · querying · analysis · data-mining dashboards</span></div><b>↑↓</b><div><strong>MIDDLE TIER: OLAP SERVER</strong><span>Processes cubes and analytical queries; ROLAP / MOLAP / HOLAP</span></div><b>↑↓</b><div><strong>BOTTOM TIER: WAREHOUSE STORAGE</strong><span>Integrated historical records · metadata · data marts</span></div><b>↑</b><div><strong>ETL AND STAGING</strong><span>Operational databases / ERP / files → Extract → Transform → Load</span></div></div>\n<p><b>Explain each arrow:</b> heterogeneous sources pass through extraction, cleaning and transformation. They are integrated in the warehouse; an OLAP server produces summaries; analysts reach those summaries through the front end. <b>Metadata</b> documents field definitions and transformations. <b>Data marts</b> offer subject/department-specific views.</p>\n<p class=\"imp-practice\"><b>Original case question:</b> For eight years of multinational retail data, identify the source systems, how to standardize currency and date formats, which tier aggregates annual revenue, and which tier displays a manager's report.</p></section>"},{"title":"Warehouse models and design views","short":"Enterprise warehouse, data mart, virtual warehouse.","body":"### Three models\n- **Enterprise warehouse:** Organization-wide, integrates many subjects and departments. Broad and consistent, but costly to build.\n- **Data mart:** Department/subject subset (sales mart, finance mart). Smaller and faster to deliver. **Dependent** marts are sourced from an enterprise DW; **independent** marts source from operational systems directly.\n- **Virtual warehouse:** Logical views over operational sources. Less physical duplication, but heavy analytical queries may still burden sources; limited materializations can help.\n\n### Four design views\nThe slides describe **top-down view** (select information needed by warehouse), **data-source view** (operational systems and extraction), **data-warehouse view** (fact/dimension structures), and **business-query view** (what end users actually ask).\n\n**Trade-off:** Enterprise DW optimizes unified governance; a data mart optimizes narrow speed; a virtual DW minimizes materialized storage at the cost of analysis performance and source coupling.","source":"M1 DM.ppt slides 15, 20–23","exam":"","type":"core","html":"<h3>Three models</h3>\n<ul>\n<li><strong>Enterprise warehouse:</strong> Organization-wide, integrates many subjects and departments. Broad and consistent, but costly to build.</li>\n<li><strong>Data mart:</strong> Department/subject subset (sales mart, finance mart). Smaller and faster to deliver. <strong>Dependent</strong> marts are sourced from an enterprise DW; <strong>independent</strong> marts source from operational systems directly.</li>\n<li><strong>Virtual warehouse:</strong> Logical views over operational sources. Less physical duplication, but heavy analytical queries may still burden sources; limited materializations can help.</li>\n</ul>\n<h3>Four design views</h3>\n<p>The slides describe <strong>top-down view</strong> (select information needed by warehouse), <strong>data-source view</strong> (operational systems and extraction), <strong>data-warehouse view</strong> (fact/dimension structures), and <strong>business-query view</strong> (what end users actually ask).</p>\n<p><strong>Trade-off:</strong> Enterprise DW optimizes unified governance; a data mart optimizes narrow speed; a virtual DW minimizes materialized storage at the cost of analysis performance and source coupling.</p>\n"},{"title":"Facts, dimensions and schema designs","short":"Star versus snowflake versus fact constellation.","body":"### The mental model\nA **fact table** contains measurements plus foreign keys to descriptive **dimension tables**. A **dimension** provides the ways we group/filter (time, location, product, customer). A **measure** is the quantity (sales amount, quantity, count).\n\n**Example fact table:** `sales_fact(date_key, product_key, store_key, units_sold, revenue)`.\n\nDimension tables might be `date(date_key, year, quarter, month)`, `product(product_key, name, category)`, `store(store_key, city, state, country)`.\n\n**Fact grain** = what exactly one row means; e.g. *one product sold in one store on one date*. Pick grain explicitly; mixing grains creates double counting.\n\n| Schema | Shape | Advantage | Cost |\n|---|---|---|---|\n| **Star** | Central fact connected directly to denormalized dimensions | Easy querying, fewer joins | Some duplicate dimension attributes |\n| **Snowflake** | Dimension tables further normalized into hierarchy tables | Less dimension redundancy, formal hierarchies | More joins, more complicated queries |\n| **Fact constellation / galaxy** | Multiple fact tables share conformed dimensions | Models several business processes | More modeling and query complexity |\n\n**Draw it:** Star: `date → sales_fact ← product`, with `store → sales_fact`; snowflake: `country ← state ← store → sales_fact`; fact constellation: `sales_fact ← date → shipment_fact`.\n\n**Exam trap:** Snowflake is **not** the OLAP cube. It is a *relational schema pattern*.","source":"M1 DM.ppt slides 24–27, 44–51","exam":"","type":"core","html":"<h3>The mental model</h3>\n<p>A <strong>fact table</strong> contains measurements plus foreign keys to descriptive <strong>dimension tables</strong>. A <strong>dimension</strong> provides the ways we group/filter (time, location, product, customer). A <strong>measure</strong> is the quantity (sales amount, quantity, count).</p>\n<p><strong>Example fact table:</strong> <code>sales_fact(date_key, product_key, store_key, units_sold, revenue)</code>.</p>\n<p>Dimension tables might be <code>date(date_key, year, quarter, month)</code>, <code>product(product_key, name, category)</code>, <code>store(store_key, city, state, country)</code>.</p>\n<p><strong>Fact grain</strong> = what exactly one row means; e.g. <em>one product sold in one store on one date</em>. Pick grain explicitly; mixing grains creates double counting.</p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Schema</th>\n  <th>Shape</th>\n  <th>Advantage</th>\n  <th>Cost</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td><strong>Star</strong></td>\n  <td>Central fact connected directly to denormalized dimensions</td>\n  <td>Easy querying, fewer joins</td>\n  <td>Some duplicate dimension attributes</td>\n</tr>\n<tr>\n  <td><strong>Snowflake</strong></td>\n  <td>Dimension tables further normalized into hierarchy tables</td>\n  <td>Less dimension redundancy, formal hierarchies</td>\n  <td>More joins, more complicated queries</td>\n</tr>\n<tr>\n  <td><strong>Fact constellation / galaxy</strong></td>\n  <td>Multiple fact tables share conformed dimensions</td>\n  <td>Models several business processes</td>\n  <td>More modeling and query complexity</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Draw it:</strong> Star: <code>date → sales_fact ← product</code>, with <code>store → sales_fact</code>; snowflake: <code>country ← state ← store → sales_fact</code>; fact constellation: <code>sales_fact ← date → shipment_fact</code>.</p>\n<p><strong>Exam trap:</strong> Snowflake is <strong>not</strong> the OLAP cube. It is a <em>relational schema pattern</em>.</p>\n"},{"title":"Data cubes and cuboid lattices","short":"Make multidimensional data concrete.","body":"### What is a cube?\nA cube represents a multidimensional summary. Consider sales by **product × region × time**. Each cell holds a measure, such as `SUM(revenue)`. Cubes do **not** have to be three-dimensional—there may be any number of dimensions.\n\nA **cuboid** is one particular grouping level or choice of dimensions. For dimensions {Product, Region, Time} the lattice has `2³ = 8` grouping subsets (assuming one total/all level per dimension): `{P,R,T}`, `{P,R}`, `{P,T}`, `{R,T}`, `{P}`, `{R}`, `{T}`, `{ALL}`. \n\n- **Base cuboid:** Most detailed grouping (`Product, Region, Time`).\n- **Apex cuboid:** Fully aggregated grand total (`ALL`).\n- **Dimension hierarchy:** city → state → country → ALL, day → month → quarter → year.\n\n### Measure categories\n- **Distributive:** Aggregate partial answers directly (SUM, MIN, MAX, COUNT).\n- **Algebraic:** Computed from fixed-size partial summaries (AVG = SUM/COUNT; variance from sums/counts).\n- **Holistic:** No fixed-size summary always suffices for exact answer (MEDIAN, MODE, exact distinct in general).\n\n**Why classification matters:** OLAP engines can efficiently preaggregate distributive and algebraic measures; holistic measures may require much larger retained detail.","source":"M1 DM.ppt slides 26–28, 32–36, 52–56","exam":"","type":"core","html":"<h3>What is a cube?</h3>\n<p>A cube represents a multidimensional summary. Consider sales by <strong>product × region × time</strong>. Each cell holds a measure, such as <code>SUM(revenue)</code>. Cubes do <strong>not</strong> have to be three-dimensional—there may be any number of dimensions.</p>\n<p>A <strong>cuboid</strong> is one particular grouping level or choice of dimensions. For dimensions {Product, Region, Time} the lattice has <code>2³ = 8</code> grouping subsets (assuming one total/all level per dimension): <code>{P,R,T}</code>, <code>{P,R}</code>, <code>{P,T}</code>, <code>{R,T}</code>, <code>{P}</code>, <code>{R}</code>, <code>{T}</code>, <code>{ALL}</code>.</p>\n<ul>\n<li><strong>Base cuboid:</strong> Most detailed grouping (<code>Product, Region, Time</code>).</li>\n<li><strong>Apex cuboid:</strong> Fully aggregated grand total (<code>ALL</code>).</li>\n<li><strong>Dimension hierarchy:</strong> city → state → country → ALL, day → month → quarter → year.</li>\n</ul>\n<h3>Measure categories</h3>\n<ul>\n<li><strong>Distributive:</strong> Aggregate partial answers directly (SUM, MIN, MAX, COUNT).</li>\n<li><strong>Algebraic:</strong> Computed from fixed-size partial summaries (AVG = SUM/COUNT; variance from sums/counts).</li>\n<li><strong>Holistic:</strong> No fixed-size summary always suffices for exact answer (MEDIAN, MODE, exact distinct in general).</li>\n</ul>\n<p><strong>Why classification matters:</strong> OLAP engines can efficiently preaggregate distributive and algebraic measures; holistic measures may require much larger retained detail.</p>\n\n<section class=\"imp-deepdive\"><div class=\"imp-depth-head\"><strong>★ EXAM-READY EXPANSION</strong><small>Checked against: M1 DM.ppt, slides 26–28, 55–56</small></div>\n<h3>Lattice of cuboids: BASE versus APEX</h3>\n<p>Suppose a Sales cube has three dimensions: <b>Product (P), Date (D), Country (C)</b>. Each different choice of grouping dimensions creates a <b>cuboid</b>. The faculty's 3-D lattice contains exactly these eight:</p>\n<div class=\"imp-lattice\"><div><span>0-D · APEX</span><b>ALL</b></div><div><span>1-D</span><b>P</b><b>D</b><b>C</b></div><div><span>2-D</span><b>P,D</b><b>P,C</b><b>D,C</b></div><div><span>3-D · BASE</span><b>P,D,C</b></div></div>\n<p><b>Base cuboid:</b> the finest grouping using all the cube dimensions (P,D,C). <b>Apex cuboid:</b> no grouping dimensions remain; one grand total (ALL). <b>Roll-up:</b> move toward fewer dimensions / coarser hierarchy levels. <b>Drill-down:</b> move toward finer detail.</p>\n<p><b>Count:</b> choose each dimension to be present or ALL → <code>2^n</code> group-by cuboids when each dimension has only those two choices. For n=3, counts by level are 1+3+3+1=8. For n=4, there are 16. If multiple concept-hierarchy levels are included, do not blindly apply 2^n; count the available level choices.</p>\n<div class=\"imp-answer\"><b>Original mini-question:</b> List all cuboids of Region × Item × Time. Answer: RIT (base); RI, RT, IT; R, I, T; ALL (apex). A query grouped only by Region uses the R cuboid.</div></section>"},{"title":"OLAP operations you must distinguish","short":"Roll-up, drill-down, slice, dice, pivot.","body":"### The five high-yield operations\n1. **Roll-up (drill-up):** Summarize to a higher hierarchy level. `City → State → Country`; or remove a dimension.\n2. **Drill-down:** Reverse: expand a region or year to more detailed state/city or quarter/month.\n3. **Slice:** Fix **one dimension** to one value: `Time=2026`. A 3D cube becomes a 2D view.\n4. **Dice:** Filter on **multiple dimensions/ranges**: product ∈ {phone,laptop}, state ∈ {KA,TN}, year ∈ {2025,2026}. Produces a subcube.\n5. **Pivot / rotate:** Change layout or axes of the same data; e.g. rows=region, columns=product → rows=product, columns=region.\n\nAdditional related terms: **drill-through** obtains supporting detailed transactions from the summary; **drill-across** compares compatible fact tables using shared dimensions.\n\n**Walk-through:** “Quarterly tablet sales by city” → roll-up city to state; drill-down quarter to month; slice to Q1; dice to tablets + laptops in two states; pivot to display product as rows.\n\n### Decision-support benefits\nFast summaries across dimensions, trend comparisons, ad hoc questions, interactive drill paths, consistent definitions, and shared reporting reduce decision time.\n\n**Don't confuse:** Slice and pivot change how data is **viewed**; they do not mean “create new information.” Roll-up **aggregates**, while drill-down returns **granularity**.","source":"M1 DM.ppt slides 29–43","exam":"Actual CAT-I Q1: five-parameter OLTP/OLAP comparison and OLAP operations.","type":"core","html":"<h3>The five high-yield operations</h3>\n<ol>\n<li><strong>Roll-up (drill-up):</strong> Summarize to a higher hierarchy level. <code>City → State → Country</code>; or remove a dimension.</li>\n<li><strong>Drill-down:</strong> Reverse: expand a region or year to more detailed state/city or quarter/month.</li>\n<li><strong>Slice:</strong> Fix <strong>one dimension</strong> to one value: <code>Time=2026</code>. A 3D cube becomes a 2D view.</li>\n<li><strong>Dice:</strong> Filter on <strong>multiple dimensions/ranges</strong>: product ∈ {phone,laptop}, state ∈ {KA,TN}, year ∈ {2025,2026}. Produces a subcube.</li>\n<li><strong>Pivot / rotate:</strong> Change layout or axes of the same data; e.g. rows=region, columns=product → rows=product, columns=region.</li>\n</ol>\n<p>Additional related terms: <strong>drill-through</strong> obtains supporting detailed transactions from the summary; <strong>drill-across</strong> compares compatible fact tables using shared dimensions.</p>\n<p><strong>Walk-through:</strong> “Quarterly tablet sales by city” → roll-up city to state; drill-down quarter to month; slice to Q1; dice to tablets + laptops in two states; pivot to display product as rows.</p>\n<h3>Decision-support benefits</h3>\n<p>Fast summaries across dimensions, trend comparisons, ad hoc questions, interactive drill paths, consistent definitions, and shared reporting reduce decision time.</p>\n<p><strong>Don't confuse:</strong> Slice and pivot change how data is <strong>viewed</strong>; they do not mean “create new information.” Roll-up <strong>aggregates</strong>, while drill-down returns <strong>granularity</strong>.</p>\n"}]},{"number":2,"title":"Introduction to Data Mining","kicker":"DISCOVERY","description":"Understand the KDD pipeline, mining tasks, system design and major challenges.","accent":"#577b6f","source":"CAT 1 NOTES / M2 DM.pptx, slides 3–30; DATA MINING INTRO.pptx","lessons":[{"title":"What data mining actually does","short":"Data is not knowledge until you discover patterns.","body":"### Definition\n**Data mining** discovers *valid, novel, potentially useful, and understandable* patterns from large data sets. It draws on databases, statistics, machine learning, pattern recognition, visualization, and domain expertise.\n\n- **Data:** Individual records (user, product, time, purchase).\n- **Information:** Organized summaries (200 purchases of a product).\n- **Knowledge:** An actionable regularity or model (“customers who buy X often buy Y” with measurable support/confidence).\n\n### Data mining vs KDD\n**Knowledge Discovery in Databases (KDD)** is the **entire process** that converts raw data into useful knowledge. **Data mining** is its core *pattern-discovery* stage. They are related but not synonyms.\n\nExample: A bank wants to recognize fraudulent transactions. Cleaning removes malformed amounts, integration reconciles accounts across systems, mining identifies suspicious patterns, and evaluation checks whether alerts are actionable.","source":"M2 DM.pptx slides 3–5","exam":"Actual CAT-I Q4 asks why mining is the core of KDD.","type":"core","html":"<h3>Definition</h3>\n<p><strong>Data mining</strong> discovers <em>valid, novel, potentially useful, and understandable</em> patterns from large data sets. It draws on databases, statistics, machine learning, pattern recognition, visualization, and domain expertise.</p>\n<ul>\n<li><strong>Data:</strong> Individual records (user, product, time, purchase).</li>\n<li><strong>Information:</strong> Organized summaries (200 purchases of a product).</li>\n<li><strong>Knowledge:</strong> An actionable regularity or model (“customers who buy X often buy Y” with measurable support/confidence).</li>\n</ul>\n<h3>Data mining vs KDD</h3>\n<p><strong>Knowledge Discovery in Databases (KDD)</strong> is the <strong>entire process</strong> that converts raw data into useful knowledge. <strong>Data mining</strong> is its core <em>pattern-discovery</em> stage. They are related but not synonyms.</p>\n<p>Example: A bank wants to recognize fraudulent transactions. Cleaning removes malformed amounts, integration reconciles accounts across systems, mining identifies suspicious patterns, and evaluation checks whether alerts are actionable.</p>\n"},{"title":"The seven KDD stages","short":"Know the order and explain what each produces.","body":"### The exam-ready pipeline\n1. **Data cleaning:** Handle missing values, errors, noise, outliers, duplicates and inconsistencies.\n2. **Data integration:** Combine data from multiple sources; resolve schemas and entities.\n3. **Data selection:** Retain relevant records and features for the task.\n4. **Data transformation:** Normalize, aggregate, encode, or construct mining-ready features.\n5. **Data mining:** Apply algorithms (classification, association, clustering, etc.) to discover patterns/models.\n6. **Pattern evaluation:** Check validity, novelty, interestingness, accuracy, lift, and usefulness. Reject spurious patterns.\n7. **Knowledge presentation:** Show interpretable rules, charts, decision trees, dashboards or reports for action.\n\nThe process is **iterative**: if evaluation reveals an unhelpful model, return to selection, transformation, or even the original business question.\n\n### Before the pipeline\n**Understand the domain, user goals, constraints and success criteria.** The lecture expands KDD planning with data preparation, choosing mining functions/algorithms, and presenting results.\n\n**Why mining is the core:** Cleaning/selection supply reliable inputs, mining *generates candidate knowledge*, and evaluation/presentation determine whether it is useful. Without mining, preprocessing alone does not discover the requested patterns.\n\n**Memory technique:** C–I–S–T–M–E–P (Clean → Integrate → Select → Transform → Mine → Evaluate → Present).","source":"M2 DM.pptx slides 4–7","exam":"CAT-I Q4: explain how each stage contributes.","type":"core","html":"<h3>The exam-ready pipeline</h3>\n<ol>\n<li><strong>Data cleaning:</strong> Handle missing values, errors, noise, outliers, duplicates and inconsistencies.</li>\n<li><strong>Data integration:</strong> Combine data from multiple sources; resolve schemas and entities.</li>\n<li><strong>Data selection:</strong> Retain relevant records and features for the task.</li>\n<li><strong>Data transformation:</strong> Normalize, aggregate, encode, or construct mining-ready features.</li>\n<li><strong>Data mining:</strong> Apply algorithms (classification, association, clustering, etc.) to discover patterns/models.</li>\n<li><strong>Pattern evaluation:</strong> Check validity, novelty, interestingness, accuracy, lift, and usefulness. Reject spurious patterns.</li>\n<li><strong>Knowledge presentation:</strong> Show interpretable rules, charts, decision trees, dashboards or reports for action.</li>\n</ol>\n<p>The process is <strong>iterative</strong>: if evaluation reveals an unhelpful model, return to selection, transformation, or even the original business question.</p>\n<h3>Before the pipeline</h3>\n<p><strong>Understand the domain, user goals, constraints and success criteria.</strong> The lecture expands KDD planning with data preparation, choosing mining functions/algorithms, and presenting results.</p>\n<p><strong>Why mining is the core:</strong> Cleaning/selection supply reliable inputs, mining <em>generates candidate knowledge</em>, and evaluation/presentation determine whether it is useful. Without mining, preprocessing alone does not discover the requested patterns.</p>\n<p><strong>Memory technique:</strong> C–I–S–T–M–E–P (Clean → Integrate → Select → Transform → Mine → Evaluate → Present).</p>\n"},{"title":"Architecture of a mining system","short":"Where data, algorithms and users meet.","body":"A typical architecture has these components:\n\n- **Database, data warehouse, information repositories:** Source records.\n- **Database / warehouse server:** Retrieves relevant data based on user requests.\n- **Knowledge base:** Stores metadata, domain constraints, concept hierarchies, or belief information.\n- **Data-mining engine:** Runs classification, association, clustering, outlier detection, etc.\n- **Pattern evaluation module:** Filters interesting and statistically/operationally useful results; may guide mining.\n- **Graphical user interface:** Defines queries/parameters, explores results and presents discovered knowledge.\n\n**Flow:** Sources → server → mining engine ↔ pattern evaluator ↔ knowledge base → GUI/results. Feedback from the user can change a mining query and trigger reprocessing.\n\n**Example:** A store manager selects a date range on a dashboard (GUI), SQL server retrieves transactions, Apriori discovers combinations, lift filters weak rules, and the UI displays useful product bundles.","source":"M2 DM.pptx slides 8–9","exam":"","type":"core","html":"<p>A typical architecture has these components:</p>\n<ul>\n<li><strong>Database, data warehouse, information repositories:</strong> Source records.</li>\n<li><strong>Database / warehouse server:</strong> Retrieves relevant data based on user requests.</li>\n<li><strong>Knowledge base:</strong> Stores metadata, domain constraints, concept hierarchies, or belief information.</li>\n<li><strong>Data-mining engine:</strong> Runs classification, association, clustering, outlier detection, etc.</li>\n<li><strong>Pattern evaluation module:</strong> Filters interesting and statistically/operationally useful results; may guide mining.</li>\n<li><strong>Graphical user interface:</strong> Defines queries/parameters, explores results and presents discovered knowledge.</li>\n</ul>\n<p><strong>Flow:</strong> Sources → server → mining engine ↔ pattern evaluator ↔ knowledge base → GUI/results. Feedback from the user can change a mining query and trigger reprocessing.</p>\n<p><strong>Example:</strong> A store manager selects a date range on a dashboard (GUI), SQL server retrieves transactions, Apriori discovers combinations, lift filters weak rules, and the UI displays useful product bundles.</p>\n"},{"title":"Six kinds of mining tasks","short":"Descriptive versus predictive.","body":"### Descriptive tasks\nExplain what is present **without known target labels**.\n- **Concept characterization:** Summarize properties of one target class (typical high-value customers).\n- **Concept discrimination:** Contrast a target class against another (loyal vs churned customers).\n- **Association / correlation mining:** Find co-occurrence rules, `milk → bread`; frequent itemsets and correlations.\n- **Clustering:** Group similar objects when no class labels exist.\n- **Outlier / anomaly analysis:** Identify unusually different objects.\n- **Evolution and trend analysis:** Discover sequential, temporal, periodic, or changing patterns.\n\n### Predictive tasks\nLearn a relationship that generalizes to unseen examples:\n- **Classification:** Predict a **categorical label** (`risk=high/low`).\n- **Regression / numerical prediction:** Predict a **number** (loan amount, sales revenue).\n\nA task may support several methods: **clustering** customers first, then **classifying** whether each customer will churn.\n\n| Scenario | Best task |\n|---|---|\n| Find groups of similar buyers with no labels | Clustering |\n| Predict whether the applicant defaults | Classification |\n| Predict expected loss in rupees | Regression |\n| Find products purchased together | Association |\n| Find unusual card transactions | Outlier detection |\n| Summarize traits of premium customers | Characterization |\n\n**Exam trap:** Cluster analysis is **unsupervised**; classification generally needs labeled training examples. The slides have one compressed line that can be misread—rely on the formal distinction.","source":"M2 DM.pptx slides 15–21, 24","exam":"","type":"core","html":"<h3>Descriptive tasks</h3>\n<p>Explain what is present <strong>without known target labels</strong>.</p>\n<ul>\n<li><strong>Concept characterization:</strong> Summarize properties of one target class (typical high-value customers).</li>\n<li><strong>Concept discrimination:</strong> Contrast a target class against another (loyal vs churned customers).</li>\n<li><strong>Association / correlation mining:</strong> Find co-occurrence rules, <code>milk → bread</code>; frequent itemsets and correlations.</li>\n<li><strong>Clustering:</strong> Group similar objects when no class labels exist.</li>\n<li><strong>Outlier / anomaly analysis:</strong> Identify unusually different objects.</li>\n<li><strong>Evolution and trend analysis:</strong> Discover sequential, temporal, periodic, or changing patterns.</li>\n</ul>\n<h3>Predictive tasks</h3>\n<p>Learn a relationship that generalizes to unseen examples:</p>\n<ul>\n<li><strong>Classification:</strong> Predict a <strong>categorical label</strong> (<code>risk=high/low</code>).</li>\n<li><strong>Regression / numerical prediction:</strong> Predict a <strong>number</strong> (loan amount, sales revenue).</li>\n</ul>\n<p>A task may support several methods: <strong>clustering</strong> customers first, then <strong>classifying</strong> whether each customer will churn.</p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Scenario</th>\n  <th>Best task</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Find groups of similar buyers with no labels</td>\n  <td>Clustering</td>\n</tr>\n<tr>\n  <td>Predict whether the applicant defaults</td>\n  <td>Classification</td>\n</tr>\n<tr>\n  <td>Predict expected loss in rupees</td>\n  <td>Regression</td>\n</tr>\n<tr>\n  <td>Find products purchased together</td>\n  <td>Association</td>\n</tr>\n<tr>\n  <td>Find unusual card transactions</td>\n  <td>Outlier detection</td>\n</tr>\n<tr>\n  <td>Summarize traits of premium customers</td>\n  <td>Characterization</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Exam trap:</strong> Cluster analysis is <strong>unsupervised</strong>; classification generally needs labeled training examples. The slides have one compressed line that can be misread—rely on the formal distinction.</p>\n\n<section class=\"imp-deepdive\"><div class=\"imp-depth-head\"><strong>★ EXAM-READY EXPANSION</strong><small>Checked against: M2 DM.pptx, slides 15–21</small></div>\n<h3>Mining functionalities — identify the QUESTION being answered</h3>\n<div class=\"table-scroll\"><table><thead><tr><th>Functionality</th><th>Meaning</th><th>Situation</th></tr></thead><tbody>\n<tr><td>Characterization</td><td>Describe one target class</td><td>Profile the typical loyal customer</td></tr>\n<tr><td>Discrimination</td><td>Contrast target with another class</td><td>Frequent vs one-time buyers</td></tr>\n<tr><td>Association</td><td>Find things that co-occur</td><td>Bread → butter with support/confidence</td></tr>\n<tr><td>Classification</td><td>Predict a known label</td><td>Spam vs legitimate email</td></tr>\n<tr><td>Numeric prediction</td><td>Estimate a number</td><td>Revenue next month</td></tr>\n<tr><td>Clustering</td><td>Discover unlabeled groups</td><td>Customer segments without labels</td></tr>\n<tr><td>Outliers</td><td>Find anomalous observations</td><td>Suspicious bank withdrawal</td></tr>\n<tr><td>Trend / evolution</td><td>Discover changes over time or sequences</td><td>Seasonal demand or repeated buying order</td></tr>\n</tbody></table></div>\n<p><b>Descriptive vs predictive:</b> mining tasks can summarize existing patterns or use examples to predict unseen labels/numbers. <b>Remember:</b> characterization ≠ discrimination; supervised classification ≠ unsupervised clustering.</p>\n<p class=\"imp-practice\"><b>Original FAT-style prompt:</b> A retailer wants customer profiles, shopper segments, fraud alerts, future revenue and frequently paired items. For each, name the matching functionality and explain why.</p></section>"},{"title":"Types of data that can be mined","short":"The repository changes the algorithm requirements.","body":"### Common source systems\n**Relational databases:** Tables with attributes and keys. **Transactional databases:** Sets of purchase items/events. **Data warehouses:** Integrated and historical multidimensional data. **Object-oriented/object-relational databases:** Complex objects and class structures.\n\n**Advanced data:** Temporal sequences, time series, spatial and spatiotemporal data, text, multimedia, web documents, hyperlinked pages, graphs/networks, streaming data, and heterogeneous sources.\n\n### Why type matters\nA market basket is naturally a set: `{bread, eggs}`. A web page has text **and** outgoing links. A sensor is a **time series**. A social network is a **graph**. Algorithms and distance functions must respect those structures; simply flattening everything into arbitrary numbers can lose meaning.\n\n**Related fields:** Machine learning supplies models, statistics supplies estimates/inference, databases supply scalable storage/indexing, visualization supports interpretation, and information retrieval handles documents.","source":"M2 DM.pptx slides 10–14, 23","exam":"","type":"core","html":"<h3>Common source systems</h3>\n<p><strong>Relational databases:</strong> Tables with attributes and keys. <strong>Transactional databases:</strong> Sets of purchase items/events. <strong>Data warehouses:</strong> Integrated and historical multidimensional data. <strong>Object-oriented/object-relational databases:</strong> Complex objects and class structures.</p>\n<p><strong>Advanced data:</strong> Temporal sequences, time series, spatial and spatiotemporal data, text, multimedia, web documents, hyperlinked pages, graphs/networks, streaming data, and heterogeneous sources.</p>\n<h3>Why type matters</h3>\n<p>A market basket is naturally a set: <code>{bread, eggs}</code>. A web page has text <strong>and</strong> outgoing links. A sensor is a <strong>time series</strong>. A social network is a <strong>graph</strong>. Algorithms and distance functions must respect those structures; simply flattening everything into arbitrary numbers can lose meaning.</p>\n<p><strong>Related fields:</strong> Machine learning supplies models, statistics supplies estimates/inference, databases supply scalable storage/indexing, visualization supports interpretation, and information retrieval handles documents.</p>\n"},{"title":"How mining systems are classified","short":"Four independent perspectives.","body":"A data-mining system may be classified by:\n\n1. **Database/data type:** Relational, transactional, spatial, temporal, text, multimedia, data warehouse, web, etc.\n2. **Kind of knowledge mined:** Characterization/discrimination, association, classification, clustering, outliers, evolution.\n3. **Techniques used:** Database-oriented, statistical, machine learning, neural, pattern recognition, visualization, OLAP integration.\n4. **Application domain:** Finance, retail, healthcare, telecommunications, scientific analysis, fraud detection, and so on.\n\nThis is **not one single hierarchy**. A system can simultaneously be “web-data + link analysis + graph technique + search application.”\n\n**10-mark answer structure:** Define classification schemes → explain all four axes → example for each → argue why the axes affect algorithm choice, data structures, performance, quality, and interpretation.","source":"M2 DM.pptx slides 22–26","exam":"Actual CAT-I Q3 on classification schemes and major issues.","type":"core","html":"<p>A data-mining system may be classified by:</p>\n<ol>\n<li><strong>Database/data type:</strong> Relational, transactional, spatial, temporal, text, multimedia, data warehouse, web, etc.</li>\n<li><strong>Kind of knowledge mined:</strong> Characterization/discrimination, association, classification, clustering, outliers, evolution.</li>\n<li><strong>Techniques used:</strong> Database-oriented, statistical, machine learning, neural, pattern recognition, visualization, OLAP integration.</li>\n<li><strong>Application domain:</strong> Finance, retail, healthcare, telecommunications, scientific analysis, fraud detection, and so on.</li>\n</ol>\n<p>This is <strong>not one single hierarchy</strong>. A system can simultaneously be “web-data + link analysis + graph technique + search application.”</p>\n<p><strong>10-mark answer structure:</strong> Define classification schemes → explain all four axes → example for each → argue why the axes affect algorithm choice, data structures, performance, quality, and interpretation.</p>\n\n<section class=\"imp-deepdive\"><div class=\"imp-depth-head\"><strong>★ EXAM-READY EXPANSION</strong><small>Checked against: M2 DM.pptx, slides 22–26</small></div>\n<h3>The FOUR classification schemes of mining systems</h3>\n<p>For an exam answer, give the criterion, examples, then show how a single real system can belong to all four simultaneously.</p>\n<ol><li><b>Kind of database/data mined:</b> relational, transactional, spatial, time series, text, multimedia, WWW.</li>\n<li><b>Kind of knowledge mined:</b> characterization, discrimination, association, classification, clustering, trends/outliers.</li>\n<li><b>Technique used:</b> database/OLAP methods, statistics, machine learning, neural networks, visualization.</li>\n<li><b>Application domain:</b> banking, retail, telecommunications, fraud analysis, stock market, DNA analysis.</li></ol>\n<div class=\"imp-answer\"><b>Original worked classification:</b> A bank flags unusual card purchases with a decision tree: <em>data</em> = transaction records; <em>knowledge</em> = classification/anomalies; <em>technique</em> = machine learning; <em>application</em> = banking/fraud detection.</div>\n<p><b>Do not confuse:</b> “classification schemes for a mining SYSTEM” with the supervised “classification” functionality that predicts class labels.</p></section>"},{"title":"Major issues in data mining","short":"Methodology • performance • diverse data • responsible use.","body":"### 1. Mining methodology and user interaction\nMining different knowledge types, discovery at multiple abstraction levels, incorporation of domain/background knowledge, query-driven and interactive mining, pattern evaluation and interestingness, handling uncertainty/noise, visualizing results, and identifying redundant patterns.\n\n### 2. Performance\n- **Efficiency and scalability:** Runtime and memory should remain practical as objects, attributes and sources grow.\n- **Parallel/distributed/incremental mining:** Work across processors or nodes, process streaming data and updates without complete recomputation.\n- **High-dimensional data:** More attributes increase sparsity and computational difficulty.\n\n### 3. Diversity of data types\nStructured tables differ from unstructured text, linked web pages, time series, trajectories, multimedia, and network data. Algorithms need type-specific representations and cross-source integration.\n\n### 4. Application and societal issues\nPrivacy, data ownership, access permissions, security, explainability, algorithmic bias, and inappropriate use of mined correlations. These are useful modern considerations; the core slides emphasize methodology, performance, and heterogeneous data.\n\n### Reliable results demand\nRepresentative data, proper handling of leakage, meaningful evaluation metrics, correct statistical interpretation (correlation ≠ causation), and understandable outputs.\n\n**Scenario response:** For mining social web data, mention graph/text processing, scale, real-time updates, interestingness, user control, and privacy—not merely “large datasets”.","source":"M2 DM.pptx slides 27–30; final paragraph is explanatory extension","exam":"CAT-I Q3 expects classified issues and their implications.","type":"core","html":"<h3>1. Mining methodology and user interaction</h3>\n<p>Mining different knowledge types, discovery at multiple abstraction levels, incorporation of domain/background knowledge, query-driven and interactive mining, pattern evaluation and interestingness, handling uncertainty/noise, visualizing results, and identifying redundant patterns.</p>\n<h3>2. Performance</h3>\n<ul>\n<li><strong>Efficiency and scalability:</strong> Runtime and memory should remain practical as objects, attributes and sources grow.</li>\n<li><strong>Parallel/distributed/incremental mining:</strong> Work across processors or nodes, process streaming data and updates without complete recomputation.</li>\n<li><strong>High-dimensional data:</strong> More attributes increase sparsity and computational difficulty.</li>\n</ul>\n<h3>3. Diversity of data types</h3>\n<p>Structured tables differ from unstructured text, linked web pages, time series, trajectories, multimedia, and network data. Algorithms need type-specific representations and cross-source integration.</p>\n<h3>4. Application and societal issues</h3>\n<p>Privacy, data ownership, access permissions, security, explainability, algorithmic bias, and inappropriate use of mined correlations. These are useful modern considerations; the core slides emphasize methodology, performance, and heterogeneous data.</p>\n<h3>Reliable results demand</h3>\n<p>Representative data, proper handling of leakage, meaningful evaluation metrics, correct statistical interpretation (correlation ≠ causation), and understandable outputs.</p>\n<p><strong>Scenario response:</strong> For mining social web data, mention graph/text processing, scale, real-time updates, interestingness, user control, and privacy—not merely “large datasets”.</p>\n"}]},{"number":3,"title":"Data Preprocessing","kicker":"CLEAN / REDUCE / TRANSFORM","description":"Repair unreliable data, shrink it intelligently, and prepare numerical features.","accent":"#786ca7","source":"CAT 1 NOTES / M3.1 DM.ppt; DM CAT 2 NOTES / M3 DM.ppt","lessons":[{"title":"The complete preprocessing map","short":"Cleaning → integration → reduction → transformation.","body":"### Why data mining fails without preparation\nReal data may be **incomplete**, **noisy**, **inconsistent**, **duplicated**, collected at differing resolutions, or spread across systems. Even a sophisticated model cannot repair a systematically wrong definition of a feature.\n\n**Six quality dimensions from the lectures:** accuracy (correctness), completeness (missingness), consistency (agreement across records/systems), timeliness (currency), believability (trustworthiness), interpretability (unambiguous meaning). \n\n### Four core tasks\n1. **Cleaning:** Repair missing, noisy, incorrect and inconsistent values.\n2. **Integration:** Merge multiple data sources with compatible identities and schemas.\n3. **Reduction:** Use smaller representation with minimal loss of analytical information.\n4. **Transformation/discretization:** Convert values to useful scales, categories, aggregations, or new features.\n\n**Quick choice:** duplicated columns → attribute subset selection; inconsistent currency → integration/transformation; impossible age → cleaning; huge continuous income range → normalization/discretization.","source":"M3.1 DM.ppt slides 3–6; M3 DM.ppt slides 3–5","exam":"","type":"core","html":"<h3>Why data mining fails without preparation</h3>\n<p>Real data may be <strong>incomplete</strong>, <strong>noisy</strong>, <strong>inconsistent</strong>, <strong>duplicated</strong>, collected at differing resolutions, or spread across systems. Even a sophisticated model cannot repair a systematically wrong definition of a feature.</p>\n<p><strong>Six quality dimensions from the lectures:</strong> accuracy (correctness), completeness (missingness), consistency (agreement across records/systems), timeliness (currency), believability (trustworthiness), interpretability (unambiguous meaning).</p>\n<h3>Four core tasks</h3>\n<ol>\n<li><strong>Cleaning:</strong> Repair missing, noisy, incorrect and inconsistent values.</li>\n<li><strong>Integration:</strong> Merge multiple data sources with compatible identities and schemas.</li>\n<li><strong>Reduction:</strong> Use smaller representation with minimal loss of analytical information.</li>\n<li><strong>Transformation/discretization:</strong> Convert values to useful scales, categories, aggregations, or new features.</li>\n</ol>\n<p><strong>Quick choice:</strong> duplicated columns → attribute subset selection; inconsistent currency → integration/transformation; impossible age → cleaning; huge continuous income range → normalization/discretization.</p>\n\n<section class=\"imp-deepdive\"><div class=\"imp-depth-head\"><strong>★ EXAM-READY EXPANSION</strong><small>Checked against: M3.1 DM.ppt slides 4–6</small></div>\n<h3>Six data-quality dimensions — complete identification table</h3>\n<div class=\"table-scroll\"><table><thead><tr><th>Dimension</th><th>Meaning</th><th>Problem example</th></tr></thead><tbody>\n<tr><td><b>Accuracy</b></td><td>Does the value reflect reality?</td><td>Age recorded as 200 instead of 20</td></tr>\n<tr><td><b>Completeness</b></td><td>Are necessary values available?</td><td>Missing income field</td></tr>\n<tr><td><b>Consistency</b></td><td>Do records agree across sources?</td><td>Same customer has conflicting account status</td></tr>\n<tr><td><b>Timeliness</b></td><td>Is the record current enough?</td><td>Years-old contact data used for messaging</td></tr>\n<tr><td><b>Believability</b></td><td>Is the data/source trustworthy?</td><td>Unverified third-party figure</td></tr>\n<tr><td><b>Interpretability</b></td><td>Can its meaning be understood?</td><td>Unknown measurement units</td></tr>\n</tbody></table></div>\n<p><strong>Six dimensions are not the same as preprocessing tasks.</strong> The four tasks are cleaning, integration, reduction, and transformation/discretization. In a scenario, first identify the quality defect, then the operation to improve it.</p>\n<p class=\"imp-practice\"><b>Original practice:</b> One store writes 12/05 as 12 May while another means December 5. This is a <em>consistency/interpretability</em> issue; establish a single date convention during integration and validate ambiguous rows.</p></section>"},{"title":"Missing, noisy, inconsistent data","short":"Decide whether to drop, fill, smooth, or investigate.","body":"### Missing values — common handling\n- **Delete tuple/record:** Particularly when a class label is missing and labels are required; risks lost information and bias.\n- **Fill manually:** Accurate for tiny data, impractical at scale.\n- **Global constant:** “unknown” or a sentinel, but can invent an artificial cluster.\n- **Mean/median:** Numerical feature, often median for skewed distributions.\n- **Class-conditional mean:** Fill based on the target class or relevant group, but avoid target leakage at prediction time.\n- **Most probable value:** Regression, Bayesian inference, kNN or other learned imputation.\n\n### Noise\nNoise is random error or variance. The lecture lists **binning** (means/medians/boundaries), **regression** fitting a trend, and **clustering** to find patterns or unusual points.\n\n### Inconsistencies\n`DOB=2004` but `age=85`; mixed date formats; totals that differ from line items; duplicates; violated keys/ranges. Use metadata, schema constraints, cross-field rules and source-of-truth checks.\n\n**Important distinction:** Outliers can be *real rare events*, not errors. Investigate before deleting. Always fit imputers and scalers on **training data only**, then apply to held-out test data.","source":"M3.1 DM.ppt slides 8–13; M3 DM.ppt slides 7–12","exam":"Theory question: justify choices for incomplete and noisy values.","type":"core","html":"<h3>Missing values — common handling</h3>\n<ul>\n<li><strong>Delete tuple/record:</strong> Particularly when a class label is missing and labels are required; risks lost information and bias.</li>\n<li><strong>Fill manually:</strong> Accurate for tiny data, impractical at scale.</li>\n<li><strong>Global constant:</strong> “unknown” or a sentinel, but can invent an artificial cluster.</li>\n<li><strong>Mean/median:</strong> Numerical feature, often median for skewed distributions.</li>\n<li><strong>Class-conditional mean:</strong> Fill based on the target class or relevant group, but avoid target leakage at prediction time.</li>\n<li><strong>Most probable value:</strong> Regression, Bayesian inference, kNN or other learned imputation.</li>\n</ul>\n<h3>Noise</h3>\n<p>Noise is random error or variance. The lecture lists <strong>binning</strong> (means/medians/boundaries), <strong>regression</strong> fitting a trend, and <strong>clustering</strong> to find patterns or unusual points.</p>\n<h3>Inconsistencies</h3>\n<p><code>DOB=2004</code> but <code>age=85</code>; mixed date formats; totals that differ from line items; duplicates; violated keys/ranges. Use metadata, schema constraints, cross-field rules and source-of-truth checks.</p>\n<p><strong>Important distinction:</strong> Outliers can be <em>real rare events</em>, not errors. Investigate before deleting. Always fit imputers and scalers on <strong>training data only</strong>, then apply to held-out test data.</p>\n"},{"title":"Data integration, redundancy, and chi-square","short":"Entity resolution and correlation must be considered separately.","body":"### Integration\nCombine heterogeneous sources into one coherent representation. Resolve **schema integration** (`cust_id` vs `customer_identifier`), **entity identification** (two records describe the same customer), data-value conflicts, naming conventions and units.\n\n**Redundancy** arises from duplicated attributes, derivable fields, or duplicate tuples. Detect it with key analysis, statistics and domain meaning.\n\n### Chi-square for two categorical variables\nObserved frequency **Oᵢⱼ**, expected frequency **Eᵢⱼ = (row total × column total)/grand total**.\n\n**χ² = Σ over cells [(O−E)²/E]**. Large χ² relative to its degrees of freedom suggests **dependence**, not causal influence.\n\n**Slides' example:**\n| | Plays chess | Doesn't play | Row total |\n|---|---:|---:|---:|\n| Likes science fiction | 250 | 200 | 450 |\n| Doesn't like | 50 | 1000 | 1050 |\n| Column total | 300 | 1200 | 1500 |\n\nThe expected counts are `(90, 360, 210, 840)`:\n`(250−90)²/90 + (200−360)²/360 + (50−210)²/210 + (1000−840)²/840 ≈ 507.94`.\n\n**Degrees of freedom** for r×c table = `(r−1)(c−1)` = 1 here.\n\n**Exam trap:** χ² analyzes categorical *association*. Pearson r analyzes linear association between numeric variables. Neither proves causation.","source":"M3.1 DM.ppt slides 15–18; M3 DM.ppt slides 14–17","exam":"Make a contingency table with expected counts before summing χ².","type":"core","html":"<h3>Integration</h3>\n<p>Combine heterogeneous sources into one coherent representation. Resolve <strong>schema integration</strong> (<code>cust_id</code> vs <code>customer_identifier</code>), <strong>entity identification</strong> (two records describe the same customer), data-value conflicts, naming conventions and units.</p>\n<p><strong>Redundancy</strong> arises from duplicated attributes, derivable fields, or duplicate tuples. Detect it with key analysis, statistics and domain meaning.</p>\n<h3>Chi-square for two categorical variables</h3>\n<p>Observed frequency <strong>Oᵢⱼ</strong>, expected frequency <strong>Eᵢⱼ = (row total × column total)/grand total</strong>.</p>\n<p><strong>χ² = Σ over cells [(O−E)²/E]</strong>. Large χ² relative to its degrees of freedom suggests <strong>dependence</strong>, not causal influence.</p>\n<p><strong>Slides' example:</strong></p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th></th>\n  <th style=\"text-align:right\">Plays chess</th>\n  <th style=\"text-align:right\">Doesn't play</th>\n  <th style=\"text-align:right\">Row total</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Likes science fiction</td>\n  <td style=\"text-align:right\">250</td>\n  <td style=\"text-align:right\">200</td>\n  <td style=\"text-align:right\">450</td>\n</tr>\n<tr>\n  <td>Doesn't like</td>\n  <td style=\"text-align:right\">50</td>\n  <td style=\"text-align:right\">1000</td>\n  <td style=\"text-align:right\">1050</td>\n</tr>\n<tr>\n  <td>Column total</td>\n  <td style=\"text-align:right\">300</td>\n  <td style=\"text-align:right\">1200</td>\n  <td style=\"text-align:right\">1500</td>\n</tr>\n</tbody>\n</table></div>\n<p>The expected counts are <code>(90, 360, 210, 840)</code>:\n<code>(250−90)²/90 + (200−360)²/360 + (50−210)²/210 + (1000−840)²/840 ≈ 507.94</code>.</p>\n<p><strong>Degrees of freedom</strong> for r×c table = <code>(r−1)(c−1)</code> = 1 here.</p>\n<p><strong>Exam trap:</strong> χ² analyzes categorical <em>association</em>. Pearson r analyzes linear association between numeric variables. Neither proves causation.</p>\n"},{"title":"Pearson correlation and covariance","short":"Learn both the meaning and the table method.","body":"### Pearson correlation\n**r = Σ[(xᵢ−x̄)(yᵢ−ȳ)] / √(Σ(xᵢ−x̄)² · Σ(yᵢ−ȳ)²)**.\n\nEquivalent computational formula:\n\n**r = [nΣxy − (Σx)(Σy)] / √{[nΣx²−(Σx)²][nΣy²−(Σy)²]}**.\n\n- `+1`: perfect positive linear relation; `−1`: perfect negative.\n- Near `0`: little **linear** association, **not proof of independence**.\n- Correlation is unitless and invariant to positive rescaling.\n\n### Covariance\n**Population covariance = Σ[(x−x̄)(y−ȳ)] / n = Σxy/n − x̄ȳ**.\n\n**Sample covariance = Σ[(x−x̄)(y−ȳ)]/(n−1)**.\n\nPositive covariance: values tend to rise together; negative: one rises as other falls. Covariance depends on measurement scales, unlike Pearson r.\n\n**Lecture example:** A = `(2,3,5,4,6)`, B = `(5,8,10,11,14)` → `x̄=4`, `ȳ=9.6`, `Σxy=212`, population covariance = `212/5 − 38.4 = 4`.\n\n### Actual CAT-I numerical\nMathematics `(45,55,60,70,80)` and Data Mining `(50,60,65,75,85)` satisfy **y = x+5**, so **r = 1** exactly; this is perfect positive linear correlation.","source":"M3.1 DM.ppt slides 19–24; CAT 1 dm.pdf Q5","exam":"CAT-I Q5 is directly solved here.","type":"core","html":"<h3>Pearson correlation</h3>\n<p><strong>r = Σ[(xᵢ−x̄)(yᵢ−ȳ)] / √(Σ(xᵢ−x̄)² · Σ(yᵢ−ȳ)²)</strong>.</p>\n<p>Equivalent computational formula:</p>\n<p><strong>r = [nΣxy − (Σx)(Σy)] / √{[nΣx²−(Σx)²][nΣy²−(Σy)²]}</strong>.</p>\n<ul>\n<li><code>+1</code>: perfect positive linear relation; <code>−1</code>: perfect negative.</li>\n<li>Near <code>0</code>: little <strong>linear</strong> association, <strong>not proof of independence</strong>.</li>\n<li>Correlation is unitless and invariant to positive rescaling.</li>\n</ul>\n<h3>Covariance</h3>\n<p><strong>Population covariance = Σ[(x−x̄)(y−ȳ)] / n = Σxy/n − x̄ȳ</strong>.</p>\n<p><strong>Sample covariance = Σ[(x−x̄)(y−ȳ)]/(n−1)</strong>.</p>\n<p>Positive covariance: values tend to rise together; negative: one rises as other falls. Covariance depends on measurement scales, unlike Pearson r.</p>\n<p><strong>Lecture example:</strong> A = <code>(2,3,5,4,6)</code>, B = <code>(5,8,10,11,14)</code> → <code>x̄=4</code>, <code>ȳ=9.6</code>, <code>Σxy=212</code>, population covariance = <code>212/5 − 38.4 = 4</code>.</p>\n<h3>Actual CAT-I numerical</h3>\n<p>Mathematics <code>(45,55,60,70,80)</code> and Data Mining <code>(50,60,65,75,85)</code> satisfy <strong>y = x+5</strong>, so <strong>r = 1</strong> exactly; this is perfect positive linear correlation.</p>\n"},{"title":"Normalization: three essential formulas","short":"Min–max, z-score, and decimal scaling.","body":"### 1. Min–max normalization\n**x' = a + [(x−min)/(max−min)](b−a)**, mapping original data range `[min,max]` into `[a,b]`.\n\nFor `[0,1]`: `x'=(x−min)/(max−min)`.\n**Actual CAT-II:** values 18,27,35,49,62,70,81,96 → min=18, max=96 → **70'=(70−18)/(96−18)=52/78≈0.6667**.\n\n**If max = min:** denominator is 0. Treat the constant feature separately (commonly assign 0); don't divide by zero.\n\n### 2. Z-score standardization\n**z = (x−μ)/σ**, where σ is the population standard deviation, or use sample s consistently as the question specifies. Mean 0, SD 1 after standardization (if nonconstant). This is **not restricted to [0,1]**.\n\n### 3. Decimal scaling\n**x' = x/10ʲ**, where `j` is the smallest nonnegative integer making `max(|x'|) < 1`. If the maximum absolute value is 987, `j=3`; 987→0.987. If max=100, j=3 (100/100=1 is not *less than* 1).\n\n| Goal | Prefer |\n|---|---|\n| Fixed interval [0,1] | Min–max |\n| Compare deviations in SD units | Z-score |\n| Quick decimal magnitude reduction | Decimal scaling |\n\n**Leakage trap:** Use training-derived min/max/mean/SD for evaluation and new records.","source":"M3 DM.ppt slides 51–52; CAT-II Q1","exam":"Actual CAT-II Q1: normalize 70 from a given list.","type":"core","html":"<h3>1. Min–max normalization</h3>\n<p><strong>x' = a + <a href=\"b%E2%88%92a\">(x−min)/(max−min)</a></strong>, mapping original data range <code>[min,max]</code> into <code>[a,b]</code>.</p>\n<p>For <code>[0,1]</code>: <code>x'=(x−min)/(max−min)</code>.\n<strong>Actual CAT-II:</strong> values 18,27,35,49,62,70,81,96 → min=18, max=96 → <strong>70'=(70−18)/(96−18)=52/78≈0.6667</strong>.</p>\n<p><strong>If max = min:</strong> denominator is 0. Treat the constant feature separately (commonly assign 0); don't divide by zero.</p>\n<h3>2. Z-score standardization</h3>\n<p><strong>z = (x−μ)/σ</strong>, where σ is the population standard deviation, or use sample s consistently as the question specifies. Mean 0, SD 1 after standardization (if nonconstant). This is <strong>not restricted to [0,1]</strong>.</p>\n<h3>3. Decimal scaling</h3>\n<p><strong>x' = x/10ʲ</strong>, where <code>j</code> is the smallest nonnegative integer making <code>max(|x'|) &lt; 1</code>. If the maximum absolute value is 987, <code>j=3</code>; 987→0.987. If max=100, j=3 (100/100=1 is not <em>less than</em> 1).</p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Goal</th>\n  <th>Prefer</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Fixed interval [0,1]</td>\n  <td>Min–max</td>\n</tr>\n<tr>\n  <td>Compare deviations in SD units</td>\n  <td>Z-score</td>\n</tr>\n<tr>\n  <td>Quick decimal magnitude reduction</td>\n  <td>Decimal scaling</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Leakage trap:</strong> Use training-derived min/max/mean/SD for evaluation and new records.</p>\n"},{"title":"Binning and smoothing — complete numerical method","short":"Equal-width vs equal-frequency, mean vs boundary.","body":"### Binning = make intervals\n**Equal-width:** `width=(max−min)/k`, intervals begin at `min + i×width`; commonly use `[left,right)` except include maximum in last bin. Bins can have unequal record counts.\n\n**Actual CAT-II data:** 18,27,35,49,62,70,81,96; 4 bins → width 78/4 = 19.5:\n- `[18,37.5)` → 18,27,35\n- `[37.5,57)` → 49\n- `[57,76.5)` → 62,70\n- `[76.5,96]` → 81,96.\n\n**Equal-frequency/equal-depth:** Sort the values, then allocate approximately `n/k` observations per bin. With 8 observations and 4 bins: `(18,27)`, `(35,49)`, `(62,70)`, `(81,96)`. Ties at boundaries may complicate perfectly equal-sized bins.\n\n### Smoothing an equal-frequency bin\nSource example sorted prices: `4,8,9,15 | 21,21,24,25 | 26,28,29,34`.\n\n- **By bin mean:** replace every value by its bin average: `(9,9,9,9)`, `(22.75,... repeated)` ≈ 23, and `(29.25,... repeated)` ≈ 29.\n- **By bin median:** replace each with its bin median.\n- **By bin boundaries:** replace each value by its **nearest bin endpoint**. For first bin, `4,4,4,15`. Where equally distant, state the tie rule.\n\n**Why bin?** Smoothing noise, discretizing for mining, and reducing numeric detail. Equal-width is sensitive to extreme values; equal-frequency gives more balanced counts.\n\n### Exam algorithm\nSort → compute min/max or target counts → write interval boundaries clearly → assign **every** input value exactly once → state last interval convention.","source":"M3 DM.ppt slides 53–57; CAT-II Q1 and re-CAT Q1","exam":"Also compare equal-width with equal-frequency explicitly.","type":"core","html":"<h3>Binning = make intervals</h3>\n<p><strong>Equal-width:</strong> <code>width=(max−min)/k</code>, intervals begin at <code>min + i×width</code>; commonly use <code>[left,right)</code> except include maximum in last bin. Bins can have unequal record counts.</p>\n<p><strong>Actual CAT-II data:</strong> 18,27,35,49,62,70,81,96; 4 bins → width 78/4 = 19.5:</p>\n<ul>\n<li><code>[18,37.5)</code> → 18,27,35</li>\n<li><code>[37.5,57)</code> → 49</li>\n<li><code>[57,76.5)</code> → 62,70</li>\n<li><code>[76.5,96]</code> → 81,96.</li>\n</ul>\n<p><strong>Equal-frequency/equal-depth:</strong> Sort the values, then allocate approximately <code>n/k</code> observations per bin. With 8 observations and 4 bins: <code>(18,27)</code>, <code>(35,49)</code>, <code>(62,70)</code>, <code>(81,96)</code>. Ties at boundaries may complicate perfectly equal-sized bins.</p>\n<h3>Smoothing an equal-frequency bin</h3>\n<p>Source example sorted prices: <code>4,8,9,15 | 21,21,24,25 | 26,28,29,34</code>.</p>\n<ul>\n<li><strong>By bin mean:</strong> replace every value by its bin average: <code>(9,9,9,9)</code>, <code>(22.75,... repeated)</code> ≈ 23, and <code>(29.25,... repeated)</code> ≈ 29.</li>\n<li><strong>By bin median:</strong> replace each with its bin median.</li>\n<li><strong>By bin boundaries:</strong> replace each value by its <strong>nearest bin endpoint</strong>. For first bin, <code>4,4,4,15</code>. Where equally distant, state the tie rule.</li>\n</ul>\n<p><strong>Why bin?</strong> Smoothing noise, discretizing for mining, and reducing numeric detail. Equal-width is sensitive to extreme values; equal-frequency gives more balanced counts.</p>\n<h3>Exam algorithm</h3>\n<p>Sort → compute min/max or target counts → write interval boundaries clearly → assign <strong>every</strong> input value exactly once → state last interval convention.</p>\n"},{"title":"Discretization and concept hierarchies","short":"From a continuum to interpretable levels.","body":"**Discretization** converts continuous attribute values to intervals/labels; e.g. age → `young / middle / old`. It reduces complexity but loses exact precision.\n\n- **Unsupervised:** Equal-width/equal-frequency bins, histograms, clustering; no class labels needed.\n- **Supervised:** Decision-tree splits chosen to separate known class labels (information gain, Gini).\n- **Top-down splitting:** Start broad, create smaller intervals.\n- **Bottom-up merging:** Combine adjacent intervals based on similarity or a statistical criterion (such as χ²).\n\n**Concept hierarchy** organizes levels of abstraction, e.g. `Street → City → State → Country`; for numerics `Age → Age band → ALL`. Can be defined by domain experts, explicit partial orders, grouping, or automatically from distinct-value patterns.\n\n**Remember:** A **hierarchy** connects concepts at different levels; **discretization** creates a finite set of intervals. They can be used together.","source":"M3 DM.ppt slides 53–61","exam":"","type":"core","html":"<p><strong>Discretization</strong> converts continuous attribute values to intervals/labels; e.g. age → <code>young / middle / old</code>. It reduces complexity but loses exact precision.</p>\n<ul>\n<li><strong>Unsupervised:</strong> Equal-width/equal-frequency bins, histograms, clustering; no class labels needed.</li>\n<li><strong>Supervised:</strong> Decision-tree splits chosen to separate known class labels (information gain, Gini).</li>\n<li><strong>Top-down splitting:</strong> Start broad, create smaller intervals.</li>\n<li><strong>Bottom-up merging:</strong> Combine adjacent intervals based on similarity or a statistical criterion (such as χ²).</li>\n</ul>\n<p><strong>Concept hierarchy</strong> organizes levels of abstraction, e.g. <code>Street → City → State → Country</code>; for numerics <code>Age → Age band → ALL</code>. Can be defined by domain experts, explicit partial orders, grouping, or automatically from distinct-value patterns.</p>\n<p><strong>Remember:</strong> A <strong>hierarchy</strong> connects concepts at different levels; <strong>discretization</strong> creates a finite set of intervals. They can be used together.</p>\n\n<section class=\"imp-deepdive\"><div class=\"imp-depth-head\"><strong>★ EXAM-READY EXPANSION</strong><small>Checked against: M3 DM.ppt slides 53–61; M1 DM.ppt slide 52</small></div>\n<h3>Concept hierarchies — worked numerical from the lecture METHOD</h3>\n<p>A concept hierarchy arranges attribute values from specific to general: <b>Street → City → State → Country → ALL</b>. For numeric attributes, first make age intervals by discretization, then summarize (roll up) counts.</p>\n<div class=\"imp-answer\"><b>Original example, not a copied faculty numerical:</b> Ages 12, 18, 22, 24, 31, 33, 39. Generalize to decade groups: 10–19 has 2 people; 20–29 has 2; 30–39 has 3. Roll up to ALL = 2+2+3 = <b>7</b>. The number of represented distinct groups falls from seven exact ages to three bands to one ALL group.</div>\n<p><b>Worked table:</b></p><div class=\"table-scroll\"><table><tr><th>Age band</th><th>Original ages</th><th>Count</th></tr><tr><td>10–19</td><td>12, 18</td><td>2</td></tr><tr><td>20–29</td><td>22, 24</td><td>2</td></tr><tr><td>30–39</td><td>31, 33, 39</td><td>3</td></tr><tr><td><b>ALL</b></td><td>All ages</td><td><b>7</b></td></tr></table></div>\n<p><b>Faculty methods:</b> expert-defined order (street&lt;city&lt;state&lt;country), explicit grouping of specific values, partial ordering and automatic generation based on distinct-value counts. For nominal data, more distinct values are <em>generally</em> lower in the hierarchy; the faculty gives exceptions (weekday/month/quarter/year).</p>\n<p><b>Exam steps:</b> define the hierarchy → show mapping → count each generalized group → compute ALL total → label roll-up and reverse drill-down → note loss of exact detail.</p></section>"},{"title":"Data reduction: what and why","short":"Dimensionality, numerosity, and compression are different.","body":"The aim is a **much smaller representation** that yields the same or nearly the same mining results.\n\n### Three broad strategies in the slides\n1. **Dimensionality reduction:** Fewer features/coordinates (wavelet transforms, PCA, attribute selection, new features).\n2. **Numerosity reduction:** Fewer records or a concise data model (regression, log-linear models, histograms, clustering representatives, sampling, data cube aggregation).\n3. **Compression:** Compact representation; **lossless** gives exact recovery, **lossy** approximates.\n\n### Curse of dimensionality\nAs feature count grows, the space expands exponentially, distances can become less informative, data grows sparse, and both storage and learning become harder.\n\n**Example:** 400 redundant customer measurements → use attribute selection to retain the most informative 25, or PCA to project into 25 components. Those two operations differ: selection keeps original columns; PCA produces new combined coordinates.","source":"M3 DM.ppt slides 23–25, 34–49","exam":"Actual CAT-II Q1(i): strategy is data reduction, especially dimensionality reduction.","type":"core","html":"<p>The aim is a <strong>much smaller representation</strong> that yields the same or nearly the same mining results.</p>\n<h3>Three broad strategies in the slides</h3>\n<ol>\n<li><strong>Dimensionality reduction:</strong> Fewer features/coordinates (wavelet transforms, PCA, attribute selection, new features).</li>\n<li><strong>Numerosity reduction:</strong> Fewer records or a concise data model (regression, log-linear models, histograms, clustering representatives, sampling, data cube aggregation).</li>\n<li><strong>Compression:</strong> Compact representation; <strong>lossless</strong> gives exact recovery, <strong>lossy</strong> approximates.</li>\n</ol>\n<h3>Curse of dimensionality</h3>\n<p>As feature count grows, the space expands exponentially, distances can become less informative, data grows sparse, and both storage and learning become harder.</p>\n<p><strong>Example:</strong> 400 redundant customer measurements → use attribute selection to retain the most informative 25, or PCA to project into 25 components. Those two operations differ: selection keeps original columns; PCA produces new combined coordinates.</p>\n"},{"title":"PCA, wavelets and attribute selection","short":"A conceptually correct reduction pipeline.","body":"### PCA step by step\n1. Collect numerical matrix `X` with rows=objects, columns=features.\n2. **Center** each feature by subtracting its mean; often **standardize** if measurement scales differ.\n3. Calculate **covariance matrix** `Σ = X_centeredᵀ X_centered / (n−1)`.\n4. Find **eigenvectors and eigenvalues** of the covariance matrix.\n5. Sort eigenvectors by decreasing eigenvalues (variance explained).\n6. Keep the first `k` orthogonal principal components and compute `Z = X_centered · W_k`.\n\n**Worked miniature:** covariance matrix `[[3,1],[1,3]]` has eigenvectors along `(1,1)` and `(1,−1)` with eigenvalues `4` and `2`. First PC explains `4/(4+2)=66.7%` of variance.\n\nPCA components maximize **retained variance**, not necessarily class prediction accuracy. Components may be less interpretable than original attributes.\n\n### Wavelets\nA wavelet transform breaks a signal into **coarse (approximation)** and **detail** coefficients at different resolutions; small detail coefficients can often be discarded for compression/denoising. The slides illustrate **Haar wavelets** on an eight-value signal. Fourier transforms instead emphasize global frequencies; wavelets localize changes by position and scale.\n\n### Attribute selection and generation\n- **Attribute subset selection:** Forward selection, backward elimination, combined stepwise selection, tree-based importance. With d attributes there are `2ᵈ` possible subsets.\n- **Feature generation:** Make meaningful new attributes (e.g. `debt_to_income = debt/income`) to capture relationships.\n\n**Contrast:** Feature **selection** retains some original dimensions; **extraction** (PCA) constructs different axes.","source":"M3 DM.ppt slides 26–36","exam":"","type":"core","html":"<h3>PCA step by step</h3>\n<ol>\n<li>Collect numerical matrix <code>X</code> with rows=objects, columns=features.</li>\n<li><strong>Center</strong> each feature by subtracting its mean; often <strong>standardize</strong> if measurement scales differ.</li>\n<li>Calculate <strong>covariance matrix</strong> <code>Σ = X_centeredᵀ X_centered / (n−1)</code>.</li>\n<li>Find <strong>eigenvectors and eigenvalues</strong> of the covariance matrix.</li>\n<li>Sort eigenvectors by decreasing eigenvalues (variance explained).</li>\n<li>Keep the first <code>k</code> orthogonal principal components and compute <code>Z = X_centered · W_k</code>.</li>\n</ol>\n<p><strong>Worked miniature:</strong> covariance matrix <code>[[3,1],[1,3]]</code> has eigenvectors along <code>(1,1)</code> and <code>(1,−1)</code> with eigenvalues <code>4</code> and <code>2</code>. First PC explains <code>4/(4+2)=66.7%</code> of variance.</p>\n<p>PCA components maximize <strong>retained variance</strong>, not necessarily class prediction accuracy. Components may be less interpretable than original attributes.</p>\n<h3>Wavelets</h3>\n<p>A wavelet transform breaks a signal into <strong>coarse (approximation)</strong> and <strong>detail</strong> coefficients at different resolutions; small detail coefficients can often be discarded for compression/denoising. The slides illustrate <strong>Haar wavelet
