n                                                                       10   1  2\n       major OLAP operations with suitable examples.\n\n   2.   A multinational retail company stores sales, customer, and inventory data in\n        separate operational databases. Management wants to analyse 8 years of sales\n        trends across different countries and product categories for better business                                                                       10   1  2\n         decisions. Why is a Data Warehouse preferred over an operational database for\n        business analysis? Based on the above scenario, draw the three-tier architecture\n         of a Data Warehouse.\n   3.    Explain how different classification schemes influence the design of an effective\n       Data Mining System, and analyse the major issues that must be addressed to\n                                                                       10   1  2\n       ensure reliable knowledge discovery.\n\n   4.    Explain why Data Mining is considered as the core step of the Knowledge\n        Discovery in Databases process. Discuss how each stage of the KDD process   10   1  2\n        contributes to discovering useful knowledge.\n   5.   The marks obtained by five students in Mathematics and Data Mining are shown\n       below:\n      A (45, 50), B (55, 60) ,C (60, 65), D (70, 75) ,E (80, 85)                        5\n        a) Calculate the Pearson Correlation Coefficient and comment on the relationship       2  3\n       between the two variables.\n        b) Explain how Data Cleaning improve data quality before the mining process.                                                                       5\n\n\n                                           **********************\n\n\n\n\n                                                                                    Page 1 of 1"}]},{"name":"M7 DM/FALLSEM2024-25_BCSE208L_TH_VL2024250101574_2024-11-13_Reference-Material-I.pdf","parts":[{"page":1,"text":"Spatial-Temporal Data Mining"},{"page":2,"text":"Outline\n\n\n• Introduction\n• Active Spatial Data Mining\n   – Spatial data mining trigger\n• Temporal Association Rule with Numerical\n  Attributes\n   – Correlation among object evolutions\n• Conclusions and Future Work"},{"page":3,"text":"Introduction\n\n                               • Huge amount of spatial data\n                           are generated everyday.\n                              – Earth Observing System\n                              – National Spatial Data Infrastructure\n                                                          Satellite\n\n\n     Satellite                                                                                                                             Satellite       – National Image Mapping Agency\n                              – One meter resolution data\n                              –  Digital earth\n\n\n\n\n\n             Satellite dish                                                                 Satellite dish              Users are usually interested in\n                           the hidden information.\n                                                                                                                 Satellite dish         – Aggregate information\n                              –  Clustering\n                              –  Patterns"},{"page":4,"text":"Introduction\n\n\n• Knowledge discovery processes are\n  computationally expensive.\n• Today’s technology advances provide\n  necessary computing power to carry out\n  such complicated processes."},{"page":5,"text":"Outline\n\n\n• Introduction\n• STING+: An approach to active spatial data\n  mining\n• Temporal association rules with numerical\n   attributes\n• Conclusions and Future Work"},{"page":6,"text":"STING+\n\n\n•  Since data evolves over time, interesting patterns are likely\n   to emerge or change.\n•  Goal: identify and find (most) interesting patterns\n•  Problems:\n    – Knowledge discovery processes are expensive.\n                It is not feasible to re-process the entire data set for every change.\n    –  Periodically examine the data.\n           • Long delays\n           •  Transient patterns might be missed\n\n  Natural solution: Usage of triggers."},{"page":7,"text":"STING+\n\n\n•  Traditional database triggers can not be directly applied:\n    – Expressive power of traditional database triggers is limited,\n       especially in describing spatial relationships.\n    – Example: Trigger investigation when the size of any cluster\n      exceeds 20.\n                                       . .                                        .                                         . .                                       .. .                                                                       .. ..             .                                                                      .. ..                                                             .                                                    .\n\n                                                        .\n                                                .\n                                    .                                         .                                                         ."},{"page":8,"text":"STING+\n\n• STING+ was designed to introduce and support spatial\n   triggers efficiently.\n•  Observation (spatial locality): Only objects added to the\n  shaded area will contribute to the growth of cluster size at\n   this moment.\n\n                                        . .                                         .                                          . .                                        .. .                                                                        .. ..             .                                                                       .. ..                                                              .                                                     .\n\n                                                         .\n                                                 .\n                                     .                                          .                                                          ."},{"page":9,"text":"STING+\n\n\n• STING+ Strategy: Monitor only the area occupied by\n   potential clusters and their neighborhoods.\n\n\n•  Observation (cumulative effect): at least 4 more objects\n   are needed in order to make the cluster size be 20.\n\n\n• STING+ Strategy: Space is organized in a hierarchy so\n   that updates can be suspended at various levels in the\n   hierarchy until the cumulative effect might cause the\n   trigger to be fired."},{"page":10,"text":"STING+\n\n\n   – Space is recursively divided into smaller rectangular\n       cells down to a specified granularity and is organized\n      via the inherit pyramid hierarchy.\n\n                    . .                                           . .                     .                                             .                      . .                                           . .                    .. .                                          .. .                                       .. ..             .                                                .. ..             .                                      .. ..                                                                       .. ..                                          .                                             .                                 .                                             .\n\n                                     .                                             .\n                             .                                             .\n                 .                                             .                      .                                             .                                      .                                             .\n\n                   Level 1                    Level 2"},{"page":11,"text":"STING+\n\n\n    – STING+ decomposes a trigger into a set of sub-triggers\n       associated with individual cells in the hierarchical\n        structure to monitor the cumulative effect of data\n      changes within the cell.\n                          . .                                                 . .                           .                                                   .                            . .                                                 . .                          .. .                                                .. .                                                 .. ..             .                                                          .. ..             .                                                .. ..                                                                                 .. ..                                                .                                                   .Sub-trigger                        .                                                   .\n  on cell\n                                    Higher level\n                                           .        sub-trigger                          .\n                                   .              on cell                     .\n                       .                                                   .                            .                                                   .                                            .                                                   .\n\n                    Level 4                           Level 3"},{"page":12,"text":"STING+\n\n\n   – Updates/insertions are suspended at various levels in\n      the hierarchy until such time that the cumulative effect\n      of these insertions might cause the trigger condition to\n     become satisfied.\n                    . .                                          . .                     .                                            .                      . .                                          . .                    .. .                                         .. .                                       .. ..             .                                              .. ..             .                                      .. ..                                                                     .. ..                                          .                                            .                                 .                                            .\n                +                         +             + ++                      + ++\n                                     .                                            .\n                             .                                            .\n                 .                                            .                      .                                            .                                      .                                            .\n\n                Level 0                      Level 1"},{"page":13,"text":"STING+\n\n\n\n            . .                                          . .             .                                            .              . .                                          . .            .. .                                         .. .                          .. ..             .                                              .. ..             .                         .. ..                                                                     .. ..                                  .                                            .                         .                                            .\n            +                         +         + ++                      + ++\n                             .                                            .\n                     .                                            .\n         .                                            .              .                                            .                              .                                            .\n\n           Level 2                      Level 3\n\n                        No update of cluster !"},{"page":14,"text":"STING+\n\n\n•  Primitive event: insertion, deletion, update\n•  Composite event: a set of primitive events\n•  In general, evaluating a trigger T usually involves two\n   aspects:\n    – Find a set of composite events E(s) that may cause the trigger\n       condition CT to become true.\n    – Each time some composite event in E(s) occurs, check the status\n        (false or true) of CT (given that CT was false previously).\n•  Observation: As a side effect of the occurrence of some\n  composite event, E(s) might also evolve over time."},{"page":15,"text":" STING+\n\n                                              . .                                               .                                                . .                                              .. .                                                                                  ..               .                                                                                 ..                                                                    .                                                           .\n                                                      .                                                  .                                                            ..                                                         ...                                      ..                                    ..                                                     .                                             .       ..\n                                                              .                                             .\n                                           .                                                .                                                                .\n• STING+ Strategy: Two sets of composite events are considered:\n    –  the set of composite events E(s) that can cause CT to become true\n           • need to re-evaluate CT\n    –  the set of composite events F(s) that can cause a change to E(s)\n           • need to update E(s)\n    – The sub-triggers are used to monitor composite events in E(s) and F(s) and\n      change accordingly when E(s) and F(s) evolves."},{"page":16,"text":"STING+\n\n\n• Observation: Trigger condition CT is a\n  conjunction of predicates     …    and                        P1   P2        Pn\n  can not be true if one predicate is false.\n   – They can be evaluated in a specific order: the ith\n      predicate is tested when all previous (i -1) predicates\n      are true.\n   – The evaluation order should be chosen in such a way\n       that the total cost is minimum."},{"page":17,"text":"STING+\n\n\n• PK-tree is used to index instantiated cells\n   – Bound on height\n   – Bounds on number of children\n   – Uniqueness for any data set\n          • independent of order of insertion and deletion\n   – Solid theoretical foundation\n   – Fast retrieval and efficient maintenance\n•  Statistical information maintained at each node is\n  used to facilitate the trigger process.\n   – Sub-trigger"},{"page":18,"text":"STING+\n\n• Comparison with periodic re-examination via\n  STING\n   – 200,000 synthetic point objects\n   – 10,000 insertions/deletions/updates\n   – If the period is set to be less than 4000 updates,\n    STING+ consumes less CPU cycles.\n   – Significant delay and transient patterns misses can\n     occur for larger period.\n          • Not acceptable in many applications\n   – No delay and no transient patterns missed with\n     STING+."},{"page":19,"text":"Outline\n\n\n• Introduction\n• STING+: An approach to active spatial data\n  mining\n• Temporal association rules with numerical\n  attributes\n• Conclusions and Future Work"},{"page":20,"text":"Temporal Association Rules\n\n\n• Now we are considering general databases with evolving\n   numerical attributes.\n•  Interesting patterns exhibited in the data are often\n  numerous and complicated.\n    – Customer churning: If a customer’s phone bill increases by at\n        least $10 each month for six months, then he is likely to change his\n       long distance telephone carrier.\n    – Real estate: People who receive a raise of at least 20% of their\n       salary are likely to move away from big city.\n•  Such patterns can be represented by association rules of\n   the form X  Y, which indicates that the occurrences of X\n  and Y have high correlation."},{"page":21,"text":"Temporal Association Rules\n\n\n•  Earlier work on association rules mainly focused on binary\n   attributes and intra-transaction relationship.\n   – E.g., ham  bread\n   – Support and strength are two metrics used to qualify\n      interesting rules.\n          • support: number of instances to follow the rule\n            – N(ham, bread)\n          • strength: how strong the correlation is\n\n           N ( ham , bread )\n            –\n             N ( ham )\n\n             N ( ham , bread )\n            –\n            N ( ham )  N ( bread )"},{"page":22,"text":"Temporal Association Rules\n\n•  Consider a set of objects, each of which has a unique ID\n  and a set of time varying numerical attributes; and a\n  sequence of snapshots are taken at some frequency.\n    –  E.g., in an employee database, two attributes are considered: salary\n      and monthly housing expense.\n    – For a given snapshot, each employee can be mapped to a point in a\n      two dimensional space.\n\n                                                    .\n                                                .\n                                          .\n                                                                salary        .                                         . .\n\n\n                           monthly housing expense"},{"page":23,"text":"Temporal Association Rules\n\n\n\n         Snapshot 1   Snapshot 2   Snapshot 3   Snapshot 4   Snapshot 5\n\n                                                                      .                                                       .                              .                     .              .                                                .                                                                   .                                                    .                  .                                                              .                                                                                  .                                  .             .              .                     .              .               .                 .              .               .               .                   .                  salary                                                                     .                               .                .             . .             . .               .\n\n                                                                   time\n\n   – Given a sequence of snapshots, the trace of an\n     employee can be mapped to a point in a high\n     dimensional space.\n          • (<s1, mhe1>, <s2, mhe2>, <s3, mhe3>, <s4, mhe4>, <s5, mhe5>)"},{"page":24,"text":"Temporal Association Rules\n\n\n•  Temporal association rules represent the correlation\n  among object evolutions.\n    –  (salary: [52000, 56000]→[54000, 58000]) \n       (monthly_housing_expense: [1200, 1400]→[1400, 1600])\n    – Each temporal association rule can also be viewed as an\n        interpretation of a cluster (with certain shape) of points.\n\n                                                          .                                                           .                                                  .. .. .. ..                                                  .                                                    . . ......                                                   ...                                                          .                                                        ....                                                          ...                                                                       salary     .                                             ......                                             .                                               ...... .                                               .\n\n\n                            monthly_housing_expense"},{"page":25,"text":"Temporal Association Rules\n\n\n\n•  Observation: The domain of a numerical attribute might contain a\n   large number of distinct values and might even be continuous.\n    –  E.g., domain(salary) = [50000, 60000].\n    – Any sub-ranges can appear in a rule.\n    – The number of possible rules may be very large if not infinite.\n•  Strategy: Each attribute domain is quantized into a set of equi-length\n   base intervals.\n    – The domain of salary could be quantized into base intervals of length\n       $2000:\n\n                     50000              60000\n\n    –  Values within the same interval are not distinguished.\n             •  E.g., $51000 and $51500 are considered as the same."},{"page":26,"text":"Temporal Association Rules\n\n\n•  Attribute evolution\n\n                60000\n\n\n                58000\n\n\n                56000\n                          salary\n                54000\n\n\n                52000\n\n\n                50000\n         E1(salary) = [52000, 54000] → [52000, 54000] → [54000, 56000]\n         E2(salary) = [52000, 56000] → [52000, 54000] → [52000, 56000]"},{"page":27,"text":"Temporal Association Rules\n\n\n\n\n                 Snapshot 1\n\n                          Evolution space\n\n\n\n                                                       Evolution cube of E2(salary)\n\n                                                       Evolution cube of E1(salary)\n    Base cube                                                      Snapshot 2\n\n\n\n     Snapshot 3"},{"page":28,"text":"Temporal Association Rules\n\n\n   – The subcube-supercube relationship defines a lattice\n    among all evolution cubes within the evolution space.\n   – This also holds for the evolution space of more than\n     one attributes.\n\n                              60000\n\n                                                                salary\n\n\n                              50000\n                                  1000             2000\n                             monthly housing expense"},{"page":29,"text":"Temporal Association Rules\n\n• Some properties of the metrics enable us to search\n   efficiently through the lattice in a bottom-up manner.\n                                          .  .  .  .\n\n                                                              ...\n                                                         ...\n                                                       ...\n\n                                                ...\n\n  Property of strength: The strength of an evolution cube is\n   less than or equal to the highest strength of its subcubes.\n\n  Property of support: The support of an evolution cube is\n  great than or equal to support of its subcube."},{"page":30,"text":"Temporal Association Rules\n\n\n•  Observation: Many valid but trivial rules may exist.\n    –  (salary: [52000, 56000])  (monthly_housing_expense: [1200, 1400])\n    –  (salary: [50000, 56000])  (monthly_housing_expense: [1200, 1400])\n    –  Both rules have the same value of support and strength since no\n       employee’s salary is between 50000 and 52000. However, the first rule\n       conveys more precise information.\n                               60000\n                                                            .\n                                                        .\n                                                  .                                                   .                                                                    salary                                                 . .\n\n                               50000\n                                    1000             2000\n                              monthly housing expense"},{"page":31,"text":"Temporal Association Rules\n\n•  Strategy: An interval can be included in a rule only if\n   there are some minimum number of objects whose\n   attributes values fall into that interval.\n    – The density of each base cube within the evolution cube of a rule\n       has to meet some threshold.\n                                   ..  ..   .                                         .                                      min_density = 2                                           ..                                  ..                                    .      .                                    .                                  . .     ...\n\n    – In the previous example, the second rule can be eliminated.\n•  Property of density: An evolution cube could satisfy the\n   density threshold only when all of its subcubes satisfy the\n   density threshold."},{"page":32,"text":"Temporal Association Rules\n\n•  General Model:\n    – Data set D\n    – Language L\n           •  express properties or define subgroup of data\n    – Selection predicate q\n           •  evaluate whether a sentence  L defines a potentially interesting\n             class of D\n    – Task: find the set { | q(D, ) is true}\n•  If\n    – a lattice can be formed on sentences in L and\n    –  partial order exists on selection predicate\n•  then the level-wise algorithm can be used to prune search\n   space efficiently."},{"page":33,"text":"Temporal Association Rules\n\n\n•  Temporal Association Rule:\n    – Language L: each sentence  L is a temporal association rule.\n    – The selection predicate q(D, ) is true iff\n           •  support(D, )  min_support and          q1\n           •  strength(D, )  min_strength and          q2\n           •  density(D, )  min_density                                           q3\n    – Task: find the set of temporal association rules which satisfy all\n       three predicates.\n•  Specialization relation < ⎯ a lattice on the sentences in L\n    – subcube/supercube relationship"},{"page":34,"text":"Temporal Association Rules\n\n•  partial order on qi with respect to <\n    – support(D, )  support(D, ) if < \n    –  if strength (D, ) < min_strength for all < , then strength(D, )\n     < min_strength\n    – density(D, )  density(D, ) if < \n•  level-wise algorithm\n    –  basic scheme: starting from the most special (general) sentences,\n      and then evaluate more and more general (special) sentences\n       excluding those sentences that can not be interesting given all the\n       information obtained in earlier iterations.\n   Efficient space pruning\n    –  Starting point\n    – Random sampling\n    – Order of predicate evaluation"},{"page":35,"text":"Temporal Association Rules\n\n\n•  Efficiency of space pruning\n    – SR algorithm: after quantization, base intervals are combined as long as\n         their density satisfies the threshold. The original base intervals and the\n       combined intervals are treated as a set of items.\n\n\n\n\n\n                                                                             100000 objects\n                                                                             100 snapshots\n                                                                             5 attributes\n                                                                             500 rules of length 5\n                                                                                        density = 2\n                                                                                 support = 5%\n                                                                                       strength = 1.4"},{"page":36,"text":"Conclusions and Future Work\n\n• Selected future work\n   – Data mining over Internet\n         • data type\n         • networking issue\n   – Analytical model\n         • classify data mining problems\n         • devise efficient general approach\n   – Applications\n         • compiler/programming language\n         • WWW"}]},{"name":"M7 DM/FALLSEM2024-25_BCSE208L_TH_VL2024250101574_2024-11-06_Reference-Material-I.pdf","parts":[{"page":1,"text":"Outlier Detection"},{"page":2,"text":"Motivation: Fraud Detection\n\n\n\n\n\n  http://i.imgur.com/ckkoAOp.gif\n\n\n  Jian Pei: CMPT 741/459 Data Mining -- Outlier Detection (1)                                  2"},{"page":3,"text":"Techniques: Fraud Detection\n\n•  Features\n•  Dissimilarity\n•  Groups and noise\n\n\n\n\n\n  http://i.stack.imgur.com/tRDGU.png\n\n\n  Jian Pei: CMPT 741/459 Data Mining -- Outlier Detection (1)                                  3"},{"page":4,"text":"Outlier Analysis\n\n•  “One person’s noise is another person’s\n  signal”\n•  Outliers: the objects considerably dissimilar\n  from the remainder of the data\n   – Examples: credit card fraud, Michael Jordon,\n     intrusions, etc\n   – Applications: credit card fraud detection,\n    telecom fraud detection, intrusion detection,\n    customer segmentation, medical analysis, etc\n\n\n\n  Jian Pei: CMPT 741/459 Data Mining -- Outlier Detection (1)                                  4"},{"page":5,"text":"Outliers and Noise\n\n•  Different from noise\n   – Noise is random error or variance in a\n    measured variable\n•  Outliers are interesting: an outlier violates\n  the mechanism that generates the normal\n  data\n•  Outlier detection vs. novelty detection\n   – Early stage may be regarded as outliers\n   – But later merged into the model\n\n  Jian Pei: CMPT 741/459 Data Mining -- Outlier Detection (1)                                  5"},{"page":6,"text":"Types of Outliers\n\n•  Three kinds: global, contextual and\n  collective outliers\n   – A data set may have multiple types of outlier\n  – One object may belong to more than one type of\n     outlier\n•  Global outlier (or point anomaly)\n   – An outlier object significantly deviates from the\n     rest of the data set\n•  challenge: find an appropriate measurement\n  of deviation\n\n\n  Jian Pei: CMPT 741/459 Data Mining -- Outlier Detection (1)                                  6"},{"page":7,"text":"Contextual Outliers\n\n•  An outlier object deviates significantly based on a\n  selected context\n     –  Ex. Is 10C in Vancouver an outlier? (depending on summer\n      or winter?)\n•  Attributes of data objects should be divided into two\n  groups\n     –  Contextual attributes: defines the context, e.g., time &\n      location\n     –  Behavioral attributes: characteristics of the object, used in\n       outlier evaluation, e.g., temperature\n•  A generalization of local outliers—whose density\n   significantly deviates from its local area\n•  Challenge: how to define or formulate meaningful\n  context?\n\n\n  Jian Pei: CMPT 741/459 Data Mining -- Outlier Detection (1)                                  7"},{"page":8,"text":"Collective Outliers\n\n•  A subset of data objects collectively deviate\n  significantly from the whole data set, even if the\n  individual data objects may not be outliers\n    –  Application example: intrusion detection when a\n    number of computers keep sending denial-of-\n     service packages to each other\n•  Detection of collective outliers\n    –  Consider not only behavior of individual objects, but\n     also that of groups of objects\n    –  Need to have the background knowledge on the\n     relationship among data objects, such as a distance\n     or similarity measure on objects\n\n\n\n  Jian Pei: CMPT 741/459 Data Mining -- Outlier Detection (1)                                  8"},{"page":9,"text":"Outlier Detection: Challenges\n\n•  Modeling normal objects and outliers properly\n    –  Hard to enumerate all possible normal behaviors in\n    an application\n    –  The border between normal and outlier objects is\n     often a gray area\n•  Application-specific outlier detection\n    –  Choice of distance measure among objects and the\n    model of relationship among objects are often\n     application-dependent\n    –  Example: clinic data: a small deviation could be an\n      outlier; while in marketing analysis, larger\n     fluctuations\n\n\n\n  Jian Pei: CMPT 741/459 Data Mining -- Outlier Detection (1)                                  9"},{"page":10,"text":"Outlier Detection: Challenges\n\n•  Handling noise in outlier detection\n    –  Noise may distort the normal objects and blur the\n      distinction between normal objects and outliers\n    –  Noise may help hide outliers and reduce the\n     effectiveness of outlier detection\n•  Understandability\n    –  Understand why these are outliers: Justification of\n     the detection\n    –  Specify the degree of an outlier: the unlikelihood of\n     the object being generated by a normal mechanism\n\n\n  Jian Pei: CMPT 741/459 Data Mining -- Outlier Detection (1)                                 10"},{"page":11,"text":"Outlier Detection Methods\n\n•  Whether user-labeled examples of outliers\n  can be obtained\n   – Supervised, semi-supervised, and unsupervised\n    methods\n•  Assumptions about normal data and outliers\n   – Statistical, proximity-based, and clustering-\n    based methods\n\n\n\n\n\n  Jian Pei: CMPT 741/459 Data Mining -- Outlier Detection (1)                                    11"},{"page":12,"text":"Supervised Methods\n\n•  Modeling outlier detection as a classification problem\n     –  Samples examined by domain experts used for training &\n      testing\n•  Methods for Learning a classifier for outlier detection\n   effectively:\n     –  Model normal objects & report those not matching the model\n     as outliers, or\n     –  Model outliers and treat those not matching the model as\n     normal\n•  Challenges\n     –  Imbalanced classes, i.e., outliers are rare: Boost the outlier\n      class and make up some artificial outliers\n     –  Catch as many outliers as possible, i.e., recall is more\n      important than accuracy (i.e., not mislabeling normal objects\n     as outliers)\n\n  Jian Pei: CMPT 741/459 Data Mining -- Outlier Detection (1)                                 12"},{"page":13,"text":"Unsupervised Methods\n\n•  Assume the normal objects are somewhat\n  ``clustered'‘ into multiple groups, each having some\n   distinct features\n•  An outlier is expected to be far away from any\n  groups of normal objects\n•  Weakness: Cannot detect collective outlier\n  effectively\n    –  Normal objects may not share any strong patterns, but\n     the collective outliers may share high similarity in a\n     small area\n•  Many clustering methods can be adapted for\n  unsupervised methods\n    –  Find clusters, then outliers: not belonging to any cluster\n\n\n  Jian Pei: CMPT 741/459 Data Mining -- Outlier Detection (1)                                 13"},{"page":14,"text":"Unsupervised Methods: Challenges\n\n•  In some intrusion or virus detection, normal\n  activities are diverse\n    –  Unsupervised methods may have a high false\n     positive rate but still miss many real outliers.\n    –  Supervised methods can be more effective, e.g.,\n      identify attacking some key resources\n•  Challenges\n    –  Hard to distinguish noise from outliers\n    –  Costly since first clustering: but far less outliers than\n    normal objects\n•  Newer methods: tackle outliers directly\n\n  Jian Pei: CMPT 741/459 Data Mining -- Outlier Detection (1)                                 14"},{"page":15,"text":"Semi-Supervised Methods\n\n•  In many applications, the number of labeled data is often\n  small\n     –  Labels could be on outliers only, normal objects only, or both\n•   If some labeled normal objects are available\n     –  Use the labeled examples and the proximate unlabeled\n      objects to train a model for normal objects\n     –  Those not fitting the model of normal objects are detected as\n       outliers\n•   If only some labeled outliers are available, a small\n  number of labeled outliers many not cover the possible\n   outliers well\n     –  To improve the quality of outlier detection, one can get help\n     from models for normal objects learned from unsupervised\n     methods\n\n\n  Jian Pei: CMPT 741/459 Data Mining -- Outlier Detection (1)                                 15"},{"page":16,"text":"Pros and Cons\n\n•  Effectiveness of statistical methods: highly\n  depends on whether the assumption of\n  statistical model holds in the real data\n•  There are rich alternatives to use various\n  statistical models\n   – Parametric vs. non-parametric\n\n\n\n\n\n  Jian Pei: CMPT 741/459 Data Mining -- Outlier Detection (1)                                 16"},{"page":17,"text":"Proximity-based Methods\n\n•  An object is an outlier if the nearest\n  neighbors of the object are far away, i.e.,\n  the proximity of the object is significantly\n  deviates from the proximity of most of the\n  other objects in the same data set\n\n\n\n\n\n  Jian Pei: CMPT 741/459 Data Mining -- Outlier Detection (1)                                 17"},{"page":18,"text":"Pros and Cons\n\n•  The effectiveness of proximity-based methods\n  highly relies on the proximity measure\n•  In some applications, proximity or distance\n  measures cannot be obtained easily\n•  Often have a difficulty in identifying a group of\n  outliers that stay close to each other\n•  Two major types of proximity-based outlier\n  detection methods\n    –  Distance-based vs. density-based\n\n\n  Jian Pei: CMPT 741/459 Data Mining -- Outlier Detection (1)                                 18"},{"page":19,"text":"Clustering-based Methods\n\n•  Normal data belong to large and dense\n  clusters, whereas outliers belong to small or\n  sparse clusters, or do not belong to any\n  clusters\n\n\n\n\n\n  Jian Pei: CMPT 741/459 Data Mining -- Outlier Detection (1)                                 19"},{"page":20,"text":"Challenges\n\n•  Since there are many clustering methods,\n  there are many clustering-based outlier\n  detection methods as well\n•  Clustering is expensive: straightforward\n  adaption of a clustering method for outlier\n  detection can be costly and does not scale\n  up well for large data sets\n\n\n\n\n\n  Jian Pei: CMPT 741/459 Data Mining -- Outlier Detection (1)                                 20"},{"page":21,"text":"Statistical Outlier Analysis\n\n•  Assumption: the objects in a data set are\n  generated by a (stochastic) process (a\n  generative model)\n•  Learn a generative model fitting the given\n  data set, and then identify the objects in low\n  probability regions of the model as outliers\n•  two categories: parametric versus non-\n  parametric\n\n\n\n\n  Jian Pei: CMPT 741/459 Data Mining -- Outlier Detection (1)                                 21"},{"page":22,"text":"Example\n\n•  Statistical methods (also known as model-\n  based methods) assume that the normal\n  data follow some statistical model\n   – The data not following the model are outliers.\n\n\n\n\n\n  Jian Pei: CMPT 741/459 Data Mining -- Outlier Detection (1)                                 22"},{"page":23,"text":"Parametric Methods\n\n•  Assumption: the normal data is generated\n  by a parametric distribution with parameter\n  θ\n•  The probability density function of the\n  parametric distribution f(x | θ) gives the\n  probability that object x is generated by the\n  distribution\n•  The smaller this value, the more likely x is\n  an outlier\n\n\n  Jian Pei: CMPT 741/459 Data Mining -- Outlier Detection (1)                                 23"},{"page":24,"text":"Univariate Outliers Based on Normal\nDistribution\n\n\n     Xn              Xn                                                       1\n   ln     σ2) =     ln f(xi  (u, σ2)) =     ln(2⇡)     ln σ2           (xi    L(µ,                            |      −n2    −n2   − 2σ2      −µ)2\n                 i=1                                                i=1\n•  Taking derivatives with respect to µ and σ2,\n we derive the following maximum likelihood\n  estimates\n     Xn      Xn             1                  1\n         ˆµ = ¯x =       xi           ˆσ2 =       (xi           n               n       −¯x)2\n                  i=1                   i=1\n\n\n\n\n\n  Jian Pei: CMPT 741/459 Data Mining -- Outlier Detection (1)                                 24"},{"page":25,"text":"Example\n\n•  Daily average temperature: {24.0, 28.9,\n  28.9, 29.0, 29.1, 29.1, 29.2, 29.2, 29.3,\n  29.4}\n                   p                                ˆµ = 28.61 ˆσ =   2.29 = 1.51•  Since n = 10,\n•  Then (24 – 28.61) /1.51 = – 3.04 < –3, 24 is\n  an outlier since µ ± 3σ contains 99.7% data\n\n\n\n\n\n  Jian Pei: CMPT 741/459 Data Mining -- Outlier Detection (1)                                 25"},{"page":26,"text":"The Grubb’s Test\n\n•  Maximum normed residual test\n•  For each object x in a data set, compute its\n  z-score          v               u\n               u     t2↵\n               t      2N ,N−2   – x is an outlier if  z    −1\n                     N   + t2↵            ≥Np N\n                                                 2N                         −2      ,N−2\n    –  t2↵      is the value taken by a t-distribution at a        2N         ,N−2\n     significance level of α/(2N), and N is the number\n     of objects in the data set\n\n\n\n\n\n  Jian Pei: CMPT 741/459 Data Mining -- Outlier Detection (1)                                 26"},{"page":27,"text":"Non-parametric Method\n\n•  Not assume an a-priori statistical model,\n  instead, determine the model from the input\n  data\n   – Not completely parameter free but consider the\n    number and nature of the parameters are\n     flexible and not fixed in advance\n•  Examples: histogram and kernel density\n  estimation\n\n\n\n\n\n  Jian Pei: CMPT 741/459 Data Mining -- Outlier Detection (1)                                 27"},{"page":28,"text":"Histogram\n\n•  A transaction in the amount of $7,500 is an\n  outlier, since only 0.2% transactions have\n  an amount higher than $5,000\n\n\n\n\n\n  Jian Pei: CMPT 741/459 Data Mining -- Outlier Detection (1)                                 28"},{"page":29,"text":"Challenges\n\n•  Hard to choose an appropriate bin size for\n  histogram\n   – Too small bin size → normal objects in empty/\n     rare bins, false positive\n   – Too big bin size → outliers in some frequent\n     bins, false negative\n\n\n\n\n\n  Jian Pei: CMPT 741/459 Data Mining -- Outlier Detection (1)                                 29"},{"page":30,"text":"To-Do List\n\n•  Read Chapters 12.1-12.3\n\n\n\n\n\n  Jian Pei: CMPT 741/459 Data Mining -- Outlier Detection (1)                                 30"}]},{"name":"M7 DM/WEB MINING.pdf","parts":[{"page":1,"text":"Chapter 11\nWeb Mining And\nSearch Engines"},{"page":2,"text":"Chapter Objectives\n\n\n\n   1.To understand what is meant by web mining and its\n      types.\n   2.To understand the working of the HITS algorithm To\n    know the brief history of search engines.\n   3.To understand a search engine's architecture and its\n     working.\n   4.To understand the PageRank algorithm and its\n     working.\n   5.To understand the concepts of precision and recall."},{"page":3,"text":"        Introduction to Web Mining\n\nWeb mining is divided into three parts, i.e. web content mining, structure mining, and\nusage mining as shown in Figure.\n\n\n\n\n\n                                      Categories of Web Mining\n\n\nThese slides are designed to complement 'Data Mining and Data Warehousing' by Parteek Bhatia, published by Cambridge University Press."},{"page":4,"text":"         Web Content Mining\n\n• Web content mining deals with extracting relevant knowledge from the contents\n   of a web page.\n\n•  During content mining, we totally ignore how other web pages link to a given\n  web page or how users interact with it.\n\n• A trivial approach to web content mining is based on location and frequency of\n  keywords. But this gives rise to two problems: first, the problem of scarcity and\n  second, the problem of abundance.\n\n•  The data is usually present in the form of HTML which is semi-structured and\n   useful information is generally scattered across multiple web pages.\n\n\n   These slides are designed to complement 'Data Mining and Data Warehousing' by Parteek Bhatia, published by Cambridge University Press."},{"page":5,"text":"       Web document clustering\n\n• Web document clustering is an approach to manage large number of documents\n\n  based on keywords.\n\n•  The core idea is to form meaningful clusters of the web pages instead of returning a\n\n    list of web pages arranged by their rank.\n\n•  Cluster analysis techniques, namely K-mean and agglomerative clustering, can be\n\n  used to achieve this goal.\n\n\n\n\n\n   These slides are designed to complement 'Data Mining and Data Warehousing' by Parteek Bhatia, published by Cambridge University Press."},{"page":6,"text":"         Suffix Tree Clustering (STC)\n•  It does Clustering based upon phrases rather than frequency\n  of keywords.\nSTC works as follows:\nStep 1: Obtain text from the web page. For every sentence in\n  the text, filter out common       words and punctuations.\n  Convert the remaining words into their root form.\nStep 2: Make a tree based on the list of words obtained in\n  step 1.\nStep 3: Compare trees obtained from various documents.\n  Tree having same root to leaf node sequence of words are\n  grouped into same cluster.\n\n\n   These slides are designed to complement 'Data Mining and Data Warehousing' by Parteek Bhatia, published by Cambridge University Press."},{"page":7,"text":"        Suffix Tree Clustering (STC)\n\n\n\n\n\nThese slides are designed to complement 'Data Mining and Data Warehousing' by Parteek Bhatia, published by Cambridge University Press."},{"page":8,"text":"      Resemblance and containment\n\n•  Resemblance is the term for how similar two documents are to each other. It has a\n   value between 0 and 1 (both inclusive). A value close to 1 represents an almost\n   similar document and a value close to 0 represents a completely different document.\n•  Containment is the term for the existence of one document inside another. It also\n   has value between 0 and 1 with value of 1 representing that the first document is\n   present inside the second and value of 0 stating otherwise.\n•   It uses the concept of shingles.\n\n\n\n\n\n   These slides are designed to complement 'Data Mining and Data Warehousing' by Parteek Bhatia, published by Cambridge University Press."},{"page":9,"text":"               Fingerprinting\n\nFingerprinting works by dividing a document into a continuous sequence of words\n   (shingles) of every possible length. For instance, consider two documents with the\n   respective content given below.\n     Document 1: I love machine learning.\n     Document 2: I love artificial intelligence\n                                       Sequences of length two\n\n\n\n\n\n   These slides are designed to complement 'Data Mining and Data Warehousing' by Parteek Bhatia, published by Cambridge University Press."},{"page":10,"text":"          Web Usage Mining\n\nWeb usage mining deals with extracting useful information from log data about a\n   user’s interaction with the web pages.\n                                       Important parameters for web usage mining\n\n\n\n\n\n   These slides are designed to complement 'Data Mining and Data Warehousing' by Parteek Bhatia, published by Cambridge University Press."},{"page":11,"text":"         Web Structure Mining\nWeb structure mining aims at obtaining information\n  from the hyperlinked structure of the web. Apart from\n  discovering authority sites, web structure is also used to\n  identify hubs, i.e., the websites which link to many\n  authority websites.\n\n\n\n\n\n   These slides are designed to complement 'Data Mining and Data Warehousing' by Parteek Bhatia, published by Cambridge University Press."},{"page":12,"text":"Hyperlink Induced Topic Search (HITS) algorithm\nHITS algorithm is an algorithm that analyzes hyperlinked\n  structure of the web in order to rank web pages. HITS\n  works on the basis of the concept of hubs and authority.\n  They do not hold any information by themselves but\n  they point out to other pages which according to them\n  have the required information.\n\n\n\n\n\n   These slides are designed to complement 'Data Mining and Data Warehousing' by Parteek Bhatia, published by Cambridge University Press."},{"page":13,"text":" Hyperlink Induced Topic Search (HITS) algorithm\n\nFollowing Figure shows a hyperlinked web structure where H1, H2 and H3 are search directories pages and A, B,\nC and D are web pages. pages like H1, H2 and H3 act as hubs of information.\n\n\n\n\n\n                                       Hubs and Authority\n\nThe Following figure below shows a web page structure where each node represents a web page and arrows\nshow the hyperlinks between the vertices.\n\n\n\n\n\n   These slides are designed to complement 'Data Mining and Data Warehousing' by Parteek Bhatia, published by Cambridge University Press."},{"page":14,"text":" Hyperlink Induced Topic Search (HITS) algorithm\nStep 1: Adjacency matrix representing web structure\n\n\n\n\n\n                                                     Step 2: Prepare the transpose of matrix\n\n\n\n\n\n   These slides are designed to complement 'Data Mining and Data Warehousing' by Parteek Bhatia, published by Cambridge University Press."},{"page":15,"text":" Hyperlink Induced Topic Search (HITS) algorithm\nStep 3: Assume initial hub weight vector to be 1 and calculate authority weight vector\n\n\n\n\n\n                         Obtaining the Authority Weight Matrix\n\nStep 4: Calculate the updated hub weight vector\n\n\n\n\n\n                           Updated Hub Weight Vector\n\n\n   These slides are designed to complement 'Data Mining and Data Warehousing' by Parteek Bhatia, published by Cambridge University Press."},{"page":16,"text":"        Working of a Search Engine\nEvery search engine\n  consists of the\n  following modules:\na web crawler,\nan indexer and\na query processor.\n\n\n\n\n                                        Architecture of a search engine\n\n\n   These slides are designed to complement 'Data Mining and Data Warehousing' by Parteek Bhatia, published by Cambridge University Press."},{"page":17,"text":"            Web crawler\n\nA web crawler is a simple piece of software whose responsibility is to visit every\n  web page available on the www and fetch data from those web pages.\n\n\n                                    Algorithm of General web crawling\n\n\n\n\n\n   These slides are designed to complement 'Data Mining and Data Warehousing' by Parteek Bhatia, published by Cambridge University Press."},{"page":18,"text":"                 Indexer\nThe responsibility of an indexer is to identify\n   the keywords of a web page and index the\n  web pages with their respective keywords.\nWorking:\n• A list of words from the page title, heading\n  tags and the meta tags is extracted.\n• Next, common words such as the, it, and, that\n  and suchlike are removed from this list and\n  stemming is conducted on the remaining\n  words.\n•  After generating these keywords an index is\n  created which is queried when a user\n  performs a search.\n\n\n\n\n   These slides are designed to complement 'Data Mining and Data Warehousing' by Parteek Bhatia, published by Cambridge University Press."},{"page":19,"text":"            Query processor\nQuery processors used to return web pages based on the matching\n  keywords found in the index.\nWorking:\n• A query processor works in multiple stages. When a user enters a query\n   it is first passed to a checking module in order to correct any mistakes.\n• Once the query is checked, it is categorized based on its type. Then they\n  are arranged in order of their relevance decided by using algorithms\n  such as PageRank.\n\n\n\n\n\n   These slides are designed to complement 'Data Mining and Data Warehousing' by Parteek Bhatia, published by Cambridge University Press."},{"page":20,"text":"          PageRank Algorithm\n\nThe PageRank algorithm works on the basis of backlinks. It can be understood well\n   by considering the social behaviour of human beings. The PageRank algorithm uses\n   probability theory at its core. The probability of a user clicking on a link may be\n   estimated base on the number of links present in that web page. The more links a\n  web page has the less chance that a user will click on a particular link.\n\n\n\n\n\nHere, PR(A) represents PageRank of web page A, L(T) represents number of\n   outgoing links from web page T and d is the damping factor. Here, the term (1 - d)\n   represents the scenario when the user leaves the web page A.\n\n\n\n\n   These slides are designed to complement 'Data Mining and Data Warehousing' by Parteek Bhatia, published by Cambridge University Press."},{"page":21,"text":"     Example of PageRank Algorithm\n\nFigure shows a collection of four web pages where the arrow indicates the\n   hyperlinks. For instance, an arrow goes from page B to page C indicates that page B\n   has a link that will take the user to page C. Assume that initial damping factor (d) is\n   0.7. Find PageRank of all web pages.\n\n\n\n\n\n   These slides are designed to complement 'Data Mining and Data Warehousing' by Parteek Bhatia, published by Cambridge University Press."},{"page":22,"text":"    Example of PageRank Algorithm\n\n Solution: Applying the PageRank formula given above, we get following four linear equations:\n\n\n\n\n\n PR(A) = (1 - 0.7) + 0.7 (PR(B) / 2 + PR(D) / 1) = 0.3 + (0.7 / 2) (PR(B) + 2 PR(D))   …1\n As webpage A can be reached from webpage B and D only.\n PR(B) = (1 - 0.7) + 0.7 (PR(A) / 1) = 0.3 + 0.7 (PR(A))                  …2\n As webpage B can be reached from webpage A only.\n PR(C) = (1 - 0.7) + 0.7 (PR(B) / 2) = 0.3 + (0.7 / 2) (PR(B))               …3\n As webpage C can be reached from webpage B only.\n PR(D) = (1 - 0.7) + 0.7 (PR(C) / 1) = 0.3 + 0.7 (PR(C))                 …4\n As webpage D can be reached from webpage C only.\n\n  Therefore, the respective PageRanks are as follows:\n PR(A) = 1.281 PR(B) = 1.197 PR(C) = 0.719 PR(D) = 0.803\n\n\n\nThese slides are designed to complement 'Data Mining and Data Warehousing' by Parteek Bhatia, published by Cambridge University Press."},{"page":23,"text":"     Example of PageRank Algorithm\n\nFigure shows a collection of five web pages where the arrow indicates the\n   hyperlinks. Assume that initial damping factor (d) is 0.6. Find PageRank of all web\n   pages.\n\n\n\n\n\n   These slides are designed to complement 'Data Mining and Data Warehousing' by Parteek Bhatia, published by Cambridge University Press."},{"page":24,"text":"    Example of PageRank Algorithm\n\n Solution: Applying the PageRank formula given above, we get following four linear equations:\n\n\n\n\n\n PR(A) = (1 - 0.6) + 0.6 (PR(B) / 2 + PR(D) / 2) = 0.4 + (0.6 / 2) (PR(B) + PR(D))   …1\n PR(B) = (1 - 0.6) + 0.6 (PR(A) / 1 + PR(E) / 1) = 0.4 + 0.6 (PR(A) + PR(E))      …2\n PR(C) = (1 - 0.6) + 0.6 (PR(B) / 2) = 0.4 + (0.6 / 2) (PR(B))              …3\n PR(D) = (1 - 0.6) + 0.6 (PR(C) / 1) = 0.4 + 0.6 (PR(C))                …4\n PR(E) = (1 - 0.6) + 0.6 (PR(C) / 2 + PR(D) / 2) = 0.4 + (0.6 / 2) (PR(C) + PR(D))\n\n Therefore the respective Page Ranks are as followed:\n PR(A) = 1.19, PR(B) = 1.69, PR(C) = 0.91, PR(D) = 0.94 and PR(E) = 0.95.\n\n\n\n\n\nThese slides are designed to complement 'Data Mining and Data Warehousing' by Parteek Bhatia, published by Cambridge University Press."},{"page":25,"text":"           Precision and Recall\n   These two parameters which are used to evaluate the quality of the search\n    results of a search engine.\n\n\n\n\n\n                                            Venn diagram showing relevant and retrieved results\nPrecision is defined as\nPrecision = Number of relevant items retrieved / Total retrieved items\n= (Total retrieved ∩ Total relevant) / Total retrieved items\nAnd Recall is defined as\nRecall = Number of relevant retrieved / Total relevant items\n= (Total retrieved ∩ Total relevant) / Total relevant items\n\nThese slides are designed to complement 'Data Mining and Data Warehousing' by Parteek Bhatia, published by Cambridge University Press."},{"page":26,"text":"     Example of Precision and Recall\nLet us suppose that there are 200 pages available on\n  Internet for machine learning. The search on this term\n  returns total 210 pages, out of which 190 belongs to\n  machine learning, calculate precision and recall for our\n  algorithm.\n\n\n\n\n\n   These slides are designed to complement 'Data Mining and Data Warehousing' by Parteek Bhatia, published by Cambridge University Press."},{"page":27,"text":"    Example of Precision and Recall\n\n   Solution: Precision = Number of relevant items retrieved / Total retrieved\n   items\n             = (Total retrieved ∩ Total relevant) / Total retrieved items\n             = 190 / 210\n   Because, the Number of relevant items retrieved is 190 (belongs to machine\n   learning) and the Total Number of retrieved items is 210 (these many pages\n   were returned to user on his query).\n   Recall = Number of relevant retrieved / Total relevant items\n       = (Total retrieved ∩ Total relevant) / Total relevant items\n        = 190 / 200\n\n\n\n\n\nThese slides are designed to complement 'Data Mining and Data Warehousing' by Parteek Bhatia, published by Cambridge University Press."},{"page":28,"text":"Book Details\n\n                                                Table of Contents                               Published by\n                                                       1. Beginning with machine learning                 Cambridge University, Press\n                                                                                          (UK).                                                       2. Introduction to data mining\n                                                                  Recommended as Six Best                                                       3. Beginning with Weka and R language\n                                                               New Data Warehousing\n                                                       4. Data pre-processing\n                                                                       Books to read in 2020 and\n                                                       5. Classification                                                                             43 Best Data Mining Books\n                                                       6. Implementing classification in Weka and R             of all time by\n                                                       7. Cluster analysis                                bookauthority.org\n\n                                                       8. Implementing clustering with Weka and R\n\n                                                       9. Association mining\n\n                                                  10. Implementing association mining with Weka and R\n\n                                                    11. Web mining and search engine\n\n                                                  12. Operational data store and data warehouse\n\n                                                  13. Data warehouse schema\n\n                                                  14. Online analytical processing\n\n
