</li><li><b>LOOCV:</b> p=1, exactly N validation trials.</li><li><b>Rolling/time-series CV:</b> train on earlier timestamps and validate on later ones; never leak future observations into training.</li><li><b>Monte Carlo/repeated random splits:</b> repeatedly choose random train and test subsets; samples may be evaluated zero, one or several times.</li></ol>\n<div class=\"imp-answer\"><b>Quick stratified example:</b> 100 patients, 20 positive and 80 negative; 5 folds can each have approximately 4 positives and 16 negatives. Ordinary k-fold need not maintain that ratio.</div>\n<p><b>Common exam pitfalls:</b> Confusing N and k; saying LOOCV trains only once; claiming stratified folds have identical class counts for every dataset; averaging scores incorrectly; performing scaling using all records before cross-validation (data leakage).</p></section>"},{"title":"ROC, AUC, precision–recall and selecting models","short":"Thresholds create a trade-off.","body":"A classifier often outputs a **score/probability**; a threshold turns the score into class predictions.\n\n**ROC curve:** Plot **TPR (recall)** on vertical axis vs **FPR** on horizontal axis as threshold moves.\n- Ideal point: top-left `(FPR=0, TPR=1)`.\n- ROC-AUC: area under ROC; roughly how often a random positive ranks above a random negative.\n\n**Precision–recall curve:** Plot precision vs recall at different thresholds. Often more informative than ROC when positives are very rare because it focuses on the positive class.\n\n**Model selection factors from slides:** accuracy, speed, robustness, scalability, and interpretability. Use held-out validation, not training accuracy alone.\n\n### Classification vs regression error\nFor continuous targets, use **MAE = Σ|y−ŷ|/n**, **MSE = Σ(y−ŷ)²/n**, **RMSE = √MSE**; these measure numeric prediction errors, not classification accuracy.\n\n**Practical caution:** AUC says how well scores rank outcomes; it does not tell you the best operating threshold or whether probabilities are calibrated.","source":"Model Evaluation and Selection.pptx slides 8–9; Classification.pptx slides 49–50","exam":"","type":"core","html":"<p>A classifier often outputs a <strong>score/probability</strong>; a threshold turns the score into class predictions.</p>\n<p><strong>ROC curve:</strong> Plot <strong>TPR (recall)</strong> on vertical axis vs <strong>FPR</strong> on horizontal axis as threshold moves.</p>\n<ul>\n<li>Ideal point: top-left <code>(FPR=0, TPR=1)</code>.</li>\n<li>ROC-AUC: area under ROC; roughly how often a random positive ranks above a random negative.</li>\n</ul>\n<p><strong>Precision–recall curve:</strong> Plot precision vs recall at different thresholds. Often more informative than ROC when positives are very rare because it focuses on the positive class.</p>\n<p><strong>Model selection factors from slides:</strong> accuracy, speed, robustness, scalability, and interpretability. Use held-out validation, not training accuracy alone.</p>\n<h3>Classification vs regression error</h3>\n<p>For continuous targets, use <strong>MAE = Σ|y−ŷ|/n</strong>, <strong>MSE = Σ(y−ŷ)²/n</strong>, <strong>RMSE = √MSE</strong>; these measure numeric prediction errors, not classification accuracy.</p>\n<p><strong>Practical caution:</strong> AUC says how well scores rank outcomes; it does not tell you the best operating threshold or whether probabilities are calibrated.</p>\n"},{"title":"Ensembles: bagging, boosting and forests","short":"Many learners can be stronger than one.","body":"### Bagging = bootstrap aggregation\nDraw several bootstrap samples (with replacement), train a model on each independently, then majority-vote classification / average regression. Main benefit: **reduce variance** and instability of high-variance learners.\n\n### Random forest\nAn ensemble of decision trees trained on bootstrapped data, with **random subsets of features at each split**. Decorrelating the trees improves averaging.\n\n### Boosting\nTrain learners **sequentially**, emphasizing previous mistakes, and combine weighted predictions. **AdaBoost** starts with equal record weights; after each weak learner, increase emphasis on misclassified examples and combine learners based on performance.\n\n### Compare\n| | Bagging | Boosting |\n|---|---|---|\n| Training | Mostly parallel/independent | Sequential/dependent |\n| Sample focus | Bootstrap variability | Previous errors |\n| Combination | Vote/average | Weighted vote/additive model |\n| Main aim | Variance reduction | Reduce difficult errors / bias (often also variance) |\n| Noise sensitivity | Often more robust | Can focus excessively on mislabeled outliers |\n\n**Exam cue:** “Random forest = bagging + feature randomness + decision trees.”","source":"Classification.pptx slides 42–47; Model Evaluation and Selection.pptx slides 10–14","exam":"","type":"core","html":"<h3>Bagging = bootstrap aggregation</h3>\n<p>Draw several bootstrap samples (with replacement), train a model on each independently, then majority-vote classification / average regression. Main benefit: <strong>reduce variance</strong> and instability of high-variance learners.</p>\n<h3>Random forest</h3>\n<p>An ensemble of decision trees trained on bootstrapped data, with <strong>random subsets of features at each split</strong>. Decorrelating the trees improves averaging.</p>\n<h3>Boosting</h3>\n<p>Train learners <strong>sequentially</strong>, emphasizing previous mistakes, and combine weighted predictions. <strong>AdaBoost</strong> starts with equal record weights; after each weak learner, increase emphasis on misclassified examples and combine learners based on performance.</p>\n<h3>Compare</h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th></th>\n  <th>Bagging</th>\n  <th>Boosting</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Training</td>\n  <td>Mostly parallel/independent</td>\n  <td>Sequential/dependent</td>\n</tr>\n<tr>\n  <td>Sample focus</td>\n  <td>Bootstrap variability</td>\n  <td>Previous errors</td>\n</tr>\n<tr>\n  <td>Combination</td>\n  <td>Vote/average</td>\n  <td>Weighted vote/additive model</td>\n</tr>\n<tr>\n  <td>Main aim</td>\n  <td>Variance reduction</td>\n  <td>Reduce difficult errors / bias (often also variance)</td>\n</tr>\n<tr>\n  <td>Noise sensitivity</td>\n  <td>Often more robust</td>\n  <td>Can focus excessively on mislabeled outliers</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Exam cue:</strong> “Random forest = bagging + feature randomness + decision trees.”</p>\n"}]},{"number":6,"title":"Cluster Analysis & Outliers","kicker":"UNSUPERVISED STRUCTURE","description":"Distance, k-means, k-medoids, hierarchical, density, grids and anomalies.","accent":"#467f92","source":"M6 DM / M6 DM.pptx, K MEDOIDS DM 6.docx, OUTLIER DM 6.docx; M7 ref outlier PDF","lessons":[{"title":"What clustering is and when to use it","short":"Find high intra-cluster and low inter-cluster dissimilarity.","body":"**Cluster analysis** groups data so that objects in the same group are similar and those in different groups are dissimilar—without needing labeled classes.\n\n### Properties of useful clustering\nHigh **intra-cluster similarity**, low **inter-cluster similarity**, appropriate distance/density definition, stable results, interpretable groups, and scalability to realistic data.\n\n### Typical applications from slides\nCustomer segments, image recognition, spatial analysis of disease or hazards, insurance risk groups, fraud patterns, financial data, city planning, document organization.\n\n### Challenges/requirements\nScalability, mixed attribute types, irregular shapes, selecting k/parameters, noise/outliers, incremental updates, high dimensionality, constrained clustering, interpretability and insensitive processing order.\n\n**Five family types:**\n1. **Partitioning:** k-means, k-medoids/PAM.\n2. **Hierarchical:** agglomerative (AGNES), divisive (DIANA).\n3. **Density-based:** DBSCAN, OPTICS.\n4. **Grid-based:** STING, CLIQUE.\n5. **Model-based:** Fit assumed probability/distribution models.\n\n**Contrast:** A cluster has no natural ground-truth label until meaning is assigned. A classifier learns from known target labels.","source":"M6 DM.pptx slides 1–25","exam":"","type":"core","html":"<p><strong>Cluster analysis</strong> groups data so that objects in the same group are similar and those in different groups are dissimilar—without needing labeled classes.</p>\n<h3>Properties of useful clustering</h3>\n<p>High <strong>intra-cluster similarity</strong>, low <strong>inter-cluster similarity</strong>, appropriate distance/density definition, stable results, interpretable groups, and scalability to realistic data.</p>\n<h3>Typical applications from slides</h3>\n<p>Customer segments, image recognition, spatial analysis of disease or hazards, insurance risk groups, fraud patterns, financial data, city planning, document organization.</p>\n<h3>Challenges/requirements</h3>\n<p>Scalability, mixed attribute types, irregular shapes, selecting k/parameters, noise/outliers, incremental updates, high dimensionality, constrained clustering, interpretability and insensitive processing order.</p>\n<p><strong>Five family types:</strong></p>\n<ol>\n<li><strong>Partitioning:</strong> k-means, k-medoids/PAM.</li>\n<li><strong>Hierarchical:</strong> agglomerative (AGNES), divisive (DIANA).</li>\n<li><strong>Density-based:</strong> DBSCAN, OPTICS.</li>\n<li><strong>Grid-based:</strong> STING, CLIQUE.</li>\n<li><strong>Model-based:</strong> Fit assumed probability/distribution models.</li>\n</ol>\n<p><strong>Contrast:</strong> A cluster has no natural ground-truth label until meaning is assigned. A classifier learns from known target labels.</p>\n"},{"title":"Data types and distance measures","short":"Pick a distance that makes domain sense.","body":"### Numerical distance formulas\nFor two d-dimensional points x and y:\n- **Euclidean (L₂):** `√Σᵢ(xᵢ−yᵢ)²`.\n- **Manhattan (L₁):** `Σᵢ|xᵢ−yᵢ|`.\n- **Minkowski (Lₚ):** `(Σᵢ|xᵢ−yᵢ|ᵖ)^(1/p)`; p=1 Manhattan, p=2 Euclidean.\n- **Chebyshev (L∞):** `maxᵢ|xᵢ−yᵢ|`.\n- **Cosine similarity:** `(x·y)/(|x||y|)`; cosine distance often `1−cosine`.\n- **Jaccard similarity (sets):** `|A∩B|/|A∪B|`; Jaccard distance `1−similarity`.\n\n**Worked:** P=(2,3), Q=(5,7) → Euclidean=`√(3²+4²)=5`, Manhattan=`3+4=7`, Chebyshev=`4`.\n\n### Feature types\nContinuous numeric, ordinal rankings, binary (symmetric vs asymmetric), nominal categorical, and mixed types need suitable encodings/dissimilarities. For asymmetric binary, a shared absence may have less value than shared presence.\n\n### Scale matters\nIncome in lakhs will dominate age if distances are computed directly. Standardize/normalize where meaningful before distance-based clustering.\n\n**Exam caveat:** Euclidean distance is not automatically suitable for every type of data. You must justify feature encoding/scale.","source":"M6 DM.pptx slides 9–19, 46–49; course data-types syllabus; Jaccard extension","exam":"","type":"core","html":"<h3>Numerical distance formulas</h3>\n<p>For two d-dimensional points x and y:</p>\n<ul>\n<li><strong>Euclidean (L₂):</strong> <code>√Σᵢ(xᵢ−yᵢ)²</code>.</li>\n<li><strong>Manhattan (L₁):</strong> <code>Σᵢ|xᵢ−yᵢ|</code>.</li>\n<li><strong>Minkowski (Lₚ):</strong> <code>(Σᵢ|xᵢ−yᵢ|ᵖ)^(1/p)</code>; p=1 Manhattan, p=2 Euclidean.</li>\n<li><strong>Chebyshev (L∞):</strong> <code>maxᵢ|xᵢ−yᵢ|</code>.</li>\n<li><strong>Cosine similarity:</strong> <code>(x·y)/(|x||y|)</code>; cosine distance often <code>1−cosine</code>.</li>\n<li><strong>Jaccard similarity (sets):</strong> <code>|A∩B|/|A∪B|</code>; Jaccard distance <code>1−similarity</code>.</li>\n</ul>\n<p><strong>Worked:</strong> P=(2,3), Q=(5,7) → Euclidean=<code>√(3²+4²)=5</code>, Manhattan=<code>3+4=7</code>, Chebyshev=<code>4</code>.</p>\n<h3>Feature types</h3>\n<p>Continuous numeric, ordinal rankings, binary (symmetric vs asymmetric), nominal categorical, and mixed types need suitable encodings/dissimilarities. For asymmetric binary, a shared absence may have less value than shared presence.</p>\n<h3>Scale matters</h3>\n<p>Income in lakhs will dominate age if distances are computed directly. Standardize/normalize where meaningful before distance-based clustering.</p>\n<p><strong>Exam caveat:</strong> Euclidean distance is not automatically suitable for every type of data. You must justify feature encoding/scale.</p>\n"},{"title":"K-means — manual iteration","short":"Assign → average → reassign until stable.","body":"**K-means** partitions n objects into k groups; each cluster is represented by its **centroid**, the arithmetic mean of its assigned vectors. Objective: minimize **WCSS/SSE = Σclusters Σx∈C ||x−μ_C||²**.\n\n### Algorithm\n1. Choose k and initial centroids.\n2. Assign each point to nearest centroid (often Euclidean).\n3. Recompute centroid as mean of assigned points.\n4. Repeat until assignments/centroids stabilize or iteration limit reached.\n\n### Worked one-dimensional example\nData: `1,2,4,10,11,12`, choose k=2 with centroids 1 and 10.\n- Assignment to 1: `{1,2,4}`, to 10: `{10,11,12}`.\n- New centroids: `(1+2+4)/3=7/3≈2.333`, `(10+11+12)/3=11`.\n- Reassignment unchanged → converged.\n\n**Strengths:** Simple, fast roughly O(iterations × n × k × dimensions), suited to compact spherical numeric clusters.\n**Limitations:** Requires k, sensitive to centroid initialization and outliers, struggles with unequal densities and nonconvex shapes. Different initializations may give different local optima.\n\n**Exam nuance:** A **centroid may not be an actual object in the data**.","source":"M6 DM.pptx slides 26–27","exam":"","type":"core","html":"<p><strong>K-means</strong> partitions n objects into k groups; each cluster is represented by its <strong>centroid</strong>, the arithmetic mean of its assigned vectors. Objective: minimize <strong>WCSS/SSE = Σclusters Σx∈C ||x−μ_C||²</strong>.</p>\n<h3>Algorithm</h3>\n<ol>\n<li>Choose k and initial centroids.</li>\n<li>Assign each point to nearest centroid (often Euclidean).</li>\n<li>Recompute centroid as mean of assigned points.</li>\n<li>Repeat until assignments/centroids stabilize or iteration limit reached.</li>\n</ol>\n<h3>Worked one-dimensional example</h3>\n<p>Data: <code>1,2,4,10,11,12</code>, choose k=2 with centroids 1 and 10.</p>\n<ul>\n<li>Assignment to 1: <code>{1,2,4}</code>, to 10: <code>{10,11,12}</code>.</li>\n<li>New centroids: <code>(1+2+4)/3=7/3≈2.333</code>, <code>(10+11+12)/3=11</code>.</li>\n<li>Reassignment unchanged → converged.</li>\n</ul>\n<p><strong>Strengths:</strong> Simple, fast roughly O(iterations × n × k × dimensions), suited to compact spherical numeric clusters.\n<strong>Limitations:</strong> Requires k, sensitive to centroid initialization and outliers, struggles with unequal densities and nonconvex shapes. Different initializations may give different local optima.</p>\n<p><strong>Exam nuance:</strong> A <strong>centroid may not be an actual object in the data</strong>.</p>\n"},{"title":"K-medoids / PAM — numerical swaps","short":"Representative objects are actual points.","body":"A **medoid** is an **actual data point** minimizing total dissimilarity to the other points in its cluster. **K-medoids / PAM (Partitioning Around Medoids)** uses medoids instead of artificial means.\n\n### PAM workflow\n1. Choose k initial medoids.\n2. Assign each remaining point to the nearest medoid.\n3. Calculate **total cost = Σpoints distance(point, assigned medoid)**.\n4. Consider swapping one medoid with a non-medoid and recompute total cost.\n5. Accept the swap **only if it decreases cost**; repeat until no improving swap remains.\n\n### Source numerical\nInitial medoids C1=(4,5), C2=(8,5). Using **Manhattan distance**, the notes compute total cost **20**.\nTest replacing C2=(8,5) with C2'=(8,4): total cost **22**.\n**Swap cost = 22−20 = +2**, so reject the swap and keep the old medoids.\n\n**Why robust?** A median-like representative is not pulled as dramatically by a single extreme point as a mean.\n\n| k-means | k-medoids |\n|---|---|\n| Center = numerical mean | Center = observed data object |\n| Usually squared Euclidean objective | General pairwise dissimilarity possible |\n| Faster for large n | PAM often costlier |\n| More outlier sensitive | More resistant to extremes |\n\n**Important limitation:** The provided DOCX's diagrams and point table are image-only, so its cost comparison is reproduced, but the missing table is not invented.","source":"M6 DM.pptx slides 28–29; K MEDOIDS DM 6.docx worked swap","exam":"PAM cost and swap questions are highly practice-worthy.","type":"core","html":"<p>A <strong>medoid</strong> is an <strong>actual data point</strong> minimizing total dissimilarity to the other points in its cluster. <strong>K-medoids / PAM (Partitioning Around Medoids)</strong> uses medoids instead of artificial means.</p>\n<h3>PAM workflow</h3>\n<ol>\n<li>Choose k initial medoids.</li>\n<li>Assign each remaining point to the nearest medoid.</li>\n<li>Calculate <strong>total cost = Σpoints distance(point, assigned medoid)</strong>.</li>\n<li>Consider swapping one medoid with a non-medoid and recompute total cost.</li>\n<li>Accept the swap <strong>only if it decreases cost</strong>; repeat until no improving swap remains.</li>\n</ol>\n<h3>Source numerical</h3>\n<p>Initial medoids C1=(4,5), C2=(8,5). Using <strong>Manhattan distance</strong>, the notes compute total cost <strong>20</strong>.\nTest replacing C2=(8,5) with C2'=(8,4): total cost <strong>22</strong>.\n<strong>Swap cost = 22−20 = +2</strong>, so reject the swap and keep the old medoids.</p>\n<p><strong>Why robust?</strong> A median-like representative is not pulled as dramatically by a single extreme point as a mean.</p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>k-means</th>\n  <th>k-medoids</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Center = numerical mean</td>\n  <td>Center = observed data object</td>\n</tr>\n<tr>\n  <td>Usually squared Euclidean objective</td>\n  <td>General pairwise dissimilarity possible</td>\n</tr>\n<tr>\n  <td>Faster for large n</td>\n  <td>PAM often costlier</td>\n</tr>\n<tr>\n  <td>More outlier sensitive</td>\n  <td>More resistant to extremes</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Important limitation:</strong> The provided DOCX's diagrams and point table are image-only, so its cost comparison is reproduced, but the missing table is not invented.</p>\n"},{"title":"Hierarchical clustering and linkage","short":"Merge by distance, not by class labels.","body":"### Two directions\n- **AGNES (agglomerative):** Start with n singleton clusters. Repeatedly merge the **two closest clusters** until one remains or a stopping rule applies.\n- **DIANA (divisive):** Start with all objects together. Repeatedly divide clusters.\n\nThe result can be drawn as a **dendrogram**; merge height represents dissimilarity at which groups join.\n\n### How is inter-cluster distance calculated?\nGiven clusters A and B:\n- **Single linkage:** `min{d(a,b):a∈A,b∈B}`. Can form *chains*.\n- **Complete linkage:** `max{d(a,b)}`. Prefers compact clusters.\n- **Average linkage:** Average of **all cross-cluster pair distances**.\n- **Centroid linkage:** Distance between cluster centroids.\n- **Ward linkage:** Select merger with least increase in within-cluster SSE.\n\n**Worked:** A={1,2}, B={5,8} using absolute distance.\nCross distances: |1−5|=4, |1−8|=7, |2−5|=3, |2−8|=6.\n- Single = **3**; complete = **7**; average = `(4+7+3+6)/4=5`.\n- Centroid distance = |1.5−6.5| = **5**.\n\n**Agglomerative matrix routine:** Start distance table → merge smallest pair → update distance to new cluster according to linkage → repeat → draw dendrogram.\n\n**Limitation:** Early irreversible merges can be wrong; standard implementations may require O(n²) memory/time or more, especially with naive updates.","source":"M6 DM.pptx slides 30–36, 44–63","exam":"","type":"core","html":"<h3>Two directions</h3>\n<ul>\n<li><strong>AGNES (agglomerative):</strong> Start with n singleton clusters. Repeatedly merge the <strong>two closest clusters</strong> until one remains or a stopping rule applies.</li>\n<li><strong>DIANA (divisive):</strong> Start with all objects together. Repeatedly divide clusters.</li>\n</ul>\n<p>The result can be drawn as a <strong>dendrogram</strong>; merge height represents dissimilarity at which groups join.</p>\n<h3>How is inter-cluster distance calculated?</h3>\n<p>Given clusters A and B:</p>\n<ul>\n<li><strong>Single linkage:</strong> <code>min{d(a,b):a∈A,b∈B}</code>. Can form <em>chains</em>.</li>\n<li><strong>Complete linkage:</strong> <code>max{d(a,b)}</code>. Prefers compact clusters.</li>\n<li><strong>Average linkage:</strong> Average of <strong>all cross-cluster pair distances</strong>.</li>\n<li><strong>Centroid linkage:</strong> Distance between cluster centroids.</li>\n<li><strong>Ward linkage:</strong> Select merger with least increase in within-cluster SSE.</li>\n</ul>\n<p><strong>Worked:</strong> A={1,2}, B={5,8} using absolute distance.\nCross distances: |1−5|=4, |1−8|=7, |2−5|=3, |2−8|=6.</p>\n<ul>\n<li>Single = <strong>3</strong>; complete = <strong>7</strong>; average = <code>(4+7+3+6)/4=5</code>.</li>\n<li>Centroid distance = |1.5−6.5| = <strong>5</strong>.</li>\n</ul>\n<p><strong>Agglomerative matrix routine:</strong> Start distance table → merge smallest pair → update distance to new cluster according to linkage → repeat → draw dendrogram.</p>\n<p><strong>Limitation:</strong> Early irreversible merges can be wrong; standard implementations may require O(n²) memory/time or more, especially with naive updates.</p>\n"},{"title":"DBSCAN and density-based clustering","short":"Core, border and noise have precise definitions.","body":"**DBSCAN** finds clusters as connected dense regions and can recover non-spherical shapes.\n\n### Two parameters\n- **ε (Eps):** Radius of neighborhood.\n- **MinPts:** Minimum number of points in an ε-neighborhood needed for a **core point**. The standard convention includes the point itself; check how a particular question defines it.\n\n### Point types\n- **Core:** ε-neighborhood contains ≥ MinPts objects.\n- **Border:** Not a core, but lies inside an ε-neighborhood of some core.\n- **Noise:** Neither core nor density-reachable as part of a cluster.\n\n### Procedure\nSelect unvisited point → find ε-neighbors → if core, start/expand cluster by adding neighbors of reachable core points → if not core, mark provisional noise/border → continue.\n\n**Density reachable:** Chain of core-expanded neighborhoods from point to point. **Density connected:** Two points can be reached from a common point.\n\n**DBSCAN strengths:** Arbitrary shapes, automatic noise detection, no k. **Weaknesses:** Picking Eps/MinPts, variable-density clusters, difficult high-dimensional distances. **OPTICS** records density structure across thresholds.\n\n**Exam trap:** Border points do **not** independently expand a cluster; only **core points** do.","source":"M6 DM.pptx slides 37–43","exam":"","type":"core","html":"<p><strong>DBSCAN</strong> finds clusters as connected dense regions and can recover non-spherical shapes.</p>\n<h3>Two parameters</h3>\n<ul>\n<li><strong>ε (Eps):</strong> Radius of neighborhood.</li>\n<li><strong>MinPts:</strong> Minimum number of points in an ε-neighborhood needed for a <strong>core point</strong>. The standard convention includes the point itself; check how a particular question defines it.</li>\n</ul>\n<h3>Point types</h3>\n<ul>\n<li><strong>Core:</strong> ε-neighborhood contains ≥ MinPts objects.</li>\n<li><strong>Border:</strong> Not a core, but lies inside an ε-neighborhood of some core.</li>\n<li><strong>Noise:</strong> Neither core nor density-reachable as part of a cluster.</li>\n</ul>\n<h3>Procedure</h3>\n<p>Select unvisited point → find ε-neighbors → if core, start/expand cluster by adding neighbors of reachable core points → if not core, mark provisional noise/border → continue.</p>\n<p><strong>Density reachable:</strong> Chain of core-expanded neighborhoods from point to point. <strong>Density connected:</strong> Two points can be reached from a common point.</p>\n<p><strong>DBSCAN strengths:</strong> Arbitrary shapes, automatic noise detection, no k. <strong>Weaknesses:</strong> Picking Eps/MinPts, variable-density clusters, difficult high-dimensional distances. <strong>OPTICS</strong> records density structure across thresholds.</p>\n<p><strong>Exam trap:</strong> Border points do <strong>not</strong> independently expand a cluster; only <strong>core points</strong> do.</p>\n"},{"title":"Grid-based and model-based clustering","short":"STING, CLIQUE and what grid aggregation buys.","body":"### Grid-based principle\nPartition the data space into a **finite set of cells**, calculate cell statistics, then discover connected dense cells/clusters. Runtime may depend more on number of cells than number of objects.\n\n**STING (Statistical Information Grid):** Hierarchical rectangular cells. Every cell stores summary statistics (count, mean, SD, min, max, etc.). Search starts coarse and drills into relevant cells.\n\n**CLIQUE:** Grid-based **subspace clustering** for high-dimensional data; finds dense units in subsets of dimensions and assembles them into clusters.\n\n**WaveCluster:** Uses wavelet transformation to find connected high-density regions at scales and suppress random noise.\n\n### Model-based methods\nFit a hypothesized model (e.g. mixture of Gaussian distributions) to data and derive membership probabilities/assignments. Requires assumptions about distributions.\n\n**Compare:** DBSCAN defines neighborhood density around points; STING defines densities from grid cells; k-means defines distance to centroids.","source":"M6 DM.pptx slides 22–25; ACP Module 6 grid-based syllabus; textbook elaboration for STING/CLIQUE/WaveCluster","exam":"","type":"core","html":"<h3>Grid-based principle</h3>\n<p>Partition the data space into a <strong>finite set of cells</strong>, calculate cell statistics, then discover connected dense cells/clusters. Runtime may depend more on number of cells than number of objects.</p>\n<p><strong>STING (Statistical Information Grid):</strong> Hierarchical rectangular cells. Every cell stores summary statistics (count, mean, SD, min, max, etc.). Search starts coarse and drills into relevant cells.</p>\n<p><strong>CLIQUE:</strong> Grid-based <strong>subspace clustering</strong> for high-dimensional data; finds dense units in subsets of dimensions and assembles them into clusters.</p>\n<p><strong>WaveCluster:</strong> Uses wavelet transformation to find connected high-density regions at scales and suppress random noise.</p>\n<h3>Model-based methods</h3>\n<p>Fit a hypothesized model (e.g. mixture of Gaussian distributions) to data and derive membership probabilities/assignments. Requires assumptions about distributions.</p>\n<p><strong>Compare:</strong> DBSCAN defines neighborhood density around points; STING defines densities from grid cells; k-means defines distance to centroids.</p>\n"},{"title":"Outliers: global, contextual, collective","short":"Unusual does not always mean incorrect.","body":"### Three types from the uploaded outlier lecture\n1. **Global / point outlier:** Far from typical objects overall; e.g. one payment of ₹5,000,000 when almost all are ₹500.\n2. **Contextual / conditional outlier:** Unusual **given context**; e.g. 10°C may be ordinary in winter but anomalous in midsummer.\n3. **Collective outlier:** A **set/sequence** is unusual even though individual points look normal; e.g. coordinated low-value fraudulent transfers.\n\n**Noise** = random measurement variation. **Outlier** = exceptional object/pattern relative to a model; may be the *signal* we seek.\n\n### Methods\n- **Statistical / distribution based:** Z-score, normal model, extreme quantiles, Grubbs' test.\n- **Proximity based:** Large kNN distance.\n- **Density based:** Points in much sparser neighborhoods, e.g. LOF.\n- **Clustering based:** Unassigned points, tiny/sparse clusters, large distance to centroid.\n- **Supervised/semisupervised:** If some anomalies/normal examples are labeled.\n\n**Challenges:** Rare labeled anomalies, shifting definitions of “normal,” high dimensions, noise, computational cost, false-positive/false-negative trade-off.","source":"M7 reference PDF 2024-11-06 pages 4–29; OUTLIER DM 6.docx","exam":"","type":"core","html":"<h3>Three types from the uploaded outlier lecture</h3>\n<ol>\n<li><strong>Global / point outlier:</strong> Far from typical objects overall; e.g. one payment of ₹5,000,000 when almost all are ₹500.</li>\n<li><strong>Contextual / conditional outlier:</strong> Unusual <strong>given context</strong>; e.g. 10°C may be ordinary in winter but anomalous in midsummer.</li>\n<li><strong>Collective outlier:</strong> A <strong>set/sequence</strong> is unusual even though individual points look normal; e.g. coordinated low-value fraudulent transfers.</li>\n</ol>\n<p><strong>Noise</strong> = random measurement variation. <strong>Outlier</strong> = exceptional object/pattern relative to a model; may be the <em>signal</em> we seek.</p>\n<h3>Methods</h3>\n<ul>\n<li><strong>Statistical / distribution based:</strong> Z-score, normal model, extreme quantiles, Grubbs' test.</li>\n<li><strong>Proximity based:</strong> Large kNN distance.</li>\n<li><strong>Density based:</strong> Points in much sparser neighborhoods, e.g. LOF.</li>\n<li><strong>Clustering based:</strong> Unassigned points, tiny/sparse clusters, large distance to centroid.</li>\n<li><strong>Supervised/semisupervised:</strong> If some anomalies/normal examples are labeled.</li>\n</ul>\n<p><strong>Challenges:</strong> Rare labeled anomalies, shifting definitions of “normal,” high dimensions, noise, computational cost, false-positive/false-negative trade-off.</p>\n"},{"title":"Outlier numericals: z-scores and IQR","short":"Two exam-friendly detection rules.","body":"### Z-score detection\n**z = (x−mean)/standard deviation**. A common heuristic flags `|z| > 3`, especially when the reference data are approximately normal; it is not a universal law.\n\nExample: mean=50, SD=8, x=78 → `z=(78−50)/8=3.5`; flag for investigation.\n\n### IQR fences\nSort values. Compute first quartile Q1, third quartile Q3; **IQR = Q3−Q1**.\n- Lower inner fence = `Q1−1.5·IQR`.\n- Upper inner fence = `Q3+1.5·IQR`.\n\nExample dataset `[2,3,4,5,6,7,8,30]` (median-of-halves method):\n- Q1 median of `[2,3,4,5]` = 3.5.\n- Q3 median of `[6,7,8,30]` = 7.5.\n- IQR = 4; fences = −2.5 and 13.5. **30 is an outlier**.\n\n**Quartile conventions can vary.** State your method if the question is unclear.\n\n### Boxplot and visual checks\nBoxplot = Q1, median, Q3, whiskers (commonly to nearest non-outlier inside fences), plotted outside points. A log transform can help for heavily skewed positive numeric distributions, but check interpretation.\n\n**Pitfall:** For small samples or highly skewed data, the ±3σ rule may perform poorly; use domain context.","source":"OUTLIER DM 6.docx; M7 outlier lecture 2024-11-06 pp. 21–29","exam":"","type":"core","html":"<h3>Z-score detection</h3>\n<p><strong>z = (x−mean)/standard deviation</strong>. A common heuristic flags <code>|z| &gt; 3</code>, especially when the reference data are approximately normal; it is not a universal law.</p>\n<p>Example: mean=50, SD=8, x=78 → <code>z=(78−50)/8=3.5</code>; flag for investigation.</p>\n<h3>IQR fences</h3>\n<p>Sort values. Compute first quartile Q1, third quartile Q3; <strong>IQR = Q3−Q1</strong>.</p>\n<ul>\n<li>Lower inner fence = <code>Q1−1.5·IQR</code>.</li>\n<li>Upper inner fence = <code>Q3+1.5·IQR</code>.</li>\n</ul>\n<p>Example dataset <code>[2,3,4,5,6,7,8,30]</code> (median-of-halves method):</p>\n<ul>\n<li>Q1 median of <code>[2,3,4,5]</code> = 3.5.</li>\n<li>Q3 median of <code>[6,7,8,30]</code> = 7.5.</li>\n<li>IQR = 4; fences = −2.5 and 13.5. <strong>30 is an outlier</strong>.</li>\n</ul>\n<p><strong>Quartile conventions can vary.</strong> State your method if the question is unclear.</p>\n<h3>Boxplot and visual checks</h3>\n<p>Boxplot = Q1, median, Q3, whiskers (commonly to nearest non-outlier inside fences), plotted outside points. A log transform can help for heavily skewed positive numeric distributions, but check interpretation.</p>\n<p><strong>Pitfall:</strong> For small samples or highly skewed data, the ±3σ rule may perform poorly; use domain context.</p>\n"},{"title":"Choose a clustering algorithm — comparison sheet","short":"Know suitability, weak spots, and parameters.","body":"| Method | Need k? | Handles irregular shape? | Natural outliers? | Main weakness |\n|---|---|---|---|---|\n| **K-means** | Yes | Usually poor | No | Mean sensitive to outliers |\n| **K-medoids (PAM)** | Yes | Usually poor | Not inherently | Computational cost |\n| **Agglomerative** | Stop/cut rule | Depends on linkage | Not inherently | O(n²)-scale work |\n| **DBSCAN** | No (`ε`, `MinPts`) | **Yes** | **Yes** | Varying density |\n| **STING/grid** | Grid resolution | Depends on cells | Possible | Grid boundary effects |\n| **Gaussian mixtures** | Components/model | Soft ellipsoidal groups | Through probability | Distribution assumption |\n\n### How to answer scenario questions\n- Compact numeric groups, big data → k-means.\n- Need robust representative points / arbitrary dissimilarity → k-medoids.\n- Need nested groups/dendrogram → hierarchical.\n- Nonconvex shapes + noise → DBSCAN.\n- Very large spatial data and hierarchical cell summaries → grid methods.\n- Need uncertainty/soft membership → mixture model.\n\n**Key conceptual difference:** `k` specifies **number of groups**; DBSCAN's `MinPts` specifies **minimum neighborhood density**, not number of clusters.","source":"M6 DM.pptx slides 21–43, 45–63; cross-method synthesis","exam":"","type":"core","html":"<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Method</th>\n  <th>Need k?</th>\n  <th>Handles irregular shape?</th>\n  <th>Natural outliers?</th>\n  <th>Main weakness</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td><strong>K-means</strong></td>\n  <td>Yes</td>\n  <td>Usually poor</td>\n  <td>No</td>\n  <td>Mean sensitive to outliers</td>\n</tr>\n<tr>\n  <td><strong>K-medoids (PAM)</strong></td>\n  <td>Yes</td>\n  <td>Usually poor</td>\n  <td>Not inherently</td>\n  <td>Computational cost</td>\n</tr>\n<tr>\n  <td><strong>Agglomerative</strong></td>\n  <td>Stop/cut rule</td>\n  <td>Depends on linkage</td>\n  <td>Not inherently</td>\n  <td>O(n²)-scale work</td>\n</tr>\n<tr>\n  <td><strong>DBSCAN</strong></td>\n  <td>No (<code>ε</code>, <code>MinPts</code>)</td>\n  <td><strong>Yes</strong></td>\n  <td><strong>Yes</strong></td>\n  <td>Varying density</td>\n</tr>\n<tr>\n  <td><strong>STING/grid</strong></td>\n  <td>Grid resolution</td>\n  <td>Depends on cells</td>\n  <td>Possible</td>\n  <td>Grid boundary effects</td>\n</tr>\n<tr>\n  <td><strong>Gaussian mixtures</strong></td>\n  <td>Components/model</td>\n  <td>Soft ellipsoidal groups</td>\n  <td>Through probability</td>\n  <td>Distribution assumption</td>\n</tr>\n</tbody>\n</table></div>\n<h3>How to answer scenario questions</h3>\n<ul>\n<li>Compact numeric groups, big data → k-means.</li>\n<li>Need robust representative points / arbitrary dissimilarity → k-medoids.</li>\n<li>Need nested groups/dendrogram → hierarchical.</li>\n<li>Nonconvex shapes + noise → DBSCAN.</li>\n<li>Very large spatial data and hierarchical cell summaries → grid methods.</li>\n<li>Need uncertainty/soft membership → mixture model.</li>\n</ul>\n<p><strong>Key conceptual difference:</strong> <code>k</code> specifies <strong>number of groups</strong>; DBSCAN's <code>MinPts</code> specifies <strong>minimum neighborhood density</strong>, not number of clusters.</p>\n"}]},{"number":7,"title":"Web, Temporal & Spatial Mining","kicker":"RESEARCH FRONTIERS","description":"Apply mining to documents, hyperlinks, logs and evolving space–time data.","accent":"#9e6b85","source":"M7 DM / WEB MINING.pdf and two 2024 reference PDFs","lessons":[{"title":"Three branches of web mining","short":"Content, structure and usage answer different questions.","body":"Web mining extracts useful information from the World Wide Web. The lecture divides it into **three main types**:\n\n| Web content mining | Web structure mining | Web usage mining |\n|---|---|---|\n| Analyze page **contents** | Analyze **hyperlinks/graph** | Analyze **user behavior/logs** |\n| Text, words, metadata, media | Incoming/outgoing links, hubs, authorities | Sessions, clicks, navigation paths |\n| Document clustering, text extraction | HITS, PageRank | Recommendations, site optimization |\n\n**Examples:**\n- “Which articles discuss data mining?” → content.\n- “Which pages are authoritative on data mining?” → structure.\n- “What paths lead users to abandon shopping carts?” → usage.\n\n**Web usage data:** Server logs, clickstream, session IDs, referrers, timestamps, page duration and navigation sequences. Process raw logs to identify users/sessions, remove bots, then discover paths, associations or clusters.\n\n**Privacy caveat:** Browsing behavior can be sensitive, so minimize/anonymize collection and obey relevant policies.","source":"WEB MINING.pdf pp. 3–4, 10–11","exam":"","type":"core","html":"<p>Web mining extracts useful information from the World Wide Web. The lecture divides it into <strong>three main types</strong>:</p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Web content mining</th>\n  <th>Web structure mining</th>\n  <th>Web usage mining</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Analyze page <strong>contents</strong></td>\n  <td>Analyze <strong>hyperlinks/graph</strong></td>\n  <td>Analyze <strong>user behavior/logs</strong></td>\n</tr>\n<tr>\n  <td>Text, words, metadata, media</td>\n  <td>Incoming/outgoing links, hubs, authorities</td>\n  <td>Sessions, clicks, navigation paths</td>\n</tr>\n<tr>\n  <td>Document clustering, text extraction</td>\n  <td>HITS, PageRank</td>\n  <td>Recommendations, site optimization</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Examples:</strong></p>\n<ul>\n<li>“Which articles discuss data mining?” → content.</li>\n<li>“Which pages are authoritative on data mining?” → structure.</li>\n<li>“What paths lead users to abandon shopping carts?” → usage.</li>\n</ul>\n<p><strong>Web usage data:</strong> Server logs, clickstream, session IDs, referrers, timestamps, page duration and navigation sequences. Process raw logs to identify users/sessions, remove bots, then discover paths, associations or clusters.</p>\n<p><strong>Privacy caveat:</strong> Browsing behavior can be sensitive, so minimize/anonymize collection and obey relevant policies.</p>\n"},{"title":"Web document clustering, shingles and fingerprinting","short":"Compare phrases, not just individual words.","body":"### Web document clustering\nGroup pages that discuss similar subjects. Standard bag-of-words clusters based on token frequencies, while **Suffix Tree Clustering (STC)** uses shared **phrases**, which better preserve word order and theme.\n\n**STC from the slides:** Extract page text → remove stopwords/punctuation → normalize words/stemming → build word/phrase suffix representations → group documents sharing significant phrases.\n\n### Shingles\nA **k-shingle** is a contiguous sequence of k words. For `I love machine learning` the 2-word shingles are:\n`{I love, love machine, machine learning}`.\n\nFor another document `I love artificial intelligence`: \n`{I love, love artificial, artificial intelligence}`.\n\nIntersection has 1 common shingle; union has 5 → **Jaccard resemblance = 1/5=0.2**.\n\n### Resemblance vs containment\nFor shingle sets A and B:\n- **Resemblance:** `|A∩B| / |A∪B|` (symmetric).\n- **Containment of A in B:** `|A∩B| / |A|` (asymmetric: asks how much of A is covered by B).\n\n**Fingerprinting:** Hash/select representative shingles to efficiently identify similar or near-duplicate web documents without comparing every word.","source":"WEB MINING.pdf pp. 5–9","exam":"","type":"core","html":"<h3>Web document clustering</h3>\n<p>Group pages that discuss similar subjects. Standard bag-of-words clusters based on token frequencies, while <strong>Suffix Tree Clustering (STC)</strong> uses shared <strong>phrases</strong>, which better preserve word order and theme.</p>\n<p><strong>STC from the slides:</strong> Extract page text → remove stopwords/punctuation → normalize words/stemming → build word/phrase suffix representations → group documents sharing significant phrases.</p>\n<h3>Shingles</h3>\n<p>A <strong>k-shingle</strong> is a contiguous sequence of k words. For <code>I love machine learning</code> the 2-word shingles are:\n<code>{I love, love machine, machine learning}</code>.</p>\n<p>For another document <code>I love artificial intelligence</code>:\n<code>{I love, love artificial, artificial intelligence}</code>.</p>\n<p>Intersection has 1 common shingle; union has 5 → <strong>Jaccard resemblance = 1/5=0.2</strong>.</p>\n<h3>Resemblance vs containment</h3>\n<p>For shingle sets A and B:</p>\n<ul>\n<li><strong>Resemblance:</strong> <code>|A∩B| / |A∪B|</code> (symmetric).</li>\n<li><strong>Containment of A in B:</strong> <code>|A∩B| / |A|</code> (asymmetric: asks how much of A is covered by B).</li>\n</ul>\n<p><strong>Fingerprinting:</strong> Hash/select representative shingles to efficiently identify similar or near-duplicate web documents without comparing every word.</p>\n"},{"title":"Search engine pipeline","short":"Crawler → indexer → query processor.","body":"### 1. Web crawler / spider\nStart with seed URLs; download pages; extract outgoing links; maintain a URL frontier and visited set; avoid repeated retrieval, handle robots rules, scheduling, duplicates and failures.\n\n### 2. Indexer\nParse content and build an **inverted index**: for each term, store a list of pages containing it, possibly positions and term frequencies. Example `mining → {doc3, doc8, doc14}`.\n\n### 3. Query processor\nParse the user's query, retrieve candidate documents via the inverted index, score/rank pages by relevance/authority, and return results.\n\n**Architecture to draw:** `Web → Crawler → Document store → Parser/Indexer → Inverted index → Query processor/ranker → User results`.\n\n**Exam difference:** The crawler **fetches**; the indexer **organizes words and document references**; the query processor **retrieves/ranks** in response to the user's question.","source":"WEB MINING.pdf pp. 16–19","exam":"","type":"core","html":"<h3>1. Web crawler / spider</h3>\n<p>Start with seed URLs; download pages; extract outgoing links; maintain a URL frontier and visited set; avoid repeated retrieval, handle robots rules, scheduling, duplicates and failures.</p>\n<h3>2. Indexer</h3>\n<p>Parse content and build an <strong>inverted index</strong>: for each term, store a list of pages containing it, possibly positions and term frequencies. Example <code>mining → {doc3, doc8, doc14}</code>.</p>\n<h3>3. Query processor</h3>\n<p>Parse the user's query, retrieve candidate documents via the inverted index, score/rank pages by relevance/authority, and return results.</p>\n<p><strong>Architecture to draw:</strong> <code>Web → Crawler → Document store → Parser/Indexer → Inverted index → Query processor/ranker → User results</code>.</p>\n<p><strong>Exam difference:</strong> The crawler <strong>fetches</strong>; the indexer <strong>organizes words and document references</strong>; the query processor <strong>retrieves/ranks</strong> in response to the user's question.</p>\n"},{"title":"HITS: hubs and authorities","short":"Mutually reinforcing hyperlink scores.","body":"**HITS = Hyperlink-Induced Topic Search.** It uses directed links to calculate:\n- **Authority score:** A page is important when many good **hubs link to it**.\n- **Hub score:** A page is useful when it **links to good authorities**.\n\nLet adjacency matrix **Aᵢⱼ=1** when page i links to page j.\n\n### Iteration\nStart hub vector `h=(1,…,1)`.\n- **Authority update:** `a = Aᵀ h`.\n- **Hub update:** `h = A a`.\n- Normalize vectors each iteration (L2 norm, unless exam specifies another normalization).\n\nEquivalently, `a` tends to principal eigenvector of `AᵀA`; `h` of `AAᵀ`.\n\n### Tiny numerical\nThree pages with edges `A→B`, `A→C`, `B→C`. Adjacency:\n```text\n      A B C\nA     0 1 1\nB     0 0 1\nC     0 0 0\n```\nInitial `h=(1,1,1)` → authority `a=Aᵀh=(0,1,2)`.\nThen `h=Aa=(1+2,2,0)=(3,2,0)`.\nNormalize (optional for the first demonstration):\n`a/√5≈(0,.447,.894)` and `h/√13≈(.832,.555,0)`.\n\n**Exam traps:** Matrix **transpose** for authority, original adjacency for hub. A hub can be valuable without storing much content of its own.","source":"WEB MINING.pdf pp. 11–15","exam":"","type":"core","html":"<p><strong>HITS = Hyperlink-Induced Topic Search.</strong> It uses directed links to calculate:</p>\n<ul>\n<li><strong>Authority score:</strong> A page is important when many good <strong>hubs link to it</strong>.</li>\n<li><strong>Hub score:</strong> A page is useful when it <strong>links to good authorities</strong>.</li>\n</ul>\n<p>Let adjacency matrix <strong>Aᵢⱼ=1</strong> when page i links to page j.</p>\n<h3>Iteration</h3>\n<p>Start hub vector <code>h=(1,…,1)</code>.</p>\n<ul>\n<li><strong>Authority update:</strong> <code>a = Aᵀ h</code>.</li>\n<li><strong>Hub update:</strong> <code>h = A a</code>.</li>\n<li>Normalize vectors each iteration (L2 norm, unless exam specifies another normalization).</li>\n</ul>\n<p>Equivalently, <code>a</code> tends to principal eigenvector of <code>AᵀA</code>; <code>h</code> of <code>AAᵀ</code>.</p>\n<h3>Tiny numerical</h3>\n<p>Three pages with edges <code>A→B</code>, <code>A→C</code>, <code>B→C</code>. Adjacency:</p>\n<pre><code class=\"language-text\">      A B C\nA     0 1 1\nB     0 0 1\nC     0 0 0\n</code></pre>\n<p>Initial <code>h=(1,1,1)</code> → authority <code>a=Aᵀh=(0,1,2)</code>.\nThen <code>h=Aa=(1+2,2,0)=(3,2,0)</code>.\nNormalize (optional for the first demonstration):\n<code>a/√5≈(0,.447,.894)</code> and <code>h/√13≈(.832,.555,0)</code>.</p>\n<p><strong>Exam traps:</strong> Matrix <strong>transpose</strong> for authority, original adjacency for hub. A hub can be valuable without storing much content of its own.</p>\n"},{"title":"PageRank: random surfers and backlinks","short":"Inbound votes are weighted by outgoing degrees.","body":"**PageRank** scores the importance of web pages using the link structure and a random-surfer model.\n\n### Standard normalized formula\nFor N pages, damping factor d and page u:\n\n**PR(u) = (1−d)/N + d·Σ[v→u] PR(v)/outdegree(v)**.\n\nWith normalized initialization `PR_i=1/N`, the scores sum to 1 (with appropriate dangling-link handling).\n\n### Course's slide convention\nThe WEB MINING slides use **`(1−d)` without dividing by N**, with an unnormalized rank vector whose sum is approximately N. Both conventions produce equivalent *relative rankings* when applied consistently; **follow the question's stated equation**.\n\n### Worked 3-page example (normalized)\nLinks: A→B, B→C, C→A. d=0.85, N=3, start all PR=1/3.\nEach page receives exactly 1/3 from the previous node. Therefore next iteration:\n`PR(A)=PR(B)=PR(C)=0.15/3 + 0.85/3 = 1/3`.\nThey remain equal.\n\n### More interesting example from supplied slides\nFour-page graph:\n`A→B; B→A,C; C→D; D→A`, d=0.7, *unnormalized slide formula*:\n`PR(A)=0.3+0.7[PR(B)/2+PR(D)]`;\n`PR(B)=0.3+0.7 PR(A)`;\n`PR(C)=0.3+0.7 PR(B)/2`;\n`PR(D)=0.3+0.7 PR(C)`.\nThe slides report approximately `A=1.281, B=1.197, C=0.719, D=0.803` (sum≈4).\n\n**Difference from HITS:** PageRank generates one reputation score using a stochastic link model; HITS calculates **separate hub and authority scores**.","source":"WEB MINING.pdf pp. 20–24","exam":"Slide-specific PageRank formula caveat is crucial.","type":"core","html":"<p><strong>PageRank</strong> scores the importance of web pages using the link structure and a random-surfer model.</p>\n<h3>Standard normalized formula</h3>\n<p>For N pages, damping factor d and page u:</p>\n<p><strong>PR(u) = (1−d)/N + d·Σ[v→u] PR(v)/outdegree(v)</strong>.</p>\n<p>With normalized initialization <code>PR_i=1/N</code>, the scores sum to 1 (with appropriate dangling-link handling).</p>\n<h3>Course's slide convention</h3>\n<p>The WEB MINING slides use <strong><code>(1−d)</code> without dividing by N</strong>, with an unnormalized rank vector whose sum is approximately N. Both conventions produce equivalent <em>relative rankings</em> when applied consistently; <strong>follow the question's stated equation</strong>.</p>\n<h3>Worked 3-page example (normalized)</h3>\n<p>Links: A→B, B→C, C→A. d=0.85, N=3, start all PR=1/3.\nEach page receives exactly 1/3 from the previous node. Therefore next iteration:\n<code>PR(A)=PR(B)=PR(C)=0.15/3 + 0.85/3 = 1/3</code>.\nThey remain equal.</p>\n<h3>More interesting example from supplied slides</h3>\n<p>Four-page graph:\n<code>A→B; B→A,C; C→D; D→A</code>, d=0.7, <em>unnormalized slide formula</em>:\n<code>PR(A)=0.3+0.7[PR(B)/2+PR(D)]</code>;\n<code>PR(B)=0.3+0.7 PR(A)</code>;\n<code>PR(C)=0.3+0.7 PR(B)/2</code>;\n<code>PR(D)=0.3+0.7 PR(C)</code>.\nThe slides report approximately <code>A=1.281, B=1.197, C=0.719, D=0.803</code> (sum≈4).</p>\n<p><strong>Difference from HITS:</strong> PageRank generates one reputation score using a stochastic link model; HITS calculates <strong>separate hub and authority scores</strong>.</p>\n"},{"title":"Search precision and recall","short":"Correct denominator = full marks.","body":"**Precision = Relevant pages retrieved / Total pages retrieved.**\n\n**Recall = Relevant pages retrieved / Total relevant pages in the collection.**\n\n### Exact supplied example\n200 relevant pages on the internet; the search returns 210 pages, and 190 of those are relevant.\n\n- **Precision** = `190/210 = 0.90476 ≈ 90.48%`.\n- **Recall** = `190/200 = 0.95 = 95%`.\n- **F1** = `2PR/(P+R) ≈ 92.68%`.\n\n**Why trade off?** Returning more pages can boost recall while admitting irrelevant pages and lowering precision. Aggressive filtering often boosts precision at the cost of missed relevant pages.\n\n**Connection to classification:** Relevant pages = positive class; retrieved pages = predicted positive. The same precision/recall concepts apply.","source":"WEB MINING.pdf pp. 25–27","exam":"","type":"core","html":"<p><strong>Precision = Relevant pages retrieved / Total pages retrieved.</strong></p>\n<p><strong>Recall = Relevant pages retrieved / Total relevant pages in the collection.</strong></p>\n<h3>Exact supplied example</h3>\n<p>200 relevant pages on the internet; the search returns 210 pages, and 190 of those are relevant.</p>\n<ul>\n<li><strong>Precision</strong> = <code>190/210 = 0.90476 ≈ 90.48%</code>.</li>\n<li><strong>Recall</strong> = <code>190/200 = 0.95 = 95%</code>.</li>\n<li><strong>F1</strong> = <code>2PR/(P+R) ≈ 92.68%</code>.</li>\n</ul>\n<p><strong>Why trade off?</strong> Returning more pages can boost recall while admitting irrelevant pages and lowering precision. Aggressive filtering often boosts precision at the cost of missed relevant pages.</p>\n<p><strong>Connection to classification:</strong> Relevant pages = positive class; retrieved pages = predicted positive. The same precision/recall concepts apply.</p>\n"},{"title":"Temporal mining and evolution rules","short":"Data changes; relationships can change with it.","body":"**Temporal data mining** finds time-dependent patterns, sequences, trends, periodicities, and **associations among attribute evolutions** rather than static snapshots alone.\n\n### Temporal association rules\nClassic item association: `ham → bread` within transactions.\nEvolution association (from the reference material): \n`salary changes from [52k,56k] to [54k,58k] ⇒ housing expense changes in a particular range`.\n\n### Formal idea\n- Each object has an ID and numerical attributes measured at ordered time **snapshots**.\n- Quantize continuous attribute values into **intervals**.\n- Represent movement across intervals as an **evolution sequence/cube**.\n- Search association rules between evolution patterns subject to **support** and **strength** thresholds.\n\n### Why interval mining is hard\nContinuous values yield infinitely many possible ranges; choose meaningful quantized base intervals, build a lattice of more general/specific evolution intervals, and **prune** patterns whose support/strength cannot satisfy thresholds.\n\n**Time-series vs temporal association:** Time series often predicts or summarizes numerical signals over time; temporal association links **change patterns across variables/objects**.\n\n**Exam-ready application:** In smart buildings, `occupancy rises during hours 8–9` may be associated with `electric load rises during 9–10`. Temporal order is part of the pattern, not proof of causality.","source":"M7 reference PDF 2024-11-13 pp. 20–35","exam":"","type":"core","html":"<p><strong>Temporal data mining</strong> finds time-dependent patterns, sequences, trends, periodicities, and <strong>associations among attribute evolutions</strong> rather than static snapshots alone.</p>\n<h3>Temporal association rules</h3>\n<p>Classic item association: <code>ham → bread</code> within transactions.\nEvolution association (from the reference material):\n<code>salary changes from [52k,56k] to [54k,58k] ⇒ housing expense changes in a particular range</code>.</p>\n<h3>Formal idea</h3>\n<ul>\n<li>Each object has an ID and numerical attributes measured at ordered time <strong>snapshots</strong>.</li>\n<li>Quantize continuous attribute values into <strong>intervals</strong>.</li>\n<li>Represent movement across intervals as an <strong>evolution sequence/cube</strong>.</li>\n<li>Search association rules between evolution patterns subject to <strong>support</strong> and <strong>strength</strong> thresholds.</li>\n</ul>\n<h3>Why interval mining is hard</h3>\n<p>Continuous values yield infinitely many possible ranges; choose meaningful quantized base intervals, build a lattice of more general/specific evolution intervals, and <strong>prune</strong> patterns whose support/strength cannot satisfy thresholds.</p>\n<p><strong>Time-series vs temporal association:</strong> Time series often predicts or summarizes numerical signals over time; temporal association links <strong>change patterns across variables/objects</strong>.</p>\n<p><strong>Exam-ready application:</strong> In smart buildings, <code>occupancy rises during hours 8–9</code> may be associated with <code>electric load rises during 9–10</code>. Temporal order is part of the pattern, not proof of causality.</p>\n"},{"title":"Spatial mining and STING+","short":"Mining changing geospatial patterns efficiently.","body":"**Spatial data mining** finds clusters, hotspots, proximity relations, co-location patterns and geographic anomalies. Spatial data has **location, distance, adjacency, topology** and may evolve over time.\n\n### STING (static) vs STING+ (active)\nA grid hierarchy recursively partitions geographical space into rectangular cells. **STING+** extends the statistical grid approach to support **spatial triggers** for changing data, rather than blindly remine all spatial records after every update.\n\n**Key observations from the reference lectures:**\n1. **Spatial locality:** Only updates inside/near areas relevant to a trigger can change its result.\n2. **Cumulative effect:** A single update may not be sufficient; aggregate changes until a condition might become true.\n3. **Hierarchical cells:** Maintain summaries across coarse and fine cells.\n4. **Sub-triggers:** Split the original trigger into monitored conditions associated with cells.\n5. **Event handling:** Primitive insertion/deletion/update events can form composite events.\n6. **Efficient checking:** Delay expensive examination unless accumulated changes could make trigger predicates true.\n\nThe slides mention a **PK-tree** indexing instantiated cells and compare trigger-based updating with periodic full STING reruns.\n\n### Example\nA city monitors unusual localized increases in traffic accidents. Instead of reclustering the entire city each hour, a spatial trigger monitors changing counts in candidate hotspot cells and neighbors.\n\n**Common confusion:** STING+ in M7 = *active spatial mining*, not the classification algorithm, not a web crawler.","source":"M7 reference PDF 2024-11-13 pp. 3–18","exam":"","type":"core","html":"<p><strong>Spatial data mining</strong> finds clusters, hotspots, proximity relations, co-location patterns and geographic anomalies. Spatial data has <strong>location, distance, adjacency, topology</strong> and may evolve over time.</p>\n<h3>STING (static) vs STING+ (active)</h3>\n<p>A grid hierarchy recursively partitions geographical space into rectangular cells. <strong>STING+</strong> extends the statistical grid approach to support <strong>spatial triggers</strong> for changing data, rather than blindly remine all spatial records after every update.</p>\n<p><strong>Key observations from the reference lectures:</strong></p>\n<ol>\n<li><strong>Spatial locality:</strong> Only updates inside/near areas relevant to a trigger can change its result.</li>\n<li><strong>Cumulative effect:</strong> A single update may not be sufficient; aggregate changes until a condition might become true.</li>\n<li><strong>Hierarchical cells:</strong> Maintain summaries across coarse and fine cells.</li>\n<li><strong>Sub-triggers:</strong> Split the original trigger into monitored conditions associated with cells.</li>\n<li><strong>Event handling:</strong> Primitive insertion/deletion/update events can form composite events.</li>\n<li><strong>Efficient checking:</strong> Delay expensive examination unless accumulated changes could make trigger predicates true.</li>\n</ol>\n<p>The slides mention a <strong>PK-tree</strong> indexing instantiated cells and compare trigger-based updating with periodic full STING reruns.</p>\n<h3>Example</h3>\n<p>A city monitors unusual localized increases in traffic accidents. Instead of reclustering the entire city each hour, a spatial trigger monitors changing counts in candidate hotspot cells and neighbors.</p>\n<p><strong>Common confusion:</strong> STING+ in M7 = <em>active spatial mining</em>, not the classification algorithm, not a web crawler.</p>\n"},{"title":"Statistical mining and applications","short":"Read the course's broad frontier topics coherently.","body":"The official ACP syllabus names **statistical data mining** and **data-mining applications**, but the attached Module 7 materials focus specifically on **web, spatial, and temporal mining** rather than offering a standalone statistical-mining lecture.\n\n### Supplemental orientation\nStatistical mining uses probability models, hypothesis tests, distributions, regression, time-series models, and uncertainty quantification to describe, discover and assess data patterns. Examples:\n- **Retail:** Basket rules and customer segmentation.\n- **Healthcare:** Prediction of risk categories and unusual patient trajectories.\n- **Finance:** Fraud detection and default probability.\n- **Web/search:** Document clusters, authorities, and click paths.\n- **Spatial:** Hotspot/anomaly detection, environmental monitoring.\n- **Temporal:** Evolving customer or sensor behavior.\n\n### From pattern to deployment\nChoose a domain problem → acquire lawful representative data → clean/integrate → select algorithm → test on unseen/appropriately time-separated data → validate robustness/fairness/privacy → present actionable result.\n\n**Boundary of material:** This section is marked supplemental rather than claiming to reproduce missing professor slides.","source":"ACP Module 7 syllabus; explanatory synthesis beyond supplied M7 lectures","exam":"Supplemental; source pack lacks a dedicated statistical mining chapter.","type":"supplement","html":"<p>The official ACP syllabus names <strong>statistical data mining</strong> and <strong>data-mining applications</strong>, but the attached Module 7 materials focus specifically on <strong>web, spatial, and temporal mining</strong> rather than offering a standalone statistical-mining lecture.</p>\n<h3>Supplemental orientation</h3>\n<p>Statistical mining uses probability models, hypothesis tests, distributions, regression, time-series models, and uncertainty quantification to describe, discover and assess data patterns. Examples:</p>\n<ul>\n<li><strong>Retail:</strong> Basket rules and customer segmentation.</li>\n<li><strong>Healthcare:</strong> Prediction of risk categories and unusual patient trajectories.</li>\n<li><strong>Finance:</strong> Fraud detection and default probability.</li>\n<li><strong>Web/search:</strong> Document clusters, authorities, and click paths.</li>\n<li><strong>Spatial:</strong> Hotspot/anomaly detection, environmental monitoring.</li>\n<li><strong>Temporal:</strong> Evolving customer or sensor behavior.</li>\n</ul>\n<h3>From pattern to deployment</h3>\n<p>Choose a domain problem → acquire lawful representative data → clean/integrate → select algorithm → test on unseen/appropriately time-separated data → validate robustness/fairness/privacy → present actionable result.</p>\n<p><strong>Boundary of material:</strong> This section is marked supplemental rather than claiming to reproduce missing professor slides.</p>\n"},{"title":"Final theory comparison — web versus spatial versus temporal","short":"Fast identification for scenario questions.","body":"| Given scenario | Domain | Signature method/idea |\n|---|---|---|\n| Analyze page words and topics | **Web content** | Document clustering / STC |\n| Rank pages by links | **Web structure** | HITS / PageRank |\n| Analyze navigation sequences | **Web usage** | Clickstream mining |\n| Detect geographic disease hotspots | **Spatial** | Grid/density clustering |\n| Track growing hotspots after new records | **Active spatial** | STING+ triggers |\n| Mine a salary-to-expense change pattern | **Temporal** | Temporal association/evolution |\n| Find a multistep coordinated fraud episode | **Temporal / outlier** | Sequence/collective anomaly |\n| Compute ratio of correct search results | **Information retrieval** | Precision |\n\n### Source caveat: Module 8\nThe ACP lists **Module 8: Contemporary Issues, 2 hours**, but the uploaded ZIP contains **no separate lecture for that module**. Rather than pretending it is covered, this guide flags it as a potential question to verify with the professor.","source":"ACP syllabus Module 7–8; M7 reference PDFs and WEB MINING.pdf","exam":"","type":"core","html":"<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Given scenario</th>\n  <th>Domain</th>\n  <th>Signature method/idea</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Analyze page words and topics</td>\n  <td><strong>Web content</strong></td>\n  <td>Document clustering / STC</td>\n</tr>\n<tr>\n  <td>Rank pages by links</td>\n  <td><strong>Web structure</strong></td>\n  <td>HITS / PageRank</td>\n</tr>\n<tr>\n  <td>Analyze navigation sequences</td>\n  <td><strong>Web usage</strong></td>\n  <td>Clickstream mining</td>\n</tr>\n<tr>\n  <td>Detect geographic disease hotspots</td>\n  <td><strong>Spatial</strong></td>\n  <td>Grid/density clustering</td>\n</tr>\n<tr>\n  <td>Track growing hotspots after new records</td>\n  <td><strong>Active spatial</strong></td>\n  <td>STING+ triggers</td>\n</tr>\n<tr>\n  <td>Mine a salary-to-expense change pattern</td>\n  <td><strong>Temporal</strong></td>\n  <td>Temporal association/evolution</td>\n</tr>\n<tr>\n  <td>Find a multistep coordinated fraud episode</td>\n  <td><strong>Temporal / outlier</strong></td>\n  <td>Sequence/collective anomaly</td>\n</tr>\n<tr>\n  <td>Compute ratio of correct search results</td>\n  <td><strong>Information retrieval</strong></td>\n  <td>Precision</td>\n</tr>\n</tbody>\n</table></div>\n<h3>Source caveat: Module 8</h3>\n<p>The ACP lists <strong>Module 8: Contemporary Issues, 2 hours</strong>, but the uploaded ZIP contains <strong>no separate lecture for that module</strong>. Rather than pretending it is covered, this guide flags it as a potential question to verify with the professor.</p>\n"}]}],"quizzes":[{"module":1,"q":"Which characteristic allows comparison across many years?","choices":["Integrated","Nonvolatile","Time-variant","Subject-oriented"],"answer":2,"why":"Time-variant means historical data/snapshots are retained.","kind":"concept"},{"module":1,"q":"A store manager asks for monthly revenue by city over 8 years. Which workload fits best?","choices":["OLTP point updates","OLAP multidimensional aggregation","Transaction logging only","Index maintenance"],"answer":1,"why":"Read-heavy, grouped, historical questions fit OLAP.","kind":"concept"},{"module":1,"q":"Which architecture tier houses the OLAP engine?","choices":["Bottom storage tier","Middle analytical tier","Top front-end tier","Source systems outside the tiers"],"answer":1,"why":"The OLAP server is the middle tier.","kind":"concept"},{"module":1,"q":"ETL in order means…","choices":["Evaluate, Train, Load","Extract, Transform, Load","Extract, Transfer, Link","Encode, Translate, Learn"],"answer":1,"why":"Extract data, clean/transform it, then load.","kind":"concept"},{"module":1,"q":"In a star schema, where are numerical business measures usually stored?","choices":["Dimension table","Metadata table","Fact table","Normalized hierarchy only"],"answer":2,"why":"Measurements like revenue and quantity belong in fact tables.","kind":"concept"},{"module":1,"q":"Which schema uses multiple fact tables with shared dimensions?","choices":["Star","Fact constellation","Snowflake only","Virtual warehouse"],"answer":1,"why":"Galaxy/constellation connects several facts to conformed dimensions.","kind":"concept"},{"module":1,"q":"City → State → Country is an example of…","choices":["Drill-down only","Concept/dimension hierarchy","Candidate pruning","Index sharding"],"answer":1,"why":"Those are levels in a geography hierarchy.","kind":"concept"},{"module":1,"q":"Roll-up from city to state generally…","choices":["Decreases aggregation","Increases detail","Increases aggregation","Deletes historical data"],"answer":2,"why":"Roll-up combines finer-grained values.","kind":"concept"},{"module":1,"q":"Filter `Year=2026` in a product×region×year cube: which operation?","choices":["Slice","Dice","Pivot","Drill-across"],"answer":0,"why":"Fixing exactly one dimension to one value is slice.","kind":"concept"},{"module":1,"q":"Filter two product categories and three states:","choices":["Slice only","Dice","Drill-through","Extract"],"answer":1,"why":"Dice selects a subcube using multiple constraints.","kind":"concept"},{"module":1,"q":"Switch rows from products to regions without changing sales values:","choices":["Roll-up","Drill-down","Pivot","Normalization"],"answer":2,"why":"Pivot rotates the displayed axes.","kind":"concept"},{"module":1,"q":"Average belongs to which category of OLAP measures?","choices":["Distributive","Algebraic","Holistic","Nominal"],"answer":1,"why":"AVG can be computed from SUM and COUNT.","kind":"concept"},{"module":1,"q":"Which is a holistic aggregate in general?","choices":["MAX","COUNT","SUM","MEDIAN"],"answer":3,"why":"Exact median generally cannot be reconstructed from a fixed-size partial summary.","kind":"concept"},{"module":2,"q":"Data mining is most precisely…","choices":["The whole KDD pipeline","The core pattern-discovery stage within KDD","Only cleaning missing values","A kind of OLTP"],"answer":1,"why":"KDD is the overall process; mining is one stage.","kind":"concept"},{"module":2,"q":"Which step normally follows data mining in KDD?","choices":["Database normalization","Pattern evaluation","Raw data generation","Census sampling"],"answer":1,"why":"Evaluate whether mined patterns are useful/reliable.","kind":"concept"},{"module":2,"q":"Predict `fraud/not fraud` using historical labels:","choices":["Clustering","Classification","Regression","Association"],"answer":1,"why":"A categorical class label makes it classification.","kind":"concept"},{"module":2,"q":"Predict electricity use in kWh:","choices":["Classification","Clustering","Regression","Concept hierarchy"],"answer":2,"why":"A numerical target means regression.","kind":"concept"},{"module":2,"q":"Identify customer groups with no labels:","choices":["Clustering","Decision tree classification","Numerical prediction","OLTP"],"answer":0,"why":"Unsupervised grouping is clustering.","kind":"concept"},{"module":2,"q":"Find {milk,bread} frequently purchased together:","choices":["Dimensionality reduction","Association mining","Data integration","Regression"],"answer":1,"why":"Association/frequent pattern mining discovers co-occurrence.","kind":"concept"},{"module":2,"q":"Which architecture component filters useless patterns?","choices":["Data-mining engine only","Pattern evaluation module","ETL source","OLTP transaction log"],"answer":1,"why":"Interestingness/pattern evaluation is handled by that module.","kind":"concept"},{"module":2,"q":"A mining system is categorized by what it mines and how. These are…","choices":["Mutually exclusive categories","Different classification axes","Only database types","Only output types"],"answer":1,"why":"Database type, knowledge type, techniques, application are independent.","kind":"concept"},{"module":2,"q":"Complex social-network links require special handling because of…","choices":["Only a faster CPU","Heterogeneous data structures","No stored data","Perfect data quality"],"answer":1,"why":"Graph, temporal, multimedia, text structures need appropriate mining representations.","kind":"concept"},{"module":2,"q":"What best expresses an issue of interestingness?","choices":["Rows stored in SQL","Too many trivial rules are discovered","Disk initialization","A password reset"],"answer":1,"why":"Filtering useful, nonredundant patterns is core.","kind":"concept"},{"module":2,"q":"Can a high observed correlation alone show causation?","choices":["Yes, if positive","Yes, if r>0.9","No","Yes, on big data"],"answer":2,"why":"Confounding and selection can cause correlations.","kind":"concept"},{"module":2,"q":"In KDD, selection comes before transformation in the course pipeline.","choices":["True","False","Only for supervised learning","Only for web pages"],"answer":0,"why":"Course order: cleaning, integration, selection, transformation, mining, evaluation, presentation.","kind":"concept"},{"module":3,"q":"Which quality dimension asks whether recorded facts are correct?","choices":["Completeness","Accuracy","Timeliness","Believability"],"answer":1,"why":"Accuracy is correctness; completeness addresses missingness.","kind":"concept"},{"module":3,"q":"Duplicates across sources are especially an issue for…","choices":["Data integration","Cosine similarity only","Apex cuboids","HITS"],"answer":0,"why":"Integration reconciles schemas and entity identities.","kind":"concept"},{"module":3,"q":"What is the min–max [0,1] value of 70 when min=18 and max=96?","choices":["0.5000","0.6667","0.7500","0.8999"],"answer":1,"why":"(70−18)/(96−18)=52/78=0.6667.","kind":"numerical"},{"module":3,"q":"With data min 18, max 96 and k=4, equal-width bin size is:","choices":["12","19.5","26","4"],"answer":1,"why":"(96−18)/4=19.5.","kind":"numerical"},{"module":3,"q":"For 8 sorted values and 4 equal-frequency bins, ideal observations per bin:","choices":["8","4","2","1"],"answer":2,"why":"8/4=2 observations each.","kind":"numerical"},{"module":3,"q":"Z-score normalization uses…","choices":["x/max","(x−mean)/SD","min/max","log₂x"],"answer":1,"why":"Z measures deviation in standard deviations.","kind":"concept"},{"module":3,"q":"Decimal scaling for max absolute value 100 requires j=","choices":["1","2","3","0"],"answer":2,"why":"Since max(|x|)/10^j must be strictly below 1, j=3.","kind":"concept"},{"module":3,"q":"If an attribute has constant value 9, min-max normalization formula…","choices":["Returns exactly 9","Has zero denominator","Always returns 1","Creates four bins"],"answer":1,"why":"Max−min=0: choose a separate constant-feature convention.","kind":"concept"},{"module":3,"q":"For two categorical variables, the lecture uses…","choices":["χ² test","Pearson r only","Euclidean distance","AUC"],"answer":0,"why":"Chi-square compares observed versus expected cell counts.","kind":"concept"},{"module":3,"q":"Pearson r=0 implies the numeric variables are fully independent.","choices":["True","False","Always unless categorical","True for time series"],"answer":1,"why":"Zero correlation only rules out linear association in general.","kind":"concept"},{"module":3,"q":"PCA retains directions with…","choices":["Largest variance (eigenvalues)","Most unusual labels","Most missingness","Shortest column names"],"answer":0,"why":"PCA projects onto top-variance orthogonal directions.","kind":"concept"},{"module":3,"q":"Attribute subset selection differs from PCA because it…","choices":["Chooses original columns","Always creates two new axes","Requires a web crawler","Retains all dimensions"],"answer":0,"why":"Selection keeps a subset of existing features; PCA extracts combinations.","kind":"concept"},{"module":3,"q":"Smoothing by bin boundaries replaces values by…","choices":["The overall median","Their nearest bin endpoint","Their z-score","An Apriori rule"],"answer":1,"why":"Each point becomes the closer lower or upper boundary.","kind":"concept"},{"module":3,"q":"An 8-year monthly sales cube summarized to annual totals is…","choices":["Data cube aggregation","Classifier pruning","Laplace smoothing","Zero-padding"],"answer":0,"why":"Aggregation reduces detailed rows while preserving higher-level information.","kind":"concept"},{"module":4,"q":"Support count of {A,B} is…","choices":["Transactions containing A or B","Transactions containing both A and B","Number of distinct items","Confidence×N"],"answer":1,"why":"A transaction must contain the entire
