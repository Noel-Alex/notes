s. Explain training vs inference, advantages for variable length, and the fixed-bottleneck limitation.<\/p>\n"},{"m":4,"title":"Autoencoders and reconstruction loss","deck":"A bottleneck that learns a representation of its input.","source":"N4b pp. 40–56; DL pp. 103–108","priority":"high","demo":"seq2seq","labels":["autoencoder","MSE"],"id":40,"order":7,"html":"<h3>Two-stage architecture<\/h3>\n<p>An autoencoder learns to <strong>reconstruct its input<\/strong> rather than predict a separate class label:<\/p>\n<p><code>z = encoder(x)<\/code> → <code>x̂ = decoder(z)<\/code> → minimise <code>L(x,x̂)<\/code>.<\/p>\n<p>The latent z is often lower-dimensional, limiting how much information can be transmitted; this can force useful compressed representations. An autoencoder with a very large latent and no regularisation can simply learn an identity mapping, so compression/regularisation matters.<\/p>\n<h3>Main versions<\/h3>\n<ul>\n<li><strong>Undercomplete autoencoder:<\/strong> z has fewer dimensions than input.<\/li>\n<li><strong>Sparse autoencoder:<\/strong> encourage only a few hidden units active.<\/li>\n<li><strong>Denoising autoencoder:<\/strong> corrupt input x→x_noisy, reconstruct <strong>clean x<\/strong>; teaches robustness.<\/li>\n<li><strong>Variational autoencoder (VAE):<\/strong> probabilistic latent variables and reconstruction+distribution regularisation; this is supplementary context, not the central Module-4 requirement.<\/li>\n<\/ul>\n<h3>Numerical MSE<\/h3>\n<p>Clean target <code>(1,0,1)<\/code> and reconstruction <code>(0.8,0.2,0.9)<\/code>:<\/p>\n<p><code>MSE=[(1−.8)²+(0−.2)²+(1−.9)²]/3=(.04+.04+.01)/3=.03<\/code>.<\/p>\n<h3>Distinguish it from seq2seq<\/h3>\n<p>A basic autoencoder reconstructs <strong>the same input<\/strong>. An encoder–decoder translator generates a <strong>different target sequence<\/strong>. Both have encoder/decoder components, but their learning objectives differ.<\/p>\n"},{"m":4,"title":"Deep RNNs and stacked sequence modelling","deck":"Depth across layers versus recurrence across time.","source":"N4b pp. 75–88","priority":"core","demo":null,"labels":["deep RNN"],"id":41,"order":8,"html":"<h3>Two independent axes<\/h3>\n<p><strong>Temporal depth<\/strong>: an RNN cell is repeatedly applied over time <code>t=1,…,T<\/code>. <strong>Stacked depth<\/strong>: the hidden outputs from one recurrent layer become inputs to another recurrent layer at the same time step.<\/p>\n<p>For two layers:<\/p>\n<p><code>hₜ^(1) = φ(Wₓ¹ xₜ + Wₕ¹ hₜ₋₁^(1)+b¹)<\/code><\/p>\n<p><code>hₜ^(2) = φ(Wₓ² hₜ^(1) + Wₕ² hₜ₋₁^(2)+b²)<\/code>.<\/p>\n<p>Each layer has its own trainable matrices; <strong>within<\/strong> a layer those matrices are shared across time.<\/p>\n<h3>Example: sentiment classifier<\/h3>\n<p>Embed tokens; pass embeddings through one recurrent layer that learns local sequence features; feed its output sequence into a second recurrent layer; pool/final-state representation → dense classifier → sigmoid sentiment probability.<\/p>\n<h3>Pros and cons<\/h3>\n<p>Depth can build more complex temporal features. But more recurrent operations increase computational cost, memory, optimization difficulty, and potentially gradient instability. Dropout can be applied between recurrent layers, though indiscriminate independent dropout to recurrent state can be harmful if not designed carefully.<\/p>\n<blockquote>\n<p><strong>Trap:<\/strong> “Deep RNN” does not mean the same neuron is copied into T <em>separate sets of weights<\/em>. Temporal unrolling shares each layer's weights.<\/p>\n<\/blockquote>\n"},{"m":4,"title":"Self-attention and BERT — why the future matters","deck":"The transformer-based model taught after recurrent networks.","source":"DL pp. 108–132 (Malathi); N4b final section","priority":"critical","demo":"attention","labels":["BERT","attention","MLM"],"id":42,"order":9,"html":"<h3>What attention buys you<\/h3>\n<p>Instead of compressing every token into one recurrent hidden state, <strong>self-attention<\/strong> lets a token compute a weighted mixture of other token representations. Queries Q, keys K and values V are learned projections of token vectors.<\/p>\n<p><code>Attention(Q,K,V) = softmax(QKᵀ/√dₖ)V<\/code>.<\/p>\n<p>With a causal mask, tokens cannot attend to future positions. A <strong>bidirectional encoder<\/strong> such as BERT generally attends to context on both sides during pretraining; this differs from an autoregressive decoder used for left-to-right generation.<\/p>\n<h3>Tiny attention numerical<\/h3>\n<p>One query q=1, two keys k=(1,2), values v=(10,20), and <code>dₖ=1<\/code>. Scores <code>(1,2)<\/code>, softmax weights ≈ <code>(0.2689,0.7311)<\/code>. Weighted output <code>0.2689×10+0.7311×20 ≈ 17.311<\/code>. A more similar key gets more weight, but the calculation is learned and context-dependent.<\/p>\n<h3>BERT's pretraining objectives<\/h3>\n<ul>\n<li><strong>Masked language modeling (MLM):<\/strong> mask selected tokens, predict original tokens using surrounding context; the loss is computed on designated prediction positions.<\/li>\n<li><strong>Next sentence prediction (NSP):<\/strong> original BERT pretraining included a sentence-pair classification objective; not every later BERT-like model includes NSP.<\/li>\n<\/ul>\n<h3>Fine-tuning<\/h3>\n<p>Attach a task-specific head (e.g., sentiment classification, named entity recognition, question answering) to pretrained BERT and update model parameters on supervised task data.<\/p>\n<blockquote>\n<p><strong>Exam distinction:<\/strong> Bidirectional RNN and BERT can both use both-side context, but BERT is based on <strong>Transformer encoder self-attention<\/strong>, not on a recurrent hidden-state chain.<\/p>\n<\/blockquote>\n"},{"m":4,"title":"Module 4 — architecture comparison and exam templates","deck":"Pick the correct sequence model from the question.","source":"N4a, N4b; DL pp. 75–132","priority":"high","demo":null,"labels":["exam comparison"],"id":43,"order":10,"html":"<h3>Compare in one compact table<\/h3>\n<table>\n<thead>\n<tr>\n  <th>Model<\/th>\n  <th>Essential mechanism<\/th>\n  <th>Good use<\/th>\n  <th>Main limitation<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Vanilla RNN<\/td>\n  <td>Shared recurrence<\/td>\n  <td>Simple sequences<\/td>\n  <td>Long-gradient decay<\/td>\n<\/tr>\n<tr>\n  <td>Bidirectional RNN<\/td>\n  <td>Forward + backward context<\/td>\n  <td>Offline sequence tagging<\/td>\n  <td>Needs future context<\/td>\n<\/tr>\n<tr>\n  <td>Deep RNN<\/td>\n  <td>Stacked recurrent layers<\/td>\n  <td>Hierarchical sequence features<\/td>\n  <td>Expensive sequential compute<\/td>\n<\/tr>\n<tr>\n  <td>Seq2Seq<\/td>\n  <td>Encoder and autoregressive decoder<\/td>\n  <td>Variable-length translation<\/td>\n  <td>Classic fixed context bottleneck<\/td>\n<\/tr>\n<tr>\n  <td>Autoencoder<\/td>\n  <td>Encode and reconstruct input<\/td>\n  <td>Compression/denoising<\/td>\n  <td>Can learn trivial identity<\/td>\n<\/tr>\n<tr>\n  <td>BERT<\/td>\n  <td>Bidirectional self-attention encoder<\/td>\n  <td>NLU/classification/NER<\/td>\n  <td>Not a plain autoregressive generator<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Three answer blueprints<\/h3>\n<p><strong>Explain BPTT:<\/strong> unroll → forward states/losses → reverse chain rule → accumulate shared-weight gradients → vanishing/exploding → clipping/LSTM/GRU.<\/p>\n<p><strong>Draw seq2seq:<\/strong> input tokens → encoder → context / attention → decoder token-by-token → training teacher forcing vs inference.<\/p>\n<p><strong>Explain BERT:<\/strong> Transformer encoder → Q/K/V attention → masked token objective → original NSP → fine-tuned downstream head.<\/p>\n<h3>Coverage caveat<\/h3>\n<p>The recent Fall-2026 Module-4_2 PDF becomes image-heavy near the final BERT-related pages. The supplemental Malathi combined lecture (pp. 108–132) includes accessible BERT terminology and examples; these notes rely on that supplied companion rather than pretending image-only slides were fully machine-read.<\/p>\n"},{"m":5,"title":"The long-term dependency problem","deck":"Why an ordinary RNN cannot reliably remember a clue 100 steps earlier.","source":"N5 slides 2–8; S5 pp. 4–8; DL pp. 132–138","priority":"core","demo":null,"labels":["long dependency"],"id":44,"order":0,"html":"<h3>What is a long-term dependency?<\/h3>\n<p>The information required for a prediction may appear many time steps before the prediction itself. In “The books on the shelf near the door <strong>are<\/strong> old”, the plural subject <em>books<\/em> must control the verb despite intervening words.<\/p>\n<p>A vanilla RNN repeatedly transforms hidden states. During BPTT the gradient to an early state is a product of many Jacobians, which may vanish or explode. For a scalar factor 0.8 across 30 steps: <code>0.8³⁰≈0.00124<\/code>. A distant signal becomes very weak.<\/p>\n<h3>What the course teaches in response<\/h3>\n<ul>\n<li><strong>Echo State Networks (ESN):<\/strong> use a mostly fixed recurrent reservoir, usually training only the readout.<\/li>\n<li><strong>LSTM:<\/strong> keep a cell state gated by forget/input/output decisions.<\/li>\n<li><strong>GRU:<\/strong> use update/reset gates with a simpler state structure.<\/li>\n<li><strong>Gradient clipping and suitable optimization:<\/strong> tame exploding gradients.<\/li>\n<li><strong>Explicit memory:<\/strong> make information accessible without relying entirely on repeated hidden-state transitions.<\/li>\n<\/ul>\n<h3>RNN vs recursive neural network<\/h3>\n<p>The official Module 5 syllabus title is “Recursive neural networks”, but the uploaded slides predominantly address <strong>recurrent<\/strong> long-term-memory approaches. A recursive network works on a tree; an RNN unrolls along a sequence. We follow the supplied teaching topics while preserving correct terminology.<\/p>\n"},{"m":5,"title":"Echo State Networks and reservoir computing","deck":"Keep a rich dynamical reservoir; train a simpler readout.","source":"N5 slides 8–14; S5 pp. 9–14; DL pp. 143–149","priority":"high","demo":null,"labels":["ESN","reservoir"],"id":45,"order":1,"html":"<h3>Architecture<\/h3>\n<p>An Echo State Network (ESN) is a recurrent reservoir-computing model. Input enters a relatively large <strong>fixed, often randomly initialised reservoir<\/strong>, producing time-varying internal states. Typically only the <strong>readout weights<\/strong> mapping reservoir states to outputs are trained.<\/p>\n<p><code>hₜ = φ(W_in xₜ + W_res hₜ₋₁ + b)<\/code><\/p>\n<p><code>ŷₜ = W_out [hₜ;xₜ]<\/code> (one possible readout form).<\/p>\n<p>A central idea is that the reservoir has fading influence from initial conditions and responds stably to input history; design often constrains recurrent spectral radius (depending on task and implementation).<\/p>\n<h3>Why it is different from LSTM<\/h3>\n<p><strong>ESN:<\/strong> a fixed nonlinear feature dynamics system plus trained readout; training can be quick. <strong>LSTM:<\/strong> learns its internal recurrent gates and updates via BPTT. ESN may have limited adaptability if fixed reservoir dynamics are poorly matched to the task.<\/p>\n<h3>Exam comparison answer<\/h3>\n<table>\n<thead>\n<tr>\n  <th>Echo State Network<\/th>\n  <th>LSTM<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Internal recurrent weights often frozen<\/td>\n  <td>Gates and recurrent weights trained<\/td>\n<\/tr>\n<tr>\n  <td>Reservoir features + readout training<\/td>\n  <td>Full gated recurrent learning<\/td>\n<\/tr>\n<tr>\n  <td>Relatively efficient readout training<\/td>\n  <td>More computationally costly training<\/td>\n<\/tr>\n<tr>\n  <td>Reservoir-size / spectral-radius design matters<\/td>\n  <td>Gate/hidden-size design matters<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>Trap:<\/strong> “ESN has no recurrence” is false. It has recurrent connections, but many of their weights are <strong>not trained<\/strong> under the standard approach.<\/p>\n<\/blockquote>\n"},{"m":5,"title":"LSTM: the complete cell, gate by gate","deck":"Learn the equations in the order information moves.","source":"N5 slides 14–32; S5 pp. 15–32; DL pp. 136–143","priority":"critical","demo":"lstm","labels":["LSTM","gates"],"id":46,"order":2,"html":"<h3>Why the separate cell state matters<\/h3>\n<p>An LSTM carries hidden output <code>hₜ<\/code> and a longer-lived memory vector <code>cₜ<\/code>. Three gates decide what to forget, write and reveal. Gates use <strong>sigmoid<\/strong> (values 0–1); candidate content uses <strong>tanh<\/strong> (−1–1).<\/p>\n<p>Let <code>[hₜ₋₁,xₜ]<\/code> be the concatenated previous hidden state and current input:<\/p>\n<ol>\n<li><strong>Forget:<\/strong> <code>fₜ = σ(W_f[hₜ₋₁,xₜ]+b_f)<\/code>.<\/li>\n<li><strong>Input gate:<\/strong> <code>iₜ = σ(W_i[hₜ₋₁,xₜ]+b_i)<\/code>.<\/li>\n<li><strong>Candidate:<\/strong> <code>gₜ = tanh(W_g[hₜ₋₁,xₜ]+b_g)<\/code>.<\/li>\n<li><strong>Cell update:<\/strong> <code>cₜ = fₜ⊙cₜ₋₁ + iₜ⊙gₜ<\/code>.<\/li>\n<li><strong>Output gate:<\/strong> <code>oₜ = σ(W_o[hₜ₋₁,xₜ]+b_o)<\/code>.<\/li>\n<li><strong>Hidden output:<\/strong> <code>hₜ = oₜ⊙tanh(cₜ)<\/code>.<\/li>\n<\/ol>\n<p>The <code>⊙<\/code> symbol means <strong>elementwise multiplication<\/strong>. It does not mean matrix multiplication.<\/p>\n<h3>Interpret gates like a real system<\/h3>\n<p><code>fₜ≈1<\/code> preserves old memory, <code>fₜ≈0<\/code> deletes it. <code>iₜ≈1<\/code> writes new candidate content, <code>iₜ≈0<\/code> refuses it. <code>oₜ<\/code> controls exposure of the updated cell state to the next layer/time step. These statements are per cell coordinate, not just global yes/no switches.<\/p>\n<h3>Why gradients can travel further<\/h3>\n<p>The memory update contains an <strong>additive<\/strong> path, not only repeated nonlinear state replacement. Gradient through the preserved cell path can propagate with product of forget gates, reducing (not abolishing) vanishing-gradient difficulty.<\/p>\n<blockquote>\n<p><strong>Exam draw:<\/strong> Sketch the horizontal cell-state highway, forget multiplication, input×candidate addition, and output gate. Labels alone without the update equations will leave marks on the table.<\/p>\n<\/blockquote>\n"},{"m":5,"title":"LSTM numerical — compute cₜ and hₜ exactly","deck":"A simple gate numerical you should solve from memory.","source":"N5 slides 17–28; supplemented with original worked example","priority":"critical","demo":"lstm","labels":["LSTM","numerical"],"id":47,"order":3,"html":"<h3>Given<\/h3>\n<p>A one-dimensional LSTM cell has previous cell state <code>cₜ₋₁=0.8<\/code>. Gate outputs are supplied directly: forget <code>fₜ=0.6<\/code>, input <code>iₜ=0.7<\/code>, candidate <code>gₜ=0.5<\/code>, and output <code>oₜ=0.9<\/code>.<\/p>\n<h3>Step 1: retain old memory<\/h3>\n<p><code>fₜ cₜ₋₁ = 0.6×0.8 = 0.48<\/code>.<\/p>\n<h3>Step 2: write new information<\/h3>\n<p><code>iₜ gₜ = 0.7×0.5 = 0.35<\/code>.<\/p>\n<h3>Step 3: form cell state<\/h3>\n<p><code>cₜ = 0.48 + 0.35 = 0.83<\/code>.<\/p>\n<h3>Step 4: reveal hidden output<\/h3>\n<p><code>tanh(0.83) ≈ 0.68048<\/code>, so <code>hₜ = 0.9×0.68048 ≈ 0.61243<\/code>.<\/p>\n<p>Final: <strong>cell state 0.83; hidden output ≈0.61243<\/strong>.<\/p>\n<h3>If the question gives gate <em>pre-activations<\/em><\/h3>\n<p>You must first compute their sigmoid or tanh values. For example <code>σ(0)=0.5<\/code>, <code>tanh(0)=0<\/code>, <code>σ(ln 3)=0.75<\/code>. The exam may hide the gate values behind weights and inputs; always process gates before updating c.<\/p>\n<h3>Extension: vector memory<\/h3>\n<p>For <code>c_previous=(0.8,−0.4)<\/code> and <code>f=(0.6,0.3)<\/code>, the retained component is <code>(0.48,−0.12)<\/code>. Operations are coordinatewise, not matrix products unless explicitly declared otherwise.<\/p>\n"},{"m":5,"title":"GRU — update gate, reset gate and candidate","deck":"The simpler two-gate relative of LSTM.","source":"N5 slides 34–44; S5 pp. 34–43","priority":"critical","demo":"gru","labels":["GRU","numerical"],"id":48,"order":4,"html":"<h3>The anatomy of a GRU<\/h3>\n<p>A Gated Recurrent Unit (GRU) uses <strong>one hidden state h<\/strong> rather than a separate LSTM cell state c. Its two named gates are:<\/p>\n<ul>\n<li>Reset gate r: how much previous hidden information influences the <strong>candidate<\/strong>.<\/li>\n<li>Update gate z: how much of the previous state is retained versus replaced.<\/li>\n<\/ul>\n<p>One common convention is:<\/p>\n<p><code>rₜ=σ(W_r xₜ+U_r hₜ₋₁+b_r)<\/code><\/p>\n<p><code>zₜ=σ(W_z xₜ+U_z hₜ₋₁+b_z)<\/code><\/p>\n<p><code>h̃ₜ=tanh(W_h xₜ+U_h(rₜ⊙hₜ₋₁)+b_h)<\/code><\/p>\n<p><code>hₜ=zₜ⊙hₜ₋₁+(1−zₜ)⊙h̃ₜ<\/code>.<\/p>\n<p><strong>Warning:<\/strong> Some texts reverse the final z convention, writing <code>(1−z)old + z candidate<\/code>. Both are valid <em>definitions of what “update” means<\/em> when equations agree. Follow the form supplied on your exam sheet.<\/p>\n<h3>Numeric example<\/h3>\n<p>Given <code>h_prev=.6<\/code>, update gate z=.75, reset gate r=.2, candidate <code>h̃=.1<\/code>: <code>h=.75(.6)+.25(.1)=.475<\/code> under the displayed convention. The reset gate influences calculation of candidate; once candidate is given directly, r does not appear again in the final mixture.<\/p>\n<h3>LSTM versus GRU<\/h3>\n<p>GRU is generally smaller/simpler, can train efficiently, and performs competitively; LSTM has a distinct cₜ and separate forget/input/output gates for potentially richer control. Neither universally dominates every sequence task.<\/p>\n"},{"m":5,"title":"LSTM versus GRU versus vanilla RNN","deck":"A concept comparison, not “LSTM is always better”.","source":"N5 slides 34–45; S5 pp. 43–45","priority":"high","demo":null,"labels":["compare","gated"],"id":49,"order":5,"html":"<h3>Put mechanisms side by side<\/h3>\n<table>\n<thead>\n<tr>\n  <th>Feature<\/th>\n  <th>Simple RNN<\/th>\n  <th>LSTM<\/th>\n  <th>GRU<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Persistent internal variables<\/td>\n  <td>hₜ<\/td>\n  <td>hₜ and cₜ<\/td>\n  <td>hₜ<\/td>\n<\/tr>\n<tr>\n  <td>Explicit learned gates<\/td>\n  <td>None<\/td>\n  <td>Forget, input, output<\/td>\n  <td>Reset, update<\/td>\n<\/tr>\n<tr>\n  <td>Long-range gradient behavior<\/td>\n  <td>Often problematic<\/td>\n  <td>Improved by gated cell state<\/td>\n  <td>Improved by gated mixing<\/td>\n<\/tr>\n<tr>\n  <td>Relative computation<\/td>\n  <td>Lowest per step<\/td>\n  <td>Most gate operations<\/td>\n  <td>Usually less than LSTM<\/td>\n<\/tr>\n<tr>\n  <td>Typical use<\/td>\n  <td>Simple short sequences<\/td>\n  <td>Long-range temporal problems<\/td>\n  <td>Efficient long-range temporal problems<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Parameter count intuition<\/h3>\n<p>For input dimension d and hidden size h, a vanilla RNN cell has <code>h(d+h+1)<\/code>. A typical GRU has roughly <strong>3×<\/strong> this base count; LSTM roughly <strong>4×<\/strong> (depending on implementation, biases and projections). Do <strong>not<\/strong> simply multiply by T sequence length; parameters are shared across time.<\/p>\n<p>Example <code>d=5,h=4<\/code>: vanilla RNN <code>4(5+4+1)=40<\/code>, GRU about <code>120<\/code>, LSTM about <code>160<\/code>, excluding output heads and variant implementation details.<\/p>\n<h3>When to choose what<\/h3>\n<p>If efficiency is critical and sequence dependence moderate, consider GRU. If long, complex temporal dependencies and control over memory are important, LSTM is a strong baseline. For pretrained NLP tasks with long-context interaction, a Transformer/attention architecture may be more suitable—but that is an architectural decision, not a mathematical guarantee.<\/p>\n<blockquote>\n<p><strong>Exam trap:<\/strong> The reset gate of a GRU is not the same as the LSTM forget gate in a one-for-one structural sense. Draw and explain the actual equations.<\/p>\n<\/blockquote>\n"},{"m":5,"title":"Gradient clipping, truncation and optimization","deck":"Control exploding gradients without pretending to cure every issue.","source":"N5 slides 45–48; S5 pp. 45–49","priority":"critical","demo":"clip","labels":["gradient clipping","numerical"],"id":50,"order":6,"html":"<h3>Global norm clipping<\/h3>\n<p>Given a gradient vector g and maximum norm c:<\/p>\n<p><code>g_clipped = g × min(1, c/||g||₂)<\/code>.<\/p>\n<p>This scales an overly large gradient down while preserving its direction. If <code>||g||≤c<\/code>, the vector is unchanged.<\/p>\n<h3>Full numerical<\/h3>\n<p>Let <code>g=(6,8)<\/code>. Norm <code>||g||=√(36+64)=10<\/code>. Clip threshold <code>c=5<\/code>:<\/p>\n<p><code>g_clipped=(6,8)×(5/10)=(3,4)<\/code>.<\/p>\n<p>If learning rate η=.1, the parameter update is <code>Δθ=−.1(3,4)=(−.3,−.4)<\/code>. Without clipping it would be <code>(−.6,−.8)<\/code>.<\/p>\n<h3>Value clipping is not the same<\/h3>\n<p>Clipping <strong>by value<\/strong> restricts each component into <code>[−c,c]<\/code>. For <code>(6,8),c=5<\/code>, it gives <code>(5,5)<\/code> with changed direction. Clipping <strong>by global norm<\/strong> preserves direction.<\/p>\n<h3>Other controls<\/h3>\n<p>Truncated BPTT restricts how far gradients travel through time, trading computational efficiency for long-context learning. Gated cells preserve state better; careful initialization and monitoring help training stability.<\/p>\n<blockquote>\n<p><strong>Exam trap:<\/strong> Clipping addresses <strong>exploding<\/strong> gradients. A vanishing gradient is already too small; clipping cannot magnify it.<\/p>\n<\/blockquote>\n"},{"m":5,"title":"Explicit memory and attention-based retrieval","deck":"Learn what “external memory” means in the course.","source":"N5 slides 49–51; S5 pp. 48–51; DL pp. 152–156","priority":"core","demo":"attention","labels":["memory","attention"],"id":51,"order":7,"html":"<h3>Memory without propagating everything through recurrent state<\/h3>\n<p>An RNN stores context in a fixed-size hidden state. <strong>Explicit memory<\/strong> architectures provide readable/writable memory slots or other mechanisms that allow content to be accessed by <em>address, key or attention<\/em>, reducing dependence on the hidden-state chain alone.<\/p>\n<p>Conceptually:<\/p>\n<ol>\n<li>Encode an input or query into a key.<\/li>\n<li>Compare the key with stored memory addresses/keys.<\/li>\n<li>Compute attention/read weights.<\/li>\n<li>Retrieve a weighted combination of values.<\/li>\n<li>Use retrieved content to predict or update the controller.<\/li>\n<\/ol>\n<h3>Examples and boundary<\/h3>\n<p>Attention in encoder–decoder models is an explicit access mechanism to encoder states. More specialized Neural Turing Machines and memory networks use differentiable external memory; these are illustrative extensions, <strong>not all required by the teaching slides<\/strong>.<\/p>\n<h3>Compare<\/h3>\n<table>\n<thead>\n<tr>\n  <th>LSTM<\/th>\n  <th>Explicit key–value memory<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>State updated sequentially by gates<\/td>\n  <td>Information stored in slots and retrieved by similarity<\/td>\n<\/tr>\n<tr>\n  <td>Fixed-size cell state<\/td>\n  <td>Separate memory capacity/access paths<\/td>\n<\/tr>\n<tr>\n  <td>Efficient when long context fits gated state<\/td>\n  <td>Potentially better direct access to distant items<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Exam-ready sentence<\/h3>\n<p>“Explicit memory provides a separate mechanism for storing and retrieving information, reducing the need to encode every past detail in a recurrent hidden state.” Then illustrate with a key/query/read diagram.<\/p>\n"},{"m":5,"title":"Module 5 — long-term memory answer blueprint","deck":"Draw the gates correctly and perform numericals in the correct order.","source":"N5 slides 2–51; S5 pp. 4–51","priority":"high","demo":null,"labels":["revision"],"id":52,"order":8,"html":"<h3>A complete LSTM answer<\/h3>\n<p>Start with the <strong>long-term dependency problem<\/strong> and vanishing gradients. Then draw the LSTM cell, label <code>(xₜ,hₜ₋₁,cₜ₋₁)<\/code> inputs and <code>(hₜ,cₜ)<\/code> outputs, write four preactivations/gates, then the two state equations. Explain the additive cell path and one practical use such as sequence sentiment or speech prediction.<\/p>\n<h3>A complete GRU answer<\/h3>\n<p>Show update/reset sigmoids, candidate tanh, final convex mixing, and note the absence of a separate cell state. If given gate values, calculate the final state rather than merely describing them.<\/p>\n<h3>A complete clipping numerical<\/h3>\n<p>Write Euclidean norm, decide whether the threshold is exceeded, compute scale factor, multiply each component, then show parameter update if asked. Distinguish norm clipping and value clipping.<\/p>\n<h3>Decision checklist<\/h3>\n<ul>\n<li>Is the network recurrent, recursive or Transformer-based?<\/li>\n<li>Do the gates provided correspond to sigmoid <strong>outputs<\/strong> or raw logits?<\/li>\n<li>Which GRU update-gate convention is specified?<\/li>\n<li>Are you required to update cₜ, hₜ, or both?<\/li>\n<li>Does the problem ask to solve vanishing gradients or exploding gradients?<\/li>\n<\/ul>\n<p>The goal is not to memorize prose. It is to draw the correct state flow and make the arithmetic reproduce it.<\/p>\n"},{"m":6,"title":"Transfer learning: feature extraction versus fine-tuning","deck":"Reuse pretrained representations without training everything from scratch.","source":"S6 pp. 4–32; DL pp. 157–165","priority":"critical","demo":"transfer","labels":["transfer learning"],"id":53,"order":0,"html":"<h3>The fundamental assumption<\/h3>\n<p>A model trained on a <strong>source task/domain<\/strong> has representations that may help a <strong>related target task<\/strong>. Example: a CNN pretrained on a large natural-image dataset often learns transferable edges, textures and shapes useful for a smaller image-classification task.<\/p>\n<p>Two common strategies:<\/p>\n<ol>\n<li><strong>Feature extraction:<\/strong> freeze pretrained backbone weights, replace and train a new task head. Faster and less likely to overfit a tiny target dataset.<\/li>\n<li><strong>Fine-tuning:<\/strong> unfreeze some upper backbone layers (possibly later more), use a cautious small learning rate and train on target data. More flexible but higher overfit/computation risk.<\/li>\n<\/ol>\n<h3>The “what if my data is small?” decision matrix<\/h3>\n<table>\n<thead>\n<tr>\n  <th>Target dataset<\/th>\n  <th>Related to source?<\/th>\n  <th>Sensible starting strategy<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Small<\/td>\n  <td>High<\/td>\n  <td>Freeze backbone; train small head<\/td>\n<\/tr>\n<tr>\n  <td>Small<\/td>\n  <td>Low<\/td>\n  <td>Try transfer cautiously; features may not fit<\/td>\n<\/tr>\n<tr>\n  <td>Large<\/td>\n  <td>High<\/td>\n  <td>Fine-tune upper layers; compare to frozen baseline<\/td>\n<\/tr>\n<tr>\n  <td>Large<\/td>\n  <td>Low<\/td>\n  <td>More extensive fine-tuning or train from scratch if feasible<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Leakage and preprocessing traps<\/h3>\n<p>Preserve the pretrained model's expected input normalization, size and channel ordering. Fit tuning choices on training/validation only. Don't let test images appear in augmented training data. Freezing layers does not automatically freeze training behavior of all normalization statistics—check framework mode semantics in practice.<\/p>\n<h3>Exam application<\/h3>\n<p>Given 2,000 labeled medical images and an ImageNet backbone, explain which layers you freeze, replace the output head to match classes, why a lower LR is appropriate when unfreezing, and how you validate generalisation.<\/p>\n"},{"m":6,"title":"GANs — generator, discriminator and adversarial objectives","deck":"Two networks compete; neither sees a supervised paired target by default.","source":"S6 pp. 32–58; DL pp. 164–175","priority":"critical","demo":"gan","labels":["GAN","loss"],"id":54,"order":1,"html":"<h3>Roles<\/h3>\n<p>A <strong>generator G<\/strong> maps random noise z (and optional conditioning variables) to a synthetic sample <code>G(z)<\/code>. A <strong>discriminator D(x)<\/strong> estimates whether its input resembles real training data rather than generated data.<\/p>\n<p>A classical minimax objective is:<\/p>\n<p><code>min_G max_D [ E_{x~pdata} ln D(x) + E_{z~p(z)} ln(1−D(G(z))) ]<\/code>.<\/p>\n<p>The discriminator learns to distinguish genuine from synthetic. The generator learns to fool the discriminator. In many implementations, the generator uses a <strong>non-saturating<\/strong> loss <code>−E ln D(G(z))<\/code> because it provides stronger gradients early in training.<\/p>\n<h3>Numerical: discriminator binary CE<\/h3>\n<p>If D(real)=0.9 and D(fake)=0.2, discriminator loss for one real and one fake (sum convention):<\/p>\n<p><code>L_D=−[ln(0.9)+ln(1−0.2)] ≈ −[−0.10536−0.22314]=0.32850<\/code>.<\/p>\n<p>For non-saturating generator loss on the fake: <code>L_G=−ln(0.2)≈1.60944<\/code>.<\/p>\n<h3>Alternating training loop<\/h3>\n<ol>\n<li>Sample real x and latent noise z.<\/li>\n<li>Generate fakes <code>G(z)<\/code>.<\/li>\n<li>Update D on real and fake examples.<\/li>\n<li>Sample noise again; update G through D's signal, holding D parameters fixed during G's update.<\/li>\n<li>Repeat; monitor sample quality, diversity and stability.<\/li>\n<\/ol>\n<h3>Common difficulties<\/h3>\n<p>Mode collapse (limited diversity), unstable adversarial dynamics, oscillation, and evaluation challenges. “At equilibrium D≈0.5” is an idealised statement under an optimal setup, not a useful standalone guarantee that images are good.<\/p>\n"},{"m":6,"title":"GAN variants, advantages and applications","deck":"Explain conditional generation and the stability trade-offs.","source":"S6 pp. 56–79; DL pp. 169–177","priority":"core","demo":null,"labels":["GAN variants"],"id":55,"order":2,"html":"<h3>Why variants exist<\/h3>\n<p>Basic GAN training may be unstable, lose modes or lack output control. Variants change architecture, conditioning or distance measures.<\/p>\n<ul>\n<li><strong>DCGAN:<\/strong> uses convolutional generator/discriminator networks; suitable for image synthesis.<\/li>\n<li><strong>Conditional GAN (cGAN):<\/strong> conditions G and D on a label or other information, enabling controllable outputs.<\/li>\n<li><strong>WGAN:<\/strong> uses a critic and an Earth-Mover-style objective; the critic's role differs from a sigmoid-probability discriminator, so the BCE objective from vanilla GAN is not reused unchanged.<\/li>\n<li><strong>CycleGAN:<\/strong> learns unpaired translation with cycle-consistency constraints (supplementary context).<\/li>\n<\/ul>\n<h3>Application-to-variant decision<\/h3>\n<p>Generate a specific digit class from noise → cGAN. Synthesize realistic image crops → DCGAN-style model. Translate a style across <em>unpaired<\/em> image domains → CycleGAN-type architecture. The best choice depends on data and restrictions; not every generated sample is safe or faithful to real data.<\/p>\n<h3>What to write in a compare question<\/h3>\n<p>For each model name, identify <strong>the architectural/learning innovation<\/strong>, what issue it tries to fix, and an example. Avoid the unsupported claim that GANs always learn without labels: vanilla GAN can be unlabeled, conditional GANs may use labels or other conditioning signals.<\/p>\n<blockquote>\n<p><strong>Exam trap:<\/strong> Image augmentation and GAN synthesis are related but not equivalent. GAN-generated examples may contain artifacts or incorrect labels and require careful evaluation.<\/p>\n<\/blockquote>\n"},{"m":6,"title":"Image classification versus object detection","deck":"Class labels are not bounding boxes.","source":"S6 pp. 80–85; DL pp. 175–179","priority":"high","demo":"iou","labels":["object detection"],"id":56,"order":3,"html":"<h3>First identify the output type<\/h3>\n<p><strong>Classification:<\/strong> one or more labels for the entire image. <strong>Object detection:<\/strong> localise and classify potentially multiple objects, typically with <code>(class, confidence, bounding box)<\/code> predictions. <strong>Semantic segmentation:<\/strong> class per pixel. <strong>Instance segmentation:<\/strong> pixels plus separated object instances.<\/p>\n<p>This distinction explains why a CNN classification backbone alone is not a full detector. Detection algorithms need <strong>localisation<\/strong> and often post-processing to remove duplicate boxes.<\/p>\n<h3>Bounding-box coordinates<\/h3>\n<p>Axis-aligned box is <code>(x_min,y_min,x_max,y_max)<\/code>. Its area is <code>max(0,x_max−x_min)×max(0,y_max−y_min)<\/code>. For two boxes, intersection width is <code>max(0,min(x₂A,x₂B)−max(x₁A,x₁B))<\/code>; similarly for height.<\/p>\n<h3>IoU<\/h3>\n<p><code>IoU = intersection_area / union_area<\/code>, <code>union=A+B−intersection<\/code>. Range is [0,1] (when union&gt;0), equals 0 for no overlap, equals 1 for identical boxes.<\/p>\n<h3>Why nonmaximum suppression is needed<\/h3>\n<p>A detector may predict multiple overlapping boxes for one object. Non-maximum suppression keeps a high-score candidate and suppresses substantially overlapping lower-score candidates, often using an IoU threshold. It is different from evaluating IoU against ground truth.<\/p>\n"},{"m":6,"title":"R-CNN — region proposals, classification and box regression","deck":"Understand the slow but historically important detection pipeline.","source":"S6 pp. 80–103; DL pp. 176–189","priority":"high","demo":"detection","labels":["R-CNN"],"id":57,"order":4,"html":"<h3>The original R-CNN pipeline<\/h3>\n<ol>\n<li>Input image → around <strong>2,000 region proposals<\/strong> using selective search (approximate typical description).<\/li>\n<li>Warp/crop each proposed region to the CNN's expected input size.<\/li>\n<li>Run a CNN to extract a feature vector for <strong>each region<\/strong>.<\/li>\n<li>Classify regions, historically with per-class SVMs.<\/li>\n<li>Use bounding-box regression to refine locations.<\/li>\n<\/ol>\n<h3>Why it is costly<\/h3>\n<p>Running a full CNN separately on thousands of region proposals means duplicated computation. Its stages were also originally trained separately rather than as one modern end-to-end network.<\/p>\n<h3>Selective search<\/h3>\n<p>Selective search generates candidate object regions by hierarchically grouping similar image segments using signals such as color, texture, size and shape. It proposes <strong>possible object locations<\/strong>, not their final class labels.<\/p>\n<h3>Difference from image classification<\/h3>\n<p>A CNN classifies an image or crop; R-CNN adds a <strong>region proposal and localisation pipeline<\/strong>. If an exam asks for an R-CNN architecture diagram, mark candidate regions, per-region CNN, classifier and box regression separately.<\/p>\n<blockquote>\n<p><strong>Trap:<\/strong> The SVM stage is a detail of original R-CNN; modern Faster R-CNN uses a different integrated architecture. Do not describe all R-CNN variants as independently running a CNN 2,000 times.<\/p>\n<\/blockquote>\n"},{"m":6,"title":"Fast R-CNN and the R-CNN family","deck":"Share convolutional computation and pool region features.","source":"S6 pp. 102–110; DL pp. 189–195","priority":"high","demo":"detection","labels":["Fast R-CNN"],"id":58,"order":5,"html":"<h3>Fast R-CNN's crucial efficiency gain<\/h3>\n<p>Instead of running CNN separately per proposed box, <strong>Fast R-CNN<\/strong> runs the image through the convolutional backbone <strong>once<\/strong> to obtain shared feature maps. Region-of-interest (RoI) pooling extracts fixed-size features corresponding to each proposal; a classifier and bounding-box regression head operate on those RoI features.<\/p>\n<h3>Compare the lineage<\/h3>\n<table>\n<thead>\n<tr>\n  <th>Model<\/th>\n  <th>Proposal method<\/th>\n  <th>Feature computation<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>R-CNN<\/td>\n  <td>External selective search<\/td>\n  <td>CNN rerun per proposal<\/td>\n<\/tr>\n<tr>\n  <td>Fast R-CNN<\/td>\n  <td>External selective search<\/td>\n  <td>CNN once on whole image; RoI pooling<\/td>\n<\/tr>\n<tr>\n  <td>Faster R-CNN<\/td>\n  <td>Learned Region Proposal Network (RPN)<\/td>\n  <td>Shared convolutional features and learned proposals<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Why “Fast” still was not fully fast<\/h3>\n<p>External selective search remains a bottleneck in Fast R-CNN. Faster R-CNN addresses this with an RPN that predicts proposals from shared feature maps. Faster R-CNN is taught as a contextual evolution; the supplied Module-6 deck focuses on R-CNN and Fast R-CNN.<\/p>\n<h3>Exam diagram<\/h3>\n<p><code>image → shared CNN feature map → external proposals → RoI pooling → class scores + box offsets<\/code>. Draw the shared CNN as a <strong>single<\/strong> path.<\/p>\n<blockquote>\n<p><strong>Trap:<\/strong> Fast R-CNN is not the same as YOLO. Fast R-CNN is two-stage (proposals then classification); YOLO is single-stage prediction.<\/p>\n<\/blockquote>\n"},{"m":6,"title":"YOLO — one-stage detection in a single forward pass","deck":"Grid prediction, objectness and class confidence.","source":"S6 pp. 109–131; DL pp. 195–204","priority":"critical","demo":"detection","labels":["YOLO","numerical"],"id":59,"order":6,"html":"<h3>What “You Only Look Once” means<\/h3>\n<p>YOLO predicts bounding boxes and classes <strong>directly from the image features in one network forward pass<\/strong> rather than repeatedly classifying external region proposals. The early YOLO design divides the image into an S×S grid; each cell predicts boxes and class information according to the architecture's output encoding.<\/p>\n<h3>Classic YOLO-v1 output shape<\/h3>\n<p>For S×S cells, B boxes per cell, and C classes, classic YOLO-v1 uses <code>S×S×(B×5+C)<\/code> outputs. Each box contributes coordinates <code>(x,y,w,h)<\/code> plus confidence; class probabilities are predicted for each cell.<\/p>\n<p>For <code>S=7, B=2, C=20<\/code>, output size is <code>7×7×(2×5+20)=7×7×30<\/code>, i.e., <strong>1,470 scalar values<\/strong>.<\/p>\n<h3>The class-confidence idea<\/h3>\n<p>In the historical formulation, a box confidence reflects both object presence and how well the box overlaps an object (based on IoU). Class-specific confidence is often interpreted as conditional class probability × box confidence. Modern YOLO implementations vary greatly; do not blindly apply original YOLO-v1 formulas to newer versions.<\/p>\n<h3>YOLO versus proposal-based detection<\/h3>\n<p>YOLO is typically faster for real-time use and learns joint localisation/classification. Two-stage detectors can offer different accuracy/small-object tradeoffs. Exact speed and quality depend on architecture version, hardware and dataset.<\/p>\n<blockquote>\n<p><strong>Exam trap:<\/strong> “YOLO predicts one box per image” is false. It predicts multiple candidate boxes, later filtered by confidence and overlap suppression.<\/p>\n<\/blockquote>\n"},{"m":6,"title":"SSD — multi-scale single-shot detection","deck":"Predict from several feature maps to handle object sizes.","source":"S6 pp. 131–138","priority":"core","demo":"detection","labels":["SSD"],"id":60,"order":7,"html":"<h3>How SSD differs from both R-CNN and basic YOLO<\/h3>\n<p>Single Shot MultiBox Detector (SSD) predicts classes and bounding-box offsets directly from <strong>multiple feature-map scales<\/strong>. Earlier/higher-resolution features can better detect small objects; deeper/coarser features offer broader receptive fields for larger objects.<\/p>\n<p>At each feature-map location SSD associates several default/anchor boxes with predefined aspect ratios and scales. It predicts offsets that refine these boxes and class confidences. A matching strategy assigns ground-truth objects to appropriate default boxes during training.<\/p>\n<h3>Anchor interpretation<\/h3>\n<p>A default box is a starting hypothesis for size/aspect ratio. A regression head predicts how to translate/scale it. This is different from selective-search proposals generated by an independent image-segmentation heuristic.<\/p>\n<h3>High-value comparison<\/h3>\n<table>\n<thead>\n<tr>\n  <th>R-CNN / Fast R-CNN<\/th>\n  <th>YOLO<\/th>\n  <th>SSD<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Region proposals then classify<\/td>\n  <td>One-stage grid/box prediction<\/td>\n  <td>One-stage default boxes on multiple scales<\/td>\n<\/tr>\n<tr>\n  <td>Original R-CNN slow due per-region CNN<\/td>\n  <td>Often real-time<\/td>\n  <td>Multi-scale single-shot design<\/td>\n<\/tr>\n<tr>\n  <td>ROI/proposal concepts central<\/td>\n  <td>Objectness/grid concepts central<\/td>\n  <td>Anchor/default boxes central<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>Exam answer:<\/strong> Draw the image feature extractor feeding multiple feature maps with box/class prediction heads, then explain multiscale handling and NMS.<\/p>\n<\/blockquote>\n"},{"m":6,"title":"IoU numerical and non-maximum suppression","deck":"Boxes are easy marks only when geometry is correct.","source":"S6 detection slides; D2 2024 FAT reported topics","priority":"critical","demo":"iou","labels":["IoU","NMS","numerical"],"id":61,"order":8,"html":"<h3>Step-by-step IoU<\/h3>\n<p>Suppose A has coordinates <code>(0,0,4,4)<\/code> and B <code>(2,1,6,5)<\/code>. Areas: <code>A=16<\/code>, <code>B=16<\/code>. Overlap rectangle: left=max(0,2)=2, top=max(0,1)=1, right=min(4,6)=4, bottom=min(4,5)=4. Width <code>4−2=2<\/code>, height <code>4−1=3<\/code>, intersection <code>6<\/code>. Union <code>16+16−6=26<\/code>.<\/p>\n<p><strong>IoU = 6/26 ≈ 0.23077.<\/strong><\/p>\n<h3>NMS worked miniature<\/h3>\n<p>Three predicted boxes have scores A=.95, B=.81, C=.70. Suppose IoU(A,B)=.8, IoU(A,C)=.1, and threshold τ=.5.<\/p>\n<ol>\n<li>Keep A (highest score).<\/li>\n<li>Suppress B because <code>.8&gt;.5<\/code>.<\/li>\n<li>Keep C because <code>.1≤.5<\/code>.<\/li>\n<\/ol>\n<p>Final detections: <strong>A and C<\/strong>. The scores decide order; the overlap threshold decides suppression.<\/p>\n<h3>Do not confuse metrics<\/h3>\n<p>IoU is an overlap measure of two boxes. A score called “confidence” is a model prediction, not the IoU itself. Precision/recall are dataset-level detection evaluation ideas and require consistent matching criteria.<\/p>\n"},{"m":6,"title":"Module 6 — design questions and family comparison","deck":"Make a justified architecture choice from the application.","source":"S6 pp. 4–138; DL pp. 157–206","priority":"high","demo":"detection","labels":["exam blueprint"],"id":62,"order":9,"html":"<h3>Three architecture families, three outputs<\/h3>\n<ul>\n<li><strong>Transfer learning:<\/strong> leverage pretrained weights and adapt to target task; output depends on the new head.<\/li>\n<li><strong>GAN:<\/strong> synthesize realistic new examples; generator and discriminator are trained adversarially.<\/li>\n<li><strong>Detection:<\/strong> identify <em>what and where<\/em> in an image; use proposal-based (R-CNN/Fast R-CNN) or one-stage (YOLO/SSD) strategies.<\/li>\n<\/ul>\n<h3>Scenario → answer outline<\/h3>\n<p><strong>Few labeled images:<\/strong> pretrained CNN, freeze backbone first, train head, cautiously unfreeze, augmentation, validation.<\/p>\n<p><strong>Generate realistic examples:<\/strong> define G and D, write adversarial loss, describe alternating updates, mention collapse/quality assessment.<\/p>\n<p><strong>Traffic-sign detector on a real-time camera:<\/strong> YOLO/SSD are candidates; justify latency, scale sensitivity, acceptable accuracy and hardware.<\/p>\n<p><strong>Accurate localisation of complex scenes:<\/strong> region-based detector may be considered; explain RoI/shared features and speed tradeoff.<\/p>\n<h3>What diagrams to draw<\/h3>\n<p>Transfer pipeline <code>source model → frozen/finetuned layers → new classifier<\/code>. GAN <code>noise → Generator → fake ↔ Discriminator ← real<\/code>. Fast R-CNN <code>image → shared convolution → RoI pooling → classifier+regressor<\/code>. YOLO <code>image → dense prediction grid → filtering/NMS<\/code>.<\/p>\n<blockquote>\n<p><strong>Scope rule:<\/strong> Do not spend hours memorizing every release of YOLO; the source teaches the <strong>underlying one-shot principle and early architecture<\/strong>, and the exam asks you to explain mechanisms and compute simple outputs.<\/p>\n<\/blockquote>\n"},{"m":7,"title":"RL language: agent, environment, reward and policy","deck":"Turn an interactive problem into a precise Markov decision process.","source":"S7 pp. 3–21; DL pp. 204–212","priority":"core","demo":"rl","labels":["MDP","return"],"id":63,"order":0,"html":"<h3>A learner that acts<\/h3>\n<p>In <strong>reinforcement learning<\/strong> an agent repeatedly observes a <strong>state s<\/strong>, chooses an <strong>action a<\/strong>, receives a <strong>reward r<\/strong>, and moves into a next state s′. It tries to maximise expected cumulative future reward rather than directly matching a labelled target for every action.<\/p>\n<p>A Markov Decision Process is commonly defined as <code>(S,A,P,R,γ)<\/code>:<\/p>\n<ul>\n<li>S: possible states.<\/li>\n<li>A: available actions.<\/li>\n<li>P(s′|s,a): transition probability.<\/li>\n<li>R: immediate reward model.<\/li>\n<li>γ∈[0,1): discount factor (for many continuing-task formulations).<\/li>\n<\/ul>\n<p>A <strong>policy π(a|s)<\/strong> gives how an agent chooses actions. A state-value function <code>V^π(s)<\/code> estimates expected discounted return under π; action-value <code>Q^π(s,a)<\/code> estimates expected return from state-action pair followed by π.<\/p>\n<h3>Discounted return<\/h3>\n<p><code>Gₜ = rₜ₊₁ + γ rₜ₊₂ + γ² rₜ₊₃ + …<\/code>.<\/p>\n<p>Numerical: rewards 5, 2, 1 over the next three steps, γ=.9. Return <code>G=5+.9×2+.9²×1=7.61<\/code>.<\/p>\n<h3>What makes it “deep”?<\/h3>\n<p>Deep RL uses neural networks to represent policies, values, environment models or other components. Tabular Q-learning uses a state–action table; DQN uses a deep network to approximate Q-values when state spaces are too large for a simple table.<\/p>\n<blockquote>\n<p><strong>Exam trap:<\/strong> The reward is the immediate feedback; the <strong>return<\/strong> is accumulated discounted future rewards. They are not synonyms.<\/p>\n<\/blockquote>\n"},{"m":7,"title":"Bellman equations and the value of future choices","deck":"Make recursive expectation understandable.","source":"S7 pp. 15–29","priority":"high","demo":"rl","labels":["Bellman","TD"],"id":64,"order":1,"html":"<h3>Value is recursively defined<\/h3>\n<p>For policy π:<\/p>\n<p><code>V^π(s) = E_π[rₜ₊₁ + γ V^π(sₜ₊₁) | sₜ=s]<\/code>.<\/p>\n<p>The optimal action-value satisfies the <strong>Bellman optimality<\/strong> idea:<\/p>\n<p><code>Q*(s,a) = E[r + γ max_a′ Q*(s′,a′)]<\/code>.<\/p>\n<p>An action may give a small immediate reward but lead to a much better next state; γ determines how strongly the future matters.<\/p>\n<h3>Worked Bellman backup<\/h3>\n<p>A transition yields immediate reward <code>r=2<\/code>. The best next-state action has Q-value <code>8<\/code>, and discount γ=.9. The one-step target is <code>2+.9×8=9.2<\/code>. If current Q(s,a)=5, the TD error <code>δ=9.2−5=4.2<\/code>.<\/p>\n<h3>Policy evaluation versus control<\/h3>\n<p><strong>Evaluation:<\/strong> calculate values for a fixed policy. <strong>Control:<\/strong> improve the policy, using choices such as <code>argmax_a Q(s,a)<\/code> (subject to exploration). Q-learning learns toward a greedy optimality target, whereas SARSA uses the value of the <strong>action actually chosen next<\/strong> in its on-policy update.<\/p>\n<h3>Practical limitation<\/h3>\n<p>The textbook's simple tabular examples assume manageable discrete states/actions and appropriate exploration. Deep networks introduce approximation and stability issues addressed by DQN techniques later.<\/p>\n"},{"m":7,"title":"Q-learning — one update with complete arithmetic","deck":"Probably the cleanest DRL numerical to master.","source":"S7 pp. 24–52; D2 2024 FAT topic summaries","priority":"critical","demo":"qlearning","labels":["Q-learning","numerical"],"id":65,"order":2,"html":"<h3>The formula you must remember<\/h3>\n<p>For current Q(s,a), learning rate α, reward r, discount γ, and maximum next-state Q:<\/p>\n<p><code>Q_new(s,a) = Q_old(s,a) + α [ r + γ max_a′ Q_old(s′,a′) − Q_old(s,a) ]<\/code>.<\/p>\n<p>The expression in square brackets is the <strong>temporal-difference error<\/strong>. Q-learning is off-policy because its target takes the best next Q whether or not the agent actually chooses that action under exploration.<\/p>\n<h3>Complete numerical<\/h3>\n<p>Given <code>Q_old=4<\/code>, <code>α=.5<\/code>, immediate <code>r=3<\/code>, <code>γ=.9<\/code>, and next-state Q values <code>(6,2,1)<\/code>:<\/p>\n<ol>\n<li>Maximum next Q = <strong>6<\/strong>.<\/li>\n<li>Bellman target <code>T=3+0.9×6=8.4<\/code>.<\/li>\n<li>TD error <code>δ=T−4=4.4<\/code>.<\/li>\n<li>Weighted correction <code>αδ=.5×4.4=2.2<\/code>.<\/li>\n<li><strong>Updated Q = 4+2.2=6.2<\/strong>.<\/li>\n<\/ol>\n<p>Check: new Q moved halfway from old 4 toward target 8.4. It cannot overshoot the target if α is between 0 and 1 in this simple scalar update.<\/p>\n<h3>Edge case: terminal next state<\/h3>\n<p>If the next state is terminal with no future value, the target is just r (no <code>γ max Q<\/code> term). Treating a terminal as a normal state can produce incorrect updates.<\/p>\n<blockquote>\n<p><strong>Exam method:<\/strong> Show max next Q, target, TD error, increment and final table entry. Never update all Q-table entries when the question specifies only one visited state-action pair.<\/p>\n<\/blockquote>\n"},{"m":7,"title":"Exploration versus exploitation","deck":"Why a greedy learner can miss the best route.","source":"S7 pp. 29–38, 100–101","priority":"high","demo":"rl","labels":["epsilon greedy","probability"],"id":66,"order":3,"html":"<h3>Two competing needs<\/h3>\n<p><strong>Exploitation<\/strong> chooses an action currently thought best. <strong>Exploration<\/strong> chooses uncertain alternatives to discover better long-term outcomes. Always exploiting early estimates can trap learning in a suboptimal policy.<\/p>\n<h3>ε-greedy policy<\/h3>\n<p>With probability <code>1−ε<\/code>, choose an action with maximal current Q; with probability ε, choose a random action (including possibly the greedy one). For A=4 equally sampled actions and ε=.2, if exactly one action is greedy:<\/p>\n<p><code>P(greedy)=.8 + .2/4 = .85<\/code>.<\/p>\n<p>Every non-greedy action has probability <code>.2/4=.05<\/code>.<\/p>\n<h3>Why the nuance matters<\/h3>\n<p>People often say “20% exploration, 80% exploitation.” But because random exploration can pick the greedy action, the <strong>total probability<\/strong> of the greedy action may exceed 80%.<\/p>\n<h3>Schedules<\/h3>\n<p>A high early ε encourages discovery; gradually decreasing ε shifts toward exploitation, subject to the task. Too small ε can fail to explore; too large maintains unhelpful randomness.<\/p>\n<h3>Contrast on-policy/off-policy<\/h3>\n<p>Q-learning uses an optimality max in the target (off-policy). SARSA uses the actual next chosen action. An ε-greedy action policy can be used to collect data for either method.<\/p>\n"},{"m":7,"title":"Deep Q-Networks: Q network, target network and replay","deck":"What DQN changes about tabular Q-learning.","source":"S7 pp. 52–69","priority":"critical","demo":"qlearning","labels":["DQN","replay"],"id":67,"order":4,"html":"<h3>Replace a table with a neural function<\/h3>\n<p>In large or continuous observation spaces, a table for every state-action pair is impractical. DQN approximates <code>Q(s,a;θ)<\/code> with a deep network, returning action values from an observation.<\/p>\n<h3>Three core mechanisms<\/h3>\n<ol>\n<li><strong>Experience replay:<\/strong> store transitions <code>(s,a,r,s′,done)<\/code> and train on randomly sampled mini-batches. This reduces short-term data correlation and improves reuse.<\/li>\n<li><strong>Target network:<\/strong> maintain a separate slower-changing parameter set θ⁻ for Bellman targets, instead of chasing a target that moves every gradient step.<\/li>\n<li><strong>Online Q-network:<\/strong> update θ by optimising TD-error loss.<\/li>\n<\/ol>\n<h3>The DQN target and loss<\/h3>\n<p>For nonterminal transitions:<\/p>\n<p><code>y = r + γ max_a′ Q(s′,a′; θ⁻)<\/code>.<\/p>\n<p>For terminal transitions: <code>y=r<\/code>. Then train with a loss such as <code>L=(y−Q(s,a;θ))²<\/code> (or Huber loss in some implementations).<\/p>\n<h3>Numerical<\/h3>\n<p>Current network Q(s,a)=2, target network next Q's <code>(5,4)<\/code>, γ=.9, reward 1 → <code>y=1+.9×5=5.5<\/code>. Squared TD error <code>(5.5−2)²=12.25<\/code> (or half-squared 6.125 if that convention is specified).<\/p>\n<h3>Why naive deep Q-learning can be unstable<\/h3>\n<p>Function approximation, bootstrapping on estimates, and correlated experience can destabilize learning. Replay and target networks aim to reduce those problems, but do not guarantee convergence in all deep RL settings.<\/p>\n"},{"m":7,"title":"Policy gradients — directly learn what action to take","deck":"Optimise a stochastic policy instead of a Q table.","source":"S7 pp. 71–85","priority":"high","demo":"rl","labels":["policy gradient"],"id":68,"order":5,"html":"<h3>A different optimisation target<\/h3>\n<p>Value-based methods estimate action values and then choose actions. Policy-gradient methods directly parameterise <code>π_θ(a|s)<\/code> and adjust θ to increase expected return.<\/p>\n<p>A REINFORCE-style policy gradient estimate is:<\/p>\n<p><code>∇θ J(θ) ≈ Σₜ Gₜ ∇θ log π_θ(aₜ|sₜ)<\/code>.<\/p>\n<p>Intuition: increase log-probability of actions in <strong>high-return trajectories<\/strong>; decrease relative preference for low-return outcomes after accounting for baselines/advantage.<\/p>\n<h3>Tiny numerical intuition<\/h3>\n<p>Suppose an action has current probability p=.25 and produced unusually high return. Gradient ascent on log p encourages moving the model toward a parameter setting with a larger p. The update direction comes from <code>∇ log π<\/code>; <strong>do not<\/strong> replace it with Q-learning's max-next-state equation.<\/p>\n<h3>Variance reduction<\/h3>\n<p>A baseline (e.g. estimated V(s)) can be subtracted from the return, producing an advantage estimate <code>A(s,a)≈Q(s,a)−V(s)<\/code>. This changes variance and credit assignment, not the expectation of the ideal gradient under suitable conditions.<\/p>\n<h3>Where useful<\/h3>\n<p>Stochastic continuous-action policies and settings where explicit policy distribution matters. Policy gradients can have high variance and need careful sampling, normalization and learning-rate design.<\/p>\n"},{"m":7,"title":"Actor–critic, advantage and A2C","deck":"One network acts; another critiques.","source":"S7 pp. 80–88; DL pp. 211–214","priority":"high","demo":"rl","labels":["A2C","advantage"],"id":69,"order":6,"html":"<h3>Two function approximators<\/h3>\n<p><strong>Actor:<\/strong> policy <code>π_θ(a|s)<\/code> selects actions. <strong>Critic:<\/strong> estimates value <code>V_φ(s)<\/code> or action value and supplies a learning signal. The critic does not literally grade image classification; it evaluates expected future reward in an RL context.<\/p>\n<h3>Advantage<\/h3>\n<p><code>A(s,a)=Q(s,a)−V(s)<\/code>, conceptually: how much better was the action than the state's usual value? A positive advantage suggests increasing that action's policy probability; a negative advantage suggests decreasing it.<\/p>\n<h3>A2C<\/h3>\n<p>Advantage Actor–Critic typically collects trajectories using environments (often synchronised workers), forms reward/value targets and advantages, updates critic by value-error loss, and updates actor with advantage-weighted log-probability gradients.<\/p>\n<h3>Numeric advantage example<\/h3>\n<p>If state value <code>V(s)=4<\/code> and the estimated value of a chosen action is <code>Q(s,a)=6<\/code>, advantage <code>A=+2<\/code>. If another action's Q is 1, advantage <code>−3<\/code>. For policy learning, the positive advantage reinforces the chosen action more than baseline; negative advantage disfavours it.<\/p>\n<h3>Why not only actor?<\/h3>\n<p>A learned critic provides a baseline that can reduce the variance of policy-gradient estimates. However, poor critic estimates can bias or destabilize updates, so actor and critic must be trained carefully.<\/p>\n"},{"m":7,"title":"A3C — asynchronous actor–critic workers","deck":"Parallel environment experience with asynchronous updates.","source":"S7 pp. 87–96","priority":"high","demo":null,"labels":["A3C","parallel"],"id":70,"order":7,"html":"<h3>The architectural change from A2C<\/h3>\n<p>A3C stands for <strong>Asynchronous Advantage Actor–Critic<\/strong>. Multiple workers interact with separate environment instances and update shared model parameters asynchronously. This diversifies experiences and can help decorrelate training samples.<\/p>\n<p>A2C usually denotes a <strong>synchronous<\/strong> multi-worker variant that aggregates updates; A3C workers can finish and submit updates independently. Implementation details vary, but the key exam contrast is synchronisation.<\/p>\n<h3>Conceptual flow<\/h3>\n<p><code>worker 1: environment → trajectory → actor/critic gradient<\/code>;<\/p>\n<p><code>worker 2: environment → trajectory → gradient<\/code>;<\/p>\n<p><code>worker 3: environment → trajectory → gradient<\/code>;<\/p>\n<p>These updates are applied asynchronously to shared network parameters under A3C.<\/p>\n<h3>Benefits and caveats<\/h3>\n<p>Parallel workers explore diverse states and reduce dependence on a single trajectory. Drawbacks include coordination, stale-gradient effects and harder reproducibility. A3C does not mean the actor is trained without a critic.<\/p>\n<h3>A typical compare question<\/h3>\n<table>\n<thead>\n<tr>\n  <th>A2C<\/th>\n  <th>A3C<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Synchronous batch of worker updates<\/td>\n  <td>Asynchronous worker updates<\/td>\n<\/tr>\n<tr>\n  <td>Easier deterministic aggregation<\/td>\n  <td>Less waiting for slow workers<\/td>\n<\/tr>\n<tr>\n  <td>Consistent snapshot per update<\/td>\n  <td>Some updates may use stale weights<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>Exam sentence:<\/strong> “Both use an actor policy and critic value estimator; they differ primarily in how parallel workers synchronise parameter updates.”<\/p>\n<\/blockquote>\n"},{"m":7,"title":"Model-based reinforcement learning","deck":"Learn or use transitions to plan ahead.","source":"S7 pp. 96–101","priority":"core","demo":null,"labels":["model based RL"],"id":71,"order":8,"html":"<h3>Model-free versus model-based<\/h3>\n<p><strong>Model-free<\/strong> methods like tabular Q-learning, DQN and many policy-gradient approaches do not require an explicit model of environment transitions when selecting actions. They learn values/policies from interactions.<\/p>\n<p><strong>Model-based<\/strong> approaches maintain or learn a transition and reward model <code>P(s′|s,a)<\/code> / <code>R(s,a)<\/code> and use it to <strong>simulate<\/strong>, evaluate or plan potential future actions.<\/p>\n<h3>Example planning step<\/h3>\n<p>A warehouse robot chooses between route A and B. A learned model estimates collisions and travel costs for both routes under possible next states. The planner rolls each option forward, estimates expected return, selects a route, executes the first action, observes the real world, and updates its model.<\/p>\n<h3>Strengths and weaknesses<\/h3>\n<p>A model can improve sample efficiency because imagined rollouts supplement scarce real interactions. But <strong>model bias<\/strong> is a serious risk: planning many steps with a wrong transition model can accumulate error. Real-world safety, partial observability and distribution shift make this difficult.<\/p>\n<h3>Connection to other course material<\/h3>\n<p>This is not an autoencoder or GAN by definition. Model-based RL may use learned neural models, but its purpose is <strong>planning decision consequences<\/strong>, not merely generating realistic-looking data.<\/p>\n"},{"m":7,"title":"Challenges, failure modes and exam case studies","deck":"Turn RL terminology into a defensible solution.","source":"S7 pp. 99–101","priority":"high","demo":null,"labels":["RL challenges","exam"],"id":72,"order":9,"html":"<h3>The challenges in the faculty deck<\/h3>\n<ul>\n<li><strong>Exploration/exploitation:<\/strong> finding useful alternatives while using known good actions.<\/li>\n<li><strong>Sparse/delayed rewards:<\/strong> important feedback may arrive far after the responsible action.<\/li>\n<li><strong>Credit assignment:<\/strong> determining which actions led to an eventual reward.<\/li>\n<li><strong>Sample inefficiency:<\/strong> simulation/real-environment interactions may be expensive.<\/li>\n<li><strong>Instability:<\/strong> replay correlations, moving targets, bootstrap errors.<\/li>\n<li><strong>Safety and reward design:<\/strong> a poorly specified reward may incentivise unintended behaviour.<\/li>\n<\/ul>\n<h3>Scenario: train a navigation agent<\/h3>\n<p>State: location and local obstacle observations. Actions: move north/south/east/west. Reward: destination +10, collision −5, step cost −0.1. γ=.9 rewards reaching goal soon; ε-greedy ensures initial exploration. For a small grid, tabular Q-learning suffices. For raw camera observations, DQN can represent Q but needs replay and target network.<\/p>\n<h3>Another scenario: continuous robot arm<\/h3>\n<p>A Gaussian stochastic actor can output continuous actions, with critic estimating expected return. A policy-gradient/actor–critic method may be more natural than ordinary discrete-action DQN; justify state/action assumptions explicitly.<\/p>\n<h3>Full 10-mark structure<\/h3>\n<p>Define MDP (2), explain chosen algorithm (2), draw training loop or architecture (2), give Q/advantage formula or calculation (2), address exploration/stability and tradeoffs (2). Adapt to the actual mark allocation rather than reciting generic RL definitions.<\/p>\n<blockquote>\n<p><strong>Reminder:<\/strong> A reward function must reflect the real desired behaviour. Maximizing an imperfect proxy can cause unsafe or nonsensical action choices.<\/p>\n<\/blockquote>\n"}],"modules":[{"id":1,"name":"Neural Networks & Backpropagation","short":"Fundamentals & Backprop","deck":"From the single neuron to the full gradient."},{"id":2,"name":"Improving Deep Networks","short":"Optimisation & Training","deck":"Get a model to converge, generalise, and train reliably."},{"id":3,"name":"Convolutional Neural Networks","short":"Convolutional Networks","deck":"Spatial structure, filters, shapes, and celebrated architectures."},{"id":4,"name":"Recurrent & Sequence Networks","short":"Sequence Models","deck":"Understand sequences rather than isolated examples."},{"id":5,"name":"Long-Term Memory & Gated RNNs","short":"Gated Memory","deck":"Remember distant information without unstable gradients."},{"id":6,"name":"Advanced Architectures & Detection","short":"Advanced Networks","deck":"Reuse, generate, localise, and detect."},{"id":7,"name":"Deep Reinforcement Learning","short":"Deep Reinforcement Learning","deck":"Learn decisions from reward and experience."}],"questions":[{"m":1,"q":"What does the bias do in a neuron?","choices":["Counts training examples","Replaces the learning rate","Shifts the weighted-sum threshold","Fixes gradient explosion"],"answer":2,"why":"Bias is a trainable offset in z=w·x+b."},{"m":1,"q":"What is the preactivation of x=(2,3), w=(.4,−.1), b=.2?","choices":["0.5","0.7","−0.7","1.1"],"answer":1,"why":"Compute .8−.3+.2=.7."},{"m":1,"q":"Which hidden activation avoids a wholly linear deep stack?","choices":["Linear identity alone","Multiplication by one","ReLU","No activation"],"answer":2,"why":"Nonlinear activation adds expressive power."},{"m":1,"q":"What is ReLU(0)?","choices":["0","0.5","Undefined","1"],"answer":0,"why":"ReLU(z)=max(0,z), including zero."},{"m":1,"q":"What is σ(0)?","choices":["0","0.5","1","−1"],"answer":1,"why":"Equal exp terms give 1/(1+1)."},{"m":1,"q":"The range of tanh is:","choices":["[0,1]","(−1,1)","All real numbers","[0,∞)"],"answer":1,"why":"tanh saturates near ±1 and is centered at zero."},{"m":1,"q":"What do softmax outputs sum to?","choices":["The highest logit","1","0","Number of classes"],"answer":1,"why":"Softmax normalizes exponentials across classes."},{"m":1,"q":"What is the trainable count for Dense(3→4) with biases?","choices":["7","24","12","16"],"answer":3,"why":"Three input weights plus one bias per output neuron gives 4×4."},{"m":1,"q":"Which boolean problem is not solved by one linear threshold unit?","choices":["AND","XOR","OR","Binary identity"],"answer":1,"why":"XOR is not linearly separable."},{"m":1,"q":"For ½(ŷ−y)², derivative with respect to ŷ is:","choices":["y−ŷ","ŷ","2(ŷ−y)","ŷ−y"],"answer":3,"why":"The half cancels the 2 from differentiating the square."},{"m":1,"q":"For a sigmoid output, ∂ŷ/∂z equals:","choices":["1−ŷ","2ŷ","ŷ(1−ŷ)","e^ŷ"],"answer":2,"why":"This is the standard sigmoid derivative."},{"m":1,"q":"What algorithm computes all weight gradients efficiently?","choices":["Backpropagation","K-means","Grid search","Batch normalization"],"answer":0,"why":"Backprop applies chain rule from outputs toward inputs."},{"m":1,"q":"If a gradient is negative, SGD update θ←θ−ηg moves θ:","choices":["Upward","Downward","To zero","To η"],"answer":0,"why":"Subtracting a negative increases θ for η>0."},{"m":1,"q":"If train accuracy is 99% but validation is 65%, first suspect:","choices":["Underfitting only","No model capacity","Perfect convergence","Overfitting"],"answer":3,"why":"Large generalization gap indicates poor transfer to unseen samples."},{"m":1,"q":"In 2026 CAT1 Q1, which parameters were requested to update?","choices":["Input samples","Every hidden weight only","Output weights and output bias only","Learning rate only"],"answer":2,"why":"The task explicitly restricts updating to the output layer."},{"m":2,"q":"A 10,000-example dataset trained with mini-batches of 100 has how many updates per epoch?","choices":["1,000","1","100","10,000"],"answer":2,"why":"10,000/100=100 batches."},{"m":2,"q":"If batch size is 1, which GD variant is it?","choices":["Full-batch GD","Adam always","SGD","Grid search"],"answer":2,"why":"One sample per update is stochastic GD."},{"m":2,"q":"EWA with β=.9 puts what fraction on current gradient?","choices":["0.1","0.9","1.0","0.01"],"answer":0,"why":"v=.9 old + .1 current."},{"m":2,"q":"Momentum primarily smooths which gradient property?","choices":["Signed direction across updates","The number of classes","Image size","The training labels"],"answer":0,"why":"Momentum accumulates history of signed gradients."},{"m":2,"q":"RMSProp accumulates a moving average of:","choices":["Squared gradients","Weight signs only","Raw labels","Validation accuracy"],"answer":0,"why":"Squaring creates nonnegative magnitude estimates."},{"m":2,"q":"Why is ε included in RMSProp/Adam?","choices":["Increase epoch count","Replace bias correction","Avoid division by zero and stabilize","Select hidden units"],"answer":2,"why":"The adaptive denominator must not be zero."},{"m":2,"q":"Adam combines:","choices":["First-moment momentum and second-moment adaptation","Dropout and pooling","Softmax and sigmoid","CNN and RNN"],"answer":0,"why":"Adam tracks mean gradients m and squared gradients v."},{"m":2,"q":"What does Adam bias correction divide m_t by?","choices":["1−β₁^t","β₂^t","1+β₁","Gradient norm"],"answer":0,"why":"Initial zero moment biases estimates toward zero."},{"m":2,"q":"Which item is a hyperparameter, not normally a trained weight?","choices":["Dense-layer kernel coefficient","RNN recurrent weight","Learning rate","Convolution bias"],"answer":2,"why":"Learning rate is chosen by the training setup."},{"m":2,"q":"BatchNorm has which learned per-feature pair?","choices":["Scale γ and shift β","Stride and padding","Target and prediction","Accuracy and recall"],"answer":0,"why":"Affine scale/shift follow standardization."},{"m":2,"q":"At inference, ordinary BatchNorm typically uses:","choices":["Running statistics","No normalization","A new one-example batch estimate","Random dropout mask"],"answer":0,"why":"Running mean and variance approximate training-time distributions."},{"m":2,"q":"Softmax of logits (0,0) is:","choices":["(0,1)","(0.5,0.5)","(1,1)","(0,0)"],"answer":1,"why":"Equal exponentials normalize to equal probabilities."},{"m":2,"q":"Which method should be applied to training images but not used to inflate test accuracy?","choices":["Model evaluation","Data augmentation","Measuring held-out accuracy","Confusion matrix"],"answer":1,"why":"Training variation must not contaminate test data."},{"m":2,"q":"Which penalty encourages exactly sparse weights more strongly in many contexts?","choices":["L2 always","Early stopping by itself","L1","MSE alone"],"answer":2,"why":"Absolute penalty is associated with sparse solutions."},{"m":2,"q":"When train/validation losses are close and decreasing, should we automatically increase dropout?","choices":["Remove all hidden layers","Always set dropout to 1","No, not without overfitting evidence","Always yes"],"answer":2,"why":"The 2026 faculty key correctly notes no clear overfit in that scenario."},{"m":3,"q":"Why are CNN filters parameter-efficient?","choices":["Pooling creates trainable filters","Every pixel has separate filter weights","Weights are shared across spatial locations","RGB images are binary"],"answer":2,"why":"Spatial weight sharing reduces parameters."},{"m":3,"q":"What is the depth of output from 32 filters?","choices":["Batch size","32","Kernel width","Input width"],"answer":1,"why":"One feature map per standard output filter."},{"m":3,"q":"Output of valid 5×5 stride-1 convolution on width 32 is:","choices":["28","32","36","5"],"answer":0,"why":"(32−5)/1+1=28."},{"m":3,"q":"Output of 3×3 stride-1 convolution on width 32 with pad 1 is:","choices":["30","32","34","16"],"answer":1,"why":"(32+2−3)+1=32."},{"m":3,"q":"What is conv trainable count for kernel 3×3, Cin=3, Cout=8, biases?","choices":["72","245","224","216"],"answer":2,"why":"(3×3×3+1)×8=224."},{"m":3,"q":"How many parameters in ordinary 2×2 max pool?","choices":["1","4","0","Input channels"],"answer":2,"why":"Standard max pooling learns no weights."},{"m":3,"q":"Max pool of [1,7,3,2] equals:","choices":["13","2","3.25","7"],"answer":3,"why":"Maximum of the four values is 7."},{"m":3,"q":"What is flattened size of 26×26×20?","choices":["1,352","26","20","13,520"],"answer":3,"why":"26×26=676, times20=13,520."},{"m":3,"q":"The source's six-layer 100×100 CNN has total trainable parameters:","choices":["13,520","141,640","139,820","135,210"],"answer":2,"why":"Sum the conv and FC counts on faculty slides 67–75."},{"m":3,"q":"AlexNet conv1 with 96 11×11 RGB filters including bias has:","choices":["34,944 parameters","96 parameters","363 parameters","55×55×96 trainable weights"],"answer":0,"why":"(11×11×3+1)×96=34,944."},{"m":3,"q":"What is the effective receptive field of three stacked 3×3 stride-1 conv layers?","choices":["3×3","9×9","7×7","27×27"],"answer":2,"why":"Each additional 3×3 adds two pixels to receptive width."},{"m":3,"q":"Inception branches are combined by:","choices":["Channel concatenation","Elementwise multiplication only","Sorting inputs","Subtracting features"],"answer":0,"why":"Parallel branch feature maps concatenate along channels."},{"m":3,"q":"Why use 1×1 convolutions before a 5×5 Inception branch?","choices":["Remove all nonlinearities","Enforce a single class","Reduce channels and computation","Make image grayscale always"],"answer":2,"why":"1×1 bottlenecks mix and reduce channel depth."},{"m":3,"q":"ResNet residual block computes:","choices":["F(x)×x only","F(x)+x","Only softmax(x)","F(x)−x always"],"answer":1,"why":"Identity shortcut adds x to learned residual mapping."},{"m":3,"q":"Which distinction is correct?","choices":["Both always concatenate","ResNet requires no equal dimensions","VGG only uses 11×11 filters","Inception concatenates branches; ResNet adds shortcut"],"answer":3,"why":"Output combination in these architectures differs."},{"m":4,"q":"Which information travels across time in a simple RNN?","choices":["Different fixed weights for every time step","Kernel size","Hidden state","Class count only"],"answer":2,"why":"h_t depends on h_(t−1)."},{"m":4,"q":"Do time steps in an unrolled RNN have independent trainable W_h?","choices":["Only for classification","Only in sigmoid RNNs","No, weights are shared","Yes, one full W_h per time step"],"answer":2,"why":"Temporal reuse is the defining feature of recurrent cells."},{"m":4,"q":"A sequence→single sentiment label is:","choices":["One-to-one only","Many-to-one","Many-to-many aligned","One-to-many"],"answer":1,"why":"Multiple input tokens yield one label."},{"m":4,"q":"Word-by-word POS tagging is typically:","choices":["Many-to-many aligned","One-to-many only","Many-to-one only","Unsupervised regression"],"answer":0,"why":"Each input token receives a tag."},{"m":4,"q":"Vanilla RNN with d=4 h=3 has how many recurrent-cell parameters, including bias?","choices":["3","12","72","24"],"answer":3,"why":"h(d+h+1)=3(4+3+1)=24."},{"m":4,"q":"BPTT stands for:","choices":["Backpropagation Through Time","Backward Pooling Through Tokens","Binary Padding Tensor Transform","Batch Probability Tuning Technique"],"answer":0,"why":"Unroll recurrence and backpropagate over time."},{"m":4,"q":"Why can recurrent gradients vanish?","choices":["Dropout rate is one","Products of small Jacobians decay","Softmax always outputs zero","Images have three channels"],"answer":1,"why":"Repeated factors below one shrink exponentially."},{"m":4,"q":"Which architecture uses both left and right token context?","choices":["Pure dense logistic regression","Bidirectional RNN","Q table","Causal forward-only RNN"],"answer":1,"why":"Forward and backward state streams capture both sides."},{"m":4,"q":"Can a BiRNN depend on future input during online causal prediction?","choices":["It requires no input","It generally needs future input, limiting causal use","It never depends on future","Every RNN is causal and bidirectional"],"answer":1,"why":"Backward recurrence processes later tokens."},{"m":4,"q":"What is teacher forcing?","choices":["Remove all labels","Feed ground-truth previous output to decoder during training","Freeze only convolution layers","Set each RNN weight to one"],"answer":1,"why":"It trains autoregressive decoders with known earlier tokens."},{"m":4,"q":"What is a classic seq2seq bottleneck?","choices":["Too many output classes always","All tokens are identical","Fixed-size context vector for long source sequences","Max-pooling must be 2×2"],"answer":2,"why":"Attention can access multiple encoder states instead."},{"m":4,"q":"An autoencoder's basic target is:","choices":["Maximize RL reward","Reconstruct its input","Predict a distinct translation target","Classify each bounding box"],"answer":1,"why":"Encoder maps to latent, decoder reconstructs input."},{"m":4,"q":"BERT's MLM means:","choices":["Model learning momentum","Maximum linear matching","Masked language modeling","Multiclass layer mixing"],"answer":2,"why":"It predicts designated masked tokens from context."},{"m":4,"q":"Why is BERT not a vanilla RNN?","choices":["It only handles pixels","It uses Transformer encoder self-attention","It has no input words","It trains with Q tables"],"answer":1,"why":"Bidirectional context arises via attention, not recurrence."},{"m":4,"q":"Scaled dot-product attention uses factor:","choices":["1/d_model²","1/√d_k","No scaling ever","1/sequence length always"],"answer":1,"why":"Scaling reduces sensitivity of large dot-product variance."},{"m":5,"q":"What extra persistent state does LSTM have relative to GRU?","choices":["Filter kernel","Bounding box","Cell state c_t","Extra Q table"],"answer":2,"why":"LSTM maintains c_t and h_t."},{"m":5,"q":"Which gate controls retained old cell memory?","choices":["Softmax","Output gate alone","Forget gate","Reset gate of GRU"],"answer":2,"why":"f_t is multiplied with c_(t−1)."},{"m":5,"q":"Which activation is used for LSTM gates?","choices":["Softmax over time","ReLU for all gates","Linear identity always","Sigmoid"],"answer":3,"why":"Gate outputs must lie in (0,1) for soft control."},{"m":5,"q":"Which activation is often used for LSTM candidate state?","choices":["Softmax","Tanh","Linear batch norm","Binary step only"],"answer":1,"why":"Candidate content lies roughly between −1 and 1."},{"m":5,"q":"LSTM new cell from f=.6 c_prev=.8 i=.7 g=.5 is:","choices":["1.31","0.83","0.48","0.35"],"answer":1,"why":".6×.8+.7×.5=.48+.35=.83."},{"m":5,"q":"If c=.83 and output gate=.9, h is approximately:","choices":["0.83","1.73","0.9","0.6124"],"answer":3,"why":"h=o*tanh(c)=.9*tanh(.83)."},{"m":5,"q":"Which gates are named in a GRU?","choices":["Forget input output","Policy and critic","Gate and stride","Update and reset"],"answer":3,"why":"GRU usually has two named gates z and r."},{"m":5,"q":"With GRU convention h=z old +(1−z) candidate, z=.75 old=.6 candidate=.1, h equals:","choices":["0.7","0.475","0.15","0.825"],"answer":1,"why":".75×.6+.25×.1=.475."},{"m":5,"q":"Does GRU have an explicit separate LSTM-style cell state c?","choices":["Only for images","Yes, four c states","No","Yes, always two c states"],"answer":2,"why":"GRU commonly uses a single gated hidden state."},{"m":5,"q":"Why can ESNs train more efficiently?","choices":["They are convolutional detectors","They optimize all 100 layers with BPTT","Reservoir recurrent weights are typically fixed","They remove the input data"],"answer":2,"why":"Standard ESN trains mainly a readout."},{"m":5,"q":"Which technique directly addresses exploding rather than vanishing gradients?","choices":["Raising weight magnitude without limit","More sigmoid saturation","Replacing loss by accuracy","Gradient clipping"],"answer":3,"why":"Clipping caps overly large gradient norm."},{"m":5,"q":"Gradient norm of (6,8) is:","choices":["100","10","14","7"],"answer":1,"why":"Euclidean norm is sqrt(36+64)=10."},{"m":5,"q":"Clip (6,8) to norm 5 gives:","choices":["(6,8)","(3,4)","(5,5)","(2.5,2.5)"],"answer":1,"why":"Multiply original vector by 5/10."},{"m":5,"q":"Which path can help longer gradient transmission in LSTM?","choices":["Additive gated cell-state path","Softmax over channel count only","Permanent hard threshold everywhere","Larger input image"],"answer":0,"why":"Cell update retains a direct additive memory route."},{"m":5,"q":"What does explicit memory architecture add?","choices":["Separately addressable storage/retrieval","No extra representation","Only a larger SGD batch","A new color channel"],"answer":0,"why":"It reduces reliance on compressing all history into a recurrent state."},{"m":6,"q":"Which transfer-learning approach freezes backbone weights?","choices":["Feature extraction","Policy gradient","GAN discriminator pretraining","Full random restart"],"answer":0,"why":"A pretrained backbone acts as a fixed feature extractor."},{"m":6,"q":"Why fine-tune a pretrained backbone with a small learning rate?","choices":["It removes need for labels","It ensures zero loss","It converts labels to boxes","Avoid destroying useful learned representations quickly"],"answer":3,"why":"Cautious updates retain transferable features."},{"m":6,"q":"What maps random noise to synthetic samples in a GAN?","choices":["Generator","Critic only","ROI pooling layer","Discriminator"],"answer":0,"why":"G(z) produces fake data."},{"m":6,"q":"What does the original GAN discriminator predict?","choices":["Real versus generated likelihood","Token attention weights","Bounding box center only","Q values"],"answer":0,"why":"D distinguishes real training examples from generator outputs."},{"m":6,"q":"If D(real)=.9 and D(fake)=.2, di
