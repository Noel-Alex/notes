</style><link rel="stylesheet" href="../../../assets/easy-mode.css?v=20261122-guided5"><link rel="stylesheet" href="visual-studio.css?v=20261123-visual6"><link rel="stylesheet" href="faculty-priority.css?v=20261123-professor3"></head><body><div id="app"><main style="max-width:800px;margin:6vh auto;padding:20px;font-family:system-ui"><h1>Deep Learning · Complete FAT textbook</h1><p>Loading the seven-module teaching edition…</p></main></div><noscript>JavaScript is required for the interactive reader.</noscript><script id="course-data" type="application/json">{"lessons":[{"m":1,"title":"What a neural network actually computes","deck":"Start with the one computation that every network repeats.","source":"N1 pp. 17–35; DL pp. 8–31","priority":"core","demo":"neuron","labels":["fundamentals","forward pass"],"id":0,"order":0,"html":"<h3>The idea: a learnable function, not a mysterious brain<\/h3>\n<p>A neural network maps an input vector <strong>x<\/strong> to a prediction <strong>ŷ<\/strong> through many small weighted computations. Biological neurons are the inspiration, but an artificial neuron is a mathematical operation: weighted sum → bias → non-linear activation. Training means changing the weights and biases to reduce a stated loss.<\/p>\n<p>For one neuron with inputs <code>x₁,…,xₙ<\/code>, weights <code>w₁,…,wₙ<\/code>, and bias <code>b<\/code>:<\/p>\n<p><code>z = w₁x₁ + w₂x₂ + … + wₙxₙ + b<\/code>   →   <code>a = φ(z)<\/code><\/p>\n<p>The <strong>weights<\/strong> control feature influence. A <strong>bias<\/strong> shifts the decision boundary. The <strong>activation<\/strong> decides how the response changes with z. Without nonlinear activations, any stack of fully connected layers collapses to one affine transformation.<\/p>\n<h3>Work a forward pass<\/h3>\n<p>Given <code>x=(2,3)<\/code>, <code>w=(0.4,−0.1)<\/code>, <code>b=0.2<\/code>:<\/p>\n<ol>\n<li>Weighted sum: <code>z = 2(0.4)+3(−0.1)+0.2 = 0.7<\/code>.<\/li>\n<li>With ReLU: <code>a=max(0,0.7)=0.7<\/code>.<\/li>\n<li>With sigmoid: <code>a=1/(1+e^(−0.7))≈0.6682<\/code>.<\/li>\n<\/ol>\n<p>Do not conflate the <strong>pre-activation z<\/strong> with the <strong>activated output a<\/strong>; backpropagation differentiates through both.<\/p>\n<h3>Vocabulary that examiners expect<\/h3>\n<table>\n<thead>\n<tr>\n  <th>Term<\/th>\n  <th>Meaning<\/th>\n  <th>Where it appears<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Input feature<\/td>\n  <td>Observed value supplied to model<\/td>\n  <td>x₁, x₂<\/td>\n<\/tr>\n<tr>\n  <td>Weight<\/td>\n  <td>Trainable feature coefficient<\/td>\n  <td>wᵢ<\/td>\n<\/tr>\n<tr>\n  <td>Bias<\/td>\n  <td>Trainable offset<\/td>\n  <td>b<\/td>\n<\/tr>\n<tr>\n  <td>Layer<\/td>\n  <td>Group of neurons at one stage<\/td>\n  <td>Input, hidden, output<\/td>\n<\/tr>\n<tr>\n  <td>Parameter<\/td>\n  <td>Value learned during training<\/td>\n  <td>w,b<\/td>\n<\/tr>\n<tr>\n  <td>Hyperparameter<\/td>\n  <td>Choice set before or around training<\/td>\n  <td>Learning rate, batch size<\/td>\n<\/tr>\n<tr>\n  <td>Epoch<\/td>\n  <td>One complete pass through training examples<\/td>\n  <td>10,000 samples per epoch<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>Exam habit:<\/strong> Draw the network, label each connection, write z first, activate second. A naked final probability normally does not earn all working marks.<\/p>\n<\/blockquote>\n"},{"m":1,"title":"The McCulloch–Pitts neuron and logic gates","deck":"Implement AND, OR and NOT with a threshold.","source":"N1 pp. 36–45","priority":"standard","demo":null,"labels":["MP neuron","gates"],"id":1,"order":1,"html":"<h3>Why this historical neuron matters<\/h3>\n<p>The McCulloch–Pitts (MP) model adds weighted binary inputs and passes a threshold: <code>y=1<\/code> when <code>Σwᵢxᵢ ≥ θ<\/code>, otherwise <code>y=0<\/code>. It is a useful way to see how logical decisions emerge from weights, <strong>but it is not the differentiable neuron used in ordinary gradient backpropagation<\/strong>.<\/p>\n<p>For <code>x₁,x₂ ∈ {0,1}<\/code>:<\/p>\n<table>\n<thead>\n<tr>\n  <th>Gate<\/th>\n  <th>Weights<\/th>\n  <th>Threshold<\/th>\n  <th>Reason<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>AND<\/td>\n  <td>(1,1)<\/td>\n  <td>2<\/td>\n  <td>Only 1+1 reaches 2<\/td>\n<\/tr>\n<tr>\n  <td>OR<\/td>\n  <td>(1,1)<\/td>\n  <td>1<\/td>\n  <td>Either positive input suffices<\/td>\n<\/tr>\n<tr>\n  <td>NOT<\/td>\n  <td>−1<\/td>\n  <td>0, with strictly-positive firing or shifted threshold<\/td>\n  <td>Inverts the one input under an appropriate threshold convention<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>AND gate, every row<\/h3>\n<p><code>z=x₁+x₂<\/code>, threshold 2 gives <code>(0,0)→0<\/code>, <code>(0,1)→0<\/code>, <code>(1,0)→0<\/code>, <code>(1,1)→1<\/code>. For OR, threshold 1 changes the two mixed rows to 1.<\/p>\n<h3>Important boundary<\/h3>\n<p>XOR is <strong>not linearly separable<\/strong>. A single threshold unit cannot implement XOR in 2D; an additional layer of hidden units can construct a solution. This is the motivation for multilayer nonlinear networks.<\/p>\n<blockquote>\n<p><strong>Trap:<\/strong> Always state whether the neuron fires at <code>≥θ<\/code> or <code>&gt;θ<\/code>. An incorrect boundary convention reverses examples exactly at the threshold.<\/p>\n<\/blockquote>\n"},{"m":1,"title":"Activation functions — every graph, derivative and use","deck":"Choose the right nonlinearity and know what can go wrong.","source":"N1 pp. 44–68; CAT1 answer key Q2 pp. 2–3","priority":"high","demo":"softmax","labels":["activation","numerical"],"id":2,"order":2,"html":"<h3>Why activations are indispensable<\/h3>\n<p>A nonlinearity allows a stack of layers to express curved boundaries and complex input-output maps. A hidden-layer activation is chosen for trainability; an output activation must match the prediction task.<\/p>\n<table>\n<thead>\n<tr>\n  <th>Activation<\/th>\n  <th>Definition<\/th>\n  <th>Range<\/th>\n  <th>Derivative / main caveat<\/th>\n  <th>Typical place<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Linear<\/td>\n  <td><code>f(z)=z<\/code><\/td>\n  <td>ℝ<\/td>\n  <td>derivative 1; no nonlinear capacity<\/td>\n  <td>Regression output<\/td>\n<\/tr>\n<tr>\n  <td>Binary step<\/td>\n  <td>1 when <code>z≥0<\/code>, else 0<\/td>\n  <td>{0,1}<\/td>\n  <td>Not useful for ordinary gradient backprop<\/td>\n  <td>MP gates<\/td>\n<\/tr>\n<tr>\n  <td>Sigmoid<\/td>\n  <td><code>σ(z)=1/(1+e^(−z))<\/code><\/td>\n  <td>(0,1)<\/td>\n  <td><code>σ(1−σ)<\/code>; saturates<\/td>\n  <td>Binary output / gates<\/td>\n<\/tr>\n<tr>\n  <td>Tanh<\/td>\n  <td><code>(e^z−e^(−z))/(e^z+e^(−z))<\/code><\/td>\n  <td>(−1,1)<\/td>\n  <td><code>1−tanh²(z)<\/code>; saturates<\/td>\n  <td>RNN hidden states<\/td>\n<\/tr>\n<tr>\n  <td>ReLU<\/td>\n  <td><code>max(0,z)<\/code><\/td>\n  <td>[0,∞)<\/td>\n  <td>gradient 0 for z&lt;0; dying units<\/td>\n  <td>CNN/MLP hidden<\/td>\n<\/tr>\n<tr>\n  <td>Leaky ReLU<\/td>\n  <td><code>max(αz,z)<\/code><\/td>\n  <td>ℝ<\/td>\n  <td>small negative-side gradient<\/td>\n  <td>Hidden layers<\/td>\n<\/tr>\n<tr>\n  <td>Softmax<\/td>\n  <td><code>e^zᵢ/Σⱼe^zⱼ<\/code><\/td>\n  <td>each (0,1), sum 1<\/td>\n  <td>Coupled multiclass probabilities<\/td>\n  <td>Mutually exclusive classes<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Choose output by task<\/h3>\n<p>Binary disease/no-disease → one sigmoid output. Three mutually exclusive classes → three logits and a softmax. Predicting a real-valued price → a linear output is often appropriate. <strong>Do not<\/strong> apply independent sigmoid outputs when probabilities are required to sum to 1 across a mutually exclusive set.<\/p>\n<h3>Quick numerical<\/h3>\n<p><code>z=(2,1,0)<\/code>. Stable softmax subtracts the largest logit: <code>exp(0)=1<\/code>, <code>exp(−1)=0.3679<\/code>, <code>exp(−2)=0.1353<\/code>, sum <code>1.5032<\/code>. The probabilities are approximately <code>(0.6652, 0.2447, 0.0900)<\/code>.<\/p>\n<blockquote>\n<p><strong>Source correction:<\/strong> The CAT1 key describes ReLU range as <code>(0,∞)<\/code>, but <code>ReLU(0)=0<\/code>, so mathematically the actual range is <strong>[0,∞)<\/strong>. Study the correct mathematical range.<\/p>\n<\/blockquote>\n"},{"m":1,"title":"Perceptron, shallow MLP and deep network","deck":"Know which model class solves which kind of problem.","source":"N1 pp. 67–90; DL pp. 30–53","priority":"core","demo":null,"labels":["MLP","parameters"],"id":3,"order":3,"html":"<h3>A perceptron learns a linear boundary<\/h3>\n<p>For a perceptron with a step activation, <code>ŷ=step(w·x+b)<\/code> is a binary decision. A single linear separator can learn linearly separable tasks, but cannot solve XOR by itself. In contrast, a multilayer perceptron (MLP) has one or more nonlinear hidden layers.<\/p>\n<ul>\n<li><strong>Input layer:<\/strong> carries x but usually performs no learned transformation itself.<\/li>\n<li><strong>Hidden layers:<\/strong> compute <code>a⁽ˡ⁾=φ(W⁽ˡ⁾a⁽ˡ⁻¹⁾+b⁽ˡ⁾)<\/code>.<\/li>\n<li><strong>Output layer:<\/strong> produces a value or class distribution with an appropriate final activation.<\/li>\n<\/ul>\n<h3>Width and depth<\/h3>\n<p>Width = neurons per layer; depth = number of trainable transformations. A shallow network has relatively few transformations; a deep one composes progressively abstract features. “Deeper” does <strong>not<\/strong> automatically mean better: optimization, overfitting, memory and data scarcity can dominate.<\/p>\n<h3>Parameter-count numerical<\/h3>\n<p>For a dense network with <code>3 inputs → 4 hidden neurons → 2 outputs<\/code>, <strong>including biases<\/strong>:<\/p>\n<p><code>first layer = (3+1)×4 = 16<\/code>;\n<code>second layer = (4+1)×2 = 10<\/code>;\n<code>total = 26 trainable parameters<\/code>.<\/p>\n<p>General dense formula: <code>(n_in+1) × n_out<\/code>. The extra 1 is for one bias <strong>per output neuron<\/strong>. Counting individual hidden-neuron outputs as parameters is wrong.<\/p>\n<h3>Classification versus clustering<\/h3>\n<p>Classification learns labels from labeled training data; clustering groups similar objects without target labels. Neural architectures can support both, but a softmax classifier is <strong>supervised<\/strong>, not a clustering algorithm.<\/p>\n"},{"m":1,"title":"Loss functions and the exact training objective","deck":"Separate prediction error from the procedure that reduces it.","source":"N1 pp. 27–31, 87–98; DL pp. 15–23","priority":"high","demo":null,"labels":["loss","gradient"],"id":4,"order":4,"html":"<h3>The loss measures “how wrong?”<\/h3>\n<p>For a target y and prediction ŷ, the loss is one example's penalty. The <em>cost/objective<\/em> is generally the average or aggregate of these losses (possibly plus regularisation).<\/p>\n<p><strong>Squared error:<\/strong> <code>L=½(ŷ−y)²<\/code> gives <code>∂L/∂ŷ=ŷ−y<\/code>. The <code>½<\/code> is a convenience for differentiation. If the objective is <code>L=(ŷ−y)²<\/code>, the derivative becomes <code>2(ŷ−y)<\/code>. The current 2026 CAT1 key uses the half-squared-error convention despite calling it MSE—<strong>identify which convention your question uses<\/strong>.<\/p>\n<p><strong>Binary cross-entropy:<\/strong> <code>L=−[y ln p + (1−y)ln(1−p)]<\/code> for a Bernoulli target and predicted probability p. With sigmoid+cross-entropy, <code>∂L/∂z=p−y<\/code> for one example.<\/p>\n<p><strong>Multiclass cross-entropy:<\/strong> <code>L=−Σₖ yₖ ln pₖ<\/code>; with one-hot y and softmax p, the logit gradient is <code>p−y<\/code>.<\/p>\n<h3>Numerical: compare objectives<\/h3>\n<p>If <code>y=1<\/code> and <code>ŷ=0.8<\/code>: half-squared error <code>½(−0.2)²=0.0200<\/code>; binary CE <code>−ln(0.8)≈0.2231<\/code>. Different objectives are on different scales. A loss value alone cannot compare unrelated loss definitions.<\/p>\n<h3>Training loop<\/h3>\n<ol>\n<li>Forward pass → predictions.<\/li>\n<li>Evaluate loss.<\/li>\n<li>Backpropagate the gradient from output toward input.<\/li>\n<li>Update <code>θ←θ−η ∇θL<\/code>.<\/li>\n<li>Repeat across mini-batches/epochs and evaluate on held-out data.<\/li>\n<\/ol>\n<blockquote>\n<p><strong>Exam trap:<\/strong> Accuracy is a <em>metric<\/em>, not automatically the differentiable loss being minimized. The final layer and loss must be compatible.<\/p>\n<\/blockquote>\n"},{"m":1,"title":"Forward propagation through two layers","deck":"A reproducible numerical with no skipped arithmetic.","source":"N1 pp. 92–105; CAT1 key Q1 pp. 1–2","priority":"high","demo":"neuron","labels":["2026 CAT","forward pass"],"id":5,"order":5,"html":"<h3>Real 2026 faculty CAT question pattern<\/h3>\n<p>The uploaded <strong>13 August 2026 CAT1 E1 answer key<\/strong> specifies an MLP with two input neurons, two hidden sigmoid neurons, one sigmoid output, SGD learning rate <code>η=0.1<\/code>, and <strong>sample 8<\/strong> <code>x₁=0.7<\/code>, <code>x₂=0.9<\/code>, <code>y=1<\/code>.<\/p>\n<p>Parameters at the end of iteration 7: hidden 1 weights <code>(0.40,0.50)<\/code>, bias <code>0.10<\/code>; hidden 2 weights <code>(0.30,0.60)<\/code>, bias <code>0.20<\/code>; output weights <code>(0.70,0.80)<\/code>, bias <code>0.10<\/code>.<\/p>\n<h3>Forward pass, fully worked<\/h3>\n<ol>\n<li><code>zₕ₁ = 0.7(0.40)+0.9(0.50)+0.10 = 0.83<\/code>.<\/li>\n<li><code>h₁ = σ(0.83) = 0.69635<\/code>.<\/li>\n<li><code>zₕ₂ = 0.7(0.30)+0.9(0.60)+0.20 = 0.95<\/code>.<\/li>\n<li><code>h₂ = σ(0.95) = 0.72112<\/code>.<\/li>\n<li><code>zₒ = 0.70(0.69635)+0.80(0.72112)+0.10 = 1.16434<\/code>.<\/li>\n<li><code>ŷ = σ(1.16434) = 0.76212<\/code>.<\/li>\n<li>With half-squared loss: <code>L = ½(0.76212−1)² ≈ 0.02829<\/code>.<\/li>\n<\/ol>\n<h3>Read the computational graph<\/h3>\n<p>The hidden-layer output values <strong>h₁ and h₂<\/strong> become inputs to the output layer. Do not apply the input-layer weights again at the output. Sigmoid is applied to each hidden preactivation <strong>and<\/strong> the output preactivation.<\/p>\n<blockquote>\n<p><strong>Exam writing:<\/strong> A table of <code>z<\/code>, activation, target, and loss is excellent insurance against arithmetic mistakes. This exact question's second half is solved in the next lesson.<\/p>\n<\/blockquote>\n"},{"m":1,"title":"Backpropagation: output gradients and SGD update","deck":"Finish the faculty numerical with derivatives and updated weights.","source":"N1 pp. 91–113; CAT1 key Q1 pp. 1–2","priority":"critical","demo":"neuron","labels":["backprop","2026 CAT"],"id":6,"order":6,"html":"<h3>Chain rule behind backpropagation<\/h3>\n<p>If <code>L=½(ŷ−y)²<\/code> and <code>ŷ=σ(zₒ)<\/code>, then:<\/p>\n<p><code>δₒ = ∂L/∂zₒ = (ŷ−y) × ŷ(1−ŷ)<\/code>.<\/p>\n<p>At a hidden sigmoid neuron j, <code>δⱼ = hⱼ(1−hⱼ) Σₖ wⱼₖ δₖ<\/code>. Gradient of a weight = incoming activation × destination delta. A gradient tells us how a <em>small change<\/em> in that parameter changes the loss.<\/p>\n<h3>Exact output-layer work for the 2026 CAT1<\/h3>\n<p>From the previous lesson: <code>h₁=0.69635<\/code>, <code>h₂=0.72112<\/code>, <code>ŷ=0.76212<\/code>, <code>y=1<\/code>, <code>η=0.1<\/code>.<\/p>\n<ol>\n<li><code>δₒ = (0.76212−1)×0.76212×(1−0.76212) ≈ −0.04313<\/code>.<\/li>\n<li><code>∂L/∂v₁ = δₒ h₁ = −0.04313×0.69635 ≈ −0.03003<\/code>.<\/li>\n<li><code>∂L/∂v₂ = δₒ h₂ = −0.04313×0.72112 ≈ −0.03110<\/code>.<\/li>\n<li><code>∂L/∂bₒ = δₒ ≈ −0.04313<\/code>.<\/li>\n<li><code>v₁' = 0.70−0.1(−0.03003) ≈ 0.70300<\/code>.<\/li>\n<li><code>v₂' = 0.80−0.1(−0.03110) ≈ 0.80311<\/code>.<\/li>\n<li><code>bₒ' = 0.10−0.1(−0.04313) ≈ 0.10431<\/code>.<\/li>\n<\/ol>\n<p>This matches the uploaded faculty answer key. <strong>Only<\/strong> the output layer is updated because the question specifically requests it. Updating hidden-layer weights here would violate the given instruction.<\/p>\n<h3>For a complete hidden-layer backprop question<\/h3>\n<p>After the output δ, compute one δ for each hidden neuron, then update every hidden incoming weight as <code>wᵢⱼ' = wᵢⱼ − η(δⱼ × xᵢ)<\/code> and each bias as <code>bⱼ' = bⱼ−η δⱼ<\/code>. Do this <strong>after<\/strong> calculating deltas from the same old forward pass.<\/p>\n<blockquote>\n<p><strong>Big marking trick:<\/strong> Show the four derivatives and three updated output parameters; a correct final answer without gradients is incomplete for a 10-mark numerical.<\/p>\n<\/blockquote>\n"},{"m":1,"title":"Gradient descent from first principles","deck":"Explain why the subtraction moves parameters downhill.","source":"N1 pp. 113–134; N2 pp. 3–18","priority":"high","demo":null,"labels":["SGD","training"],"id":7,"order":7,"html":"<h3>The update is a local descent step<\/h3>\n<p>Let a differentiable cost be <code>J(θ)<\/code>. For one scalar parameter:<\/p>\n<p><code>θ_new = θ_old − η × dJ/dθ<\/code>.<\/p>\n<p>For gradient positive, θ decreases; for negative, θ increases. The learning rate <code>η<\/code> controls step size. Too large can overshoot or oscillate. Too small can make training painfully slow. Deep networks typically need nonconvex optimization; “gradient descent always finds the global minimum” is false.<\/p>\n<h3>Numerical: one weight<\/h3>\n<p><code>J(w)=(w−3)²<\/code>, <code>w=1<\/code>, <code>η=0.1<\/code>.\nDerivative <code>dJ/dw=2(w−3)=−4<\/code>. Update <code>w'=1−0.1(−4)=1.4<\/code>. Initial <code>J(1)=4<\/code>; updated <code>J(1.4)=2.56<\/code>—the objective decreased.<\/p>\n<h3>Vocabulary and common confusion<\/h3>\n<ul>\n<li><strong>Backpropagation<\/strong> efficiently computes gradients using the chain rule.<\/li>\n<li><strong>Gradient descent / SGD / Adam<\/strong> uses gradients to update parameters.<\/li>\n<li>An <strong>iteration<\/strong> means one parameter update; an <strong>epoch<\/strong> means one pass through the dataset.<\/li>\n<\/ul>\n<p>This distinction matters because an examiner can ask “which algorithm computes gradients and which performs optimization?”<\/p>\n<h3>What is not learned automatically?<\/h3>\n<p>The optimizer does not directly learn learning rate, batch size, number of epochs, dropout rate or architecture from a standard gradient update. Those are hyperparameters or model-design choices (unless explicitly made learnable by another method).<\/p>\n"},{"m":1,"title":"Underfitting, overfitting and generalisation","deck":"Diagnose from train-versus-validation behavior.","source":"N1 pp. 82–91; N2 pp. 97–115; CAT1 key Q4–Q5 pp. 3–4","priority":"high","demo":null,"labels":["generalisation","CAT1"],"id":8,"order":8,"html":"<h3>Two distinct failure patterns<\/h3>\n<p><strong>Underfitting<\/strong>: training error is high, validation error is also high; the model cannot describe the training signal. <strong>Overfitting<\/strong>: training error becomes very low but validation error remains much worse; the model generalises poorly.<\/p>\n<table>\n<thead>\n<tr>\n  <th>Observed pattern<\/th>\n  <th>Likely issue<\/th>\n  <th>Responses worth proposing<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>High train + high validation loss<\/td>\n  <td>High bias / insufficient fit<\/td>\n  <td>More capacity, train longer, improve features<\/td>\n<\/tr>\n<tr>\n  <td>Low train + much higher validation loss<\/td>\n  <td>High variance / overfit<\/td>\n  <td>Augmentation, appropriate regularisation, early stopping, more data<\/td>\n<\/tr>\n<tr>\n  <td>Both losses falling and close<\/td>\n  <td>Training not yet converged, no clear overfit<\/td>\n  <td>More epochs; inspect LR and batch<\/td>\n<\/tr>\n<tr>\n  <td>Wild oscillation between updates<\/td>\n  <td>Noisy / too-large steps<\/td>\n  <td>Lower LR, increase batch, momentum/adaptive optimizer<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>The August 2026 CAT1 hyperparameter scenario<\/h3>\n<p>The faculty key considers <strong>1 million examples<\/strong>, initial <code>LR=0.5<\/code>, <code>batch=1<\/code>, 50 epochs, highly fluctuating losses, both train and validation decreasing, and no substantial train–validation gap. Its expected direction is <strong>decrease LR; increase batch; increase epochs; do not increase dropout or L2 strength without evidence of overfit<\/strong>.<\/p>\n<h3>Explain rather than memorize<\/h3>\n<ul>\n<li>Batch size 1 is true SGD; gradients are noisy, but cheap per update.<\/li>\n<li>Higher batch size smooths the estimate, but adds memory pressure; “maximum batch size” is not automatically ideal.<\/li>\n<li>Increasing dropout and regularisation when you have <strong>no overfitting<\/strong> can make underfitting worse.<\/li>\n<\/ul>\n<blockquote>\n<p><strong>Exam style:<\/strong> When a scenario asks whether to tune five hyperparameters, give a table with <strong>change? direction? mechanism?<\/strong> A blanket “always reduce learning rate” is not sufficient.<\/p>\n<\/blockquote>\n"},{"m":1,"title":"Module 1 — the full-mark answer blueprint","deck":"Turn scattered theory into an organized 10-mark solution.","source":"N1 pp. 17–134; CAT1 key pp. 1–4","priority":"high","demo":null,"labels":["answer blueprint"],"id":9,"order":9,"html":"<h3>How to answer a “train this MLP” question<\/h3>\n<p><strong>Step 1 (diagram):<\/strong> Draw every input, hidden and output unit; label weights, bias and activation.<\/p>\n<p><strong>Step 2 (forward):<\/strong> For each hidden neuron <code>zⱼ=Σᵢwⱼᵢxᵢ+bⱼ<\/code>; compute <code>hⱼ=σ(zⱼ)<\/code>. Then <code>zₒ=Σⱼvⱼhⱼ+bₒ<\/code>, <code>ŷ=σ(zₒ)<\/code>.<\/p>\n<p><strong>Step 3 (loss):<\/strong> State whether the question uses <code>½(ŷ−y)²<\/code>, <code>(ŷ−y)²<\/code> or a batch-averaged objective.<\/p>\n<p><strong>Step 4 (chain rule):<\/strong> <code>δₒ=(ŷ−y)ŷ(1−ŷ)<\/code> under half-squared loss; obtain each required gradient.<\/p>\n<p><strong>Step 5 (update):<\/strong> Write new weights and biases with <code>θ_new=θ_old−ηgradient<\/code>, then present the final values in a box.<\/p>\n<h3>Compare conceptual questions<\/h3>\n<p>If asked <strong>MLP vs perceptron<\/strong>, contrast nonlinear hidden layers, XOR representability, and training. If asked <strong>classification vs clustering<\/strong>, contrast label availability, objectives, and evaluation. If asked <strong>activation functions<\/strong>, give formula, output range, derivative, applications, and limitations.<\/p>\n<h3>Self-test without the solution<\/h3>\n<p>For <code>x=(1,2)<\/code>, hidden sigmoid weights <code>(0.1,0.2)<\/code>, hidden bias <code>0<\/code>, output sigmoid weight <code>0.7<\/code>, output bias <code>0.1<\/code>, and <code>y=0<\/code>, first compute the hidden value, output value and δ before updating anything. <em>Checkpoint:<\/em> hidden activation <code>σ(0.5)≈0.62246<\/code>, output <code>σ(0.53572)≈0.63082<\/code>.<\/p>\n<blockquote>\n<p><strong>Final warning:<\/strong> The numerical examples use specific loss conventions. If the question uses a different loss scaling, the corresponding gradient scaling also changes. Define your convention before substituting.<\/p>\n<\/blockquote>\n"},{"m":2,"title":"Batch, stochastic and mini-batch gradient descent","deck":"How many samples per update—and how many updates per epoch?","source":"N2 pp. 5–20; CAT1 key Q3 p. 3","priority":"critical","demo":"optimizer","labels":["CAT1","batch","SGD"],"id":10,"order":0,"html":"<h3>Three ways to estimate the same objective gradient<\/h3>\n<p>Suppose you have <strong>N<\/strong> training examples and a batch of size <strong>B<\/strong>. A batch objective averages the losses over those B examples, backpropagates once, then updates parameters.<\/p>\n<table>\n<thead>\n<tr>\n  <th>Method<\/th>\n  <th style=\"text-align:right\">Gradient calculated from<\/th>\n  <th style=\"text-align:right\">Updates in one epoch<\/th>\n  <th>Strength<\/th>\n  <th>Weakness<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Full-batch GD<\/td>\n  <td style=\"text-align:right\">All N examples<\/td>\n  <td style=\"text-align:right\">1<\/td>\n  <td>Accurate, smooth gradient<\/td>\n  <td>Slow update; heavy memory<\/td>\n<\/tr>\n<tr>\n  <td>SGD<\/td>\n  <td style=\"text-align:right\">One example<\/td>\n  <td style=\"text-align:right\">N<\/td>\n  <td>Frequent, cheap updates<\/td>\n  <td>High gradient noise<\/td>\n<\/tr>\n<tr>\n  <td>Mini-batch GD<\/td>\n  <td style=\"text-align:right\">B examples<\/td>\n  <td style=\"text-align:right\"><code>ceil(N/B)<\/code><\/td>\n  <td>Efficient GPU compute and compromise<\/td>\n  <td>Batch-size tuning needed<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Exact 2026 CAT1 numerical<\/h3>\n<p><code>N=10,000<\/code> samples, mini-batch <code>B=100<\/code>. Full batch: <strong>10,000 used / 1 update<\/strong>. SGD: <strong>1 / 10,000<\/strong>. Mini-batch: <strong>100 / 100<\/strong>. If <code>B=1<\/code>, mini-batch becomes SGD. If <code>B=N<\/code>, it becomes full-batch GD.<\/p>\n<h3>Important nuances<\/h3>\n<p>Epoch count and iteration count differ: with <code>10,000<\/code> examples and <code>B=100<\/code>, ten epochs mean <code>10×100=1,000<\/code> updates. If N is not divisible by B and <code>drop_last=False<\/code>, the final mini-batch is smaller. With 10,003 examples, B=100, there are 101 updates when the final partial batch is kept.<\/p>\n<blockquote>\n<p><strong>Trap:<\/strong> Full-batch does <strong>not<\/strong> mean one gradient per training sample, and an epoch is not a single mini-batch update.<\/p>\n<\/blockquote>\n"},{"m":2,"title":"Exponential weighted averages (EWA)","deck":"What momentum actually remembers.","source":"N2 pp. 20–31","priority":"high","demo":"optimizer","labels":["EWA","momentum"],"id":11,"order":1,"html":"<h3>Why averaging gradients helps<\/h3>\n<p>A raw gradient can oscillate from one update to the next, especially with noisy mini-batches. The exponentially weighted average smooths a sequence while giving larger weights to recent observations:<\/p>\n<p><code>v_t = β v_(t−1) + (1−β)g_t<\/code>, where <code>0≤β&lt;1<\/code>.<\/p>\n<p>The weight on a gradient k steps old is <code>(1−β)βᵏ<\/code>; older observations fade geometrically. A useful effective-window heuristic is <code>1/(1−β)<\/code> samples (<code>β=.9<\/code> roughly 10, <code>.98<\/code> roughly 50).<\/p>\n<h3>Numerical, every step<\/h3>\n<p>Let <code>β=0.9<\/code>, <code>v₀=0<\/code>, gradients <code>(2,4,1)<\/code>:<\/p>\n<ol>\n<li><code>v₁=.9(0)+.1(2)=0.2<\/code>.<\/li>\n<li><code>v₂=.9(.2)+.1(4)=0.58<\/code>.<\/li>\n<li><code>v₃=.9(.58)+.1(1)=0.622<\/code>.<\/li>\n<\/ol>\n<p>Early estimates are biased toward zero because they start at <code>v₀=0<\/code>. An optional bias-corrected estimate is <code>v̂ₜ=vₜ/(1−βᵗ)<\/code>. Thus <code>v̂₁=0.2/0.1=2.0<\/code>.<\/p>\n<h3>Relate the method to gradient descent<\/h3>\n<p>EWA itself is <strong>not a replacement loss function<\/strong>. It is a smooth historical estimate used by optimizers, including Momentum and Adam. In a plain momentum-style update, the filtered gradient is used rather than only gₜ.<\/p>\n"},{"m":2,"title":"Momentum and Nesterov intuition","deck":"Why direction matters more than one jittery gradient.","source":"N2 pp. 30–48","priority":"core","demo":"optimizer","labels":["momentum"],"id":12,"order":2,"html":"<h3>Momentum as accumulated velocity<\/h3>\n<p>The lecturer’s style of momentum can be written:<\/p>\n<p><code>vₜ = βvₜ₋₁ + (1−β)gₜ<\/code>, then <code>θₜ = θₜ₋₁ − ηvₜ<\/code>.<\/p>\n<p>Another common convention absorbs <code>(1−β)<\/code> into the learning rate: <code>vₜ=βvₜ₋₁+gₜ<\/code>. They are not numerically identical if you keep all other hyperparameters fixed; <strong>follow the convention given on the question paper<\/strong>.<\/p>\n<h3>Example<\/h3>\n<p>Take gradients <code>g₁=0.9<\/code>, <code>g₂=−0.8<\/code>, with <code>β=0.9<\/code>, <code>v₀=0<\/code>. Then <code>v₁=0.09<\/code>; <code>v₂=.9(.09)+.1(−.8)=0.001<\/code>. The second update nearly cancels because direction flipped. Raw SGD would alternate strongly; momentum smooths the oscillation.<\/p>\n<h3>Nesterov acceleration in one idea<\/h3>\n<p>Ordinary momentum first uses the present gradient, then moves. Nesterov momentum evaluates a gradient at an anticipated <em>lookahead<\/em> parameter position. This anticipatory step may reduce overshooting. The detailed Nesterov derivation is a contextual extension; the supplied optimization lecture stresses ordinary momentum, RMSProp and Adam.<\/p>\n<blockquote>\n<p><strong>Exam answer:<\/strong> State the recurrence, explain why it damps oscillations across ravines, and distinguish learning rate η from momentum β. Neither a gradient history nor momentum guarantees avoiding every saddle point.<\/p>\n<\/blockquote>\n"},{"m":2,"title":"RMSProp and the second moment","deck":"Adaptive learning rates, one parameter at a time.","source":"N2 pp. 50–59","priority":"critical","demo":"optimizer","labels":["RMSProp","numerical"],"id":13,"order":3,"html":"<h3>Why RMSProp exists<\/h3>\n<p>Suppose one parameter frequently experiences large gradients while another has small gradients. A single fixed learning rate applies the same scalar η to both. RMSProp normalises each parameter's update by a moving average of <strong>squared<\/strong> gradients:<\/p>\n<p><code>sₜ=βsₜ₋₁+(1−β)gₜ²<\/code><\/p>\n<p><code>θₜ=θₜ₋₁−η gₜ / (√sₜ+ε)<\/code>.<\/p>\n<p>Here <code>ε&gt;0<\/code> avoids division by zero. Squaring gradients makes the running quantity nonnegative; a large recent squared gradient increases the denominator and reduces that parameter's effective step.<\/p>\n<h3>Example with numbers<\/h3>\n<p><code>η=0.1<\/code>, <code>β=0.9<\/code>, <code>s₀=0<\/code>, gradient <code>g₁=4<\/code>, <code>ε≈0<\/code>:<\/p>\n<ul>\n<li><code>s₁ = 0.1×4² = 1.6<\/code>.<\/li>\n<li><code>√s₁ ≈ 1.2649<\/code>.<\/li>\n<li><code>Δθ₁ = −0.1×4/1.2649 ≈ −0.3162<\/code>.<\/li>\n<\/ul>\n<p>With <code>g₂=2<\/code>, <code>s₂=.9(1.6)+.1(4)=1.84<\/code>, giving <code>Δθ₂≈−0.1474<\/code>. The cumulative squared gradient causes adaptivity.<\/p>\n<h3>RMSProp versus Momentum<\/h3>\n<p>Momentum smooths <strong>signed first-moment direction<\/strong>. RMSProp smooths <strong>squared magnitude<\/strong>. Adam combines both. Do not put the momentum variable in the RMSProp denominator unless the algorithm specifically calls for it.<\/p>\n"},{"m":2,"title":"Adam — first moment, second moment, bias correction","deck":"The optimizer most likely to be examined with equations.","source":"N2 pp. 58–67; D1 2024 FAT question topics","priority":"critical","demo":"optimizer","labels":["Adam","full numerical"],"id":14,"order":4,"html":"<h3>Adam's complete update<\/h3>\n<p>Adam maintains <strong>first moment<\/strong> m (direction) and <strong>second moment<\/strong> v (magnitude):<\/p>\n<p><code>mₜ = β₁ mₜ₋₁ + (1−β₁) gₜ<\/code><\/p>\n<p><code>vₜ = β₂ vₜ₋₁ + (1−β₂) gₜ²<\/code><\/p>\n<p><code>m̂ₜ = mₜ/(1−β₁ᵗ)<\/code>, <code>v̂ₜ = vₜ/(1−β₂ᵗ)<\/code><\/p>\n<p><code>θₜ = θₜ₋₁ − η m̂ₜ/(√v̂ₜ+ε)<\/code>.<\/p>\n<p>Typical defaults are β₁≈0.9, β₂≈0.999, ε≈10⁻⁸. They're useful defaults, not universal mathematical constants.<\/p>\n<h3>Full first-step numerical<\/h3>\n<p>Given <code>g₁=2<\/code>, <code>m₀=v₀=0<\/code>, <code>β₁=.9<\/code>, <code>β₂=.999<\/code>, <code>η=.1<\/code>:<\/p>\n<ol>\n<li><code>m₁ = .1×2 = .2<\/code>.<\/li>\n<li><code>v₁ = .001×(2²) = .004<\/code>.<\/li>\n<li><code>m̂₁=.2/(1−.9)=2<\/code>.<\/li>\n<li><code>v̂₁=.004/(1−.999)=4<\/code>.<\/li>\n<li><code>Δθ = −.1×2/(√4+ε) ≈ −.1<\/code>.<\/li>\n<\/ol>\n<p><strong>If you forget bias correction<\/strong>, the first update becomes drastically different. Both earlier VIT FAT materials and your optimization slides explicitly emphasize optimizer mathematics, so this is high-priority.<\/p>\n<h3>Compare optimizers<\/h3>\n<p>SGD: current gradient only. Momentum: smoothed directional gradient. RMSProp: adaptive denominator from squared gradients. Adam: momentum <strong>plus<\/strong> adaptive denominator with bias correction. AdaGrad accumulates <em>all past<\/em> squares; its learning rate can shrink too aggressively.<\/p>\n"},{"m":2,"title":"Hyperparameter tuning — diagnose, justify, choose","deck":"A decision framework for scenario-based 10-mark questions.","source":"N2 pp. 67–75; CAT1 key Q5 pp. 3–4","priority":"critical","demo":null,"labels":["hyperparameters","CAT1"],"id":15,"order":5,"html":"<h3>A hyperparameter is a design decision<\/h3>\n<p>Examples: learning rate η, epochs, number of layers, hidden units, batch size, dropout probability, weight decay, optimizer type. Parameters, by contrast, are learned weights and biases.<\/p>\n<table>\n<thead>\n<tr>\n  <th>Symptom<\/th>\n  <th>First investigation<\/th>\n  <th>Possible adjustment<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Training diverges<\/td>\n  <td>Update size / exploding gradients<\/td>\n  <td>Reduce learning rate; clipping if needed<\/td>\n<\/tr>\n<tr>\n  <td>Loss oscillates sharply<\/td>\n  <td>LR and noisy batch gradients<\/td>\n  <td>Reduce LR or increase batch<\/td>\n<\/tr>\n<tr>\n  <td>Both train/validation falling, not converged<\/td>\n  <td>Training duration<\/td>\n  <td>Train longer, monitor early stopping<\/td>\n<\/tr>\n<tr>\n  <td>Train excellent, validation poor<\/td>\n  <td>Generalisation gap<\/td>\n  <td>Augmentation, dropout, L2, early stopping<\/td>\n<\/tr>\n<tr>\n  <td>Neither train nor validation good<\/td>\n  <td>Capacity / bias<\/td>\n  <td>Increase model capacity or training effectiveness<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Faculty source case<\/h3>\n<p>From CAT1 E1 Q5: 1 million samples; <code>LR=.5<\/code>, batch 1, 50 epochs, fluctuating yet downward losses; train and validation close. The faculty answer says reduce learning rate, increase batch size, increase epochs; <strong>no evidence for increasing dropout or L2<\/strong>. Every choice must be tied to the facts provided.<\/p>\n<h3>A reproducible tuning procedure<\/h3>\n<ol>\n<li>Choose an appropriate metric and train/validation/test split.<\/li>\n<li>Tune on the <strong>validation<\/strong> set (never repeatedly on test).<\/li>\n<li>Coarsely search log-scale LR (e.g. <code>10⁻⁴…10⁻¹<\/code>); then refine.<\/li>\n<li>Monitor training/validation learning curves.<\/li>\n<li>Hold random seeds and data split constant for fair model comparisons.<\/li>\n<\/ol>\n<blockquote>\n<p><strong>Trap:<\/strong> More epochs can worsen validation performance after overfitting begins; the case for increasing epochs depends on the learning curves.<\/p>\n<\/blockquote>\n"},{"m":2,"title":"Batch normalization — what happens in train and test","deck":"Normalise hidden activations without confusing train-time statistics.","source":"N2 pp. 71–81","priority":"high","demo":"batchnorm","labels":["BatchNorm","numerical"],"id":16,"order":6,"html":"<h3>The forward equations<\/h3>\n<p>For values x in a mini-batch (per feature/channel), calculate <code>μ_B<\/code> and <code>σ²_B<\/code>. Then:<\/p>\n<p><code>x̂ = (x−μ_B)/√(σ²_B+ε)<\/code><\/p>\n<p><code>y = γx̂ + β<\/code>.<\/p>\n<p>The learnable scale γ and shift β restore the flexibility to represent distributions other than standard-normal. During training, batch statistics are used. At inference, typical BatchNorm layers use running estimates accumulated during training—not fresh statistics from a single test sample.<\/p>\n<h3>Numerical example<\/h3>\n<p>For the mini-batch <code>(1,3)<\/code>: mean <code>μ=2<\/code>; population-style batch variance <code>[(1−2)²+(3−2)²]/2=1<\/code>. With ε≈0, normalized outputs are <code>−1,+1<\/code>. If γ=2 and β=0.5, new outputs are <code>−1.5,2.5<\/code>.<\/p>\n<h3>Where to place it<\/h3>\n<p>Common pattern <code>Dense/Conv → BatchNorm → ReLU<\/code> (but architectures differ). BatchNorm can stabilize optimization and permit larger learning rates, but it is <strong>not<\/strong> a substitute for careful dataset scaling, and small batch sizes can make statistics noisy.<\/p>\n<h3>Common tricky comparison<\/h3>\n<p><strong>BatchNorm<\/strong> normalises activations using mini-batch statistics; <strong>dropout<\/strong> randomly zeros activations during training to reduce co-adaptation. They target different mechanisms.<\/p>\n"},{"m":2,"title":"Softmax regression and multiclass cross-entropy","deck":"Convert scores into probabilities and compute loss.","source":"N2 pp. 80–91","priority":"critical","demo":"softmax","labels":["softmax","classification"],"id":17,"order":7,"html":"<h3>Softmax needs the whole vector<\/h3>\n<p>For logits <code>z=(z₁,…,z_K)<\/code>, compute <code>pᵢ = exp(zᵢ)/Σⱼexp(zⱼ)<\/code>. For numerical stability, subtract <code>max(z)<\/code> before exponentiating. Probabilities remain unchanged by adding the same constant to every logit.<\/p>\n<h3>Work the full classification example<\/h3>\n<p><code>z=(2,1,0)<\/code>. Subtract max 2: <code>(0,−1,−2)<\/code>. Exponentials: <code>(1,0.36788,0.13534)<\/code>; sum <code>1.50322<\/code>. Final <code>p≈(0.66524,0.24473,0.09003)<\/code>. Predicted class is the first. If the true class is the second, categorical cross-entropy is <code>−ln(.24473)≈1.4076<\/code>.<\/p>\n<p>With one-hot class label <code>y=(0,1,0)<\/code>, the combined softmax+CE gradient w.r.t. logits is <code>p−y=(.66524,−.75527,.09003)<\/code>. This surprising simple gradient is a common useful derivation.<\/p>\n<h3>Cases to distinguish<\/h3>\n<ul>\n<li>Sigmoid output for a <strong>binary<\/strong> target.<\/li>\n<li>Softmax for <strong>one of K mutually exclusive<\/strong> classes.<\/li>\n<li>Independent sigmoids for <strong>multi-label<\/strong> targets where several categories can co-exist.<\/li>\n<\/ul>\n<blockquote>\n<p><strong>Exam trap:<\/strong> Do not choose an output class by dividing logits by their sum. Softmax involves exponentials, not simple proportional normalisation.<\/p>\n<\/blockquote>\n"},{"m":2,"title":"Data augmentation and real generalization","deck":"Create realistic variation without corrupting labels.","source":"N2 pp. 91–103; CAT1 key Q4 p. 3","priority":"critical","demo":null,"labels":["augmentation","overfitting"],"id":18,"order":8,"html":"<h3>Why augment?<\/h3>\n<p>Data augmentation produces transformed <strong>training<\/strong> samples that preserve the underlying task label. In a small image dataset, it increases the range of poses, crops and brightness conditions without requiring new manual annotations. It is not the same as collecting independent new real observations.<\/p>\n<h3>Four exam-ready image augmentations<\/h3>\n<ol>\n<li><strong>Horizontal flips:<\/strong> Useful if left/right orientation does not change the class (often safe for common objects; unsafe for handwritten characters or side-specific medical findings).<\/li>\n<li><strong>Small rotations:<\/strong> Increase tolerance to camera angle, but extreme rotations can make content unrealistic.<\/li>\n<li><strong>Translation/cropping:<\/strong> Encourage robustness to location and framing. Crop responsibly: don't remove the only evidence of the label.<\/li>\n<li><strong>Brightness/contrast/color jitter:<\/strong> Simulate lighting variation without changing the semantic class.<\/li>\n<\/ol>\n<p>Other valid techniques include additive noise, affine transforms, Cutout/MixUp (if taught or appropriately justified), but explain the <strong>assumption that the label remains valid<\/strong>.<\/p>\n<h3>Actual 2026 faculty CAT1 case<\/h3>\n<p>A classifier has 2,000 images; training accuracy 98%, test accuracy 75%. This signals an <strong>overfitting/generalisation<\/strong> issue. Propose label-preserving augmentation on the training split, perhaps with L2, dropout or transfer learning, and monitor validation accuracy. Do <strong>not<\/strong> augment the test set to make its reported accuracy look better.<\/p>\n<h3>Mark-winning case answer<\/h3>\n<p>Define augmentation → give 4 mechanisms and cautions → explain reduced reliance on memorized appearances → note it does not guarantee improvement and should use domain-appropriate transformations.<\/p>\n"},{"m":2,"title":"Regularization: L1, L2, dropout and early stopping","deck":"Four different controls on complexity.","source":"N2 pp. 101–115","priority":"high","demo":null,"labels":["regularization","L1","L2"],"id":19,"order":9,"html":"<h3>The common goal<\/h3>\n<p>Regularisation penalises overly complex models or otherwise limits over-specialisation to training data. You should know both the mathematical mechanism and the observable effect.<\/p>\n<p><strong>L1 penalty:<\/strong> <code>J_total = J_data + λΣ|wᵢ|<\/code>. L1 encourages exact zeros/sparsity in many settings. <strong>L2 penalty:<\/strong> <code>J_total=J_data + λ/2 Σwᵢ²<\/code>; its derivative adds <code>λwᵢ<\/code> and encourages smaller weights. Different slide/textbook conventions put different constants around λ: follow the question.<\/p>\n<p><strong>Dropout:<\/strong> At training time, each eligible unit is independently removed with probability p and kept with probability <code>1−p<\/code>. With <strong>inverted dropout<\/strong>, kept activations are divided by <code>1−p<\/code> in training, and ordinary inference uses the network without randomly dropping units.<\/p>\n<p><strong>Early stopping:<\/strong> Monitor validation loss; stop after the best validation performance ceases improving, optionally restoring the best weights. It acts like a capacity control because training time is limited.<\/p>\n<h3>Numerical: L2 update<\/h3>\n<p>If data-gradient <code>g=0.3<\/code>, <code>w=2<\/code>, <code>λ=0.1<\/code>, <code>η=0.05<\/code>, the total gradient is <code>0.3+0.1(2)=0.5<\/code>. Update: <code>w'=2−0.05(.5)=1.975<\/code>. Without regularisation, <code>w'=1.985<\/code>.<\/p>\n<h3>Compare L1 and L2<\/h3>\n<table>\n<thead>\n<tr>\n  <th>L1<\/th>\n  <th>L2<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Absolute-value penalty<\/td>\n  <td>Squared-weight penalty<\/td>\n<\/tr>\n<tr>\n  <td>Encourages sparsity<\/td>\n  <td>Smoothly shrinks weights<\/td>\n<\/tr>\n<tr>\n  <td>Nondifferentiable exactly at 0<\/td>\n  <td>Differentiable everywhere<\/td>\n<\/tr>\n<tr>\n  <td>Useful when feature selection is desired<\/td>\n  <td>Common weight decay basis<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>Exam warning:<\/strong> If both train and validation loss are high, increasing dropout/L2 can make the model worse. Diagnose <em>before<\/em> prescribing.<\/p>\n<\/blockquote>\n"},{"m":2,"title":"Improving networks — one-page decision table","deck":"Compare the controls exam questions often mix up.","source":"N2 pp. 5–115; CAT1 key pp. 3–4","priority":"high","demo":null,"labels":["exam writing"],"id":20,"order":10,"html":"<h3>Choose the correct lever<\/h3>\n<table>\n<thead>\n<tr>\n  <th>Question clue<\/th>\n  <th>Mechanism to discuss<\/th>\n  <th>Essential equation / evidence<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>High-frequency gradient oscillation<\/td>\n  <td>Momentum, larger batch, smaller LR<\/td>\n  <td><code>vₜ=βvₜ₋₁+(1−β)gₜ<\/code><\/td>\n<\/tr>\n<tr>\n  <td>Per-parameter gradients on different scales<\/td>\n  <td>RMSProp/Adam<\/td>\n  <td><code>g/(√v+ε)<\/code><\/td>\n<\/tr>\n<tr>\n  <td>First Adam update has anomalous small moments<\/td>\n  <td>Bias correction<\/td>\n  <td><code>m̂=m/(1−β₁ᵗ)<\/code><\/td>\n<\/tr>\n<tr>\n  <td>Mini-batch distribution shifts<\/td>\n  <td>BatchNorm<\/td>\n  <td><code>(x−μ)/√(σ²+ε)<\/code><\/td>\n<\/tr>\n<tr>\n  <td>Three mutually exclusive classes<\/td>\n  <td>Softmax<\/td>\n  <td><code>pᵢ=e^zᵢ/Σe^zⱼ<\/code><\/td>\n<\/tr>\n<tr>\n  <td>Small training dataset with image-label invariances<\/td>\n  <td>Augmentation<\/td>\n  <td>flip/crop/rotate/jitter<\/td>\n<\/tr>\n<tr>\n  <td>Low train error, high validation error<\/td>\n  <td>Regularisation/early stopping<\/td>\n  <td>compare learning curves<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Answer-writing discipline<\/h3>\n<p>A <strong>10-mark optimizer comparison<\/strong> should include (i) why ordinary SGD struggles, (ii) update recurrence, (iii) numerical first iteration, (iv) bias correction if Adam, (v) one practical strength and limitation. A <strong>10-mark tuning scenario<\/strong> should include five separate hyperparameter decisions grounded in observed data, not generic advice.<\/p>\n<h3>Evidence boundary<\/h3>\n<p>The optimization deck is physically labeled <em>Module-2<\/em> in Fall 2026, while the published syllabus places “Improving deep neural networks” in Module 3. The textbook deliberately follows the <strong>actual lecture file labels<\/strong> and cross-maps both orders in the source audit. The content is the same; only the module number differs.<\/p>\n"},{"m":3,"title":"Why convolution beats flattening for images","deck":"Retain locality, reuse filters and detect spatial patterns.","source":"N3 pp. 3–42; DL pp. 56–70","priority":"core","demo":"conv","labels":["CNN","receptive field"],"id":21,"order":0,"html":"<h3>Fully connected models ignore image geography<\/h3>\n<p>A <code>224×224×3<\/code> image contains <strong>150,528 input numbers<\/strong>. Connecting each input to 1,000 hidden neurons uses about <strong>150.5 million weights<\/strong> before biases. Reshaping to one long vector loses explicit 2D neighborhood structure and produces large parameter counts.<\/p>\n<p>CNNs build in two powerful biases:<\/p>\n<ol>\n<li><strong>Local connectivity:<\/strong> a <code>3×3<\/code> filter sees a small neighborhood instead of the whole image.<\/li>\n<li><strong>Parameter sharing:<\/strong> the same filter weights slide across all locations. One edge detector can respond wherever an edge appears.<\/li>\n<\/ol>\n<p>A filter is a small learnable matrix/tensor. Sliding it produces a <strong>feature map<\/strong> showing where a pattern is detected. Early filters learn local edges/texture; deeper stacks combine those patterns into parts and objects.<\/p>\n<h3>Convolution versus cross-correlation<\/h3>\n<p>Most CNN implementations compute cross-correlation (no kernel flip), though we conventionally call the layer “convolution.” A mathematical convolution flips the filter; unless the question explicitly demands a flip, follow the displayed CNN operation.<\/p>\n<h3>Parameter comparison<\/h3>\n<p>Input image <code>32×32×3<\/code>, 16 output channels, <code>3×3<\/code> kernel: convolutional parameters <code>(3×3×3+1)×16=448<\/code>. These weights are reused across thousands of output locations. A dense layer connecting all <code>32×32×3<\/code> inputs to only 16 outputs would have <code>(3072+1)×16=49,168<\/code> parameters.<\/p>\n<blockquote>\n<p><strong>Mark-winning explanation:<\/strong> cite <strong>local receptive fields<\/strong>, <strong>shared weights<\/strong>, <strong>translation equivariance<\/strong> (approximate under boundary handling), and <strong>hierarchical feature extraction<\/strong>. “CNNs are used for images” is not enough.<\/p>\n<\/blockquote>\n"},{"m":3,"title":"Compute a convolution by hand","deck":"Slide a kernel, multiply elementwise, sum.","source":"N3 pp. 43–47, 51–56","priority":"critical","demo":"conv","labels":["convolution","matrix numerical"],"id":22,"order":1,"html":"<h3>The fundamental operation<\/h3>\n<p>At each output location, align the filter with the input patch. Multiply corresponding values, sum all products, and optionally add the filter bias. For one input channel and one filter:<\/p>\n<p><code>Y[r,c] = Σᵢ Σⱼ X[r+i,c+j] K[i,j] + b<\/code>.<\/p>\n<h3>Full numerical: 3×3 input and 2×2 filter<\/h3>\n<p>Input:<\/p>\n<pre><code class=\"language-text\">1 2 0\n3 1 1\n2 0 4\n<\/code><\/pre>\n<p>Kernel:<\/p>\n<pre><code class=\"language-text\">1  0\n0 -1\n<\/code><\/pre>\n<p>With stride 1, valid padding 0, the output is <code>2×2<\/code>:<\/p>\n<ul>\n<li>Top-left patch <code>[[1,2],[3,1]]<\/code>: <code>1(1)+2(0)+3(0)+1(−1)=0<\/code>.<\/li>\n<li>Top-right patch <code>[[2,0],[1,1]]<\/code>: <code>2(1)+0+0−1=1<\/code>.<\/li>\n<li>Bottom-left patch <code>[[3,1],[2,0]]<\/code>: <code>3−0=3<\/code>.<\/li>\n<li>Bottom-right patch <code>[[1,1],[0,4]]<\/code>: <code>1−4=−3<\/code>.<\/li>\n<\/ul>\n<p>Final feature map:<\/p>\n<pre><code class=\"language-text\"> 0  1\n 3 -3\n<\/code><\/pre>\n<p>A subsequent ReLU would produce <code>[[0,1],[3,0]]<\/code>.<\/p>\n<h3>What to write on a long-answer paper<\/h3>\n<p>Draw the padded input if padding is specified. Highlight each kernel footprint. Show at least the first two dot products, then the full output matrix. State whether the operation is cross-correlation or flipped convolution if the context distinguishes them.<\/p>\n"},{"m":3,"title":"Stride, padding, dilation and output shapes","deck":"Never guess output dimensions.","source":"N3 pp. 47–59; CAT2 CNN numericals","priority":"critical","demo":"shape","labels":["formula","output dimension"],"id":23,"order":2,"html":"<h3>The master shape equation<\/h3>\n<p>For an input dimension N, kernel F, padding P on each side, stride S, dilation D, effective filter <code>F_eff=D(F−1)+1<\/code>:<\/p>\n<p><code>output = floor((N + 2P − F_eff)/S) + 1<\/code>.<\/p>\n<p>The source's normal convolution calculations use D=1; the formula simplifies to <code>floor((N+2P−F)/S)+1<\/code>. Apply independently to height and width.<\/p>\n<h3>Worked examples<\/h3>\n<ul>\n<li><code>N=32,F=5,P=0,S=1<\/code> → <code>(32−5)+1=28<\/code>.<\/li>\n<li><code>N=32,F=3,P=1,S=1<\/code> → <code>32<\/code> (<strong>same size<\/strong>).<\/li>\n<li><code>N=7,F=3,P=0,S=2<\/code> → <code>floor(4/2)+1=3<\/code>.<\/li>\n<li><code>N=53,F=2,P=0,S=2<\/code> → <code>floor(51/2)+1=26<\/code> (<strong>don't keep 26.5<\/strong>).<\/li>\n<\/ul>\n<p>If the input has Cin channels and there are Fout full-depth filters, the output depth is <code>Fout<\/code>. All convolution kernels span <strong>every input channel<\/strong> unless a depthwise/grouped configuration is explicitly given.<\/p>\n<h3>Padding vocabulary<\/h3>\n<p>“Valid” generally means no padding. “Same” means choose padding so output spatial size is preserved for stride 1 (and often ceiling-like output under stride&gt;1 by framework convention). The exact asymmetry for even kernels can differ; for hand numericals use the padding number supplied.<\/p>\n<blockquote>\n<p><strong>Trap:<\/strong> Stride changes <strong>where the kernel moves<\/strong>, not how many trainable coefficients are in the kernel. Changing stride often changes flatten-to-FC parameter counts indirectly.<\/p>\n<\/blockquote>\n"},{"m":3,"title":"Convolutional and fully connected parameter counts","deck":"Biases, channels, filters, and the zero-parameter layers.","source":"N3 pp. 59–75, 83–110","priority":"critical","demo":"shape","labels":["parameter numerical"],"id":24,"order":3,"html":"<h3>The two parameter equations<\/h3>\n<p><strong>Standard convolution:<\/strong> <code>(K_h × K_w × C_in + 1 bias) × C_out<\/code>.<\/p>\n<p><strong>Dense/fully connected:<\/strong> <code>(n_in + 1 bias) × n_out<\/code>.<\/p>\n<p>Activation, ordinary max/average pooling, reshape and flatten have <strong>zero trainable weights<\/strong>. BatchNorm, if present, has learnable γ and β (commonly 2 per output channel); do not mix these into convolution parameters unless the architecture includes it.<\/p>\n<h3>Example, layer by layer<\/h3>\n<p><code>32×32×3<\/code> input → conv <code>3×3<\/code>, 8 filters, pad1 stride1 → <code>32×32×8<\/code>.<\/p>\n<p>Conv parameters: <code>(3×3×3+1)×8 = 224<\/code>.<\/p>\n<p>MaxPool 2×2 stride2 → <code>16×16×8<\/code>, parameters 0.<\/p>\n<p>Flatten → 2,048 numbers; dense to 10 classes → <code>(2048+1)×10=20,490<\/code> parameters.<\/p>\n<p><strong>Total = 224+0+20,490 = 20,714.<\/strong><\/p>\n<h3>Source-typical trap<\/h3>\n<p>A 5×5 convolution with 10 input channels and 10 output filters has <code>(5×5×10+1)×10=2,510<\/code> parameters. It is <strong>not<\/strong> <code>25×10<\/code>—that misses input depth. And it is <strong>not<\/strong> multiplied by output width/height—those reuse weights.<\/p>\n"},{"m":3,"title":"The complete 100×100 CNN numerical from the faculty deck","deck":"Six layers, every output dimension and 139,820 parameters.","source":"N3 pp. 67–75 (source-exact example)","priority":"critical","demo":"shape","labels":["source-exact","139820"],"id":25,"order":4,"html":"<h3>The lecturer's actual question<\/h3>\n<p>Input <code>100×100×3<\/code> image, all conv strides 1, all pooling strides 2. The pipeline is: C1 <code>3×3<\/code>, 10 filters, pad2 → C2 <code>5×5<\/code>, 10 filters, pad2 → P1 <code>2×2<\/code> max-pool → C3 <code>3×3<\/code>, 20 filters, pad2 → P2 <code>2×2<\/code> max-pool → FC1 10 neurons.<\/p>\n<h3>Do <strong>not<\/strong> skip the shape table<\/h3>\n<table>\n<thead>\n<tr>\n  <th>Layer<\/th>\n  <th>Formula and output shape<\/th>\n  <th style=\"text-align:right\">Trainable parameters<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Input<\/td>\n  <td><code>100×100×3<\/code><\/td>\n  <td style=\"text-align:right\">0<\/td>\n<\/tr>\n<tr>\n  <td>C1<\/td>\n  <td><code>(100+4−3)+1=102<\/code>, so <code>102×102×10<\/code><\/td>\n  <td style=\"text-align:right\"><code>(3×3×3+1)×10=280<\/code><\/td>\n<\/tr>\n<tr>\n  <td>C2<\/td>\n  <td><code>(102+4−5)+1=102<\/code>, so <code>102×102×10<\/code><\/td>\n  <td style=\"text-align:right\"><code>(5×5×10+1)×10=2,510<\/code><\/td>\n<\/tr>\n<tr>\n  <td>P1<\/td>\n  <td><code>(102−2)/2+1=51<\/code>, so <code>51×51×10<\/code><\/td>\n  <td style=\"text-align:right\">0<\/td>\n<\/tr>\n<tr>\n  <td>C3<\/td>\n  <td><code>(51+4−3)+1=53<\/code>, so <code>53×53×20<\/code><\/td>\n  <td style=\"text-align:right\"><code>(3×3×10+1)×20=1,820<\/code><\/td>\n<\/tr>\n<tr>\n  <td>P2<\/td>\n  <td><code>floor((53−2)/2)+1=26<\/code>, so <code>26×26×20<\/code><\/td>\n  <td style=\"text-align:right\">0<\/td>\n<\/tr>\n<tr>\n  <td>FC1<\/td>\n  <td><code>26×26×20=13,520<\/code> flattened → 10 outputs<\/td>\n  <td style=\"text-align:right\"><code>(13,520+1)×10=135,210<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Final answer<\/h3>\n<p><code>280 + 2,510 + 0 + 1,820 + 0 + 135,210 = 139,820<\/code> <strong>trainable parameters<\/strong>. The source's slide 75 reports the same total.<\/p>\n<h3>What makes it tricky?<\/h3>\n<p>The lecturer intentionally chooses <strong>padding 2 with a 3×3 filter<\/strong> in C1 and C3, which <em>increases<\/em> the spatial size (100→102 and 51→53). Assuming padding always preserves size gets this entire numerical wrong. P2 begins with an odd spatial size 53, so its floor operation matters.<\/p>\n<blockquote>\n<p><strong>Study standard:<\/strong> Reproduce the whole six-row table without looking. One wrong dimension can make your fully connected parameter count enormously wrong.<\/p>\n<\/blockquote>\n"},{"m":3,"title":"Pooling, activation and the output head","deck":"Shrink spatial resolution without learning more filters.","source":"N3 pp. 56–65","priority":"high","demo":"conv","labels":["pooling"],"id":26,"order":5,"html":"<h3>Pooling summarises neighborhoods<\/h3>\n<p>A 2×2 <strong>max pool<\/strong> selects the largest of four values. An <strong>average pool<\/strong> computes their mean. Both are deterministic operations with zero trainable weights in their standard form. Stride 2 commonly reduces height and width by about half.<\/p>\n<p>For patch <code>[[1,7],[3,2]]<\/code>: max pool = <strong>7<\/strong>; average pool = <strong>13/4=3.25<\/strong>. With a 4×4 input, a nonoverlapping 2×2 stride-2 pool produces a 2×2 output. With 5×5 and no padding, <code>floor((5−2)/2)+1=2<\/code>.<\/p>\n<h3>Why ReLU often follows convolution<\/h3>\n<p>Each filter produces a linear response to its patch; ReLU introduces nonlinearity and suppresses negatives. A typical block is <code>Conv → [BatchNorm] → ReLU → Pool<\/code>, though real architectures use different ordering.<\/p>\n<h3>Output layers<\/h3>\n<ul>\n<li>Classification into K mutually exclusive classes: K logits followed by softmax.<\/li>\n<li>Binary classification: one sigmoid logit is common.<\/li>\n<li>Segmentation: preserve pixel-level spatial predictions instead of flattening too early.<\/li>\n<\/ul>\n<h3>Flatten versus global-average pooling<\/h3>\n<p>Flatten creates one feature per spatial location and channel, which can make a huge dense head. Global average pooling averages each channel spatially, producing C values and fewer dense parameters. This idea appears in later CNN families.<\/p>\n<blockquote>\n<p><strong>Trick:<\/strong> Pooling is not trainable; it changes geometry but does not, by itself, change channel count. A pooling layer does not magically make class probabilities.<\/p>\n<\/blockquote>\n"},{"m":3,"title":"LeNet-5 — learn the historical blueprint","deck":"A compact digit-recognition CNN that introduced the pattern.","source":"N3 pp. 79–92","priority":"core","demo":null,"labels":["LeNet","architecture"],"id":27,"order":6,"html":"<h3>Why LeNet matters<\/h3>\n<p>LeNet-5 is a pioneering architecture for handwritten character/digit recognition. Its recognizable idea is <em>alternating convolutions and spatial downsampling<\/em>, followed by fully connected classification. It predates ReLU's widespread use; classical LeNet often uses tanh-like activations and average/subsampling stages.<\/p>\n<h3>Simplified LeNet-5 path<\/h3>\n<p><code>32×32×1 image → C1: 6 conv 5×5 → 28×28×6 → S2: subsample → 14×14×6 → C3: 16 conv 5×5 → 10×10×16 → S4 → 5×5×16 → C5: 120 → F6: 84 → output: 10<\/code>.<\/p>\n<h3>Source-specific accounting<\/h3>\n<p>The faculty's source table (pp. 85–91) uses an architecture summary and parameter counts; historical implementations include partial connection patterns in C3, so <strong>do not assume every layer uses a modern fully connected kernel rule<\/strong> when reconciling the original paper's total parameter count. For an <em>exam numerical with explicitly standard full-depth conv filters<\/em>, use the standard <code>(k²Cin+1)Cout<\/code> formula.<\/p>\n<h3>Compare architectural eras<\/h3>\n<p>LeNet is relatively small and input-specific. AlexNet dramatically increases scale and uses ReLU, dropout and large-scale GPU training. VGG uses a repeated 3×3 design; Inception uses parallel filter branches; ResNet uses residual shortcuts.<\/p>\n"},{"m":3,"title":"AlexNet — filters, layers and a classic calculation","deck":"Why the 2012 ImageNet breakthrough still appears on exams.","source":"N3 pp. 92–111","priority":"high","demo":"shape","labels":["AlexNet","numerical"],"id":28,"order":7,"html":"<h3>Architecture ideas<\/h3>\n<p>AlexNet popularised large-scale deep CNN training with GPUs, ReLU, pooling, dropout in fully connected layers, and data augmentation. The famous simplified input is often <code>227×227×3<\/code> with <code>96<\/code> filters of <code>11×11<\/code> and stride 4 in its first convolution.<\/p>\n<h3>First-convolution numerical<\/h3>\n<p>With input channels 3, <code>11×11<\/code> filters, 96 filters, bias per filter:<\/p>\n<p><code>(11×11×3 + 1) × 96 = (363+1)×96 = 34,944<\/code> trainable parameters.<\/p>\n<p>With N=227, F=11, S=4, P=0, output width <code>floor((227−11)/4)+1=55<\/code> and depth 96: <strong>55×55×96<\/strong>. The number of spatial outputs does not multiply the parameter count.<\/p>\n<h3>Key claims and limits<\/h3>\n<p>The large initial kernel and stride aggressively reduce spatial dimensions. ReLU helps gradient flow compared with saturating functions, but cannot prevent all optimization issues. Dropout reduces overfitting particularly in large dense heads. The source teaches the classic simplified architecture; source-image sizes can vary by whether cropping/preprocessing is described as 224 or 227—use the stated numerical input.<\/p>\n<blockquote>\n<p><strong>Exam formula:<\/strong> <code>CNN parameters = kernel_h×kernel_w×input_channels×filters + one bias/filter<\/code>.<\/p>\n<\/blockquote>\n"},{"m":3,"title":"VGG — why three 3×3 layers matter","deck":"Receptive fields and parameter efficiency.","source":"N3 pp. 112–123","priority":"high","demo":null,"labels":["VGG","receptive field"],"id":29,"order":8,"html":"<h3>VGG's design principle<\/h3>\n<p>VGGNet uses many repeated <strong>3×3 stride-1 convolution<\/strong> blocks instead of a single large kernel. With no dilations and stride 1, stacking three 3×3 convolutions gives an <strong>effective receptive field of 7×7<\/strong>, with extra nonlinearities between layers.<\/p>\n<h3>Parameter comparison at equal channel depth C<\/h3>\n<p>One <code>7×7<\/code> convolution <code>C→C<\/code> uses approximately <code>49C²<\/code> weights (plus C biases). Three <code>3×3<\/code> convolution layers <code>C→C<\/code> use approximately <code>27C²<\/code> weights (plus 3C biases). For <code>C=64<\/code>: <code>49×4096=200,704<\/code> versus <code>27×4096=110,592<\/code> weights.<\/p>\n<p>The simplification assumes all three layers have equal input/output channels. The main message is <strong>same theoretical receptive field<\/strong>, more nonlinear transformations, and potentially fewer parameters. Practical effective receptive fields also depend on trained weights.<\/p>\n<h3>Draw the distinction<\/h3>\n<table>\n<thead>\n<tr>\n  <th>VGG<\/th>\n  <th>AlexNet<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Mostly small 3×3 conv blocks<\/td>\n  <td>Large 11×11 first conv<\/td>\n<\/tr>\n<tr>\n  <td>Deeper, uniform block design<\/td>\n  <td>Shallower historical architecture<\/td>\n<\/tr>\n<tr>\n  <td>Very large dense head in classic versions<\/td>\n  <td>Also substantial dense head<\/td>\n<\/tr>\n<tr>\n  <td>Simple to reason about<\/td>\n  <td>More heterogeneous kernels<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>Exam writing:<\/strong> State “effective receptive field” and compare weights. Do not claim VGG has a tiny overall parameter count; the fully connected classifier can be enormous.<\/p>\n<\/blockquote>\n"},{"m":3,"title":"GoogLeNet / Inception — parallel paths and 1×1 bottlenecks","deck":"Multiple feature scales without exploding computation.","source":"N3 pp. 123–150","priority":"high","demo":"inception","labels":["Inception","1x1 conv"],"id":30,"order":9,"html":"<h3>One block, several receptive-field scales<\/h3>\n<p>An Inception block applies multiple transformations in parallel—typically 1×1, 3×3, 5×5 convolution and pooling paths—then concatenates the outputs <strong>along the channel dimension<\/strong>. Spatial height and width must match across concatenated paths.<\/p>\n<h3>Why 1×1 convolution is more than “doing nothing”<\/h3>\n<p>A <code>1×1<\/code> convolution mixes information <strong>across channels<\/strong> at one spatial location. It often reduces channel depth before expensive 3×3 or 5×5 kernels; this is a bottleneck.<\/p>\n<h3>Computation reduction example<\/h3>\n<p>Input feature map has 192 channels. To produce 32 output channels using direct <code>5×5<\/code> convolution: <code>25×192×32 = 153,600<\/code> weights (biases extra).<\/p>\n<p>With <code>1×1<\/code> reduction <code>192→16<\/code> and then <code>5×5<\/code> <code>16→32<\/code>: <code>1×1×192×16 + 5×5×16×32 = 3,072 + 12,800 = 15,872<\/code> weights. <strong>About 9.7× fewer<\/strong> in this branch, with extra nonlinearity.<\/p>\n<h3>Channel concatenation example<\/h3>\n<p>If four branches each output shape <code>28×28×(64,128,32,32)<\/code>, concatenate to <code>28×28×(64+128+32+32) = 28×28×256<\/code>. Concatenation itself adds no learned parameters.<\/p>\n<blockquote>\n<p><strong>Trap:<\/strong> Do not add heights or widths when concatenating feature maps along channels. If branch spatial sizes differ, the architecture must resize/pad them to align.<\/p>\n<\/blockquote>\n"},{"m":3,"title":"ResNet — learn residuals instead of full mappings","deck":"Skip connections solve a trainability problem, not merely a depth problem.","source":"N3 pp. 150–174","priority":"high","demo":"resnet","labels":["ResNet","skip connection"],"id":31,"order":10,"html":"<h3>Why deep plain networks may get worse<\/h3>\n<p>The faculty slides show the <strong>degradation problem<\/strong>: a deeper plain network can have higher training error than a shallower one, even though a deeper architecture <em>could<\/em> theoretically represent the shallower solution. This is an optimization difficulty, not just overfitting.<\/p>\n<h3>The residual block<\/h3>\n<p>Instead of directly learning <code>H(x)<\/code>, let convolutional layers learn the residual <code>F(x)=H(x)−x<\/code>, and output:<\/p>\n<p><code>y = F(x) + x<\/code>.<\/p>\n<p>The identity shortcut makes it easier to represent “do almost nothing” when extra layers are unnecessary. For backpropagation, <code>dy/dx = dF/dx + 1<\/code> in an identity skip path—there is an additional path for gradient flow.<\/p>\n<h3>Shape constraint<\/h3>\n<p>Elementwise addition requires matching tensor shapes. When dimensions or channel counts change, networks can use a projection shortcut (commonly 1×1 convolution) or suitable downsampling to align.<\/p>\n<h3>Contrast with Inception<\/h3>\n<p>Inception <strong>concatenates channels from parallel branches<\/strong>; ResNet <strong>adds aligned feature maps from a shortcut and main branch<\/strong>. They are different operations and have different output shapes.<\/p>\n<h3>Classic exam comparison<\/h3>\n<p>LeNet → AlexNet → VGG → GoogLeNet → ResNet reflects increasingly powerful approaches to depth, feature scale, computational efficiency and optimization. Name the innovation <strong>and<\/strong> its tradeoff, rather than trying to memorise every historical layer count.<\/p>\n"},{"m":3,"title":"CNNs — integrated architecture and numerical revision","deck":"Two exam answer types: calculate dimensions or justify design.","source":"N3 pp. 43–179; D1/D2 2024 FAT topic summaries","priority":"high","demo":"shape","labels":["exam checklist"],"id":32,"order":11,"html":"<h3>Numerical workflow (always in this order)<\/h3>\n<ol>\n<li>Copy architecture and initial input shape <code>H×W×C<\/code>.<\/li>\n<li>For each convolution, compute height/width using the stride/pad/kernel equation; set depth to filter count.<\/li>\n<li>Compute convolution params <code>(K²C_in+1)×filters<\/code>.<\/li>\n<li>For pooling, update spatial shape; add <strong>zero<\/strong> parameters.<\/li>\n<li>For dense, flatten correctly and compute <code>(n_in+1)n_out<\/code>.<\/li>\n<li>Sum parameters and box both shape and total.<\/li>\n<\/ol>\n<h3>Architecture long-answer workflow<\/h3>\n<ul>\n<li><strong>LeNet:<\/strong> early convolution/subsampling digit network.<\/li>\n<li><strong>AlexNet:<\/strong> large-scale GPU/ReLU/augmentation/dropout architecture.<\/li>\n<li><strong>VGG:<\/strong> many repeated 3×3 blocks; large classifier.<\/li>\n<li><strong>Inception:<\/strong> multiscale parallel branches and 1×1 channel reduction.<\/li>\n<li><strong>ResNet:<\/strong> additive residual shortcuts, improved depth trainability.<\/li>\n<\/ul>\n<h3>Three common errors<\/h3>\n<ol>\n<li>Multiplying conv filter count by <strong>output pixels<\/strong> (incorrect—weights are shared).<\/li>\n<li>Forgetting a <strong>bias for each output filter/neuron<\/strong>.<\/li>\n<li>Forgetting floor in output width or forgetting input-channel depth when a 2D filter is applied to RGB images.<\/li>\n<\/ol>\n<h3>A final five-minute test<\/h3>\n<p>Can you derive: AlexNet conv1 output <code>55×55×96<\/code>, first-convolution parameters <strong>34,944<\/strong>, three VGG 3×3 receptive field <strong>7×7<\/strong>, and the lecturer's six-layer CNN total <strong>139,820<\/strong>? If not, revisit those worked lessons before moving to later modules.<\/p>\n"},{"m":4,"title":"What makes a network recurrent?","deck":"A memory-like state that travels across time.","source":"N4a pp. 4–20; DL pp. 77–88","priority":"core","demo":"rnn","labels":["RNN","recurrent"],"id":33,"order":0,"html":"<h3>The sequence problem<\/h3>\n<p>Ordinary feed-forward networks treat inputs as independent fixed-size vectors. Language, speech, sensor data and video have <strong>order<\/strong>; a word's meaning can depend on earlier words. A recurrent neural network (RNN) carries a hidden state from one time step to the next.<\/p>\n<p>For a simple Elman RNN:<\/p>\n<p><code>aₜ = Wₓ xₜ + Wₕ hₜ₋₁ + b<\/code><\/p>\n<p><code>hₜ = tanh(aₜ)<\/code>, and optionally <code>ŷₜ = softmax(Wᵧhₜ+c)<\/code>.<\/p>\n<p>The same matrices <code>Wₓ<\/code> and <code>Wₕ<\/code> are <strong>shared at every time step<\/strong>; unrolling makes this sharing visible. The hidden state is not a separate set of trainable weights at each t. It is an input-dependent value.<\/p>\n<h3>Numerical with three inputs<\/h3>\n<p>Take scalar weights <code>Wₓ=0.4<\/code>, <code>Wₕ=0.5<\/code>, b=0, <code>h₀=0<\/code>, sequence x=<code>(1,0,1)<\/code>:<\/p>\n<p><code>h₁=tanh(.4×1+.5×0)=tanh(.4)≈.37995<\/code>.<\/p>\n<p><code>h₂=tanh(.4×0+.5×.37995)=tanh(.18997)≈.18772<\/code>.<\/p>\n<p><code>h₃=tanh(.4×1+.5×.18772)=tanh(.49386)≈.45734<\/code>.<\/p>\n<p>Notice the third state depends <strong>indirectly on the first input<\/strong> via the recurrent state.<\/p>\n<h3>Useful distinction<\/h3>\n<p>A recurrent RNN processes a <strong>sequence in time<\/strong>. A recursive neural network (RvNN) processes a <strong>tree structure<\/strong>, often according to a parse tree. The course's Module-5 title refers to recursive models but most supplied lecture material there focuses on long-memory recurrent architectures; don't conflate the two terms.<\/p>\n"},{"m":4,"title":"Sequence input/output patterns","deck":"Classify one-to-one, one-to-many, many-to-one and many-to-many.","source":"N4a pp. 22–33","priority":"core","demo":null,"labels":["RNN","architectures"],"id":34,"order":1,"html":"<h3>Count inputs and outputs, not just “RNN present”<\/h3>\n<table>\n<thead>\n<tr>\n  <th>Pattern<\/th>\n  <th>Shape idea<\/th>\n  <th>Representative use<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>One-to-one<\/td>\n  <td>one input → one output<\/td>\n  <td>Standard image classification; not inherently recurrent<\/td>\n<\/tr>\n<tr>\n  <td>One-to-many<\/td>\n  <td>one input → a sequence<\/td>\n  <td>Image caption generation<\/td>\n<\/tr>\n<tr>\n  <td>Many-to-one<\/td>\n  <td>input sequence → one output<\/td>\n  <td>Sentiment classification<\/td>\n<\/tr>\n<tr>\n  <td>Many-to-many (aligned)<\/td>\n  <td>one output per input time step<\/td>\n  <td>Part-of-speech tagging, sequence labeling<\/td>\n<\/tr>\n<tr>\n  <td>Many-to-many (different lengths)<\/td>\n  <td>input sequence → output sequence<\/td>\n  <td>Machine translation / encoder–decoder<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Example: predict sentiment<\/h3>\n<p>Sentence “The movie was surprisingly good” has multiple token inputs but a single sentiment label, so it is <strong>many-to-one<\/strong>. A per-token entity tagger that marks each word's role is <strong>many-to-many aligned<\/strong>. Translation from five English tokens to seven French tokens is <strong>many-to-many with unequal lengths<\/strong>.<\/p>\n<h3>Architecture choices<\/h3>\n<p>For many-to-one, the final hidden state is one possible sequence summary; a pooled/attention summary is another. In many-to-many, a decoder may produce each output autoregressively. Sequence length and alignment tell you which output strategy is appropriate.<\/p>\n<blockquote>\n<p><strong>Trap:<\/strong> “One-to-many” is not “one training example and many classes”. It refers to <strong>one input unit versus an output sequence<\/strong>, not the number of class probabilities in softmax.<\/p>\n<\/blockquote>\n"},{"m":4,"title":"RNN forward pass and tensor shapes","deck":"Make dimensions explicit before drawing an unrolled network.","source":"N4a pp. 13–24; N4b pp. 1–15","priority":"high","demo":"rnn","labels":["shapes","parameters"],"id":35,"order":2,"html":"<h3>The shape equations<\/h3>\n<p>Suppose a sequence has length T, each input xₜ has d features, and hidden size h. Then for column-vector convention:<\/p>\n<ul>\n<li><code>Wₓ<\/code> has shape <code>h×d<\/code>.<\/li>\n<li><code>Wₕ<\/code> has shape <code>h×h<\/code>.<\/li>\n<li>Bias b has shape <code>h×1<\/code>.<\/li>\n<li>Each hₜ has shape <code>h×1<\/code>.<\/li>\n<li>If class count K, <code>Wᵧ<\/code> is <code>K×h<\/code>.<\/li>\n<\/ul>\n<h3>Parameter count<\/h3>\n<p>A vanilla RNN cell with these three quantities has <code>h×d + h×h + h = h(d+h+1)<\/code> parameters (excluding optional output head). Sequence length T does <strong>not<\/strong> multiply the parameter count because the same cell weights are reused at every time step.<\/p>\n<p>For <code>d=4<\/code>, <code>h=3<\/code>: recurrent cell params <code>3(4+3+1)=24<\/code>. An output softmax head with K=2 uses <code>(3+1)×2=8<\/code>; total 32 parameters.<\/p>\n<h3>The key diagram<\/h3>\n<p>Unrolled view: <code>x₁→[cell]→h₁ → [cell]→h₂ → [cell]→h₃<\/code>, with x₂ and x₃ entering their respective cells. Across all three, the weight boxes must be labelled <strong>shared W<\/strong>.<\/p>\n<blockquote>\n<p><strong>Trap:<\/strong> Input tokens have length T but weights are not copied T times; computational graph nodes are repeated, parameters are tied.<\/p>\n<\/blockquote>\n"},{"m":4,"title":"Backpropagation Through Time (BPTT)","deck":"The same chain rule, through shared weights and sequential states.","source":"N4b pp. 1–13; DL pp. 75–83","priority":"critical","demo":"rnn","labels":["BPTT","numerical"],"id":36,"order":3,"html":"<h3>Unroll first, differentiate second<\/h3>\n<p>BPTT expands a recurrent model into its T time steps, computes losses, and backpropagates gradients from later states to earlier ones. Because all time steps share the same weight matrix, contributions to the gradient <strong>sum across steps<\/strong>.<\/p>\n<p><code>∂L/∂Wₕ = Σₜ (∂L/∂aₜ) hₜ₋₁ᵀ<\/code>.<\/p>\n<p>For a tanh RNN, the sensitivity traveling backward through a step includes <code>Wₕᵀ diag(1−hₜ²)<\/code>. Products of such Jacobians over long sequences can shrink toward zero or grow drastically—this is the vanishing/exploding gradient problem.<\/p>\n<h3>Small worked chain-rule example<\/h3>\n<p>Let <code>h₁=tanh(wx₁)<\/code>, <code>h₂=tanh(wh₁)<\/code> and <code>L=½(h₂−y)²<\/code>, with x₁=1, w=0.5, y=1:<\/p>\n<ul>\n<li><code>h₁=tanh(.5)=.46212<\/code>.<\/li>\n<li><code>h₂=tanh(.5×.46212)=tanh(.23106)≈.22698<\/code>.<\/li>\n<li><code>δ₂=(h₂−1)(1−h₂²)≈−.77302×.94848≈−.7332<\/code>.<\/li>\n<li>Contribution to w at t=2: <code>δ₂ h₁≈−.3388<\/code>.<\/li>\n<li>Backprop to t=1: <code>δ₁=(1−h₁²)×w×δ₂≈.78645×.5×(−.7332)=−.2883<\/code>.<\/li>\n<li>Contribution from t=1: <code>δ₁ x₁≈−.2883<\/code>.<\/li>\n<li>Total shared-weight gradient <code>dL/dw≈−.6271<\/code>.<\/li>\n<\/ul>\n<p>The exact final decimals vary slightly by rounding. <strong>The essential step is adding gradients from both appearances of w.<\/strong><\/p>\n<h3>Truncated BPTT<\/h3>\n<p>Rather than backpropagating indefinitely, truncated BPTT backpropagates through a limited recent window. This reduces cost but limits ability to capture dependencies older than the chosen window.<\/p>\n"},{"m":4,"title":"Vanishing and exploding gradients","deck":"Recognise two opposite failures of a long chain of derivatives.","source":"N4b pp. 1–15; N5 pp. 2–8","priority":"critical","demo":null,"labels":["gradient","vanishing"],"id":37,"order":4,"html":"<h3>What goes wrong mathematically?<\/h3>\n<p>For a recurrent chain, the gradient to an early state roughly includes products like <code>∏ₜ Wₕᵀdiag(φ′(aₜ))<\/code>. Repeated multiplication by values with norm less than 1 tends to <strong>vanish<\/strong>; repeatedly multiplying large factors can cause <strong>explosion<\/strong>.<\/p>\n<p>An intuitive numerical: if a relevant scalar derivative is 0.5 at each of 20 time steps, the product is <code>0.5²⁰≈9.54×10⁻⁷<\/code>, essentially no signal. If it is 1.5, <code>1.5²⁰≈3325<\/code> (exploding magnitude).<\/p>\n<h3>Consequences<\/h3>\n<p>Vanishing gradients prevent learning dependencies from distant inputs. Exploding gradients cause unstable parameter updates, giant loss spikes or nonfinite numbers. Neither is the same as having a model that simply “forgets facts” at inference; they are primarily <strong>training dynamics<\/strong>.<\/p>\n<h3>Solutions and what they address<\/h3>\n<ul>\n<li><strong>LSTM/GRU:<\/strong> learn gated state transitions that preserve useful information.<\/li>\n<li><strong>Gradient clipping:<\/strong> protects against <em>exploding<\/em> gradients, not vanishing gradients.<\/li>\n<li><strong>Better initialization and normalization:<\/strong> may improve stable propagation.<\/li>\n<li><strong>Truncated BPTT:<\/strong> reduces computational cost and very long products but also truncates learning signals.<\/li>\n<li><strong>Attention/explicit memory:<\/strong> creates more direct access paths to useful distant context.<\/li>\n<\/ul>\n<blockquote>\n<p><strong>Exam trap:<\/strong> Do not write that gradient clipping solves vanishing gradients. It caps large gradient norms and is a remedy for explosion.<\/p>\n<\/blockquote>\n"},{"m":4,"title":"Bidirectional RNNs","deck":"Why both left and right context can change a word's meaning.","source":"N4b pp. 17–40","priority":"high","demo":null,"labels":["BiRNN","sequence"],"id":38,"order":5,"html":"<h3>Two processing directions<\/h3>\n<p>A unidirectional RNN processes tokens from left to right. A bidirectional RNN uses <strong>two<\/strong> hidden-state streams: one forward and one backward, often concatenated at each token:<\/p>\n<p><code>h⃗ₜ = φ(W_f xₜ + U_f h⃗ₜ₋₁ + b_f)<\/code><\/p>\n<p><code>h⃖ₜ = φ(W_b xₜ + U_b h⃖ₜ₊₁ + b_b)<\/code><\/p>\n<p><code>hₜ=[h⃗ₜ ; h⃖ₜ]<\/code>.<\/p>\n<p>The combined representation reflects <strong>past and future context<\/strong> of the current token. The professor's example uses “Dhaval loves Apple” to motivate resolving a word using context from multiple sides.<\/p>\n<h3>When it makes sense<\/h3>\n<p>Named entity recognition, tagging and sentence analysis can benefit if the <strong>entire input sequence is already available<\/strong>. A bidirectional RNN is not naturally applicable to causal online prediction that cannot peek at future inputs, because the backward stream requires seeing later tokens.<\/p>\n<h3>Parameter and output implications<\/h3>\n<p>For equal hidden size h in both directions, concatenating forward and backward states gives <strong>2h-dimensional features<\/strong> at each step, and (for independent forward/backward cells) roughly doubles recurrent-cell parameter count versus one direction.<\/p>\n<h3>Compare to a deep RNN<\/h3>\n<p><strong>Bidirectional<\/strong> refers to processing directions; <strong>deep<\/strong> refers to stacking multiple recurrent layers. A model can be both deep and bidirectional.<\/p>\n"},{"m":4,"title":"Encoder–decoder and sequence-to-sequence networks","deck":"Convert inputs of one length into outputs of another.","source":"N4b pp. 56–76; DL pp. 90–102","priority":"high","demo":"seq2seq","labels":["seq2seq","encoder","decoder"],"id":39,"order":6,"html":"<h3>The architecture<\/h3>\n<p>An <strong>encoder<\/strong> reads input sequence <code>x₁,…,x_T<\/code> and produces states plus an encoded context representation. A <strong>decoder<\/strong> generates output tokens <code>y₁,…,y_U<\/code> conditioned on encoder information and previously generated outputs. T and U need not match.<\/p>\n<p>Classic seq2seq uses an encoder's final state as a fixed-size context vector; this can form a <strong>bottleneck<\/strong> for long inputs. Attention addresses that by allowing the decoder to look at multiple encoder states dynamically.<\/p>\n<h3>Teacher forcing versus inference<\/h3>\n<p>During training, teacher forcing feeds the <strong>true previous token<\/strong> into the decoder at a step. At inference, the correct token is unknown; the decoder feeds back its own generated token (or uses a decoding search strategy). This mismatch can produce exposure bias.<\/p>\n<h3>Translation example<\/h3>\n<p>Input “I like books” → three input tokens. Encoder produces context; decoder starts at <code>&lt;start&gt;<\/code>, outputs “J’aime”, then “les”, then “livres”, then <code>&lt;end&gt;<\/code> (tokenization illustrative). Four output tokens, so this is many-to-many with <strong>different lengths<\/strong>.<\/p>\n<h3>Standard 10-mark sketch<\/h3>\n<p>Draw two boxes labelled encoder and decoder, arrows from inputs into encoder, context/attention from encoder to decoder, and autoregressive arrows between output step
